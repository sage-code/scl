<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="psTitle psDesc">
  <title id="psTitle">A Fortran program is a set of program units connected by the USE statement</title>
  <desc id="psDesc">The main program unit sits on the left, a module in the middle and two external subprograms on the right. The main program and the module contain their own internal procedures called CONTAINS; the main program USEs the module to see its public procedures and variables.</desc>

  <rect x="0" y="0" width="920" height="420" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="396" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">One program, three kinds of program unit</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">A main program and a module may own internal procedures; external procedures are compiled separately and linked in.</text>

  <rect x="60" y="120" width="220" height="150" fill="#1f2a37" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="80" y="150" font-family="Consolas, monospace" font-size="16" fill="#7ee787">program main</text>
  <text x="80" y="176" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">use math_tools</text>
  <text x="80" y="200" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">implicit none</text>
  <text x="80" y="224" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">call compute()</text>
  <text x="80" y="248" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">end program main</text>

  <rect x="100" y="292" width="160" height="52" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="120" y="314" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">internal subroutines</text>
  <text x="120" y="334" font-family="Consolas, monospace" font-size="13" fill="#8b949e">via contains</text>

  <rect x="350" y="120" width="220" height="150" fill="#1f2a37" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="370" y="150" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">module math_tools</text>
  <text x="370" y="176" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  real :: pi</text>
  <text x="370" y="200" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">contains</text>
  <text x="370" y="224" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  subroutine compute()</text>
  <text x="370" y="248" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  end subroutine compute</text>
  <text x="370" y="262" font-family="Consolas, monospace" font-size="13" fill="#8b949e">end module math_tools</text>

  <line x1="280" y1="160" x2="342" y2="160" stroke="#7ee787" stroke-width="2"/>
  <polygon points="350,160 340,156 340,164" fill="#7ee787"/>
  <text x="311" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">USE</text>

  <rect x="640" y="120" width="220" height="150" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="660" y="150" font-family="Consolas, monospace" font-size="16" fill="#ffa657">subroutine solver()</text>
  <text x="660" y="176" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">external unit,</text>
  <text x="660" y="200" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">compiled on its own</text>
  <text x="660" y="224" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">call driv()</text>
  <text x="660" y="248" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">end subroutine solver</text>

  <line x1="570" y1="180" x2="632" y2="180" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="601" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">CALL</text>

  <text x="40" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Every program unit ends with its own END statement — a file can legally hold several units.</text>
</svg>