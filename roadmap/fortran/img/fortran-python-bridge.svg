<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="pyTitle pyDesc">
  <title id="pyTitle">Python orchestrates, Fortran computes: three growing levels of integration</title>
  <desc id="pyDesc">A Python box on the left and a Fortran library box on the right. From top to bottom: subprocess runs Fortran as a standalone binary exchanging text files; f2py compiles Fortran into a native CPython extension where numpy arrays pass without copying; iso_c_binding exposes a C ABI callable from ctypes. Each level adds structure and removes copies.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Fortran inside Python: no copy is the fastest bridge</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Level 1 is how prototypes begin; level 2 is how production HPC tools ship.</text>

  <rect x="60" y="104" width="250" height="52" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="80" y="126" font-family="Consolas, monospace" font-size="14" fill="#ffa657">subprocess.run(["solver"])</text>
  <text x="80" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">files in, files out — simplest, slowest</text>

  <rect x="60" y="176" width="250" height="52" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="80" y="198" font-family="Consolas, monospace" font-size="14" fill="#7ee787">f2py -c solver.f90 -m solver</text>
  <text x="80" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">numpy arrays pass by reference, no copy</text>

  <rect x="60" y="248" width="250" height="52" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="80" y="270" font-family="Consolas, monospace" font-size="14" fill="#58a6ff">ctypes.CDLL("libsolver.so")</text>
  <text x="80" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">bind(c) ABI, called from any language</text>

  <line x1="314" y1="130" x2="560" y2="130" stroke="#ffa657" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="314" y1="202" x2="560" y2="202" stroke="#7ee787" stroke-width="2"/>
  <polygon points="568,202 558,198 558,206" fill="#7ee787"/>
  <text x="440" y="188" font-family="Consolas, monospace" font-size="13" fill="#7ee787" text-anchor="middle">C extension, zero-copy arrays</text>
  <line x1="314" y1="274" x2="560" y2="274" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="568,274 558,270 558,278" fill="#58a6ff"/>
  <text x="440" y="320" font-family="Consolas, monospace" font-size="13" fill="#58a6ff" text-anchor="middle">iso_c_binding with bind(c)</text>

  <rect x="580" y="104" width="280" height="196" fill="#1f2a37" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="600" y="132" font-family="Consolas, monospace" font-size="15" fill="#7ee787">module solver</text>
  <text x="600" y="158" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">subroutine sim(n, t, u)</text>
  <text x="600" y="182" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  integer, intent(in) :: n</text>
  <text x="600" y="206" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  real(8), intent(inout) :: t(n)</text>
  <text x="600" y="230" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  real(8), intent(out) :: u(n)</text>
  <text x="600" y="254" font-family="Consolas, monospace" font-size="14" fill="#8b949e">end subroutine sim</text>
  <text x="600" y="278" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">input/output vectors = numpy arrays</text>

  <text x="40" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Best practice: keep the hot loop in Fortran, call it per time step from Python, and let f2py generate the extension via numpy.f2py.</text>
</svg>