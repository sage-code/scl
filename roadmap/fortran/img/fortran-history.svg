<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="histTitle histDesc">
  <title id="histTitle">Sixty-five years of Fortran standards, from FORTRAN I to Fortran 2023</title>
  <desc id="histDesc">A horizontal timeline from 1957 to 2023. Each standard is a node on the line: FORTRAN I (1957), FORTRAN II (1958), FORTRAN 66, FORTRAN 77, Fortran 90, 95, 2003, 2008, 2018 and 2023. Every revision after 66 added a major capability: structure, arrays, modules, objects, coarrays, teams and modern concurrency.</desc>

  <rect x="0" y="0" width="960" height="360" fill="#0d1117"/>
  <rect x="12" y="12" width="936" height="336" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">The Fortran standard timeline</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Every revision adds capability while keeping full backward compatibility — code from 1966 still compiles today.</text>

  <line x1="60" y1="210" x2="900" y2="210" stroke="#30363d" stroke-width="3"/>

  <!-- nodes -->
  <rect x="70" y="238" width="110" height="58" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="125" y="262" font-family="Consolas, monospace" font-size="14" fill="#ffa657" text-anchor="middle">1957</text>
  <text x="125" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">FORTRAN I</text>
  <line x1="125" y1="238" x2="125" y2="212" stroke="#ffa657" stroke-width="2"/>

  <rect x="196" y="238" width="110" height="58" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="251" y="262" font-family="Consolas, monospace" font-size="14" fill="#d2a8ff" text-anchor="middle">1966</text>
  <text x="251" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">FORTRAN 66</text>
  <line x1="251" y1="238" x2="251" y2="212" stroke="#d2a8ff" stroke-width="2"/>

  <rect x="322" y="238" width="110" height="58" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="377" y="262" font-family="Consolas, monospace" font-size="14" fill="#58a6ff" text-anchor="middle">1977</text>
  <text x="377" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">FORTRAN 77</text>
  <line x1="377" y1="238" x2="377" y2="212" stroke="#58a6ff" stroke-width="2"/>

  <rect x="448" y="238" width="110" height="58" fill="#1f2a37" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="503" y="262" font-family="Consolas, monospace" font-size="14" fill="#7ee787" text-anchor="middle">1990</text>
  <text x="503" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">Fortran 90</text>
  <line x1="503" y1="238" x2="503" y2="212" stroke="#7ee787" stroke-width="2"/>

  <rect x="574" y="238" width="110" height="58" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="629" y="262" font-family="Consolas, monospace" font-size="14" fill="#7ee787" text-anchor="middle">2003</text>
  <text x="629" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">Fortran 2003</text>
  <line x1="629" y1="238" x2="629" y2="212" stroke="#7ee787" stroke-width="2"/>

  <rect x="700" y="238" width="110" height="58" fill="#1f2a37" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="755" y="262" font-family="Consolas, monospace" font-size="14" fill="#7ee787" text-anchor="middle">2008</text>
  <text x="755" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">Fortran 2008</text>
  <line x1="755" y1="238" x2="755" y2="212" stroke="#7ee787" stroke-width="2"/>

  <rect x="826" y="238" width="110" height="58" fill="#1f2a37" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="881" y="262" font-family="Consolas, monospace" font-size="14" fill="#7ee787" text-anchor="middle">2018</text>
  <text x="881" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">Fortran 2018</text>
  <line x1="881" y1="238" x2="881" y2="212" stroke="#7ee787" stroke-width="2"/>

  <rect x="448" y="120" width="110" height="58" fill="#1f2a37" stroke="#f85149" stroke-width="2" rx="6"/>
  <text x="503" y="144" font-family="Consolas, monospace" font-size="14" fill="#f85149" text-anchor="middle">2023</text>
  <text x="503" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">Fortran 2023</text>
  <line x1="503" y1="180" x2="503" y2="206" stroke="#f85149" stroke-width="2"/>

  <text x="940" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#58a6ff" text-anchor="end">→ newer</text>
  <text x="60" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#58a6ff">older ←</text>

  <text x="40" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Node colors: milestone (orange/purple/blue) → structured era (green) → modern HPC era (green, red = latest revision).</text>
</svg>