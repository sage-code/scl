<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="dtTitle dtDesc">
  <title id="dtTitle">A derived type packs related data into one named value with named components</title>
  <desc id="dtDesc">The type Weather_Station has five components: a name string, coordinates, altitude and a history array of daily readings. Two variables, meteo_a and meteo_b, are each one instance that stores all five fields as a unit.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">One type describes many variables</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Declaring a type costs nothing at runtime; instantiating it allocates exactly the declared fields.</text>

  <rect x="60" y="108" width="360" height="210" fill="#1f2a37" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="80" y="136" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">type :: weather_station</text>
  <text x="80" y="162" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  character(len=32) :: name</text>
  <text x="80" y="186" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  real(8) :: latitude, longitude</text>
  <text x="80" y="210" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  integer :: altitude</text>
  <text x="80" y="234" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  real(8), allocatable :: history(:)</text>
  <text x="80" y="260" font-family="Consolas, monospace" font-size="14" fill="#8b949e">end type weather_station</text>
  <text x="80" y="296" font-family="Consolas, monospace" font-size="14" fill="#7ee787">type(weather_station) :: meteo_a, meteo_b</text>

  <line x1="424" y1="180" x2="500" y2="180" stroke="#7ee787" stroke-width="2"/>
  <polygon points="508,180 498,176 498,184" fill="#7ee787"/>

  <text x="60" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Instances are values, not objects: assignment copies, and passing to a subroutine must declare INTENT.</text>

  <rect x="516" y="120" width="340" height="96" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="536" y="148" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">meteo_a%name = 'Chur'</text>
  <text x="536" y="172" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">meteo_a%altitude = 556</text>
  <text x="536" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">the % operator selects one component</text>

  <rect x="516" y="232" width="340" height="56" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="536" y="258" font-family="Consolas, monospace" font-size="14" fill="#d2a8ff">allocate(meteo_a%history(365))</text>
  <text x="536" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">allocatable components grow with the data</text>
</svg>