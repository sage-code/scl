<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="gpuTitle gpuDesc">
  <title id="gpuTitle">OpenACC / OpenMP target offload moves whole loops to the GPU and copies data once</title>
  <desc id="gpuDesc">The host CPU box on the left runs the program. A directive sends data and a parallel loop across the PCIe link to the GPU device on the right, which schedules hundreds of threads over its own memory. The result tile is copied back after the region.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Offload: the directive names a loop, the runtime handles the rest</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">One source tree: the same loop compiles for CPU, one GPU, or many GPUs.</text>

  <rect x="60" y="120" width="320" height="160" fill="#1f2a37" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="80" y="148" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">host (CPU)</text>
  <text x="80" y="176" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">!$acc data copyin(a) copyout(c)</text>
  <text x="80" y="200" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">!$acc parallel loop</text>
  <text x="80" y="224" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">do i = 1, n</text>
  <text x="80" y="248" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  c(i) = a(i) * b(i)</text>
  <text x="80" y="268" font-family="Consolas, monospace" font-size="13" fill="#8b949e">end do</text>

  <rect x="540" y="120" width="320" height="160" fill="#1f2a37" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="560" y="148" font-family="Consolas, monospace" font-size="15" fill="#7ee787">device (GPU)</text>
  <text x="560" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e6edf3">device memory holds a, b, c</text>
  <text x="560" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e6edf3">thousands of threads, one per i</text>
  <text x="560" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e6edf3">SIMT lanes hide latency</text>
  <text x="560" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">memory-bound loops gain little;</text>
  <text x="560" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">compute-bound loops gain most</text>

  <line x1="384" y1="180" x2="534" y2="180" stroke="#ffa657" stroke-width="3"/>
  <polygon points="544,180 532,174 532,186" fill="#ffa657"/>
  <text x="459" y="162" font-family="Consolas, monospace" font-size="13" fill="#ffa657" text-anchor="middle">PCIe / NVLink</text>
  <text x="459" y="196" font-family="Consolas, monospace" font-size="14" fill="#ffa657" text-anchor="middle">copy data once</text>

  <text x="60" y="320" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">gfortran -fopenacc        # OpenACC via GNU</text>
  <text x="60" y="344" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">gfortran -fopenmp -foffload=nvptx-none # OpenMP target</text>
  <text x="60" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Data movement across the bus is the real cost — keep loops resident with a data region.</text>
</svg>