<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="oopTitle oopDesc">
  <title id="oopTitle">Fortran objects extend a parent type and stay fully assignable</title>
  <desc id="oopDesc">A base type animal with two components sits at the top. Two extended types, dog and bird, add behaviour through type-bound procedures. A polymorphic variable of class(animal) can point at any of them at run time; concrete extensions stay plain values that copy and assign like the parent.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Inheritance is extension of a value type</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">type, extends(...) reuses layout and procedures; class(...) gives run-time polymorphism.</text>

  <rect x="330" y="104" width="260" height="72" fill="#1f2a37" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="350" y="130" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">type, abstract :: animal</text>
  <text x="350" y="154" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  real(8) :: weight</text>
  <text x="350" y="170" font-family="Consolas, monospace" font-size="12" fill="#8b949e">deferred: procedure(make_sound)</text>

  <line x1="430" y1="176" x2="330" y2="220" stroke="#7ee787" stroke-width="2"/>
  <line x1="490" y1="176" x2="590" y2="220" stroke="#ffa657" stroke-width="2"/>

  <rect x="160" y="226" width="240" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="180" y="252" font-family="Consolas, monospace" font-size="15" fill="#7ee787">type, extends(animal) :: dog</text>
  <text x="180" y="276" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  logical :: chipped</text>
  <text x="180" y="296" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">procedure :: sound =&gt; dog_sound</text>

  <rect x="520" y="226" width="240" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="540" y="252" font-family="Consolas, monospace" font-size="15" fill="#ffa657">type, extends(animal) :: bird</text>
  <text x="540" y="276" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  real(8) :: wing_span</text>
  <text x="540" y="296" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">procedure :: sound =&gt; bird_sound</text>

  <text x="460" y="340" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">class(animal), allocatable :: pet</text>
  <text x="460" y="362" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">allocate(dog :: pet)   ! pet%sound picks dog_sound</text>
  <text x="460" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">the v-table dispatch happens once per call — cheap and explicit</text>
</svg>