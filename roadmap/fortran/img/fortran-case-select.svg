<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="scTitle scDesc">
  <title id="scTitle">SELECT CASE routes one integer, character or logical selector to one of several branches</title>
  <desc id="scDesc">An upward diamond receives the selector value. One exit leads to the DEFAULT branch. Three exits lead to cases 1, 2 and 3, each drawn as a rounded process box with its statements; after any branch the control flow merges again at the bottom.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">SELECT CASE — one selector, many branches</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The selector is evaluated once; equality against each CASE value decides the single branch that runs.</text>

  <rect x="360" y="96" width="200" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="460" y="122" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">select case (status)</text>
  <text x="460" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">selector: integer / char / logical</text>

  <polygon points="460,152 430,192 460,232 490,192" fill="#1f2a37" stroke="#ffa657" stroke-width="2"/>
  <text x="460" y="198" font-family="Consolas, monospace" font-size="14" fill="#ffa657" text-anchor="middle">match?</text>

  <line x1="460" y1="250" x2="460" y2="288" stroke="#7ee787" stroke-width="2"/>

  <rect x="180" y="288" width="160" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="260" y="312" font-family="Consolas, monospace" font-size="14" fill="#7ee787" text-anchor="middle">case (1)</text>
  <text x="260" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">start the run</text>

  <line x1="420" y1="288" x2="380" y2="315" stroke="#7ee787" stroke-width="2"/>
  <polygon points="376,319 380,312 388,315" fill="#7ee787"/>
  <text x="408" y="330" font-family="Consolas, monospace" font-size="13" fill="#7ee787" text-anchor="middle">=1</text>

  <rect x="360" y="288" width="160" height="56" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="440" y="312" font-family="Consolas, monospace" font-size="14" fill="#ffa657" text-anchor="middle">case (2)</text>
  <text x="440" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">run, keep going</text>

  <line x1="460" y1="250" x2="440" y2="281" stroke="#ffa657" stroke-width="2"/>

  <rect x="540" y="288" width="160" height="56" fill="#161b22" stroke="#f85149" stroke-width="2" rx="6"/>
  <text x="620" y="312" font-family="Consolas, monospace" font-size="14" fill="#f85149" text-anchor="middle">case default</text>
  <text x="620" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">reject the input</text>

  <line x1="490" y1="200" x2="610" y2="281" stroke="#f85149" stroke-width="2"/>

  <line x1="260" y1="344" x2="400" y2="370" stroke="#30363d" stroke-width="2"/>
  <line x1="620" y1="344" x2="490" y2="366" stroke="#30363d" stroke-width="2"/>
  <line x1="400" y1="370" x2="480" y2="370" stroke="#30363d" stroke-width="2"/>
  <polygon points="486,370 478,366 478,374" fill="#8b949e"/>
  <text x="460" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">merged: statements after END SELECT run once</text>
</svg>