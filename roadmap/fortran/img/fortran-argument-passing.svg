<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="apTitle apDesc">
  <title id="apTitle">INTENT tells the compiler who may read and who may write each dummy argument</title>
  <desc id="apDesc">A subroutine is drawn at the centre with three labelled arrows. INTENT(IN) copies a value in and forbids writes, INTENT(OUT) gives a result slot, INTENT(INOUT) both reads and updates. Missing INTENT is legacy behaviour and is flagged by gfortran's -Wunused-dummy-argument checks.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">INTENT = the compiler enforces your data-flow contract</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Fortran passes arguments by reference; INTENT controls what the callee may do with them.</text>

  <rect x="330" y="140" width="260" height="100" fill="#1f2a37" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="350" y="170" font-family="Consolas, monospace" font-size="15" fill="#7ee787">subroutine solve(a, b, x)</text>
  <text x="350" y="196" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">intent(in) :: a, b</text>
  <text x="350" y="222" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">intent(out) :: x</text>

  <line x1="270" y1="170" x2="322" y2="170" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="330,170 320,166 320,174" fill="#58a6ff"/>
  <text x="300" y="152" font-family="Consolas, monospace" font-size="13" fill="#58a6ff" text-anchor="middle">a, b</text>
  <text x="300" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">caller may read</text>

  <rect x="60" y="120" width="170" height="96" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="80" y="146" font-family="Consolas, monospace" font-size="14" fill="#58a6ff">intent(in)</text>
  <text x="80" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">read-only,</text>
  <text x="80" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">copy-in allowed</text>

  <line x1="460" y1="138" x2="460" y2="96" stroke="#7ee787" stroke-width="2"/>
  <polygon points="460,90 456,98 464,98" fill="#7ee787"/>
  <text x="520" y="112" font-family="Consolas, monospace" font-size="13" fill="#7ee787">x</text>

  <rect x="350" y="30" width="220" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="460" y="53" font-family="Consolas, monospace" font-size="14" fill="#7ee787" text-anchor="middle">intent(out) result slot</text>

  <text x="460" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">without INTENT the compiler assumes the worst —</text>
  <text x="460" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">write the contract, and the optimizer may copy in/out.</text>

  <line x1="460" y1="296" x2="460" y2="256" stroke="#8b949e" stroke-width="2" stroke-dasharray="6,4"/>
</svg>