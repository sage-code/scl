<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="llTitle llDesc">
  <title id="llTitle">Where Fortran sits among compiled languages: numerical depth versus systems reach</title>
  <desc id="llDesc">A quadrant chart. The horizontal axis runs from systems / OS reach (left) to numerical / scientific depth (right). The vertical axis runs from memory-safety guarantees (top, Rust, memory-safe Zig) to manual control (bottom, C). Fortran occupies the far right and slightly below centre: unmatched array numerics, mature compilers, but without Rust-style safety guarantees and without the systems reach of C or Zig.</desc>

  <rect x="0" y="0" width="920" height="420" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="396" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">A landscape, not a ladder: languages aim at different problems</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Most real systems mix at least two of these — the right question is which one computes.</text>

  <!-- axes -->
  <line x1="120" y1="360" x2="880" y2="360" stroke="#30363d" stroke-width="2"/>
  <line x1="120" y1="360" x2="120" y2="80" stroke="#30363d" stroke-width="2"/>
  <text x="500" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">numerics &amp; array depth →</text>
  <text x="96" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e" transform="rotate(-90 96 220)" text-anchor="middle">memory safety →</text>
  <text x="130" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">systems reach</text>
  <text x="870" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">science</text>

  <!-- bubbles -->
  <circle cx="220" cy="330" r="34" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="220" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#f85149" text-anchor="middle">C</text>

  <circle cx="330" cy="270" r="34" fill="#1f2a37" stroke="#ffa657" stroke-width="2"/>
  <text x="330" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffa657" text-anchor="middle">C++</text>

  <circle cx="430" cy="140" r="34" fill="#1f2a37" stroke="#e6edf3" stroke-width="2"/>
  <text x="430" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e6edf3" text-anchor="middle">Rust</text>

  <circle cx="270" cy="130" r="34" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="270" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d2a8ff" text-anchor="middle">Zig</text>

  <circle cx="760" cy="290" r="44" fill="#1f2a37" stroke="#7ee787" stroke-width="3"/>
  <text x="760" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="bold" fill="#7ee787" text-anchor="middle">Fortran</text>

  <circle cx="790" cy="150" r="34" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="790" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58a6ff" text-anchor="middle">Python</text>
  <text x="790" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">(with NumPy)</text>

  <text x="500" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">Fortran: farthest right — array math &amp; HPC, mature 65-year compilers,</text>
  <text x="500" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">no C-style manual memory games and no Rust-style borrow checker.</text>
</svg>