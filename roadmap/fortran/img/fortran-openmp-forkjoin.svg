<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="ompTitle ompDesc">
  <title id="ompTitle">OpenMP forks a thread team, runs the parallel region, then joins back to one thread</title>
  <desc id="ompDesc">A single master thread enters from the left. At the omp parallel directive the team forks into four threads, each with a private execution lane. The threads synchronise at an implicit barrier, the omp end parallel join merges them back into one stream, and the master thread continues alone on the right.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Fork–join: the shared-memory model</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Threads share one address space, so data movement is implicit — the cost is cache coherence and races.</text>

  <line x1="40" y1="200" x2="180" y2="200" stroke="#e6edf3" stroke-width="3"/>
  <text x="110" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">master thread</text>

  <rect x="150" y="90" width="170" height="52" fill="#1f2a37" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="235" y="112" font-family="Consolas, monospace" font-size="14" fill="#7ee787" text-anchor="middle">!$omp parallel</text>
  <text x="235" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">fork</text>

  <line x1="322" y1="116" x2="400" y2="100" stroke="#7ee787" stroke-width="2"/>
  <line x1="322" y1="116" x2="400" y2="140" stroke="#7ee787" stroke-width="2"/>
  <line x1="322" y1="116" x2="400" y2="180" stroke="#7ee787" stroke-width="2"/>
  <line x1="322" y1="116" x2="400" y2="220" stroke="#7ee787" stroke-width="2"/>

  <rect x="404" y="62" width="180" height="58" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="494" y="86" font-family="Consolas, monospace" font-size="13" fill="#58a6ff" text-anchor="middle">thread 0 (master)</text>
  <text x="494" y="106" font-family="Consolas, monospace" font-size="12" fill="#9fb3c8" text-anchor="middle">private copies + shared loop</text>

  <rect x="404" y="142" width="180" height="58" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="494" y="166" font-family="Consolas, monospace" font-size="13" fill="#58a6ff" text-anchor="middle">thread 1</text>
  <text x="494" y="186" font-family="Consolas, monospace" font-size="12" fill="#9fb3c8" text-anchor="middle">private copies + shared loop</text>

  <rect x="404" y="222" width="180" height="58" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="494" y="246" font-family="Consolas, monospace" font-size="13" fill="#58a6ff" text-anchor="middle">thread 2</text>
  <text x="494" y="266" font-family="Consolas, monospace" font-size="12" fill="#9fb3c8" text-anchor="middle">private copies + shared loop</text>

  <rect x="404" y="302" width="180" height="58" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="494" y="326" font-family="Consolas, monospace" font-size="13" fill="#58a6ff" text-anchor="middle">thread 3</text>
  <text x="494" y="346" font-family="Consolas, monospace" font-size="12" fill="#9fb3c8" text-anchor="middle">private copies + shared loop</text>

  <line x1="588" y1="90" x2="650" y2="200" stroke="#ffa657" stroke-width="2"/>
  <line x1="588" y1="171" x2="650" y2="200" stroke="#ffa657" stroke-width="2"/>
  <line x1="588" y1="251" x2="650" y2="200" stroke="#ffa657" stroke-width="2"/>
  <line x1="588" y1="331" x2="650" y2="200" stroke="#ffa657" stroke-width="2"/>

  <rect x="654" y="164" width="160" height="60" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="734" y="188" font-family="Consolas, monospace" font-size="13" fill="#ffa657" text-anchor="middle">barrier + join</text>
  <text x="734" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">!$omp end parallel</text>

  <line x1="820" y1="200" x2="880" y2="200" stroke="#e6edf3" stroke-width="3"/>
  <text x="850" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">serial</text>

  <text x="310" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">reduction (sum) merges partials safely at the join</text>
  <text x="310" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">omp_set_num_threads / OMP_NUM_THREADS controls team size; schedule governs how loop iterations are assigned.</text>
</svg>