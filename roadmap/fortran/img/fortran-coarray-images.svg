<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="caTitle caDesc">
  <title id="caTitle">Coarrays: one program, many images, one-sided communication</title>
  <desc id="caDesc">Three boxes represent three images of the same program. Each image owns a private copy of data and a coarray slice. Image 2 reads a value straight out of image 3's coarray with the square-bracket selector — no message is sent back, and a sync all barrier keeps the images in step afterwards.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Images: the same code, replicated with private state</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">You launch one executable; the runtime spawns N images that may live on N different nodes.</text>

  <rect x="60" y="120" width="240" height="150" fill="#1f2a37" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="80" y="148" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">image 1</text>
  <text x="80" y="176" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">private :: local_data</text>
  <text x="80" y="200" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">real :: buf[*]</text>
  <text x="80" y="224" font-family="Consolas, monospace" font-size="14" fill="#8b949e">this_image() = 1</text>
  <text x="80" y="248" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">owns its own copy of everything</text>

  <rect x="340" y="120" width="240" height="150" fill="#1f2a37" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="360" y="148" font-family="Consolas, monospace" font-size="15" fill="#7ee787">image 2</text>
  <text x="360" y="176" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">x = buf[3]</text>
  <text x="360" y="200" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">! one-sided read</text>
  <text x="360" y="224" font-family="Consolas, monospace" font-size="14" fill="#8b949e">no message to image 3</text>
  <text x="360" y="248" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">square bracket = remote co-index</text>

  <line x1="584" y1="180" x2="642" y2="180" stroke="#7ee787" stroke-width="2"/>
  <polygon points="650,180 640,176 640,184" fill="#7ee787"/>

  <rect x="660" y="120" width="200" height="150" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="8"/>
  <text x="680" y="148" font-family="Consolas, monospace" font-size="15" fill="#ffa657">image 3</text>
  <text x="680" y="176" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">buf = 3.14</text>
  <text x="680" y="200" font-family="Consolas, monospace" font-size="14" fill="#8b949e">plain assignment</text>
  <text x="680" y="224" font-family="Consolas, monospace" font-size="14" fill="#8b949e">to its own coarray</text>

  <text x="460" y="320" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">sync all</text>
  <text x="460" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">a barrier: no image may pass until every image has reached it</text>
  <line x1="460" y1="306" x2="460" y2="272" stroke="#8b949e" stroke-width="2" stroke-dasharray="6,4"/>

  <text x="40" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Compile with gfortran -fcoarray=single (default) or -fcoarray=lib for multi-image runs — no library to install.</text>
</svg>