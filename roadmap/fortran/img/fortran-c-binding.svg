<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="cbTitle cbDesc">
  <title id="cbTitle">iso_c_binding gives Fortran and C one shared ABI</title>
  <desc id="cbDesc">A Fortran module on the left and a C library on the right. The bridge is the right side: bind(c) exports a subroutine with a C-visible name, iso_c_binding maps Fortran types to C types, and C_LOC/C_F_POINTER convert pointers both ways. The C library can call back into Fortran through the same interface.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">One ABI, two languages, no runtime glue</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The compiler verifies every crossing — mistyped signatures fail at compile time.</text>

  <rect x="60" y="110" width="340" height="160" fill="#1f2a37" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="80" y="138" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">module bridge</text>
  <text x="80" y="164" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">use iso_c_binding, only: c_int, c_double</text>
  <text x="80" y="188" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">interface</text>
  <text x="80" y="212" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  function c_solver(n, x) bind(c, name="solver")</text>
  <text x="80" y="236" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">    import c_int, c_double</text>
  <text x="80" y="256" font-family="Consolas, monospace" font-size="12" fill="#8b949e">end interface</text>

  <line x1="404" y1="190" x2="500" y2="190" stroke="#7ee787" stroke-width="2"/>
  <polygon points="508,190 498,186 498,194" fill="#7ee787"/>
  <text x="456" y="176" font-family="Consolas, monospace" font-size="13" fill="#7ee787" text-anchor="middle">call c_solver(...)</text>

  <rect x="520" y="110" width="340" height="160" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="8"/>
  <text x="540" y="138" font-family="Consolas, monospace" font-size="15" fill="#ffa657">solver.c (C side)</text>
  <text x="540" y="164" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">int solver(int n, double *x) { ... }</text>
  <text x="540" y="188" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">→ Fortran interoperates with the</text>
  <text x="540" y="212" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">plain C ABI, not with C++ mangled</text>
  <text x="540" y="236" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">names (use extern "C" there)</text>

  <rect x="60" y="292" width="340" height="56" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="80" y="316" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">C_LOC(x)  → type(c_ptr)</text>
  <text x="80" y="336" font-family="Consolas, monospace" font-size="13" fill="#8b949e">hand the raw address to the other side</text>

  <rect x="520" y="292" width="340" height="56" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="540" y="316" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">C_F_POINTER(ptr, fptr) → fortran pointer</text>
  <text x="540" y="336" font-family="Consolas, monospace" font-size="13" fill="#8b949e">reinterpret a raw address as a typed view</text>
</svg>