<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="mtTitle mtDesc">
  <title id="mtTitle">Modules form a dependency tree that the compiler resolves from .mod files</title>
  <desc id="mtDesc">Three modules are stacked: constants and derived types at the bottom, a math library on top of them, and the main program on top. Arrows point from the consumer to the provider and are labelled with the USE statement. The math module may shadow constants with USE, ONLY.</desc>

  <rect x="0" y="0" width="920" height="420" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="396" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Compile bottom-up, then link</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Modules produce .mod files consumed by every dependant; recompiling a module forces recompilation of its users.</text>

  <rect x="330" y="300" width="260" height="64" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="350" y="326" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">module constants</text>
  <text x="350" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">parameters and kinds (compiled first)</text>

  <rect x="330" y="200" width="260" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="350" y="226" font-family="Consolas, monospace" font-size="15" fill="#7ee787">module math_lib</text>
  <text x="350" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">subroutines of the domain (second)</text>

  <line x1="460" y1="298" x2="460" y2="270" stroke="#7ee787" stroke-width="2"/>
  <polygon points="460,264 456,272 464,272" fill="#7ee787"/>
  <text x="500" y="286" font-family="Consolas, monospace" font-size="13" fill="#7ee787">use constants, only: dp</text>

  <rect x="330" y="100" width="260" height="64" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="350" y="126" font-family="Consolas, monospace" font-size="15" fill="#ffa657">program main</text>
  <text x="350" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">the only unit the linker must run</text>

  <line x1="460" y1="198" x2="460" y2="170" stroke="#ffa657" stroke-width="2"/>
  <polygon points="460,164 456,172 464,172" fill="#ffa657"/>
  <text x="480" y="186" font-family="Consolas, monospace" font-size="13" fill="#ffa657">use math_lib</text>

  <rect x="60" y="100" width="200" height="100" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="80" y="126" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">gfortran-flag:</text>
  <text x="80" y="150" font-family="Consolas, monospace" font-size="14" fill="#8b949e">-I dir with *.mod</text>
  <text x="80" y="174" font-family="Consolas, monospace" font-size="14" fill="#8b949e">-J dir producing *.mod</text>

  <rect x="660" y="100" width="200" height="100" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="680" y="126" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">health rule #1:</text>
  <text x="680" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">a module owns its</text>
  <text x="680" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">data — expose it only</text>
  <text x="680" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">through type-bound calls</text>

  <text x="40" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">fpm and CMake read the same dependencies from fpm.toml / CMakeLists.txt and compile in this order for you.</text>
</svg>