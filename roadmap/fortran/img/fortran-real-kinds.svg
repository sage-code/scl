<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="rkTitle rkDesc">
  <title id="rkTitle">The KIND parameter selects a hardware representation of a type</title>
  <desc id="rkDesc">Three INTEGER kinds and three REAL kinds are drawn as boxes with their bit width and typical range. INTEGER kind 4 spans about 2 billion values, kind 8 about 10^19. REAL kind 4 keeps about 7 significant digits, kind 8 about 15-16, kind 16 about 33. Selection is portable through selected_int_kind and selected_real_kind.</desc>

  <rect x="0" y="0" width="920" height="420" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="396" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">KIND = a hardware type, selected portably</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The compiler picks concrete sizes; programs ask for a capability, not a byte count.</text>

  <text x="60" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">INTEGER kinds</text>

  <rect x="60" y="134" width="200" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="80" y="160" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">kind 4 · 32 bit</text>
  <text x="80" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">≈ ±2.1 billion</text>

  <rect x="280" y="134" width="200" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="300" y="160" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">kind 8 · 64 bit</text>
  <text x="300" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">≈ ±9.2 × 10¹⁸</text>

  <rect x="500" y="134" width="200" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="520" y="160" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">kind 16 · 128 bit</text>
  <text x="520" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">where the target allows</text>

  <text x="60" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">REAL kinds (IEEE-754)</text>

  <rect x="60" y="250" width="200" height="64" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="80" y="276" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">kind 4 · single</text>
  <text x="80" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">≈ 7 significant digits</text>

  <rect x="280" y="250" width="200" height="64" fill="#1f2a37" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="300" y="276" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">kind 8 · double</text>
  <text x="300" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">≈ 15–16 significant digits</text>

  <rect x="500" y="250" width="200" height="64" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="520" y="276" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">kind 16 · quad</text>
  <text x="520" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">≈ 33–36 significant digits</text>

  <text x="60" y="356" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">integer,parameter :: dp = selected_real_kind(15, 307)</text>
  <text x="60" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">15 decimal digits and an exponent up to 307 — whatever representation that costs on this machine.</text>
</svg>