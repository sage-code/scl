<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="mpiTitle mpiDesc">
  <title id="mpiTitle">MPI splits a grid across processes that exchange boundary halos by message</title>
  <desc id="mpiDesc">A 4-by-4 field is decomposed into four 2-by-2 tiles, one per MPI process. Each tile keeps a halo of one ghost row or column from its neighbours. The arrows show the data that must be communicated each time step: process 0 sends its right edge to process 1 and its bottom edge to process 2, and so on.</desc>

  <rect x="0" y="0" width="920" height="420" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="396" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Domain decomposition: every process owns a tile plus a halo</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Processes communicate explicitly; the network becomes the only shared resource.</text>

  <!-- 4 tiles -->
  <rect x="160" y="110" width="180" height="120" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="250" y="136" font-family="Consolas, monospace" font-size="15" fill="#58a6ff" text-anchor="middle">process 0</text>
  <text x="250" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">rows 1–2 · cols 1–2</text>
  <text x="250" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">halo: right + bottom</text>

  <rect x="360" y="110" width="180" height="120" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="450" y="136" font-family="Consolas, monospace" font-size="15" fill="#7ee787" text-anchor="middle">process 1</text>
  <text x="450" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">rows 1–2 · cols 3–4</text>
  <text x="450" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">halo: left + bottom</text>

  <rect x="160" y="250" width="180" height="120" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="250" y="276" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff" text-anchor="middle">process 2</text>
  <text x="250" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">rows 3–4 · cols 1–2</text>
  <text x="250" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">halo: right + top</text>

  <rect x="360" y="250" width="180" height="120" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="450" y="276" font-family="Consolas, monospace" font-size="15" fill="#ffa657" text-anchor="middle">process 3</text>
  <text x="450" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">rows 3–4 · cols 3–4</text>
  <text x="450" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">halo: left + top</text>

  <!-- halo exchange arrows -->
  <line x1="344" y1="140" x2="354" y2="140" stroke="#7ee787" stroke-width="3"/>
  <line x1="358" y1="142" x2="352" y2="140" stroke="#7ee787" stroke-width="3"/>
  <text x="350" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">sendrecv</text>

  <line x1="250" y1="234" x2="250" y2="244" stroke="#d2a8ff" stroke-width="3"/>
  <text x="240" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#d2a8ff" text-anchor="middle">sendrecv</text>

  <line x1="450" y1="234" x2="450" y2="244" stroke="#ffa657" stroke-width="3"/>
  <text x="460" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#ffa657" text-anchor="middle">sendrecv</text>

  <line x1="544" y1="140" x2="554" y2="140" stroke="#ffa657" stroke-width="3"/>

  <text x="40" y="376" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">call mpi_sendrecv(...) ! each step: 1 sendrecv per face, then recompute the tile</text>
  <text x="40" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">MPI is the only model shown that runs unchanged across a whole cluster — mpiexec -n 4 ./solver</text>
</svg>