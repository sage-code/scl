<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="smTitle smDesc">
  <title id="smTitle">Immutable structs are copied on assignment while mutable structs are shared by reference</title>
  <desc id="smDesc">On the left, two immutable Point values assigned one from the other are independent: rebinding the second variable leaves the first unchanged. On the right, two variables bound to the same mutable Counter refer to a single object, so an update through either name is visible from both.</desc>

  <rect x="0" y="0" width="920" height="430" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Value semantics or reference semantics?</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The keyword struct or mutable struct decides whether assignment copies the data or shares the object.</text>

  <text x="60" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">struct Point — immutable, copied</text>

  <rect x="60" y="138" width="150" height="62" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="135" y="165" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">p1</text>
  <text x="135" y="186" font-family="Consolas, monospace" font-size="14" fill="#79c0ff" text-anchor="middle">x=1, y=2</text>

  <rect x="250" y="138" width="150" height="62" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="325" y="165" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">p2</text>
  <text x="325" y="186" font-family="Consolas, monospace" font-size="14" fill="#79c0ff" text-anchor="middle">x=1, y=2</text>

  <text x="60" y="228" font-family="Consolas, monospace" font-size="14" fill="#8b949e">p2 = p1</text>
  <text x="250" y="228" font-family="Consolas, monospace" font-size="14" fill="#8b949e">p2 = Point(3, 4)</text>

  <rect x="60" y="244" width="150" height="62" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="135" y="271" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">p1</text>
  <text x="135" y="292" font-family="Consolas, monospace" font-size="14" fill="#79c0ff" text-anchor="middle">x=1, y=2</text>

  <rect x="250" y="244" width="150" height="62" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="325" y="271" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">p2</text>
  <text x="325" y="292" font-family="Consolas, monospace" font-size="14" fill="#79c0ff" text-anchor="middle">x=3, y=4</text>

  <text x="60" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Rebinding p2 leaves p1 untouched: no aliases exist.</text>
  <text x="60" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Updates are expressed by building a new value.</text>

  <text x="500" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">mutable struct Counter — shared</text>

  <rect x="500" y="138" width="150" height="62" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="575" y="165" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">c1</text>
  <text x="575" y="186" font-family="Consolas, monospace" font-size="14" fill="#79c0ff" text-anchor="middle">n=0</text>

  <rect x="690" y="138" width="150" height="62" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="765" y="165" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">c2</text>
  <text x="765" y="186" font-family="Consolas, monospace" font-size="14" fill="#79c0ff" text-anchor="middle">n=0</text>

  <line x1="650" y1="169" x2="690" y2="169" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="500" y="228" font-family="Consolas, monospace" font-size="14" fill="#8b949e">c2 = c1   (same object)</text>

  <rect x="500" y="244" width="340" height="62" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="670" y="271" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">one Counter object</text>
  <text x="670" y="292" font-family="Consolas, monospace" font-size="14" fill="#79c0ff" text-anchor="middle">n changed 0 → 1 through c1</text>

  <text x="500" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Both names see the update: c1.n == c2.n == 1.</text>
  <text x="500" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Aliasing is the feature — and the hazard.</text>
</svg>
