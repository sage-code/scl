<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Julia multiple dispatch and JIT pipeline compared with the Go static type and goroutine pipeline">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box   { fill:#1f2933; stroke:#58a6ff; stroke-width:2; }
      .boxGo { fill:#1f2933; stroke:#f0883e; stroke-width:2; }
      .hi    { fill:#f0f6fc; stroke:#7ee787; stroke-width:2; }
      .hiGo  { fill:#f0f6fc; stroke:#f0883e; stroke-width:2; }
      .t     { fill:#e6edf3; font-family:'Segoe UI',Arial,sans-serif; font-size:15px; text-anchor:middle; }
      .tz    { fill:#0d1117; font-family:'Segoe UI',Arial,sans-serif; font-size:15px; text-anchor:middle; font-weight:600; }
      .hd    { font-family:'Segoe UI',Arial,sans-serif; font-size:17px; font-weight:700; text-anchor:middle; }
      .ln    { stroke:#8b949e; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .sm    { fill:#8b949e; font-family:'Segoe UI',Arial,sans-serif; font-size:13px; text-anchor:middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="420" fill="#0d1117"/>

  <!-- Panel headers -->
  <rect x="20" y="14" width="430" height="42" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text class="hd" x="235" y="41" fill="#58a6ff">Julia &#8212; Multiple Dispatch + JIT</text>

  <rect x="470" y="14" width="430" height="42" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text class="hd" x="685" y="41" fill="#f0883e">Go &#8212; Static Types + Goroutines</text>

  <!-- Left column -->
  <rect class="hi" x="45" y="80" width="380" height="56" rx="6"/>
  <text class="tz" x="235" y="114">area(x) &#8212; one generic function</text>

  <rect class="box" x="45"  y="166" width="118" height="52" rx="6"/>
  <text class="t"  x="104" y="197" font-size="13px">area(::Circle)</text>
  <rect class="box" x="176" y="166" width="118" height="52" rx="6"/>
  <text class="t"  x="235" y="197" font-size="13px">area(::Square)</text>
  <rect class="box" x="307" y="166" width="118" height="52" rx="6"/>
  <text class="t"  x="366" y="197" font-size="13px">area(::Int,::Int)</text>

  <rect class="box" x="45" y="250" width="380" height="56" rx="6"/>
  <text class="t"  x="235" y="284">LLVM specializes each method per type</text>

  <rect class="hi" x="45" y="336" width="380" height="56" rx="6"/>
  <text class="tz" x="235" y="370">Native code &#8212; one version per signature</text>

  <path class="ln" d="M 235 136 L 235 150 L 104 150 L 104 166"/>
  <path class="ln" d="M 235 136 L 235 166"/>
  <path class="ln" d="M 235 136 L 235 150 L 366 150 L 366 166"/>
  <path class="ln" d="M 104 218 L 104 234 L 235 234 L 235 250"/>
  <path class="ln" d="M 235 218 L 235 250"/>
  <path class="ln" d="M 366 218 L 366 234 L 235 234 L 235 250"/>
  <path class="ln" d="M 235 306 L 235 336"/>
  <text class="sm" x="248" y="330" text-anchor="start" font-size="12px">dispatch resolves, then compiles</text>

  <!-- Right column -->
  <rect class="boxGo" x="495" y="80" width="380" height="56" rx="6"/>
  <text class="t" x="685" y="114">All types fixed at compile time</text>

  <rect class="boxGo" x="495" y="166" width="380" height="52" rx="6"/>
  <text class="t" x="685" y="197">Methods bound to one receiver type</text>

  <rect class="boxGo" x="495" y="250" width="380" height="56" rx="6"/>
  <text class="t" x="685" y="284">Goroutines scheduled M:N on threads</text>

  <rect class="hiGo" x="495" y="336" width="380" height="56" rx="6"/>
  <text class="tz" x="685" y="370">Single static binary &#8212; instant start</text>

  <path class="ln" d="M 685 136 L 685 166"/>
  <path class="ln" d="M 685 218 L 685 250"/>
  <path class="ln" d="M 685 306 L 685 336"/>
</svg>
