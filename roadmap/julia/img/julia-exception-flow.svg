<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="exTitle exDesc">
  <title id="exTitle">The try block has two exits and one guaranteed cleanup path</title>
  <desc id="exDesc">A try block either completes and continues after the finally block, or raises an exception that is matched by a catch clause. A matched exception is handled and execution still passes through finally; an unmatched exception is rethrown after finally runs. The finally block always runs, whether the code succeeded, failed, or returned.</desc>

  <rect x="0" y="0" width="920" height="460" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="436" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">try, catch, finally</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">finally runs on every path: success, handled failure, or an exception on its way out.</text>

  <rect x="360" y="106" width="200" height="56" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="460" y="140" font-family="Consolas, monospace" font-size="17" fill="#e6edf3" text-anchor="middle">try</text>

  <line x1="560" y1="134" x2="660" y2="134" stroke="#7ee787" stroke-width="2"/>
  <polygon points="664,134 652,128 652,140" fill="#7ee787"/>
  <text x="612" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">no error</text>

  <rect x="670" y="106" width="210" height="56" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="775" y="140" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">continue after try</text>

  <line x1="460" y1="162" x2="460" y2="196" stroke="#ffa657" stroke-width="2"/>
  <polygon points="460,200 454,188 466,188" fill="#ffa657"/>
  <text x="556" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffa657" text-anchor="middle">exception raised</text>

  <rect x="360" y="200" width="200" height="56" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="460" y="234" font-family="Consolas, monospace" font-size="17" fill="#e6edf3" text-anchor="middle">catch e</text>

  <line x1="360" y1="228" x2="230" y2="228" stroke="#30363d" stroke-width="2"/>
  <line x1="230" y1="228" x2="230" y2="290" stroke="#30363d" stroke-width="2"/>
  <text x="296" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">not handled → rethrow</text>

  <rect x="130" y="290" width="200" height="56" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="230" y="324" font-family="Consolas, monospace" font-size="14" fill="#ffa657" text-anchor="middle">error leaves the call</text>

  <line x1="560" y1="228" x2="690" y2="228" stroke="#30363d" stroke-width="2"/>
  <line x1="690" y1="228" x2="690" y2="290" stroke="#30363d" stroke-width="2"/>
  <text x="630" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">handled</text>

  <rect x="590" y="290" width="200" height="56" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="690" y="324" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">recover and continue</text>

  <line x1="230" y1="346" x2="230" y2="378" stroke="#30363d" stroke-width="2"/>
  <line x1="690" y1="346" x2="690" y2="378" stroke="#30363d" stroke-width="2"/>
  <line x1="230" y1="378" x2="690" y2="378" stroke="#30363d" stroke-width="2"/>
  <line x1="460" y1="378" x2="460" y2="396" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="460,400 454,388 466,388" fill="#58a6ff"/>

  <rect x="350" y="400" width="220" height="46" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="460" y="430" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">finally — always runs</text>
</svg>
