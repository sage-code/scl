<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="msTitle msDesc">
  <title id="msTitle">Method specificity picks the winner, and two equally specific methods create an ambiguity</title>
  <desc id="msDesc">On the left, a call is matched against three methods listed from most specific to least specific; the exact type match runs first and the Any fallback runs only when nothing more specific applies. On the right, two methods overlap without either being more specific, so the call is ambiguous until a third, more specific method breaks the tie.</desc>

  <rect x="0" y="0" width="920" height="440" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="416" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Specificity decides, ambiguity stops the call</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Julia compares whole signatures — not one argument at a time.</text>

  <text x="40" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">Ordered candidates for f(3)</text>

  <rect x="40" y="134" width="360" height="46" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="60" y="163" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">f(x::Int)</text>
  <text x="300" y="163" font-family="Consolas, monospace" font-size="13" fill="#7ee787">wins — exact type</text>

  <rect x="40" y="192" width="360" height="46" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="60" y="221" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">f(x::Number)</text>
  <text x="300" y="221" font-family="Consolas, monospace" font-size="13" fill="#8b949e">abstract supertype</text>

  <rect x="40" y="250" width="360" height="46" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="60" y="279" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">f(x)</text>
  <text x="300" y="279" font-family="Consolas, monospace" font-size="13" fill="#8b949e">fallback for Any</text>

  <text x="40" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Only one method runs; the others stay defined but unused for this call.</text>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Adding f(x::Int8) later would take over calls made with Int8 values.</text>

  <text x="500" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">Two overlapping methods — an ambiguity</text>

  <rect x="480" y="134" width="380" height="46" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="500" y="163" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">f(a::Int,    b::Number)</text>

  <rect x="480" y="192" width="380" height="46" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="500" y="221" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">f(a::Number, b::Int)</text>

  <text x="480" y="264" font-family="Consolas, monospace" font-size="14" fill="#ffa657">f(1, 1) — ERROR: MethodError: ambiguous</text>

  <rect x="480" y="280" width="380" height="46" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="500" y="309" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">f(a::Int,    b::Int)   ← the tiebreaker</text>

  <text x="480" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Neither method is more specific than the other, so Julia refuses to guess.</text>
  <text x="480" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Adding the narrower signature resolves it for every call.</text>
</svg>
