<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" role="img" aria-labelledby="distTitle distDesc">
  <title id="distTitle">Scaling beyond one core with processes and with a GPU</title>
  <desc id="distDesc">Upper panel: one master process sends work to three worker processes with remotecall, and each process has its own memory so arguments and results are copied. Lower panel: a host process copies data over the PCIe bus to a GPU device that has its own VRAM; one kernel launches a grid of blocks, and each block runs many threads in parallel.</desc>

  <rect x="0" y="0" width="920" height="660" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="636" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Scaling beyond one core: processes, then devices</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Processes do not share memory; a GPU has thousands of lanes but its own memory.</text>

  <text x="40" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#58a6ff">Distributed: one master process, several workers</text>

  <rect x="60" y="140" width="160" height="64" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="140" y="168" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">master</text>
  <text x="140" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">runs the script</text>

  <line x1="222" y1="172" x2="332" y2="158" stroke="#7ee787" stroke-width="2"/>
  <polygon points="338,158 326,152 326,164" fill="#7ee787"/>
  <line x1="222" y1="172" x2="332" y2="214" stroke="#7ee787" stroke-width="2"/>
  <polygon points="338,214 326,208 326,220" fill="#7ee787"/>
  <line x1="222" y1="172" x2="332" y2="270" stroke="#7ee787" stroke-width="2"/>
  <polygon points="338,270 326,264 326,276" fill="#7ee787"/>
  <text x="278" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7ee787" text-anchor="middle">remotecall</text>

  <rect x="340" y="136" width="180" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="430" y="163" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">worker 1</text>
  <rect x="340" y="192" width="180" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="430" y="219" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">worker 2</text>
  <rect x="340" y="248" width="180" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="430" y="275" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">worker N</text>

  <rect x="560" y="140" width="300" height="152" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="580" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffa657">Separate address spaces</text>
  <text x="580" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">Every argument and every result</text>
  <text x="580" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">crosses a serialisation boundary.</text>
  <text x="580" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">Send large chunks, not single</text>
  <text x="580" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">values, or the copies dominate.</text>

  <text x="40" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Threads share memory and lose nothing in transit; processes scale to other machines and pay for every message.</text>

  <text x="40" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#34d399">GPU: a host process drives thousands of lanes</text>

  <rect x="60" y="400" width="220" height="86" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="170" y="430" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">host process</text>
  <text x="170" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">CPU + main memory</text>
  <text x="170" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">your Julia code runs here</text>

  <line x1="284" y1="443" x2="352" y2="443" stroke="#34d399" stroke-width="2"/>
  <polygon points="358,443 346,437 346,449" fill="#34d399"/>
  <text x="320" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">copy</text>

  <rect x="360" y="388" width="500" height="210" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="380" y="414" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">GPU device — own memory (VRAM)</text>

  <rect x="380" y="434" width="140" height="64" fill="#1f2a37" stroke="#d2a8ff" stroke-width="2"/>
  <text x="450" y="460" font-family="Consolas, monospace" font-size="13" fill="#e6edf3" text-anchor="middle">block 0</text>
  <text x="450" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">256 threads</text>

  <rect x="534" y="434" width="140" height="64" fill="#1f2a37" stroke="#d2a8ff" stroke-width="2"/>
  <text x="604" y="460" font-family="Consolas, monospace" font-size="13" fill="#e6edf3" text-anchor="middle">block 1</text>
  <text x="604" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">256 threads</text>

  <rect x="688" y="434" width="150" height="64" fill="#1f2a37" stroke="#d2a8ff" stroke-width="2"/>
  <text x="763" y="460" font-family="Consolas, monospace" font-size="13" fill="#e6edf3" text-anchor="middle">block N</text>
  <text x="763" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">256 threads</text>

  <text x="380" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">One kernel call launches the whole grid and returns when every block has finished.</text>
  <text x="380" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Memory transfers are the bottleneck: compute on the device, copy as rarely as possible.</text>
  <text x="380" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">A GPU wins on large, uniform, independent work — and loses on small or branchy work.</text>

  <text x="40" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Reach for processes when the work is coarse, and for a GPU when the work is large, uniform and numeric.</text>
</svg>
