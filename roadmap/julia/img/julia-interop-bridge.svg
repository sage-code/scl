<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="interopTitle interopDesc">
  <title id="interopTitle">Four ways across the language boundary and what each one costs</title>
  <desc id="interopDesc">A Julia process sits in the middle. A ccall to C or Fortran shares the same process and the same pointers, so nothing is copied. A Python bridge converts objects between the two runtimes. Bridges to R, Java and MATLAB load another runtime inside the same process. Files and subprocesses serialise bytes so any language can read them.</desc>

  <rect x="0" y="0" width="920" height="560" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="536" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Four ways across the language boundary</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The cheapest crossing is the one that copies nothing — everything else is a trade-off.</text>

  <rect x="360" y="180" width="200" height="70" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="460" y="210" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">Julia process</text>
  <text x="460" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">your code, one address space</text>

  <rect x="60" y="110" width="220" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="80" y="138" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">C / Fortran</text>
  <text x="80" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">shared pointers, no copy</text>

  <line x1="284" y1="148" x2="380" y2="192" stroke="#7ee787" stroke-width="2"/>
  <polygon points="386,195 374,191 379,183" fill="#7ee787"/>
  <text x="316" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">ccall</text>

  <rect x="640" y="110" width="220" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="660" y="138" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">Python</text>
  <text x="660" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">PythonCall: objects converted</text>

  <line x1="636" y1="148" x2="540" y2="192" stroke="#ffa657" stroke-width="2"/>
  <polygon points="534,195 541,183 546,191" fill="#ffa657"/>
  <text x="604" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffa657" text-anchor="middle">convert</text>

  <rect x="60" y="340" width="220" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="80" y="368" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">R / Java / MATLAB</text>
  <text x="80" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">another runtime, in-process</text>

  <line x1="284" y1="372" x2="380" y2="238" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="386,235 379,247 374,239" fill="#d2a8ff"/>
  <text x="316" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d2a8ff" text-anchor="middle">RCall · JavaCall</text>

  <rect x="640" y="340" width="220" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="660" y="368" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">Files / other processes</text>
  <text x="660" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Arrow, CSV, JSON, subprocess</text>

  <line x1="636" y1="372" x2="540" y2="238" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="534,235 546,239 541,247" fill="#58a6ff"/>
  <text x="604" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle">serialise</text>

  <text x="40" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e6edf3">Cost of crossing, cheapest first: ccall shares memory → a bridge converts objects → files and processes serialise bytes.</text>
  <text x="40" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Each boundary brings its own type mapping, its own error handling, and its own build requirements.</text>
  <text x="40" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Keep the boundary narrow: one call per batch of work, not one call per element.</text>
</svg>
