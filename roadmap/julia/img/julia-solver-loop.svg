<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-label="The internal loop of an ODE solver: propose a step, estimate the error, accept or retry">
  <title>The internal loop of an ODE solver</title>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="560" fill="#0d1117"/>
  <text x="440" y="44" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">Inside solve(): one step of the solver loop</text>

  <!-- state -->
  <rect x="40" y="90" width="200" height="80" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="140" y="122" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">state (u, t)</text>
  <text x="140" y="146" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">plus parameters p</text>

  <line x1="240" y1="130" x2="292" y2="130" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- derivative -->
  <rect x="295" y="90" width="230" height="80" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="410" y="122" text-anchor="middle" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">evaluate f(u, p, t)</text>
  <text x="410" y="146" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">your right-hand side</text>

  <line x1="525" y1="130" x2="577" y2="130" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- propose step -->
  <rect x="580" y="90" width="260" height="80" rx="10" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="710" y="122" text-anchor="middle" fill="#ffa657" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">propose step h</text>
  <text x="710" y="146" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">explicit: takes h · f  |  implicit: solves</text>

  <!-- implicit linear solve -->
  <rect x="580" y="200" width="260" height="80" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="710" y="232" text-anchor="middle" fill="#d2a8ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">linear solve</text>
  <text x="710" y="256" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">I − γh·J  with the Jacobian J</text>
  <line x1="710" y1="170" x2="710" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- error estimate -->
  <rect x="295" y="200" width="230" height="80" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="410" y="232" text-anchor="middle" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">estimate error</text>
  <text x="410" y="256" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">compare with abstol, reltol</text>
  <line x1="580" y1="240" x2="530" y2="240" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- decision -->
  <polygon points="410,320 530,380 410,440 290,380" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="410" y="374" text-anchor="middle" fill="#f0883e" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">error ok?</text>
  <text x="410" y="394" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">compare to tolerance</text>
  <line x1="410" y1="280" x2="410" y2="320" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- reject -->
  <rect x="70" y="345" width="180" height="70" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="160" y="374" text-anchor="middle" fill="#f85149" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">reject</text>
  <text x="160" y="396" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">undo, shrink h, retry</text>
  <line x1="290" y1="380" x2="250" y2="380" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M70 380 H30 V130 H40" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- accept -->
  <rect x="630" y="345" width="200" height="70" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="730" y="374" text-anchor="middle" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">accept</text>
  <text x="730" y="396" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">t += h, record output</text>
  <line x1="530" y1="380" x2="630" y2="380" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- loop back -->
  <path d="M830 380 H860 V130 H840" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>
  <text x="440" y="500" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">Repeat until t reaches the end of tspan — the step size adapts automatically.</text>
  <text x="440" y="526" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">A stiff problem is one where an explicit method shrinks h to almost nothing.</text>
</svg>
