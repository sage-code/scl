<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="cmTitle cmDesc">
  <title id="cmTitle">Julia arrays are stored column-major, so consecutive addresses run down each column</title>
  <desc id="cmDesc">A 3-row by 4-column array is mapped onto one contiguous block of twelve addresses. The first column occupies addresses one to three, the second column four to six, and so on. Looping over rows in the inner loop therefore walks memory in order.</desc>

  <rect x="0" y="0" width="920" height="500" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="476" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Memory order is column-major</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">A 3×4 array B is one contiguous block of 12 addresses. The numbers below are memory offsets, not indices.</text>

  <text x="40" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">The 3×4 array as you index it</text>

  <rect x="60" y="134" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="95" y="171" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">1</text>
  <rect x="136" y="134" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="171" y="171" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">4</text>
  <rect x="212" y="134" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="247" y="171" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">7</text>
  <rect x="288" y="134" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="323" y="171" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">10</text>

  <rect x="60" y="198" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="95" y="235" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">2</text>
  <rect x="136" y="198" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="171" y="235" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">5</text>
  <rect x="212" y="198" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="247" y="235" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">8</text>
  <rect x="288" y="198" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="323" y="235" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">11</text>

  <rect x="60" y="262" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="95" y="299" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">3</text>
  <rect x="136" y="262" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="171" y="299" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">6</text>
  <rect x="212" y="262" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="247" y="299" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">9</text>
  <rect x="288" y="262" width="70" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="323" y="299" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">12</text>

  <text x="40" y="342" font-family="Consolas, monospace" font-size="14" fill="#8b949e">row 1 = offsets 1, 4, 7, 10</text>
  <text x="40" y="366" font-family="Consolas, monospace" font-size="14" fill="#8b949e">column 1 = offsets 1, 2, 3</text>

  <text x="470" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">Loop order that matches memory</text>

  <rect x="470" y="132" width="410" height="96" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="486" y="160" font-family="Consolas, monospace" font-size="16" fill="#7ee787">for j in 1:4, i in 1:3</text>
  <text x="486" y="186" font-family="Consolas, monospace" font-size="16" fill="#e6edf3">    B[i, j] += 1   # walks 1,2,3,4,5…</text>
  <text x="486" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">the first index changes fastest — one cache line at a time</text>

  <text x="470" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffa657">Loop order that fights memory</text>

  <rect x="470" y="280" width="410" height="96" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="486" y="308" font-family="Consolas, monospace" font-size="16" fill="#ffa657">for i in 1:3, j in 1:4</text>
  <text x="486" y="334" font-family="Consolas, monospace" font-size="16" fill="#e6edf3">    B[i, j] += 1   # strides 3, 3, 3…</text>
  <text x="486" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">same results, more cache misses — the row jump skips 3 cells</text>

  <text x="40" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">One contiguous block of memory</text>

  <rect x="40" y="428" width="64" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="72" y="457" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">1</text>
  <rect x="110" y="428" width="64" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="142" y="457" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">2</text>
  <rect x="180" y="428" width="64" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="212" y="457" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">3</text>
  <rect x="250" y="428" width="64" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="282" y="457" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">4</text>
  <rect x="320" y="428" width="64" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="352" y="457" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">5</text>
  <text x="396" y="457" font-family="Consolas, monospace" font-size="17" fill="#8b949e" text-anchor="middle">…</text>
  <rect x="416" y="428" width="64" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="448" y="457" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">12</text>
</svg>
