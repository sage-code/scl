<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="perfTitle perfDesc">
  <title id="perfTitle">Type inference decides which of two code paths your program takes</title>
  <desc id="perfDesc">Source code is parsed and then passed through type inference, which assigns one type to each variable. If every type is concrete, Julia generates specialised native code for that exact combination of argument types. If some type is unknown, values are boxed on the heap and each call performs a dynamic method lookup, which is dramatically slower inside loops.</desc>

  <rect x="0" y="0" width="920" height="540" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="516" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Type inference decides how fast your code runs</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Performance work in Julia is mostly this question: does the compiler know the type of every value?</text>

  <rect x="360" y="104" width="200" height="60" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="460" y="140" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">your source code</text>

  <line x1="460" y1="164" x2="460" y2="198" stroke="#30363d" stroke-width="2"/>
  <polygon points="460,202 454,190 466,190" fill="#30363d"/>
  <text x="474" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">parse</text>

  <rect x="340" y="204" width="240" height="64" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="460" y="232" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">type inference</text>
  <text x="460" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">one type per variable, per call site</text>

  <line x1="460" y1="268" x2="460" y2="300" stroke="#30363d" stroke-width="2"/>
  <polygon points="460,304 454,292 466,292" fill="#30363d"/>
  <text x="474" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">inferred types</text>

  <polygon points="460,306 620,350 460,394 300,350" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="460" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">all types concrete?</text>
  <text x="460" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">specialisation possible</text>

  <line x1="300" y1="350" x2="190" y2="350" stroke="#ef4444" stroke-width="2"/>
  <line x1="190" y1="350" x2="190" y2="426" stroke="#ef4444" stroke-width="2"/>
  <polygon points="190,430 184,418 196,418" fill="#ef4444"/>
  <text x="238" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ef4444" text-anchor="middle">no</text>

  <rect x="60" y="432" width="260" height="70" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="190" y="460" font-family="Consolas, monospace" font-size="15" fill="#0f172a" text-anchor="middle">dynamic dispatch</text>
  <text x="190" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">boxed values, lookup on every call</text>

  <line x1="620" y1="350" x2="730" y2="350" stroke="#34d399" stroke-width="2"/>
  <line x1="730" y1="350" x2="730" y2="426" stroke="#34d399" stroke-width="2"/>
  <polygon points="730,430 724,418 736,418" fill="#34d399"/>
  <text x="682" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#34d399" text-anchor="middle">yes</text>

  <rect x="590" y="432" width="280" height="70" fill="#34d399" stroke="#059669" stroke-width="2"/>
  <text x="730" y="460" font-family="Consolas, monospace" font-size="15" fill="#0f172a" text-anchor="middle">specialised native code</text>
  <text x="730" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">one compiled method per type combination</text>

  <text x="40" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">The choice is made before your code runs — so the fix for a slow loop is usually a type, not a different algorithm.</text>
</svg>
