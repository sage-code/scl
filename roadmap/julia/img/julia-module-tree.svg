<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="modTitle modDesc">
  <title id="modTitle">Modules form a namespace tree, and using or import decides which names cross the boundary</title>
  <desc id="modDesc">Main contains the module MyApp, which contains two submodules Geometry and Reporting. Names inside a module are reached by a qualified path such as MyApp.Geometry.area; export plus using brings the exported names into the caller's namespace, while import keeps them qualified and allows adding methods.</desc>

  <rect x="0" y="0" width="920" height="450" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="426" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">A module is a namespace with a door</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Names live inside a module; using, import, and qualified names are the three ways through the door.</text>

  <rect x="60" y="106" width="240" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="180" y="139" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">Main</text>

  <line x1="180" y1="158" x2="180" y2="182" stroke="#30363d" stroke-width="2"/>
  <line x1="120" y1="182" x2="420" y2="182" stroke="#30363d" stroke-width="2"/>
  <line x1="120" y1="182" x2="120" y2="206" stroke="#30363d" stroke-width="2"/>
  <line x1="420" y1="182" x2="420" y2="206" stroke="#30363d" stroke-width="2"/>
  <line x1="270" y1="182" x2="270" y2="206" stroke="#30363d" stroke-width="2"/>

  <rect x="40" y="206" width="160" height="52" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="120" y="239" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">MyApp</text>

  <rect x="210" y="206" width="160" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="290" y="239" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">Geometry</text>

  <rect x="380" y="206" width="160" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="460" y="239" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">Reporting</text>

  <text x="40" y="296" font-family="Consolas, monospace" font-size="14" fill="#79c0ff">MyApp.Geometry.area(c)</text>
  <text x="40" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">qualified name — always available, never ambiguous</text>

  <text x="40" y="356" font-family="Consolas, monospace" font-size="14" fill="#79c0ff">using MyApp.Geometry</text>
  <text x="40" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">brings exported names into scope: area(c)</text>

  <text x="40" y="414" font-family="Consolas, monospace" font-size="14" fill="#ffa657">import MyApp.Geometry</text>
  <text x="300" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">keeps the name qualified, and allows new methods</text>
</svg>
