<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="utfTitle utfDesc">
  <title id="utfTitle">Julia string indices count bytes, not characters: every index is valid, but only some are valid starts of a character</title>
  <desc id="utfDesc">The text h-e-acute-l-l-o holds five characters but six bytes, because the accented e needs two bytes. Byte indices run one to six, so s[2] returns the accented e while s[3] raises StringIndexError: byte three is the continuation byte of that same character. length(s) is five and lastindex(s) is six.</desc>

  <rect x="0" y="0" width="920" height="470" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="446" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Indices count bytes, not characters</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">s = "héllo" — five characters, six bytes, because "é" is encoded as two bytes in UTF-8.</text>

  <text x="40" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">What you see — character positions 1…5</text>

  <rect x="60" y="134" width="72" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="96" y="173" font-family="Consolas, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">h</text>
  <rect x="140" y="134" width="72" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="176" y="173" font-family="Consolas, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">é</text>
  <rect x="220" y="134" width="72" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="256" y="173" font-family="Consolas, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">l</text>
  <rect x="300" y="134" width="72" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="336" y="173" font-family="Consolas, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">l</text>
  <rect x="380" y="134" width="72" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="416" y="173" font-family="Consolas, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">o</text>

  <text x="96" y="212" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">1</text>
  <text x="176" y="212" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">2</text>
  <text x="256" y="212" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">3</text>
  <text x="336" y="212" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">4</text>
  <text x="416" y="212" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">5</text>
  <text x="472" y="212" font-family="Consolas, monospace" font-size="14" fill="#8b949e">length(s) = 5</text>

  <text x="40" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">What is stored — byte indices 1…6</text>

  <rect x="60" y="280" width="72" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="96" y="317" font-family="Consolas, monospace" font-size="18" fill="#79c0ff" text-anchor="middle">68</text>
  <rect x="140" y="280" width="72" height="58" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="176" y="317" font-family="Consolas, monospace" font-size="18" fill="#79c0ff" text-anchor="middle">c3</text>
  <rect x="220" y="280" width="72" height="58" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="256" y="317" font-family="Consolas, monospace" font-size="18" fill="#79c0ff" text-anchor="middle">a9</text>
  <rect x="300" y="280" width="72" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="336" y="317" font-family="Consolas, monospace" font-size="18" fill="#79c0ff" text-anchor="middle">6c</text>
  <rect x="380" y="280" width="72" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="416" y="317" font-family="Consolas, monospace" font-size="18" fill="#79c0ff" text-anchor="middle">6c</text>
  <rect x="460" y="280" width="72" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="496" y="317" font-family="Consolas, monospace" font-size="18" fill="#79c0ff" text-anchor="middle">6f</text>

  <text x="96" y="358" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">1</text>
  <text x="176" y="358" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">2</text>
  <text x="256" y="358" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">3</text>
  <text x="336" y="358" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">4</text>
  <text x="416" y="358" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">5</text>
  <text x="496" y="358" font-family="Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">6</text>
  <text x="552" y="358" font-family="Consolas, monospace" font-size="14" fill="#8b949e">lastindex(s) = 6</text>

  <text x="620" y="140" font-family="Consolas, monospace" font-size="15" fill="#7ee787">s[2]</text>
  <text x="700" y="140" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">→ 'é'</text>
  <text x="620" y="168" font-family="Consolas, monospace" font-size="15" fill="#ffa657">s[3]</text>
  <text x="700" y="168" font-family="Consolas, monospace" font-size="15" fill="#ffa657">→ StringIndexError</text>
  <text x="620" y="196" font-family="Consolas, monospace" font-size="14" fill="#8b949e">byte 3 is the tail of 'é'</text>

  <text x="40" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Use eachindex(s) or iterate the string when you want one step per character; use nextind(s, i) to jump safely.</text>
  <text x="40" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Byte indices stay valid for slicing: s[1:3] → "hé", s[2:3] → "é".</text>
</svg>
