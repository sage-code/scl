<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="cfTitle cfDesc">
  <title id="cfTitle">A Julia if / elseif / else block is a single expression that yields one value</title>
  <desc id="cfDesc">Three stacked branches test conditions top to bottom. Each branch produces a value. The whole block is worth the value of the branch that ran, and that value is bound to a variable.</desc>

  <rect x="0" y="0" width="920" height="560" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="536" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">if is an expression, not a statement</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Branches are tested top to bottom; the first true one runs, and its value becomes the value of the whole block.</text>

  <rect x="60" y="104" width="800" height="292" fill="#161b22" stroke="#58a6ff" stroke-width="2" stroke-dasharray="8 5" rx="10"/>
  <text x="80" y="130" font-family="Consolas, monospace" font-size="15" fill="#79c0ff">if score ≥ 90 … elseif … else … end</text>
  <text x="700" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e">one expression</text>

  <rect x="100" y="152" width="240" height="50" fill="#e6edf3" stroke="#8b949e" stroke-width="2" rx="4"/>
  <text x="220" y="183" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">score ≥ 90</text>
  <path d="M340 177 L440 177" stroke="#58a6ff" stroke-width="2"/>
  <path d="M440 177 l-13 -6 l0 12 z" fill="#58a6ff"/>
  <text x="390" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">true</text>
  <rect x="452" y="152" width="150" height="50" fill="#161b22" stroke="#30363d" stroke-width="2" rx="4"/>
  <text x="527" y="183" font-family="Consolas, monospace" font-size="17" fill="#e6edf3" text-anchor="middle">"A"</text>

  <rect x="100" y="222" width="240" height="50" fill="#e6edf3" stroke="#8b949e" stroke-width="2" rx="4"/>
  <text x="220" y="253" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">score ≥ 80</text>
  <path d="M220 202 L220 222" stroke="#8b949e" stroke-width="2"/>
  <path d="M220 222 l-6 -13 l12 0 z" fill="#8b949e"/>
  <text x="248" y="217" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffa657">false</text>
  <path d="M340 247 L440 247" stroke="#58a6ff" stroke-width="2"/>
  <path d="M440 247 l-13 -6 l0 12 z" fill="#58a6ff"/>
  <text x="390" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">true</text>
  <rect x="452" y="222" width="150" height="50" fill="#161b22" stroke="#30363d" stroke-width="2" rx="4"/>
  <text x="527" y="253" font-family="Consolas, monospace" font-size="17" fill="#e6edf3" text-anchor="middle">"B"</text>

  <rect x="100" y="292" width="240" height="50" fill="#e6edf3" stroke="#8b949e" stroke-width="2" rx="4"/>
  <text x="220" y="323" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">else</text>
  <path d="M220 272 L220 292" stroke="#8b949e" stroke-width="2"/>
  <path d="M220 292 l-6 -13 l12 0 z" fill="#8b949e"/>
  <text x="248" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffa657">false</text>
  <path d="M340 317 L440 317" stroke="#58a6ff" stroke-width="2"/>
  <path d="M440 317 l-13 -6 l0 12 z" fill="#58a6ff"/>
  <text x="390" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">always</text>
  <rect x="452" y="292" width="150" height="50" fill="#161b22" stroke="#30363d" stroke-width="2" rx="4"/>
  <text x="527" y="323" font-family="Consolas, monospace" font-size="17" fill="#e6edf3" text-anchor="middle">"C"</text>

  <text x="660" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">each branch is</text>
  <text x="660" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">worth its last</text>
  <text x="660" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">expression</text>

  <path d="M527 344 L527 400" stroke="#58a6ff" stroke-width="2"/>
  <path d="M527 400 l-6 -13 l12 0 z" fill="#58a6ff"/>
  <text x="556" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787">the block yields exactly one value</text>

  <rect x="380" y="406" width="294" height="58" fill="#e6edf3" stroke="#8b949e" stroke-width="2" rx="4"/>
  <text x="527" y="443" font-family="Consolas, monospace" font-size="19" fill="#0d1117" font-weight="bold" text-anchor="middle">grade = "B"</text>

  <text x="40" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e">Because the whole block produces a value, it binds directly: grade = if … end. No temporary variable and no flag are needed.</text>
  <text x="40" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e">In a statement-oriented language the branches would each assign to grade themselves and the block itself would be worth nothing.</text>
</svg>
