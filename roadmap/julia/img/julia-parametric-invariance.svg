<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="piTitle piDesc">
  <title id="piTitle">Type parameters are invariant, while variables inside a definition stand for any subtype</title>
  <desc id="piDesc">Vector Int and Vector Real are not related although Int is a subtype of Real, because array element parameters are invariant. A definition written as Vector T where T is a subtype of Real is a family of concrete types, and calling it with Int fills T in with Int.</desc>

  <rect x="0" y="0" width="920" height="450" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="426" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Parameters do not inherit, they instantiate</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Int is a subtype of Real, but Vector{Int} is not a subtype of Vector{Real}.</text>

  <text x="40" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">Invariance — no relation between these two</text>

  <rect x="60" y="136" width="180" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="150" y="169" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">Vector{Int}</text>

  <rect x="300" y="136" width="180" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="390" y="169" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">Vector{Real}</text>

  <text x="252" y="169" font-family="Consolas, monospace" font-size="18" fill="#ffa657" text-anchor="middle">≠</text>

  <rect x="60" y="200" width="180" height="52" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="150" y="233" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">Int</text>

  <rect x="300" y="200" width="180" height="52" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="390" y="233" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">Real</text>

  <line x1="240" y1="226" x2="300" y2="226" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="300,226 288,220 288,232" fill="#58a6ff"/>
  <text x="270" y="216" font-family="Consolas, monospace" font-size="13" fill="#7ee787" text-anchor="middle">subtype</text>

  <text x="60" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Int &lt;: Real is true, yet Vector{Int} &lt;: Vector{Real} is false.</text>
  <text x="60" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">Write Vector{&lt;:Real} or a where clause when any element type should fit.</text>

  <text x="540" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">Instantiation — one family, many concrete types</text>

  <rect x="540" y="136" width="330" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="705" y="169" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">Vector{T} where {T &lt;: Real}</text>

  <line x1="705" y1="188" x2="705" y2="212" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="705,216 699,204 711,204" fill="#58a6ff"/>
  <text x="760" y="206" font-family="Consolas, monospace" font-size="13" fill="#8b949e">call it with Int</text>

  <rect x="540" y="224" width="330" height="52" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="705" y="257" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">Vector{Int} — a concrete type</text>

  <text x="540" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">The method is compiled once per instantiation, so speed is kept.</text>
  <text x="540" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">T is filled in by the compiler, never looked up at run time.</text>
</svg>
