<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="The request path through a Julia web service">
  <title>The request path through a Julia web service</title>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#0d1117"/>
  <text x="450" y="42" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">One request through a Julia service</text>

  <!-- client -->
  <rect x="30" y="90" width="150" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="105" y="122" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">client</text>
  <text x="105" y="146" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">GET /items?id=7</text>
  <text x="105" y="166" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">Accept: application/json</text>

  <line x1="180" y1="135" x2="232" y2="135" stroke="#8b949e" stroke-width="2" marker-end="url(#a3)"/>

  <!-- server + router -->
  <rect x="235" y="90" width="180" height="90" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="325" y="122" text-anchor="middle" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">HTTP.jl server</text>
  <text x="325" y="146" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">listen("0.0.0.0", 8080)</text>
  <text x="325" y="166" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">router dispatches</text>

  <line x1="415" y1="135" x2="467" y2="135" stroke="#8b949e" stroke-width="2" marker-end="url(#a3)"/>

  <!-- handler -->
  <rect x="470" y="90" width="180" height="90" rx="10" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="560" y="122" text-anchor="middle" fill="#ffa657" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">handler</text>
  <text x="560" y="146" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">validate params</text>
  <text x="560" y="166" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">call model or database</text>

  <line x1="650" y1="135" x2="702" y2="135" stroke="#8b949e" stroke-width="2" marker-end="url(#a3)"/>

  <!-- data -->
  <rect x="705" y="90" width="165" height="90" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="787" y="122" text-anchor="middle" fill="#d2a8ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">data / model</text>
  <text x="787" y="146" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">SQLite, Postgres</text>
  <text x="787" y="166" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">or a simulation</text>

  <!-- response path -->
  <path d="M787 180 V232 H105 V180" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a3)"/>
  <text x="446" y="256" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">200 OK  +  {"id": 7, "value": 42}   serialised with JSON3</text>

  <!-- layers -->
  <rect x="30" y="290" width="400" height="80" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="230" y="320" text-anchor="middle" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">concurrency layer</text>
  <text x="230" y="344" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">one task per request, async I/O, CPU work on threads</text>

  <rect x="470" y="290" width="400" height="80" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="670" y="320" text-anchor="middle" fill="#f0883e" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">operational layer</text>
  <text x="670" y="344" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">logging, /health endpoint, timeouts, graceful shutdown</text>

  <text x="450" y="424" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">Everything in one process: the same Julia code that computes also serves.</text>
  <text x="450" y="450" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">Async I/O for waiting, threads for cores, one image to deploy.</text>
</svg>
