<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600" role="img" aria-label="The layers of a Julia environment">
  <title>The layers of a Julia environment</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="600" fill="#0d1117"/>
  <text x="390" y="42" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">How a Julia environment is built</text>

  <rect x="80" y="70" width="620" height="72" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="110" y="100" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold">1. General Registry</text>
  <text x="110" y="124" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">name → uuid, available versions, dependency tree hashes</text>

  <line x1="390" y1="146" x2="390" y2="176" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="180" width="620" height="72" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="110" y="210" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold">2. Project.toml — what you ask for</text>
  <text x="110" y="234" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">direct deps by uuid  +  [compat] ranges  +  version 0.1.0</text>

  <line x1="390" y1="256" x2="390" y2="286" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="290" width="620" height="72" rx="10" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="110" y="320" fill="#ffa657" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold">3. Manifest.toml — what you got</text>
  <text x="110" y="344" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">every transitive dep, resolved to one exact version</text>

  <line x1="390" y1="366" x2="390" y2="396" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="400" width="620" height="72" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="110" y="430" fill="#d2a8ff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold">4. Depot — ~/.julia</text>
  <text x="110" y="454" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">downloaded sources, precompiled .ji caches, registries</text>

  <line x1="390" y1="476" x2="390" y2="506" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="510" width="620" height="72" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="110" y="540" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold">5. Artifacts / JLL — the non-Julia parts</text>
  <text x="110" y="564" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">BLAS, CUDA, libgit2, Arrow C++ … binaries located by hash</text>
</svg>
