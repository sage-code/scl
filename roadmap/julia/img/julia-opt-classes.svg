<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Problem classes in optimization and what each one can guarantee">
  <title>Problem classes in optimization</title>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#0d1117"/>
  <text x="450" y="44" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">Pick the class, then the guarantee follows</text>

  <!-- root -->
  <rect x="350" y="76" width="200" height="60" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">optimization problem</text>

  <line x1="450" y1="136" x2="450" y2="168" stroke="#8b949e" stroke-width="2"/>

  <!-- branch bar -->
  <line x1="140" y1="168" x2="760" y2="168" stroke="#8b949e" stroke-width="2"/>
  <line x1="140" y1="168" x2="140" y2="196" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="450" y1="168" x2="450" y2="196" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="760" y1="168" x2="760" y2="196" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>

  <!-- continuous -->
  <rect x="40" y="200" width="200" height="70" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="140" y="230" text-anchor="middle" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">continuous</text>
  <text x="140" y="252" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">x ∈ Rⁿ</text>

  <!-- discrete -->
  <rect x="350" y="200" width="200" height="70" rx="10" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="450" y="230" text-anchor="middle" fill="#ffa657" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">mixed-integer</text>
  <text x="450" y="252" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">some x ∈ Z, some x ∈ {0,1}</text>

  <!-- nonlinear -->
  <rect x="660" y="200" width="200" height="70" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="760" y="230" text-anchor="middle" fill="#f85149" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">nonlinear</text>
  <text x="760" y="252" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">f, g nonlinear or non-convex</text>

  <!-- guarantees -->
  <rect x="40" y="314" width="200" height="94" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="140" y="342" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">LP / QP / convex</text>
  <text x="140" y="366" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">proven global optimum</text>
  <text x="140" y="388" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">seconds to minutes</text>

  <rect x="350" y="314" width="200" height="94" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="450" y="342" text-anchor="middle" fill="#d2a8ff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">MILP / MINLP</text>
  <text x="450" y="366" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">optimum + optimality gap</text>
  <text x="450" y="388" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">minutes to hours</text>

  <rect x="660" y="314" width="200" height="94" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="760" y="342" text-anchor="middle" fill="#f0883e" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">non-convex NLP</text>
  <text x="760" y="366" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">a LOCAL optimum</text>
  <text x="760" y="388" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">start point matters</text>

  <line x1="140" y1="270" x2="140" y2="314" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="450" y1="270" x2="450" y2="314" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="760" y1="270" x2="760" y2="314" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>

  <text x="450" y="452" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">Modelling linearly or convexly trades fidelity for a guarantee — take the trade when you can.</text>
  <text x="450" y="478" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">JuMP keeps the model independent of the solver, so the class is a modelling decision, not a tooling one.</text>
</svg>
