<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="alTitle alDesc">
  <title id="alTitle">Assignment aliases an array; copy creates a second one</title>
  <desc id="alDesc">When b is bound to a, both names refer to the same array, so mutating through one is visible through the other. Binding b to copy of a creates an independent array that can be mutated separately.</desc>

  <rect x="0" y="0" width="920" height="420" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="396" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Assignment aliases, copy does not</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Arrays are mutable values, so a name is a reference to one array — not a container of its own.</text>

  <text x="40" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffa657">b = a  — one array, two names</text>

  <rect x="40" y="150" width="46" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2" rx="4"/>
  <text x="63" y="180" font-family="Consolas, monospace" font-size="18" fill="#0d1117" font-weight="bold" text-anchor="middle">a</text>
  <rect x="40" y="230" width="46" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2" rx="4"/>
  <text x="63" y="260" font-family="Consolas, monospace" font-size="18" fill="#0d1117" font-weight="bold" text-anchor="middle">b</text>

  <path d="M86 173 C 160 173, 190 190, 250 196" fill="none" stroke="#ffa657" stroke-width="2"/>
  <path d="M250 196 l-13 -3 l-1 12 z" fill="#ffa657"/>
  <path d="M86 253 C 160 253, 190 236, 250 228" fill="none" stroke="#ffa657" stroke-width="2"/>
  <path d="M250 228 l-13 -3 l-1 12 z" fill="#ffa657"/>

  <rect x="252" y="180" width="180" height="64" fill="#161b22" stroke="#ffa657" stroke-width="3" rx="4"/>
  <text x="342" y="220" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">[1, 2, 3]</text>

  <text x="40" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fc3f8">push!(b, 4) makes a == [1, 2, 3, 4] too —</text>
  <text x="40" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fc3f8">both names are bound to the same array.</text>
  <text x="40" y="352" font-family="Consolas, monospace" font-size="14" fill="#79c0ff">a === b   # true</text>

  <text x="490" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">b = copy(a)  — two arrays</text>

  <rect x="490" y="150" width="46" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2" rx="4"/>
  <text x="513" y="180" font-family="Consolas, monospace" font-size="18" fill="#0d1117" font-weight="bold" text-anchor="middle">a</text>
  <rect x="490" y="230" width="46" height="46" fill="#e6edf3" stroke="#8b949e" stroke-width="2" rx="4"/>
  <text x="513" y="260" font-family="Consolas, monospace" font-size="18" fill="#0d1117" font-weight="bold" text-anchor="middle">b</text>

  <path d="M536 173 L694 173" stroke="#7ee787" stroke-width="2"/>
  <path d="M694 173 l-13 -6 l0 12 z" fill="#7ee787"/>
  <path d="M536 253 L694 253" stroke="#7ee787" stroke-width="2"/>
  <path d="M694 253 l-13 -6 l0 12 z" fill="#7ee787"/>

  <rect x="696" y="146" width="180" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="4"/>
  <text x="786" y="182" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">[1, 2, 3]</text>
  <rect x="696" y="226" width="180" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="4"/>
  <text x="786" y="262" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">[1, 2, 3]</text>

  <text x="490" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fc3f8">push!(b, 4) leaves a as [1, 2, 3] —</text>
  <text x="490" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fc3f8">copy made an independent array.</text>
  <text x="490" y="352" font-family="Consolas, monospace" font-size="14" fill="#79c0ff">a === b   # false</text>
</svg>
