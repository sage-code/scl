<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="tlTitle tlDesc">
  <title id="tlTitle">Concurrency and parallelism are not the same thing</title>
  <desc id="tlDesc">In the upper panel one thread runs three tasks A, B and C by taking turns: a task runs until it waits, then another task uses the thread, so the wall time is the sum of all the work. In the lower panel the same work is split into four chunks that run on four threads at the same time, so the wall time is about one quarter of the total work.</desc>

  <rect x="0" y="0" width="920" height="520" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="496" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Concurrency and parallelism are not the same thing</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">One thread switches between tasks; many threads run tasks at the same time.</text>

  <text x="40" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#58a6ff">One thread — three tasks take turns</text>

  <rect x="40" y="126" width="840" height="46" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="46" y="132" width="160" height="34" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="126" y="154" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">task A</text>
  <rect x="218" y="132" width="150" height="34" fill="#1f2a37" stroke="#7ee787" stroke-width="2"/>
  <text x="293" y="154" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">task B</text>
  <rect x="380" y="132" width="160" height="34" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="460" y="154" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">task A</text>
  <rect x="552" y="132" width="150" height="34" fill="#1f2a37" stroke="#ffa657" stroke-width="2"/>
  <text x="627" y="154" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">task C</text>
  <rect x="714" y="132" width="160" height="34" fill="#1f2a37" stroke="#7ee787" stroke-width="2"/>
  <text x="794" y="154" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">task B</text>

  <text x="40" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Only one task executes at any instant. A task yields when it waits on I/O, which is why async helps I/O-bound work.</text>

  <text x="40" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#34d399">Four threads — the same work runs at the same time</text>

  <rect x="40" y="256" width="840" height="40" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="46" y="262" width="204" height="28" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="148" y="281" font-family="Consolas, monospace" font-size="13" fill="#e6edf3" text-anchor="middle">chunk 1 · worker 1</text>

  <rect x="40" y="308" width="840" height="40" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="46" y="314" width="204" height="28" fill="#1f2a37" stroke="#7ee787" stroke-width="2"/>
  <text x="148" y="333" font-family="Consolas, monospace" font-size="13" fill="#e6edf3" text-anchor="middle">chunk 2 · worker 2</text>

  <rect x="40" y="360" width="840" height="40" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="46" y="366" width="204" height="28" fill="#1f2a37" stroke="#ffa657" stroke-width="2"/>
  <text x="148" y="385" font-family="Consolas, monospace" font-size="13" fill="#e6edf3" text-anchor="middle">chunk 3 · worker 3</text>

  <rect x="40" y="412" width="840" height="40" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="46" y="418" width="204" height="28" fill="#1f2a37" stroke="#d2a8ff" stroke-width="2"/>
  <text x="148" y="437" font-family="Consolas, monospace" font-size="13" fill="#e6edf3" text-anchor="middle">chunk 4 · worker 4</text>

  <line x1="270" y1="248" x2="270" y2="460" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="284" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#34d399">wall clock ≈ total work ÷ 4</text>

  <text x="40" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Async overlaps the WAITING of tasks; threads overlap the RUNNING of work. Use both, for different problems.</text>
</svg>
