<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="exTitle exDesc">
  <title id="exTitle">Quoted code parses to a tree of Expr nodes</title>
  <desc id="exDesc">The source text x plus 2 times y is parsed into one outer Expr with head call, the plus operator and three arguments. The first two arguments are symbols and the third is another Expr for the nested multiplication, which itself holds the symbol for multiply, the integer 2, and the symbol y.</desc>

  <rect x="0" y="0" width="920" height="470" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="446" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Quoted code is a tree of Expr nodes</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Quoting stops at the tree: parsing builds it, nothing runs. Evaluating is a separate step.</text>

  <rect x="40" y="120" width="170" height="60" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="125" y="158" font-family="Consolas, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">x + 2 * y</text>
  <text x="125" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">source text</text>

  <line x1="214" y1="150" x2="320" y2="150" stroke="#7ee787" stroke-width="2"/>
  <polygon points="326,150 314,144 314,156" fill="#7ee787"/>
  <text x="270" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">parse</text>

  <rect x="332" y="116" width="260" height="68" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="462" y="146" font-family="Consolas, monospace" font-size="18" fill="#e6edf3" text-anchor="middle">Expr(:call)</text>
  <text x="462" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">head :call — 3 arguments</text>

  <line x1="462" y1="184" x2="462" y2="216" stroke="#30363d" stroke-width="2"/>
  <line x1="135" y1="216" x2="534" y2="216" stroke="#30363d" stroke-width="2"/>
  <line x1="135" y1="216" x2="135" y2="246" stroke="#30363d" stroke-width="2"/>
  <line x1="297" y1="216" x2="297" y2="246" stroke="#30363d" stroke-width="2"/>
  <line x1="534" y1="216" x2="534" y2="246" stroke="#30363d" stroke-width="2"/>
  <polygon points="135,250 129,238 141,238" fill="#30363d"/>
  <polygon points="297,250 291,238 303,238" fill="#30363d"/>
  <polygon points="534,250 528,238 540,238" fill="#30363d"/>

  <rect x="60" y="250" width="150" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="135" y="276" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">:+</text>
  <text x="135" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Symbol (the name)</text>

  <rect x="222" y="250" width="150" height="58" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="297" y="276" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">:x</text>
  <text x="297" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Symbol (the name)</text>

  <rect x="384" y="250" width="300" height="58" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="534" y="276" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">Expr(:call)</text>
  <text x="534" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">nested call — an Expr inside an Expr</text>

  <line x1="534" y1="308" x2="534" y2="330" stroke="#30363d" stroke-width="2"/>
  <line x1="432" y1="330" x2="648" y2="330" stroke="#30363d" stroke-width="2"/>
  <line x1="432" y1="330" x2="432" y2="360" stroke="#30363d" stroke-width="2"/>
  <line x1="540" y1="330" x2="540" y2="360" stroke="#30363d" stroke-width="2"/>
  <line x1="648" y1="330" x2="648" y2="360" stroke="#30363d" stroke-width="2"/>

  <rect x="384" y="364" width="96" height="54" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="432" y="388" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">:*</text>
  <text x="432" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Symbol</text>

  <rect x="492" y="364" width="96" height="54" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="540" y="388" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">2</text>
  <text x="540" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Int64</text>

  <rect x="600" y="364" width="96" height="54" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="648" y="388" font-family="Consolas, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">:y</text>
  <text x="648" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Symbol</text>

  <text x="40" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Atoms: literals such as 2 stay as values. Names such as x stay as Symbol. Everything compound is an Expr.</text>
</svg>
