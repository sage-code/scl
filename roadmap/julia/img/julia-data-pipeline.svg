<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="The five stages of a Julia data analysis pipeline">
  <title>The five stages of a Julia data analysis pipeline</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#0d1117"/>
  <text x="450" y="42" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">From raw bytes to a figure</text>

  <!-- stage 1 -->
  <rect x="30" y="90" width="150" height="110" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="105" y="122" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">1. Read</text>
  <text x="105" y="150" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">CSV.jl</text>
  <text x="105" y="170" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">Arrow.jl</text>
  <text x="105" y="190" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">XLSX.jl</text>

  <line x1="180" y1="145" x2="212" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 2 -->
  <rect x="215" y="90" width="150" height="110" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="290" y="122" text-anchor="middle" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">2. Clean</text>
  <text x="290" y="150" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">missing, dropmissing</text>
  <text x="290" y="170" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">fix column eltypes</text>
  <text x="290" y="190" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">parse dates and units</text>

  <line x1="365" y1="145" x2="397" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 3 -->
  <rect x="400" y="90" width="150" height="110" rx="10" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="475" y="122" text-anchor="middle" fill="#ffa657" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">3. Shape</text>
  <text x="475" y="150" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">select, filter, transform</text>
  <text x="475" y="170" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">groupby, combine</text>
  <text x="475" y="190" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">innerjoin, stack, unstack</text>

  <line x1="550" y1="145" x2="582" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 4 -->
  <rect x="585" y="90" width="150" height="110" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="660" y="122" text-anchor="middle" fill="#d2a8ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">4. Analyse</text>
  <text x="660" y="150" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">mean, std, quantile</text>
  <text x="660" y="170" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">Distributions.jl</text>
  <text x="660" y="190" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">GLM.jl regression</text>

  <line x1="735" y1="145" x2="767" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 5 -->
  <rect x="770" y="90" width="105" height="110" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="822" y="122" text-anchor="middle" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">5. Show</text>
  <text x="822" y="150" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">Plots.jl</text>
  <text x="822" y="170" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">Makie.jl</text>
  <text x="822" y="190" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">StatsPlots.jl</text>

  <!-- reproducibility wrapper -->
  <rect x="30" y="240" width="845" height="70" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="452" y="270" text-anchor="middle" fill="#f0883e" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">One environment, one script — the same five stages every time</text>
  <text x="452" y="294" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">Project.toml + Manifest.toml + analysis.jl + data/ (read-only input)</text>

  <text x="452" y="352" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">A DataFrame is a set of typed columns — keep them typed, and every stage stays fast.</text>
  <text x="452" y="378" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">A column of Any is the first suspect when a pipeline becomes slow.</text>
</svg>
