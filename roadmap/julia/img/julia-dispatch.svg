<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="dpTitle dpDesc">
  <title id="dpTitle">Multiple dispatch: one function name, many methods, chosen by argument type</title>
  <desc id="dpDesc">A call to area with a Circle argument is matched against a table of methods. The most specific matching signature runs; a generic method is used only when no specific one applies.</desc>

  <rect x="0" y="0" width="920" height="430" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">One name, many methods</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The argument types choose the method — resolved once, not tested on every call.</text>

  <text x="40" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7ee787">the call</text>
  <rect x="40" y="136" width="240" height="64" fill="#e6edf3" stroke="#8b949e" stroke-width="2" rx="4"/>
  <text x="160" y="176" font-family="Consolas, monospace" font-size="17" fill="#0d1117" font-weight="bold" text-anchor="middle">area(Circle(2.0))</text>

  <text x="340" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7ee787">the method table for `area`</text>

  <rect x="340" y="136" width="330" height="50" fill="#161b22" stroke="#7ee787" stroke-width="3" rx="4"/>
  <text x="356" y="168" font-family="Consolas, monospace" font-size="17" fill="#7ee787">area(c::Circle)   = π * c.r^2</text>

  <rect x="340" y="198" width="330" height="50" fill="#161b22" stroke="#30363d" stroke-width="2" rx="4"/>
  <text x="356" y="230" font-family="Consolas, monospace" font-size="17" fill="#e6edf3">area(r::Rectangle) = r.w * r.h</text>

  <rect x="340" y="260" width="330" height="50" fill="#161b22" stroke="#30363d" stroke-width="2" rx="4"/>
  <text x="356" y="292" font-family="Consolas, monospace" font-size="17" fill="#e6edf3">area(p::Polygon)  = polygon_area(p)</text>

  <rect x="340" y="322" width="330" height="50" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
  <text x="356" y="354" font-family="Consolas, monospace" font-size="17" fill="#8b949e">area(s::AbstractShape)</text>

  <path d="M280 168 L340 161" stroke="#7ee787" stroke-width="2"/>
  <path d="M340 161 l-14 -5 l2 12 z" fill="#7ee787"/>
  <text x="292" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787">Circle →</text>
  <text x="262" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787">most specific</text>
  <text x="290" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787">match wins</text>

  <path d="M280 186 C 300 320, 320 340, 340 347" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M340 347 l-14 -4 l1 12 z" fill="#8b949e"/>
  <text x="150" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">fallback, used only if</text>
  <text x="150" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">no specific method fits</text>

  <path d="M670 161 L760 161" stroke="#58a6ff" stroke-width="2"/>
  <path d="M760 161 l-13 -6 l0 12 z" fill="#58a6ff"/>
  <rect x="770" y="136" width="120" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="4"/>
  <text x="830" y="168" font-family="Consolas, monospace" font-size="16" fill="#e6edf3" text-anchor="middle">12.566…</text>

  <text x="40" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7ee787">why it matters</text>
  <text x="40" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">Adding a new shape means adding one method,</text>
  <text x="40" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">not editing a chain of if / elseif tests.</text>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">No method matches → MethodError, listing</text>
  <text x="40" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">the signatures that do exist.</text>
  <text x="40" y="398" font-family="Consolas, monospace" font-size="13" fill="#79c0ff">methods(area)   # lists every signature</text>
</svg>
