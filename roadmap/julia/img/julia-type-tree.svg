<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-label="Julia type hierarchy from Any down through Number, AbstractString and AbstractChar to concrete scalar types">
  <defs>
    <style>
      .abs  { fill:#1f2933; stroke:#58a6ff; stroke-width:2; }
      .con  { fill:#f0f6fc; stroke:#7ee787; stroke-width:2; }
      .str  { fill:#1f2933; stroke:#a371f7; stroke-width:2; }
      .ln   { stroke:#8b949e; stroke-width:2; fill:none; }
      .t    { fill:#e6edf3; font-family:'Segoe UI',Arial,sans-serif; font-size:15px; text-anchor:middle; }
      .tz   { fill:#0d1117; font-family:'Segoe UI',Arial,sans-serif; font-size:14px; text-anchor:middle; font-weight:600; }
      .root { fill:#f0f6fc; stroke:#58a6ff; stroke-width:3; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="520" fill="#0d1117"/>

  <!-- Level 0 -->
  <rect class="root" x="410" y="16" width="180" height="46" rx="8"/>
  <text class="tz" x="500" y="45">Any</text>

  <!-- Level 1 -->
  <rect class="abs" x="225" y="96" width="150" height="46" rx="8"/>
  <text class="t" x="300" y="125">Number</text>

  <rect class="str" x="540" y="96" width="200" height="46" rx="8"/>
  <text class="t" x="640" y="125">AbstractString</text>

  <rect class="str" x="815" y="96" width="170" height="46" rx="8"/>
  <text class="t" x="900" y="125">AbstractChar</text>

  <!-- Level 2 -->
  <rect class="abs" x="95"  y="176" width="130" height="46" rx="8"/>
  <text class="t" x="160" y="205">Real</text>

  <rect class="abs" x="355" y="176" width="130" height="46" rx="8"/>
  <text class="t" x="420" y="205">Complex</text>

  <rect class="con" x="530" y="176" width="220" height="46" rx="8"/>
  <text class="tz" x="640" y="205">String &#183; SubString</text>

  <rect class="con" x="815" y="176" width="170" height="46" rx="8"/>
  <text class="tz" x="900" y="205">Char</text>

  <!-- Level 3 -->
  <rect class="abs" x="30"  y="256" width="120" height="46" rx="8"/>
  <text class="t" x="90" y="285">Integer</text>

  <rect class="abs" x="190" y="256" width="160" height="46" rx="8"/>
  <text class="t" x="270" y="285">AbstractFloat</text>

  <rect class="abs" x="385" y="256" width="130" height="46" rx="8"/>
  <text class="t" x="450" y="285">Rational</text>

  <!-- Level 4 -->
  <rect class="abs" x="10"  y="336" width="240" height="46" rx="8"/>
  <text class="t" x="130" y="365">Bool &#183; Signed &#183; Unsigned</text>

  <!-- Level 5 -->
  <rect class="con" x="5"   y="416" width="250" height="70" rx="8"/>
  <text class="tz" x="130" y="445">Int8 &#183; Int16 &#183; Int32</text>
  <text class="tz" x="130" y="469">Int64 &#183; Int128 &#183; UInt&#8230;</text>

  <rect class="con" x="170" y="416" width="200" height="46" rx="8"/>
  <text class="tz" x="270" y="445">Float16 &#183; Float32 &#183; Float64</text>

  <!-- Connectors -->
  <path class="ln" d="M 500 62 L 500 79 L 300 79 L 300 96"/>
  <path class="ln" d="M 500 62 L 500 96"/>
  <path class="ln" d="M 500 62 L 500 79 L 900 79 L 900 96"/>

  <path class="ln" d="M 300 142 L 300 159 L 160 159 L 160 176"/>
  <path class="ln" d="M 300 142 L 300 159 L 420 159 L 420 176"/>
  <path class="ln" d="M 640 142 L 640 176"/>
  <path class="ln" d="M 900 142 L 900 176"/>

  <path class="ln" d="M 160 222 L 160 239 L 90 239 L 90 256"/>
  <path class="ln" d="M 160 222 L 160 239 L 270 239 L 270 256"/>
  <path class="ln" d="M 160 222 L 160 239 L 450 239 L 450 256"/>

  <path class="ln" d="M 90 302 L 90 319 L 130 319 L 130 336"/>
  <path class="ln" d="M 130 382 L 130 416"/>
  <path class="ln" d="M 270 302 L 270 416"/>
</svg>
