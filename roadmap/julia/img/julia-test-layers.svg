<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-label="The layers of a Julia test suite, from many fast unit assertions to few slow property tests">
  <title>The layers of a Julia test suite</title>

  <rect x="0" y="0" width="800" height="540" fill="#0d1117"/>
  <text x="400" y="46" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">Layers of a test suite</text>

  <!-- wide base: unit tests -->
  <polygon points="120,392 360,392 410,462 70,462" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="240" y="432" text-anchor="middle" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">unit tests</text>

  <!-- middle: integration tests -->
  <polygon points="170,330 310,330 360,392 120,392" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="240" y="368" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">integration</text>

  <!-- top: property and regression tests -->
  <polygon points="205,268 275,268 310,330 170,330" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="240" y="305" text-anchor="middle" fill="#ffa657" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">property</text>

  <!-- annotations -->
  <text x="440" y="296" fill="#ffa657" font-family="Segoe UI, Arial, sans-serif" font-size="14">few, slow — invariants and past bugs</text>
  <text x="440" y="316" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">random inputs, isapprox, @test_broken</text>

  <text x="440" y="358" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">some, medium — real files and I/O</text>
  <text x="440" y="378" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">mktempdir(), round-trip write then read</text>

  <text x="440" y="420" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="14">many, fast — one behaviour each</text>
  <text x="440" y="440" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">@test, @test_throws, @testset</text>

  <!-- CI gate -->
  <rect x="70" y="486" width="660" height="40" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="400" y="511" text-anchor="middle" fill="#d2a8ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">CI gate: Pkg.test() on Linux, macOS and Windows, across Julia versions</text>
</svg>
