<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="bcTitle bcDesc">
  <title id="bcTitle">Julia broadcasting: array plus scalar, and column plus row</title>
  <desc id="bcDesc">Top panel: a length-3 array plus a scalar reuses the scalar for every element. Bottom panel: a 3x1 column vector plus a 1x3 row vector produces a 3x3 result whose cells are every pairwise sum.</desc>

  <rect x="0" y="0" width="920" height="620" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="596" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Julia Broadcasting</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Operators are functions, so a dot in front of one applies it element-wise.</text>

  <text x="40" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">Panel 1 — array .+ scalar</text>

  <rect x="40" y="138" width="54" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="67" y="167" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">1</text>
  <rect x="102" y="138" width="54" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="129" y="167" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">2</text>
  <rect x="164" y="138" width="54" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="191" y="167" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">3</text>

  <text x="246" y="167" font-family="Consolas, monospace" font-size="22" fill="#58a6ff" text-anchor="middle">.+</text>

  <rect x="272" y="138" width="54" height="44" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="299" y="167" font-family="Consolas, monospace" font-size="20" fill="#0d1117" font-weight="bold" text-anchor="middle">10</text>

  <text x="354" y="167" font-family="Consolas, monospace" font-size="22" fill="#58a6ff" text-anchor="middle">=</text>

  <rect x="380" y="138" width="54" height="44" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="407" y="167" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">11</text>
  <rect x="442" y="138" width="54" height="44" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="469" y="167" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">12</text>
  <rect x="504" y="138" width="54" height="44" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="531" y="167" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">13</text>

  <path d="M299 186 L299 198 L407 198 L407 186" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M299 198 L469 198 L469 186" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M299 198 L531 198 L531 186" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="415" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">the scalar is reused for every element (length 1 stretches to length 3)</text>

  <text x="40" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">Panel 2 — 3×1 column .+ 1×3 row</text>

  <rect x="60" y="292" width="70" height="50" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="95" y="325" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">10</text>
  <rect x="60" y="346" width="70" height="50" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="95" y="379" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">20</text>
  <rect x="60" y="400" width="70" height="50" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="95" y="433" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">30</text>

  <text x="160" y="379" font-family="Consolas, monospace" font-size="22" fill="#58a6ff" text-anchor="middle">.+</text>

  <rect x="200" y="346" width="62" height="50" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="231" y="379" font-family="Consolas, monospace" font-size="20" fill="#0d1117" font-weight="bold" text-anchor="middle">1</text>
  <rect x="266" y="346" width="62" height="50" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="297" y="379" font-family="Consolas, monospace" font-size="20" fill="#0d1117" font-weight="bold" text-anchor="middle">2</text>
  <rect x="332" y="346" width="62" height="50" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
  <text x="363" y="379" font-family="Consolas, monospace" font-size="20" fill="#0d1117" font-weight="bold" text-anchor="middle">3</text>

  <text x="420" y="379" font-family="Consolas, monospace" font-size="22" fill="#58a6ff" text-anchor="middle">=</text>

  <rect x="460" y="292" width="62" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="491" y="325" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">11</text>
  <rect x="526" y="292" width="62" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="557" y="325" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">12</text>
  <rect x="592" y="292" width="62" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="623" y="325" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">13</text>

  <rect x="460" y="346" width="62" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="491" y="379" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">21</text>
  <rect x="526" y="346" width="62" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="557" y="379" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">22</text>
  <rect x="592" y="346" width="62" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="623" y="379" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">23</text>

  <rect x="460" y="400" width="62" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="491" y="433" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">31</text>
  <rect x="526" y="400" width="62" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="557" y="433" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">32</text>
  <rect x="592" y="400" width="62" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="623" y="433" font-family="Consolas, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">33</text>

  <text x="700" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">axes align</text>
  <text x="700" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">from the right;</text>
  <text x="700" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">each length-1</text>
  <text x="700" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">axis stretches.</text>

  <text x="40" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e">In Panel 2 both operands have one axis of length 1, so the result is 3×3: every column value is combined with every row value.</text>
  <text x="40" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e">Dark cells are arrays; light cells are the operands being stretched. A mismatch that is neither equal nor 1 is an error, not a silent reshape.</text>
  <text x="40" y="566" font-family="Consolas, monospace" font-size="15" fill="#79c0ff">[10, 20, 30] .+ [1 2 3]   # 3×3, no explicit loops</text>
</svg>
