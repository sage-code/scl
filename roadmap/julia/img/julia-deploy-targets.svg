<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Four Julia deployment targets built from one environment">
  <title>Four Julia deployment targets built from one environment</title>
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#0d1117"/>
  <text x="450" y="44" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">One environment, four deployment targets</text>

  <rect x="280" y="76" width="340" height="86" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="450" y="106" text-anchor="middle" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">Project.toml + Manifest.toml</text>
  <text x="450" y="130" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">bin/run.jl   ·   git tag v1.4.0</text>
  <text x="450" y="150" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12">the release is defined by these three things</text>

  <line x1="450" y1="162" x2="450" y2="196" stroke="#8b949e" stroke-width="2"/>
  <line x1="110" y1="196" x2="790" y2="196" stroke="#8b949e" stroke-width="2"/>
  <line x1="110" y1="196" x2="110" y2="230" stroke="#8b949e" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="337" y1="196" x2="337" y2="230" stroke="#8b949e" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="563" y1="196" x2="563" y2="230" stroke="#8b949e" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="790" y1="196" x2="790" y2="230" stroke="#8b949e" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="30" y="234" width="160" height="150" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="110" y="264" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">development</text>
  <text x="110" y="290" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">julia --project=.</text>
  <text x="110" y="308" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">installed Julia</text>
  <text x="110" y="334" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">fastest to iterate</text>
  <text x="110" y="352" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">startup seconds</text>
  <text x="110" y="370" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">warm depot</text>

  <rect x="257" y="234" width="160" height="150" rx="10" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="337" y="264" text-anchor="middle" fill="#ffa657" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">executable</text>
  <text x="337" y="290" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">create_app(...)</text>
  <text x="337" y="308" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">custom sysimage</text>
  <text x="337" y="334" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">no Julia needed</text>
  <text x="337" y="352" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">fast cold start</text>
  <text x="337" y="370" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">large artefact</text>

  <rect x="483" y="234" width="160" height="150" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="563" y="264" text-anchor="middle" fill="#d2a8ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">container</text>
  <text x="563" y="290" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">FROM julia:1.11</text>
  <text x="563" y="308" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">Pkg.instantiate()</text>
  <text x="563" y="334" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">identical anywhere</text>
  <text x="563" y="352" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">precompiled layers</text>
  <text x="563" y="370" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">orchestrator-ready</text>

  <rect x="710" y="234" width="160" height="150" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="790" y="264" text-anchor="middle" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">cluster job</text>
  <text x="790" y="290" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">julia --threads=64</text>
  <text x="790" y="308" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, monospace" font-size="11">MPI.jl / Distributed</text>
  <text x="790" y="334" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">one image, many nodes</text>
  <text x="790" y="352" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">scheduler decides</text>

  <text x="450" y="428" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">All four run the same code with the same dependency versions.</text>
  <text x="450" y="454" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">What changes is how Julia and its compiled caches reach the machine.</text>
</svg>
