<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="auto" role="img" aria-label="C++ class hierarchy with polymorphism">
  <title>C++ inheritance — Shape with derived classes</title>
  <!-- solid dark canvas -->
  <rect x="0" y="0" width="720" height="420" fill="#0f172a"/>

  <!-- base class -->
  <rect x="250" y="30" width="220" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="60" text-anchor="middle" font-family="monospace" font-size="16" fill="#f59e0b" font-weight="bold">Shape (abstract)</text>
  <line x1="260" y1="74" x2="460" y2="74" stroke="#334155" stroke-width="2"/>
  <text x="360" y="96" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0"># color : Color</text>
  <text x="360" y="120" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">+ area() = 0  (pure virtual)</text>

  <!-- isa arrow -->
  <line x1="280" y1="140" x2="190" y2="236" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="186,244 176,228 196,228" fill="#e2e8f0"/>
  <text x="196" y="196" font-family="monospace" font-size="12" fill="#94a3b8">is-a</text>
  <line x1="440" y1="140" x2="530" y2="236" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="534,244 524,228 544,228" fill="#e2e8f0"/>
  <text x="540" y="196" font-family="monospace" font-size="12" fill="#94a3b8">is-a</text>

  <!-- derived: circle -->
  <rect x="50" y="250" width="220" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="280" text-anchor="middle" font-family="monospace" font-size="14" fill="#3b82f6" font-weight="bold">Circle : Shape</text>
  <line x1="60" y1="294" x2="260" y2="294" stroke="#334155" stroke-width="2"/>
  <text x="160" y="316" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">- radius : double</text>
  <text x="160" y="340" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">+ area() override</text>

  <!-- derived: rectangle (highlight) -->
  <rect x="330" y="250" width="260" height="120" rx="8" fill="#f59e0b"/>
  <text x="460" y="278" text-anchor="middle" font-family="monospace" font-size="14" fill="#0f172a" font-weight="bold">Rectangle : Shape</text>
  <line x1="340" y1="292" x2="580" y2="292" stroke="#b45309" stroke-width="2"/>
  <text x="460" y="314" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">- width, height : double</text>
  <text x="460" y="340" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">+ area() override</text>

  <!-- runtime dispatch note -->
  <text x="360" y="406" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">Shape* s = ...  →  s-&gt;area() picks the right implementation at run time</text>
</svg>
