<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="100%" height="auto" role="img" aria-label="C++ learning path stages">
  <title>C++ learning path</title>
  <!-- solid dark canvas -->
  <rect x="0" y="0" width="640" height="560" fill="#0f172a"/>
  <text x="320" y="36" text-anchor="middle" font-family="monospace" font-size="18" fill="#e2e8f0" font-weight="bold">C++ LEARNING PATH</text>

  <!-- stage 1 -->
  <rect x="120" y="64" width="400" height="56" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="88" text-anchor="middle" font-family="monospace" font-size="14" fill="#3b82f6" font-weight="bold">1. LANGUAGE FOUNDATIONS</text>
  <text x="320" y="108" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">syntax &middot; types &middot; operators &middot; control flow</text>

  <!-- arrow -->
  <polygon points="320,124 312,138 328,138" fill="#e2e8f0"/>

  <!-- stage 2 -->
  <rect x="120" y="144" width="400" height="56" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="320" y="168" text-anchor="middle" font-family="monospace" font-size="14" fill="#34d399" font-weight="bold">2. FUNCTIONS &amp; DATA</text>
  <text x="320" y="188" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">functions &middot; references &middot; strings</text>

  <polygon points="320,204 312,218 328,218" fill="#e2e8f0"/>

  <!-- stage 3 -->
  <rect x="120" y="224" width="400" height="56" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="248" text-anchor="middle" font-family="monospace" font-size="14" fill="#f59e0b" font-weight="bold">3. OBJECT-ORIENTED DESIGN</text>
  <text x="320" y="268" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">classes &middot; inheritance &middot; polymorphism</text>

  <polygon points="320,284 312,298 328,298" fill="#e2e8f0"/>

  <!-- stage 4 -->
  <rect x="120" y="304" width="400" height="56" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="320" y="328" text-anchor="middle" font-family="monospace" font-size="14" fill="#a78bfa" font-weight="bold">4. MEMORY &amp; STL</text>
  <text x="320" y="348" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">RAII &middot; smart pointers &middot; templates</text>

  <polygon points="320,364 312,378 328,378" fill="#e2e8f0"/>

  <!-- stage 5 -->
  <rect x="120" y="384" width="400" height="56" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <text x="320" y="408" text-anchor="middle" font-family="monospace" font-size="14" fill="#f43f5e" font-weight="bold">5. MODERN C++ &amp; PRACTICE</text>
  <text x="320" y="428" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">C++17/20 features &middot; core guidelines</text>

  <polygon points="320,444 312,458 328,458" fill="#e2e8f0"/>

  <!-- stage 6 highlight -->
  <rect x="84" y="464" width="472" height="64" rx="8" fill="#f59e0b"/>
  <text x="320" y="492" text-anchor="middle" font-family="monospace" font-size="14" fill="#0f172a" font-weight="bold">6. CONCURRENCY, GPU &amp; ENTERPRISE</text>
  <text x="320" y="514" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">threads &middot; parallel &middot; GPU &middot; security &middot; build &middot; testing</text>
</svg>
