<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="auto" role="img" aria-label="C++ build pipeline">
  <title>C++ build pipeline</title>
  <!-- solid dark canvas -->
  <rect x="0" y="0" width="700" height="240" fill="#0f172a"/>
  <text x="350" y="34" text-anchor="middle" font-family="monospace" font-size="16" fill="#e2e8f0" font-weight="bold">BUILD PIPELINE</text>

  <!-- source -->
  <rect x="20" y="96" width="116" height="60" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="78" y="120" text-anchor="middle" font-family="monospace" font-size="13" fill="#34d399" font-weight="bold">source</text>
  <text x="78" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">hello.cpp</text>

  <!-- arrow -->
  <polygon points="142,126 154,120 154,132" fill="#e2e8f0"/>

  <!-- preprocessor -->
  <rect x="162" y="96" width="116" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="116" text-anchor="middle" font-family="monospace" font-size="13" fill="#3b82f6" font-weight="bold">preprocess</text>
  <text x="220" y="134" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">#include #define</text>

  <polygon points="284,126 296,120 296,132" fill="#e2e8f0"/>

  <!-- compiler -->
  <rect x="304" y="96" width="116" height="60" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="362" y="116" text-anchor="middle" font-family="monospace" font-size="13" fill="#a78bfa" font-weight="bold">compile</text>
  <text x="362" y="134" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">g++/clang++</text>

  <polygon points="426,126 438,120 438,132" fill="#e2e8f0"/>

  <!-- object -->
  <rect x="446" y="96" width="116" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="504" y="116" text-anchor="middle" font-family="monospace" font-size="13" fill="#f59e0b" font-weight="bold">object</text>
  <text x="504" y="134" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">hello.o</text>

  <polygon points="568,126 580,120 580,132" fill="#e2e8f0"/>

  <!-- linker highlight -->
  <rect x="588" y="88" width="96" height="76" rx="8" fill="#f59e0b"/>
  <text x="636" y="114" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a" font-weight="bold">link</text>
  <text x="636" y="134" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">stdlib +</text>
  <text x="636" y="150" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">runtime</text>
</svg>
