<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" style="width:100%;height:auto;" role="img" aria-labelledby="dpTitle dpDesc">
  <title id="dpTitle">Design Patterns by Problem Intent</title>
  <desc id="dpDesc">Decision map routing recurring software design problems to Creational, Structural, and Behavioral pattern families with examples and trade-offs.</desc>

  <!-- Canvas -->
  <rect x="0" y="0" width="920" height="430" fill="#0f172a"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#334155" stroke-width="2" rx="10"/>

  <!-- Header -->
  <text x="36" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" fill="#e2e8f0">Design Patterns by Problem Intent</text>
  <text x="36" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Start from the structural problem you need to solve, then select a pattern family that isolates change without needless indirection.</text>

  <!-- Decision Node -->
  <rect x="36" y="196" width="164" height="76" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="118" y="229" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Design Problem</text>
  <text x="118" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Where is coupling or change?</text>

  <!-- Branching Spine -->
  <line x1="200" y1="234" x2="226" y2="234" stroke="#94a3b8" stroke-width="2"/>
  <line x1="226" y1="134" x2="226" y2="334" stroke="#94a3b8" stroke-width="2"/>

  <!-- Row 1: Creational -->
  <line x1="226" y1="134" x2="254" y2="134" stroke="#34d399" stroke-width="2"/>
  <polygon points="260,134 252,129 252,139" fill="#34d399"/>

  <rect x="260" y="96" width="190" height="76" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="8"/>
  <text x="355" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Creational</text>
  <text x="355" y="149" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Object construction &amp; setup</text>

  <line x1="450" y1="134" x2="480" y2="134" stroke="#34d399" stroke-width="2"/>
  <polygon points="486,134 478,129 478,139" fill="#34d399"/>

  <rect x="486" y="96" width="398" height="76" fill="#1e293b" stroke="#475569" stroke-width="2" rx="8"/>
  <text x="506" y="127" font-family="Consolas, monospace" font-size="14" fill="#34d399">Factory Method | Builder | Abstract Factory</text>
  <text x="506" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Decouples callers from concrete classes; avoid Singleton global state.</text>

  <!-- Row 2: Structural -->
  <line x1="226" y1="234" x2="254" y2="234" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="260,234 252,229 252,239" fill="#f59e0b"/>

  <rect x="260" y="196" width="190" height="76" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="355" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Structural</text>
  <text x="355" y="249" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Composition &amp; interfaces</text>

  <line x1="450" y1="234" x2="480" y2="234" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="486,234 478,229 478,239" fill="#f59e0b"/>

  <rect x="486" y="196" width="398" height="76" fill="#1e293b" stroke="#475569" stroke-width="2" rx="8"/>
  <text x="506" y="227" font-family="Consolas, monospace" font-size="14" fill="#f59e0b">Adapter | Decorator | Facade</text>
  <text x="506" y="249" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Translates incompatible APIs or layers behavior without subclassing.</text>

  <!-- Row 3: Behavioral -->
  <line x1="226" y1="334" x2="254" y2="334" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="260,334 252,329 252,339" fill="#a78bfa"/>

  <rect x="260" y="296" width="190" height="76" fill="#1e293b" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="355" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Behavioral</text>
  <text x="355" y="349" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Collaboration &amp; control flow</text>

  <line x1="450" y1="334" x2="480" y2="334" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="486,334 478,329 478,339" fill="#a78bfa"/>

  <rect x="486" y="296" width="398" height="76" fill="#1e293b" stroke="#475569" stroke-width="2" rx="8"/>
  <text x="506" y="327" font-family="Consolas, monospace" font-size="14" fill="#a78bfa">Strategy | Observer | Command</text>
  <text x="506" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Swaps algorithms at runtime or decouples event producers and listeners.</text>

  <!-- Footer note -->
  <text x="36" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Guideline: apply a pattern only when variation is real — premature abstraction adds indirection without clarifying the domain.</text>
</svg>
