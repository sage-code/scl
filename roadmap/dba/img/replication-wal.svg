<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" style="width:100%;height:auto;background:#0f172a;border-radius:8px;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="25" y="30" width="145" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="97" y="57" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">App Writes</text>
  <text x="97" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">INSERT / UPDATE</text>

  <line x1="170" y1="60" x2="215" y2="60" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="217" y="20" width="195" height="80" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="314" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Primary Server</text>
  <text x="314" y="67" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">1. Write WAL (fsync)</text>
  <text x="314" y="84" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">2. Update heap &amp; indexes</text>

  <line x1="412" y1="60" x2="488" y2="60" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="450" y="48" fill="#f59e0b" font-family="sans-serif" font-size="11" text-anchor="middle">WAL stream</text>

  <rect x="490" y="20" width="195" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="587" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Standby Replica</text>
  <text x="587" y="67" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Replays WAL continuously</text>
  <text x="587" y="84" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Serves read-only queries</text>

  <line x1="314" y1="100" x2="314" y2="145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="217" y="147" width="195" height="50" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="314" y="170" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">WAL Archive + Base Backup</text>
  <text x="314" y="186" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Required for PITR (backups != replicas)</text>

  <rect x="520" y="147" width="165" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="602" y="170" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Read-Only Analytics</text>
  <text x="602" y="186" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Mind replication lag</text>
  <line x1="587" y1="100" x2="587" y2="145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
</svg>
