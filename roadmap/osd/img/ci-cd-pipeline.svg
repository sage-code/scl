<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD promotion pipeline</title>
  <desc id="desc">A source change passes automated checks, becomes a versioned artifact, waits for release approval, and is deployed to production with health verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#9fb3c8"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="16" fill="#101820"/>
  <g fill="none" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M205 139h32"/>
    <path d="M390 139h32"/>
    <path d="M575 139h32"/>
    <path d="M760 139h32"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g>
      <rect x="30" y="91" width="175" height="96" rx="12" fill="#17324d" stroke="#5ba4e6" stroke-width="2"/>
      <text x="117" y="130" fill="#f4f7fb" font-size="19" font-weight="700">Source change</text>
      <text x="117" y="158" fill="#c5d6e7" font-size="14">reviewed revision</text>
    </g>
    <g>
      <rect x="237" y="91" width="153" height="96" rx="12" fill="#203b34" stroke="#62c19c" stroke-width="2"/>
      <text x="313" y="130" fill="#f4f7fb" font-size="19" font-weight="700">CI checks</text>
      <text x="313" y="158" fill="#c5d6e7" font-size="14">test and build</text>
    </g>
    <g>
      <rect x="422" y="91" width="153" height="96" rx="12" fill="#3b3320" stroke="#e4bb5c" stroke-width="2"/>
      <text x="498" y="130" fill="#f4f7fb" font-size="19" font-weight="700">Artifact</text>
      <text x="498" y="158" fill="#c5d6e7" font-size="14">versioned output</text>
    </g>
    <g>
      <rect x="607" y="91" width="153" height="96" rx="12" fill="#342843" stroke="#b78ad9" stroke-width="2"/>
      <text x="683" y="130" fill="#f4f7fb" font-size="19" font-weight="700">Release gate</text>
      <text x="683" y="158" fill="#c5d6e7" font-size="14">policy or approval</text>
    </g>
    <g>
      <rect x="792" y="91" width="138" height="96" rx="12" fill="#40282b" stroke="#e18484" stroke-width="2"/>
      <text x="861" y="130" fill="#f4f7fb" font-size="19" font-weight="700">Production</text>
      <text x="861" y="158" fill="#c5d6e7" font-size="14">deploy and verify</text>
    </g>
    <text x="480" y="238" fill="#aebdca" font-size="15">A failed gate stops promotion; recovery uses a known-good artifact.</text>
  </g>
</svg>
