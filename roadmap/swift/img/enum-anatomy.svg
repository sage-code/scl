<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a Swift enumeration</title>
  <desc id="desc">A simple enum case holds a raw value; an enum case with an associated value carries a payload that a switch pattern binds.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .hd   { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .case { font-family: system-ui, sans-serif; font-size: 13px; fill: #e2e8f0; }
      .sm   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .code { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #e2e8f0; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="320" fill="#0f172a"/>

  <rect x="40" y="14" width="330" height="34" rx="8" fill="#3b82f6"/>
  <text x="205" y="36" class="hd" text-anchor="middle">Plain cases — one raw value each</text>

  <rect x="40" y="64" width="150" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="115" y="84" class="case" text-anchor="middle">case north</text>

  <rect x="40" y="106" width="150" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="115" y="126" class="case" text-anchor="middle">case south</text>

  <rect x="40" y="148" width="150" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="115" y="168" class="case" text-anchor="middle">case east</text>

  <text x="205" y="84" class="sm">rawValue: Int or String</text>
  <text x="205" y="126" class="sm">no payload travels</text>
  <text x="205" y="168" class="sm">CaseIterable gives allCases</text>

  <rect x="410" y="14" width="330" height="34" rx="8" fill="#f59e0b"/>
  <text x="575" y="36" class="hd" text-anchor="middle">Cases with associated values</text>

  <rect x="410" y="64" width="200" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="420" y="84" class="case">case loading</text>

  <rect x="410" y="106" width="200" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="420" y="126" class="case">case loaded(Data)</text>

  <rect x="410" y="148" width="200" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="420" y="168" class="case">case failed(Error)</text>

  <line x1="614" y1="121" x2="632" y2="121" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="638" y="106" width="102" height="30" rx="6" fill="#f59e0b"/>
  <text x="689" y="126" class="hd" text-anchor="middle">payload</text>

  <text x="420" y="196" class="sm">the payload is part of the case value, not a raw value</text>

  <rect x="40" y="222" width="700" height="84" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="246" class="code">switch state {</text>
  <text x="60" y="266" class="code">  case .loaded(let data):  render(data)</text>
  <text x="60" y="286" class="code">  case .failed(let error): report(error)</text>
  <text x="60" y="304" class="code">}</text>
</svg>
