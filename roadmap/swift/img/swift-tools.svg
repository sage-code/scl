<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 262" role="img" aria-labelledby="title desc">
  <title id="title">Choose a Swift tool</title>
  <desc id="desc">Decision diagram: try a quick snippet, build a full app, or follow a structured course.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .head { font-family: system-ui, sans-serif; font-size: 16px; fill: #e2e8f0; }
      .dec  { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .tool { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="262" fill="#0f172a"/>

  <rect x="40" y="12" width="700" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="390" y="36" class="head" text-anchor="middle">Swift without installing — what do you want to do?</text>

  <rect x="60" y="82" width="220" height="48" rx="8" fill="#3b82f6"/>
  <text x="170" y="111" class="dec" text-anchor="middle">Try a quick snippet</text>
  <line x1="170" y1="130" x2="170" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="166" width="220" height="76" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="170" y="194" class="tool" text-anchor="middle">SwiftFiddle</text>
  <text x="170" y="216" class="tool" text-anchor="middle">Programiz · JDoodle</text>

  <rect x="280" y="82" width="220" height="48" rx="8" fill="#3b82f6"/>
  <text x="390" y="111" class="dec" text-anchor="middle">Build a full app</text>
  <line x1="390" y1="130" x2="390" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="166" width="220" height="76" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="390" y="194" class="tool" text-anchor="middle">Xcode · Swift Playgrounds</text>
  <text x="390" y="216" class="tool" text-anchor="middle">Replit · Codespaces</text>

  <rect x="500" y="82" width="220" height="48" rx="8" fill="#3b82f6"/>
  <text x="610" y="111" class="dec" text-anchor="middle">Learn with a course</text>
  <line x1="610" y1="130" x2="610" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="166" width="220" height="76" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="610" y="194" class="tool" text-anchor="middle">100 Days of Swift</text>
  <text x="610" y="216" class="tool" text-anchor="middle">Stanford CS193p · Exercism</text>
</svg>
