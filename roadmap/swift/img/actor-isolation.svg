<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="title desc">
  <title id="title">An actor serialising access from several tasks</title>
  <desc id="desc">Tasks from different concurrency domains call one actor; each call crosses the isolation boundary with await and the actor runs them one at a time against its isolated state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .hd   { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .case { font-family: system-ui, sans-serif; font-size: 13px; fill: #e2e8f0; }
      .sm   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .code { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #e2e8f0; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="320" fill="#0f172a"/>

  <rect x="40" y="14" width="700" height="34" rx="8" fill="#3b82f6"/>
  <text x="390" y="36" class="hd" text-anchor="middle">One actor serialises access to its isolated state</text>

  <rect x="40" y="70" width="160" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="96" class="case" text-anchor="middle">Task A</text>

  <rect x="40" y="130" width="160" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="156" class="case" text-anchor="middle">Task B</text>

  <rect x="40" y="190" width="160" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="216" class="case" text-anchor="middle">@MainActor</text>

  <line x1="200" y1="91" x2="420" y2="91" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="151" x2="420" y2="151" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="211" x2="420" y2="211" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="310" y="84" class="sm" text-anchor="middle">await</text>
  <text x="310" y="144" class="sm" text-anchor="middle">await</text>
  <text x="310" y="204" class="sm" text-anchor="middle">await</text>

  <rect x="430" y="70" width="310" height="170" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <rect x="430" y="70" width="310" height="34" rx="8" fill="#3b82f6"/>
  <text x="585" y="92" class="hd" text-anchor="middle">actor Counter</text>

  <text x="450" y="132" class="code">private var value = 0</text>
  <text x="450" y="158" class="code">func increment() -&gt; Int</text>
  <text x="450" y="186" class="sm">one call runs at a time</text>
  <text x="450" y="208" class="sm">the others wait their turn</text>
  <text x="450" y="228" class="sm">no lost updates possible</text>

  <text x="40" y="272" class="sm">inside the actor the code is sequential — no locks, and no await needed to reach its own state.</text>
  <text x="40" y="292" class="sm">the suspension point sits at the boundary: every call from outside must await its turn.</text>
</svg>
