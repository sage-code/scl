<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="title desc">
  <title id="title">Strong reference cycle and how a weak link breaks it</title>
  <desc id="desc">Two instances holding each other strongly keep both retain counts above zero, so neither deinitialiser runs; making one direction a weak reference breaks the ring and both counts reach zero.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .hd   { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .case { font-family: system-ui, sans-serif; font-size: 13px; fill: #e2e8f0; }
      .sm   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="340" fill="#0f172a"/>

  <rect x="40" y="14" width="340" height="34" rx="8" fill="#f59e0b"/>
  <text x="210" y="36" class="hd" text-anchor="middle">Both links strong — leak</text>

  <rect x="400" y="14" width="340" height="34" rx="8" fill="#3b82f6"/>
  <text x="570" y="36" class="hd" text-anchor="middle">One weak link — released</text>

  <rect x="90" y="60" width="140" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="80" class="case" text-anchor="middle">Department</text>
  <text x="160" y="98" class="sm" text-anchor="middle">count 2</text>

  <rect x="90" y="170" width="140" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="190" class="case" text-anchor="middle">Employee</text>
  <text x="160" y="208" class="sm" text-anchor="middle">count 2</text>

  <text x="160" y="148" class="sm" text-anchor="middle">both links strong</text>

  <path d="M230,84 L280,84 L280,194 L232,194" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M90,194 L50,194 L50,84 L88,84" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="248" width="280" height="40" rx="6" fill="#f59e0b"/>
  <text x="210" y="273" class="hd" text-anchor="middle">no deinit ever runs</text>

  <rect x="450" y="60" width="140" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="520" y="80" class="case" text-anchor="middle">Department</text>
  <text x="520" y="98" class="sm" text-anchor="middle">count 1</text>

  <rect x="450" y="170" width="140" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="520" y="190" class="case" text-anchor="middle">Employee</text>
  <text x="520" y="208" class="sm" text-anchor="middle">count 1</text>

  <text x="520" y="148" class="sm" text-anchor="middle">strong down, weak back</text>

  <path d="M590,84 L640,84 L640,194 L592,194" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M450,194 L410,194 L410,84 L448,84" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <rect x="430" y="248" width="280" height="40" rx="6" fill="#3b82f6"/>
  <text x="570" y="273" class="hd" text-anchor="middle">both counts reach 0</text>

  <text x="40" y="318" class="sm">in a two-way relationship exactly one side owns: the parent holds the child strongly, the child points back weakly.</text>
</svg>
