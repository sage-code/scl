<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="title desc">
  <title id="title">Struct value semantics versus class reference semantics</title>
  <desc id="desc">Assigning a struct copies its stored data into independent storage; assigning a class instance copies a reference to one shared object.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .hd   { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .lbl  { font-family: system-ui, sans-serif; font-size: 13px; fill: #e2e8f0; }
      .sm   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .note { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="320" fill="#0f172a"/>

  <rect x="40" y="16" width="330" height="36" rx="8" fill="#34d399"/>
  <text x="205" y="40" class="hd" text-anchor="middle">struct Point — value type</text>

  <rect x="40" y="70" width="130" height="56" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="105" y="94" class="lbl" text-anchor="middle">var a</text>
  <text x="105" y="112" class="sm" text-anchor="middle">x: 1  y: 2</text>

  <rect x="240" y="70" width="130" height="56" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="305" y="94" class="lbl" text-anchor="middle">var b</text>
  <text x="305" y="112" class="sm" text-anchor="middle">x: 1  y: 2</text>

  <line x1="176" y1="98" x2="234" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="86" class="sm" text-anchor="middle">copy</text>

  <line x1="105" y1="132" x2="105" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="119" y="164" class="sm">unchanged</text>

  <line x1="305" y1="132" x2="305" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="319" y="164" class="sm">b.x = 9</text>

  <rect x="40" y="196" width="130" height="56" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="105" y="220" class="lbl" text-anchor="middle">var a</text>
  <text x="105" y="238" class="sm" text-anchor="middle">x: 1  y: 2</text>

  <rect x="240" y="196" width="130" height="56" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="305" y="220" class="lbl" text-anchor="middle">var b</text>
  <text x="305" y="238" class="sm" text-anchor="middle">x: 9  y: 2</text>

  <rect x="410" y="16" width="330" height="36" rx="8" fill="#f59e0b"/>
  <text x="575" y="40" class="hd" text-anchor="middle">class Node — reference type</text>

  <rect x="410" y="70" width="130" height="56" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="475" y="94" class="lbl" text-anchor="middle">var a</text>
  <text x="475" y="112" class="sm" text-anchor="middle">reference</text>

  <rect x="610" y="70" width="130" height="56" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="675" y="94" class="lbl" text-anchor="middle">var b</text>
  <text x="675" y="112" class="sm" text-anchor="middle">reference</text>

  <line x1="475" y1="132" x2="558" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="675" y1="132" x2="622" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="188" class="sm" text-anchor="middle">shares</text>

  <rect x="510" y="196" width="160" height="56" rx="6" fill="#f59e0b"/>
  <text x="590" y="220" class="hd" text-anchor="middle">one instance</text>
  <text x="590" y="238" class="hd" text-anchor="middle">count = 3</text>

  <text x="40" y="280" class="note">Copying a struct duplicates the data.</text>
  <text x="410" y="280" class="note">Copying a class shares the object.</text>
</svg>
