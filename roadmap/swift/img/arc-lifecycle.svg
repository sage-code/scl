<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="title desc">
  <title id="title">Retain count over the life of a class instance</title>
  <desc id="desc">A class instance is retained by each new reference, released by each reference that ends, and deinitialised when the retain count returns to zero.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .hd   { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .case { font-family: system-ui, sans-serif; font-size: 13px; fill: #e2e8f0; }
      .sm   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .code { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #e2e8f0; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="300" fill="#0f172a"/>

  <rect x="40" y="14" width="700" height="34" rx="8" fill="#3b82f6"/>
  <text x="390" y="36" class="hd" text-anchor="middle">Retain count over the life of one instance</text>

  <rect x="40" y="80" width="160" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="108" class="code" text-anchor="middle">var a = Logger()</text>
  <text x="120" y="132" class="sm" text-anchor="middle">count 1</text>

  <rect x="220" y="80" width="160" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="300" y="108" class="code" text-anchor="middle">var b = a</text>
  <text x="300" y="132" class="sm" text-anchor="middle">count 2</text>

  <rect x="400" y="80" width="160" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="108" class="code" text-anchor="middle">a = nil</text>
  <text x="480" y="132" class="sm" text-anchor="middle">count 1</text>

  <rect x="580" y="80" width="160" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="660" y="108" class="code" text-anchor="middle">b = nil</text>
  <text x="660" y="132" class="sm" text-anchor="middle">count 0</text>

  <line x1="200" y1="115" x2="218" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="115" x2="398" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="115" x2="578" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="209" y="172" class="sm" text-anchor="middle">holder added</text>
  <text x="389" y="172" class="sm" text-anchor="middle">holder removed</text>
  <text x="640" y="172" class="sm" text-anchor="middle">last holder removed</text>

  <rect x="40" y="200" width="520" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="300" y="220" class="case" text-anchor="middle">alive — usable by every holder</text>

  <rect x="580" y="200" width="160" height="30" rx="6" fill="#f59e0b"/>
  <text x="660" y="220" class="hd" text-anchor="middle">deinit runs</text>

  <text x="40" y="258" class="sm">the count measures holders, not scope.</text>
  <text x="40" y="278" class="sm">leaving a function releases one holder; the instance dies only at the last release.</text>
</svg>
