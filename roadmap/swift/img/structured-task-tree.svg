<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="title desc">
  <title id="title">Structured concurrency: a parent task and its child tasks</title>
  <desc id="desc">A parent task starts async let bindings and a task group; the parent suspends while its children run and cannot return until every child has finished or been cancelled.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .hd   { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .case { font-family: system-ui, sans-serif; font-size: 13px; fill: #e2e8f0; }
      .sm   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .code { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #e2e8f0; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="330" fill="#0f172a"/>

  <rect x="40" y="14" width="700" height="34" rx="8" fill="#3b82f6"/>
  <text x="390" y="36" class="hd" text-anchor="middle">A parent task suspends until its children finish</text>

  <rect x="290" y="64" width="200" height="44" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="390" y="91" class="code" text-anchor="middle">func loadPair() async</text>

  <line x1="390" y1="108" x2="390" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="115" y1="150" x2="540" y2="150" stroke="#94a3b8" stroke-width="2"/>

  <line x1="115" y1="150" x2="115" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="150" x2="265" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="150" x2="540" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="170" width="130" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="115" y="197" class="case" text-anchor="middle">async let first</text>

  <rect x="200" y="170" width="130" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="265" y="197" class="case" text-anchor="middle">async let second</text>

  <rect x="360" y="170" width="360" height="120" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="374" y="194" class="sm">task group — bounded children</text>

  <rect x="376" y="210" width="106" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="429" y="237" class="case" text-anchor="middle">child 1</text>

  <rect x="490" y="210" width="106" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="543" y="237" class="case" text-anchor="middle">child 2</text>

  <rect x="604" y="210" width="106" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="657" y="237" class="case" text-anchor="middle">child 3</text>

  <text x="40" y="318" class="sm">the parent cannot return before every child has completed or been cancelled; the group owns them all.</text>
</svg>
