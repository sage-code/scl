<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="title desc">
  <title id="title">Protocol conformance and a shared default implementation</title>
  <desc id="desc">A protocol states requirements; a struct, a class and an enum each declare conformance and inherit a default implementation from a protocol extension.</desc>
  <defs>
    <marker id="conf" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L11,6 L0,12 z" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
    </marker>
    <style>
      .hd   { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .lbl  { font-family: system-ui, sans-serif; font-size: 13px; fill: #e2e8f0; }
      .sm   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .smk  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #e2e8f0; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="340" fill="#0f172a"/>

  <rect x="270" y="14" width="180" height="62" rx="8" fill="#3b82f6"/>
  <text x="360" y="38" class="hd" text-anchor="middle">«protocol»</text>
  <text x="360" y="60" class="hd" text-anchor="middle">Drawable</text>

  <rect x="490" y="14" width="250" height="76" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="505" y="36" class="sm">requirements</text>
  <text x="505" y="58" class="code">func draw()</text>
  <text x="505" y="78" class="code">var area: Double</text>

  <line x1="150" y1="140" x2="630" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="150" y1="140" x2="150" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="390" y1="140" x2="390" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="630" y1="140" x2="630" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="390" y1="140" x2="390" y2="88" stroke="#94a3b8" stroke-width="2" marker-end="url(#conf)"/>
  <text x="404" y="120" class="smk">conforms to</text>

  <rect x="60" y="200" width="180" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="150" y="226" class="lbl" text-anchor="middle">struct Circle</text>
  <text x="150" y="246" class="sm" text-anchor="middle">area · draw()</text>

  <rect x="300" y="200" width="180" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="390" y="226" class="lbl" text-anchor="middle">class Square</text>
  <text x="390" y="246" class="sm" text-anchor="middle">area · draw()</text>

  <rect x="540" y="200" width="180" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="630" y="226" class="lbl" text-anchor="middle">enum Icon</text>
  <text x="630" y="246" class="sm" text-anchor="middle">area · draw()</text>

  <rect x="200" y="280" width="380" height="52" rx="8" fill="#1e293b" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="390" y="312" class="code" text-anchor="middle">extension Drawable — shared default draw()</text>
</svg>
