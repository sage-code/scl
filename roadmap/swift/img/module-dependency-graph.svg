<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-labelledby="title desc">
  <title id="title">Target dependency graph of a Swift package</title>
  <desc id="desc">An executable target depends on a library target and on an external package product, while a test target depends on the library; edges point one way only, so no cycle exists.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .hd   { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .case { font-family: system-ui, sans-serif; font-size: 13px; fill: #e2e8f0; }
      .sm   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="310" fill="#0f172a"/>

  <rect x="40" y="14" width="700" height="34" rx="8" fill="#3b82f6"/>
  <text x="390" y="36" class="hd" text-anchor="middle">Targets are modules: dependencies point one way</text>

  <rect x="60" y="70" width="240" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="180" y="92" class="case" text-anchor="middle">SensorDemo</text>
  <text x="180" y="110" class="sm" text-anchor="middle">executable target</text>

  <rect x="460" y="70" width="280" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="600" y="92" class="case" text-anchor="middle">swift-argument-parser</text>
  <text x="600" y="110" class="sm" text-anchor="middle">external package</text>

  <rect x="60" y="200" width="240" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="180" y="222" class="case" text-anchor="middle">SensorKit</text>
  <text x="180" y="240" class="sm" text-anchor="middle">library target</text>

  <rect x="460" y="200" width="280" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="600" y="222" class="case" text-anchor="middle">SensorKitTests</text>
  <text x="600" y="240" class="sm" text-anchor="middle">test target</text>

  <line x1="300" y1="94" x2="452" y2="94" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="376" y="84" class="sm" text-anchor="middle">.product(name:)</text>

  <line x1="180" y1="118" x2="180" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="160" class="sm">depends on</text>

  <line x1="460" y1="224" x2="308" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="384" y="214" class="sm" text-anchor="middle">@testable import</text>

  <text x="40" y="282" class="sm">a target may import a module only along a declared edge — never backwards, so a cycle cannot be expressed.</text>
</svg>
