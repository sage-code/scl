<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="title desc">
  <title id="title">Generic definition and substituted copies</title>
  <desc id="desc">One generic Stack&lt;Element&gt; definition produces the concrete types Stack&lt;Int&gt; and Stack&lt;String&gt; when the type parameter is fixed; constraints restrict which types may be substituted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .hd   { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
      .smk  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code { font-family: Consolas, Menlo, monospace; font-size: 11px; fill: #e2e8f0; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="300" fill="#0f172a"/>

  <rect x="40" y="14" width="280" height="36" rx="8" fill="#3b82f6"/>
  <text x="180" y="38" class="hd" text-anchor="middle">Generic definition</text>

  <rect x="40" y="64" width="280" height="104" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="56" y="88" class="code">struct Stack&lt;Element&gt; {</text>
  <text x="56" y="106" class="code">  mutating func push(_ x: Element)</text>
  <text x="56" y="124" class="code">  mutating func pop() -&gt; Element?</text>
  <text x="56" y="142" class="code">}</text>

  <rect x="460" y="14" width="300" height="36" rx="8" fill="#3b82f6"/>
  <text x="610" y="38" class="hd" text-anchor="middle">Substituted copies</text>

  <line x1="324" y1="91" x2="454" y2="91" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="80" class="smk" text-anchor="middle">Element := Int</text>

  <line x1="324" y1="161" x2="454" y2="161" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="150" class="smk" text-anchor="middle">Element := String</text>

  <rect x="460" y="64" width="300" height="54" rx="8" fill="#f59e0b"/>
  <text x="610" y="90" class="hd" text-anchor="middle">Stack&lt;Int&gt;</text>
  <text x="610" y="108" class="hd" text-anchor="middle">push(_ x: Int)</text>

  <rect x="460" y="134" width="300" height="54" rx="8" fill="#34d399"/>
  <text x="610" y="160" class="hd" text-anchor="middle">Stack&lt;String&gt;</text>
  <text x="610" y="178" class="hd" text-anchor="middle">push(_ x: String)</text>

  <rect x="40" y="220" width="720" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="248" class="code">func top&lt;T: Comparable&gt;(of items: [T]) -&gt; T?   // T must be Comparable</text>
  <text x="60" y="270" class="code">func merge&lt;A, B&gt;(_ a: A, _ b: B) where A.Element == B.Item</text>
</svg>
