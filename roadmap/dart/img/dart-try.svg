<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" style="width:100%;height:auto;" role="img" aria-label="Dart try, on, catch, and finally exception handling flow">
  <rect width="760" height="280" rx="12" fill="#0f172a"/>
  <text x="380" y="34" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Dart Exception Handling Flow (try / on / catch / finally)</text>

  <rect x="36" y="106" width="140" height="68" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="106" y="136" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">try { ... }</text>
  <text x="106" y="156" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Protected block</text>

  <polygon points="270,92 344,140 270,188 196,140" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="136" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Exception</text>
  <text x="270" y="152" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">thrown?</text>

  <rect x="392" y="64" width="160" height="64" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="472" y="92" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">on Type catch (e, st)</text>
  <text x="472" y="112" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Handle matching exception</text>

  <rect x="392" y="154" width="160" height="64" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="472" y="182" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Normal completion</text>
  <text x="472" y="202" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Skip catch handlers</text>

  <rect x="596" y="106" width="132" height="68" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="662" y="136" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">finally { ... }</text>
  <text x="662" y="156" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Always executes</text>

  <line x1="176" y1="140" x2="196" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="344" y1="122" x2="392" y2="96" stroke="#ef4444" stroke-width="2"/>
  <text x="364" y="98" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">Yes</text>
  <line x1="344" y1="158" x2="392" y2="186" stroke="#34d399" stroke-width="2"/>
  <text x="364" y="188" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">No</text>
  <line x1="552" y1="96" x2="596" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <line x1="552" y1="186" x2="596" y2="152" stroke="#94a3b8" stroke-width="2"/>
</svg>
