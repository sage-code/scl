<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="100%">
  <rect width="720" height="170" fill="#0f172a" rx="12"/>
  <text x="360" y="32" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">gcc file.c -o app — four stages</text>

  <!-- stage boxes -->
  <rect x="20" y="70" width="130" height="52" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="85" y="92" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#f59e0b">1. Preprocessor</text>
  <text x="85" y="110" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">text: #include, #define</text>

  <rect x="190" y="70" width="130" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="255" y="92" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#3b82f6">2. Compiler</text>
  <text x="255" y="110" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">C → assembly</text>

  <rect x="360" y="70" width="130" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="425" y="92" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#3b82f6">3. Assembler</text>
  <text x="425" y="110" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">asm → object .o</text>

  <rect x="530" y="70" width="150" height="52" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="605" y="92" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#34d399">4. Linker</text>
  <text x="605" y="110" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">objects + libs → executable</text>

  <!-- arrows -->
  <line x1="150" y1="96" x2="186" y2="96" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="186,90 198,96 186,102" fill="#64748b"/>
  <line x1="320" y1="96" x2="356" y2="96" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="356,90 368,96 356,102" fill="#64748b"/>
  <line x1="490" y1="96" x2="526" y2="96" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="526,90 538,96 526,102" fill="#64748b"/>

  <text x="360" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">The preprocessor runs on text before the compiler sees a single token</text>
</svg>
