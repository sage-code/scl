<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%">
  <rect width="760" height="460" fill="#0f172a" rx="12"/>
  <text x="380" y="30" text-anchor="middle" font-family="Consolas,monospace" font-size="17" fill="#e2e8f0">Two philosophies, one craft: language lineage</text>

  <!-- C family column (all nodes boxed, centered on x=95) -->
  <rect x="20" y="52" width="150" height="28" rx="7" fill="#1e293b" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="95" y="71" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#93c5fd">ALGOL 60 (1960)</text>
  <line x1="95" y1="82" x2="95" y2="90" stroke="#64748b" stroke-width="2"/>

  <rect x="20" y="90" width="150" height="28" rx="7" fill="#1e293b" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="95" y="109" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#93c5fd">BCPL (1967)</text>
  <line x1="95" y1="120" x2="95" y2="128" stroke="#64748b" stroke-width="2"/>

  <rect x="20" y="128" width="150" height="28" rx="7" fill="#1e293b" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="95" y="147" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#93c5fd">B (1969)</text>
  <line x1="95" y1="158" x2="95" y2="176" stroke="#64748b" stroke-width="2"/>

  <!-- C: light highlight box -> dark text allowed -->
  <rect x="20" y="176" width="160" height="42" rx="8" fill="#f59e0b"/>
  <text x="95" y="194" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="bold" fill="#0f172a">C (1972)</text>
  <text x="95" y="211" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#0f172a">Ritchie &#183; Bell Labs</text>

  <!-- Pascal / Wirth column (all nodes boxed, centered on x=545) -->
  <rect x="450" y="52" width="190" height="40" rx="8" fill="#2563eb" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="545" y="71" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#e2e8f0">Pascal (1970)</text>
  <text x="545" y="87" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#bfdbfe">Wirth</text>
  <line x1="545" y1="94" x2="545" y2="104" stroke="#64748b" stroke-width="2"/>

  <rect x="450" y="104" width="190" height="28" rx="7" fill="#1e293b" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="545" y="123" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#93c5fd">Modula-2 (1978)</text>
  <line x1="545" y1="134" x2="545" y2="146" stroke="#64748b" stroke-width="2"/>

  <!-- Oberon: light blue box -> dark text allowed -->
  <rect x="450" y="146" width="190" height="44" rx="8" fill="#3b82f6"/>
  <text x="545" y="166" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="bold" fill="#0f172a">Oberon (1987)</text>
  <text x="545" y="183" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#0f172a">Wirth + Gutknecht</text>

  <!-- convergence: both answer "systems programming" -->
  <line x1="180" y1="200" x2="450" y2="200" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="315" y="191" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#94a3b8">systems programming</text>

  <!-- C children: C++ and Objective-C -->
  <line x1="95" y1="218" x2="95" y2="240" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="240" x2="260" y2="240" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="240" x2="60" y2="254" stroke="#64748b" stroke-width="2"/>
  <rect x="15" y="254" width="90" height="28" rx="7" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="273" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#cbd5e1">C++ (1985)</text>
  <line x1="185" y1="240" x2="185" y2="254" stroke="#64748b" stroke-width="2"/>
  <rect x="125" y="254" width="120" height="28" rx="7" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="185" y="273" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#cbd5e1">Objective-C (1984)</text>

  <!-- C successors: Zig, Rust, Go -->
  <line x1="260" y1="240" x2="260" y2="286" stroke="#34d399" stroke-width="2"/>
  <line x1="260" y1="286" x2="530" y2="286" stroke="#34d399" stroke-width="2"/>
  <line x1="300" y1="286" x2="300" y2="300" stroke="#34d399" stroke-width="2"/>
  <line x1="400" y1="286" x2="400" y2="300" stroke="#34d399" stroke-width="2"/>
  <line x1="500" y1="286" x2="500" y2="300" stroke="#34d399" stroke-width="2"/>
  <rect x="255" y="300" width="90" height="30" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="300" y="320" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#34d399">Zig (2016)</text>
  <rect x="345" y="300" width="110" height="30" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="400" y="320" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#34d399">Rust (2015)</text>
  <rect x="455" y="300" width="90" height="30" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="320" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#34d399">Go (2009)</text>

  <!-- bottom verdict -->
  <rect x="140" y="352" width="480" height="54" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="380" y="374" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#e2e8f0">Explicit control  vs  safety by construction</text>
  <text x="380" y="393" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#94a3b8">Modern C successors borrow from both sides</text>

  <text x="380" y="436" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#64748b">Sage-Code &#8212; C roadmap</text>
</svg>
