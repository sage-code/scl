<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" width="100%">
  <rect width="520" height="430" fill="#0f172a" rx="12"/>
  <text x="260" y="28" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">Process memory layout</text>

  <!-- STACK — same axis x=170, same width as all boxes below -->
  <rect x="70" y="48" width="200" height="76" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="170" y="72" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#34d399">STACK</text>
  <text x="170" y="92" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">locals · call frames · recursion</text>
  <text x="170" y="112" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#34d399">grows downward &#8595;</text>

  <!-- 26px gap: dashed axis; heap grows up toward the stack -->
  <line x1="170" y1="126" x2="170" y2="146" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="166,132 170,124 174,132" fill="#64748b"/>

  <!-- HEAP -->
  <rect x="70" y="150" width="200" height="76" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="170" y="174" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#f59e0b">HEAP</text>
  <text x="170" y="194" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">malloc &#183; calloc &#183; realloc</text>
  <text x="170" y="214" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#f59e0b">grows upward &#8593;</text>

  <!-- 26px gap -->
  <line x1="170" y1="228" x2="170" y2="244" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- .data / .bss -->
  <rect x="70" y="252" width="200" height="44" rx="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="272" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#cbd5e1">.data / .bss</text>
  <text x="170" y="289" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">initialized / zeroed globals</text>

  <!-- 16px gap -->
  <line x1="170" y1="298" x2="170" y2="308" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- .text -->
  <rect x="70" y="312" width="200" height="44" rx="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="332" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#cbd5e1">.text</text>
  <text x="170" y="349" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">compiled machine code</text>

  <!-- right annotations aligned to each box's vertical center -->
  <text x="300" y="86" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">dies when the block exits</text>
  <text x="300" y="188" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">lives until free() &#8212; your job</text>
  <text x="300" y="274" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">static storage, whole run</text>
  <text x="300" y="334" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">read-only, shared, cache-hot</text>

  <text x="260" y="402" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#64748b">Sage-Code &#8212; C roadmap</text>
</svg>
