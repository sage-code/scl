<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="100%">
  <rect width="560" height="190" fill="#0f172a" rx="12"/>
  <text x="280" y="30" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">char s[3] = "Hi"</text>

  <!-- three boxes: H i NUL -->
  <rect x="90" y="60" width="90" height="56" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="135" y="82" text-anchor="middle" font-family="Consolas,monospace" font-size="20" fill="#e2e8f0">'H'</text>
  <text x="135" y="104" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#64748b">s[0]</text>

  <rect x="190" y="60" width="90" height="56" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="235" y="82" text-anchor="middle" font-family="Consolas,monospace" font-size="20" fill="#e2e8f0">'i'</text>
  <text x="235" y="104" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#64748b">s[1]</text>

  <rect x="290" y="60" width="90" height="56" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="335" y="80" text-anchor="middle" font-family="Consolas,monospace" font-size="18" fill="#f59e0b">'\0'</text>
  <text x="335" y="104" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#64748b">s[2] terminator</text>

  <text x="280" y="146" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#94a3b8">strlen(s) = 2   |   sizeof(s) = 3</text>
  <text x="280" y="168" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#64748b">No length field is stored — walk until the NUL</text>
</svg>
