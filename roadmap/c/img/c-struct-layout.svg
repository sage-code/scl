<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="100%">
  <rect width="560" height="230" fill="#0f172a" rx="12"/>
  <text x="280" y="28" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#e2e8f0">struct { char c; int i; } — alignment padding (4-byte int)</text>

  <!-- byte cells -->
  <rect x="60" y="70" width="60" height="60" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="90" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#34d399">c</text>
  <text x="90" y="116" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">offset 0</text>

  <rect x="120" y="70" width="60" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">pad</text>
  <text x="150" y="116" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">offset 1</text>

  <rect x="180" y="70" width="60" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="210" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">pad</text>
  <text x="210" y="116" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">offset 2</text>

  <rect x="240" y="70" width="60" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="270" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">pad</text>
  <text x="270" y="116" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">offset 3</text>

  <rect x="300" y="70" width="120" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#f59e0b">i (4 bytes)</text>
  <text x="360" y="116" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">offset 4..7 — aligned to 4</text>

  <!-- bracket -->
  <line x1="60" y1="150" x2="420" y2="150" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="60" y1="150" x2="60" y2="160" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="420" y1="150" x2="420" y2="160" stroke="#e2e8f0" stroke-width="2"/>
  <text x="240" y="172" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#e2e8f0">sizeof(struct) = 8, not 5</text>

  <text x="280" y="200" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">Reordering fields (int first) avoids the padding entirely</text>
  <text x="280" y="216" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#64748b">offsetof(struct, i) == 4 on a 4-byte-aligned platform</text>
</svg>
