<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="100%">
  <rect width="640" height="190" fill="#0f172a" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">Singly linked list: head → nodes → NULL</text>

  <!-- head -->
  <rect x="20" y="66" width="80" height="46" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="93" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#f59e0b">head</text>

  <!-- node 1 -->
  <rect x="140" y="58" width="110" height="62" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="195" y="78" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#e2e8f0">value: 3</text>
  <text x="195" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">next: ●</text>
  <text x="195" y="112" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">heap</text>

  <!-- node 2 -->
  <rect x="290" y="58" width="110" height="62" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="345" y="78" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#e2e8f0">value: 2</text>
  <text x="345" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">next: ●</text>
  <text x="345" y="112" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">heap</text>

  <!-- node 3 -->
  <rect x="440" y="58" width="110" height="62" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="495" y="78" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#e2e8f0">value: 1</text>
  <text x="495" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">next: NULL</text>
  <text x="495" y="112" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">heap</text>

  <!-- arrows -->
  <line x1="100" y1="89" x2="136" y2="89" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="136,83 148,89 136,95" fill="#f59e0b"/>
  <line x1="250" y1="89" x2="286" y2="89" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="286,83 298,89 286,95" fill="#34d399"/>
  <line x1="400" y1="89" x2="436" y2="89" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="436,83 448,89 436,95" fill="#34d399"/>

  <text x="320" y="152" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#94a3b8">push_front is O(1)  ·  search by value is O(n)  ·  each node is one malloc</text>
  <text x="320" y="172" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#64748b">delete needs the previous node — the doubly linked list keeps a back-pointer</text>
</svg>
