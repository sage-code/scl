<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="100%">
  <rect width="620" height="250" fill="#0f172a" rx="12"/>
  <text x="310" y="28" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">Hash table: buckets + collision chains (chaining)</text>

  <!-- bucket index labels + boxes -->
  <text x="40" y="74" text-anchor="end" font-family="Consolas,monospace" font-size="11" fill="#64748b">0</text>
  <text x="40" y="110" text-anchor="end" font-family="Consolas,monospace" font-size="11" fill="#64748b">1</text>
  <text x="40" y="146" text-anchor="end" font-family="Consolas,monospace" font-size="11" fill="#64748b">2</text>
  <text x="40" y="182" text-anchor="end" font-family="Consolas,monospace" font-size="11" fill="#64748b">3</text>

  <rect x="50" y="56" width="70" height="24" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="50" y="92" width="70" height="24" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="85" y="108" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">ada</text>
  <rect x="50" y="128" width="70" height="24" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="50" y="164" width="70" height="24" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>

  <!-- chain from bucket 1 -->
  <line x1="120" y1="104" x2="152" y2="104" stroke="#34d399" stroke-width="2"/>
  <polygon points="152,98 164,104 152,110" fill="#34d399"/>
  <rect x="164" y="88" width="96" height="32" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="212" y="101" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#e2e8f0">ada | 1</text>
  <text x="212" y="114" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">next: NULL</text>

  <!-- chain from bucket 2 with collision -->
  <line x1="120" y1="140" x2="152" y2="140" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="152,134 164,140 152,146" fill="#f59e0b"/>
  <rect x="164" y="122" width="96" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="212" y="136" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#e2e8f0">bob | 2</text>
  <text x="212" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">next: ●</text>
  <line x1="260" y1="140" x2="292" y2="140" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="292,134 304,140 292,146" fill="#f59e0b"/>
  <rect x="304" y="122" width="96" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="352" y="136" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#e2e8f0">ab | 1 (collision)</text>
  <text x="352" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#64748b">next: NULL</text>

  <!-- hash arrow -->
  <rect x="430" y="120" width="150" height="40" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="505" y="136" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#3b82f6">djb2("ab") % 8</text>
  <text x="505" y="152" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#94a3b8">= bucket 2</text>

  <text x="310" y="220" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">Average O(1) lookup; grow and rehash when load factor exceeds ~0.75</text>
  <text x="310" y="238" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#64748b">Sage-Code — C roadmap</text>
</svg>
