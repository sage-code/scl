<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="100%">
  <rect width="640" height="300" fill="#0f172a" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">CPU host + GPU device (CUDA / OpenCL model)</text>

  <!-- CPU host card -->
  <rect x="20" y="56" width="230" height="140" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="135" y="78" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#f59e0b">CPU — host</text>
  <rect x="40" y="92" width="46" height="30" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="63" y="111" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#fdba74">core 0</text>
  <rect x="94" y="92" width="46" height="30" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="117" y="111" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#fdba74">core 1</text>
  <rect x="148" y="92" width="46" height="30" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="171" y="111" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#fdba74">core 2</text>
  <rect x="196" y="92" width="36" height="30" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="214" y="111" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#fdba74">…</text>
  <rect x="40" y="132" width="192" height="28" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="136" y="151" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#fdba74">host memory (RAM)</text>
  <text x="135" y="186" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">runs C: malloc, memcpy, launch</text>

  <!-- GPU device card -->
  <rect x="390" y="56" width="230" height="140" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="505" y="78" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#34d399">GPU — device</text>
  <rect x="410" y="92" width="190" height="30" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="505" y="111" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#86efac">thousands of cores (SM)</text>
  <rect x="410" y="132" width="190" height="28" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="505" y="151" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#86efac">device memory (VRAM)</text>
  <text x="505" y="186" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">runs kernels: thousands of threads</text>

  <!-- PCIe link -->
  <line x1="252" y1="126" x2="386" y2="126" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="8 5"/>
  <polygon points="388,120 402,126 388,132" fill="#e2e8f0"/>
  <text x="320" y="116" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#e2e8f0">PCIe</text>
  <text x="320" y="142" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">copy H→D, launch, copy D→H</text>

  <text x="320" y="226" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#94a3b8">The transfer is the bottleneck — overlap and batch copies, keep kernels long.</text>
  <text x="320" y="262" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#64748b">Sage-Code &#8212; C roadmap</text>
</svg>
