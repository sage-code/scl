<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" width="100%">
  <rect width="620" height="270" fill="#0f172a" rx="12"/>
  <text x="310" y="30" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#e2e8f0">Pointer: an address that knows the pointee's type</text>

  <!-- variable x box: three lines, all inside the box (y 80..164) -->
  <rect x="40" y="80" width="180" height="84" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="130" y="104" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#34d399">int x</text>
  <text x="130" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="26" fill="#e2e8f0">42</text>
  <text x="130" y="152" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#64748b">at 0x7ffc14</text>

  <!-- pointer p box: three lines, all inside the box (y 80..164) -->
  <rect x="380" y="80" width="190" height="84" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="475" y="104" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#f59e0b">int *p</text>
  <text x="475" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">0x7ffc14</text>
  <text x="475" y="152" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#64748b">p = &amp;x</text>

  <!-- arrow between the two boxes, vertically centered at y=122 -->
  <line x1="380" y1="122" x2="224" y2="122" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="224,116 238,122 224,128" fill="#f59e0b"/>
  <text x="302" y="112" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#f59e0b">stores the address</text>

  <!-- dereference summary box -->
  <rect x="40" y="200" width="540" height="44" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="310" y="218" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#e2e8f0">*p  reads the int stored at p's address  &#8594;  42</text>
  <text x="310" y="235" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#94a3b8">p + 1 would advance sizeof(int) = 4 bytes</text>
</svg>
