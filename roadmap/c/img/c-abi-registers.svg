<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="100%">
  <rect width="640" height="250" fill="#0f172a" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">System V AMD64 — where arguments actually live</text>

  <!-- argument register boxes -->
  <text x="110" y="58" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#e2e8f0">integer / pointer arguments</text>
  <rect x="20" y="66" width="76" height="40" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="58" y="83" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#34d399">RDI</text>
  <text x="58" y="99" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">arg 1</text>
  <rect x="104" y="66" width="76" height="40" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="142" y="83" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#34d399">RSI</text>
  <text x="142" y="99" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">arg 2</text>
  <rect x="188" y="66" width="76" height="40" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="226" y="83" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#34d399">RDX</text>
  <text x="226" y="99" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">arg 3</text>
  <rect x="272" y="66" width="76" height="40" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="310" y="83" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#34d399">RCX</text>
  <text x="310" y="99" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">arg 4</text>
  <rect x="356" y="66" width="76" height="40" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="394" y="83" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#34d399">R8</text>
  <text x="394" y="99" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">arg 5</text>
  <rect x="440" y="66" width="76" height="40" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="478" y="83" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#34d399">R9</text>
  <text x="478" y="99" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">arg 6</text>

  <!-- stack args -->
  <rect x="540" y="66" width="80" height="40" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="83" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#f59e0b">stack</text>
  <text x="580" y="99" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">arg 7+</text>

  <!-- return row -->
  <text x="200" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#e2e8f0">return value</text>
  <rect x="136" y="158" width="128" height="40" rx="7" fill="#f59e0b"/>
  <text x="200" y="175" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="bold" fill="#0f172a">RAX</text>
  <text x="200" y="191" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#0f172a">result (RDX for 128-bit)</text>

  <!-- preserved note -->
  <text x="430" y="174" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#e2e8f0">callee must preserve</text>
  <rect x="356" y="182" width="148" height="30" rx="7" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="202" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#cbd5e1">RBX RBP RSP R12&#8211;R15</text>

  <text x="320" y="238" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#64748b">Sage-Code &#8212; C roadmap</text>
</svg>
