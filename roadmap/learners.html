<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="description" content="See who is actively learning across Sage-Code roadmaps.">
    <meta name="author" content="Sage-Code Laboratory">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="index, follow">
    <title>Who's Learning | Sage-Code Roadmaps</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="/assets/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/sage-common.css">
    <link rel="stylesheet" href="/assets/css/sage-hero.css">
    <link rel="stylesheet" href="/assets/css/sage-cards.css">
  </head>
  <body>
    <div class="container">
      <header id="dynamic-header" class="container-fluid pb-2"></header>

      <section class="hero-blackboard">
        <div class="blackboard-content">
          <h1 class="chalk-text">Who&#39;s Learning</h1>
          <p class="chalk-body mt-1">Active learners studying Sage-Code roadmaps over the past 30 days. Customize your username and picture on <a href="/roadmap/profile.html" class="link-light text-decoration-underline">Your Profile</a>.</p>
        </div>
      </section>

      <section class="container my-4" aria-label="Active learners">
        <div class="card-slate p-4">
          <p id="learners-status" class="alert alert-info mb-3" role="status" aria-live="polite">Loading active learners...</p>
          <div class="table-responsive">
            <table class="table table-bordered table-striped table-dark align-middle mb-0">
              <thead>
                <tr>
                  <th>Learner</th>
                  <th>Active Roadmaps</th>
                  <th class="text-end">Topics Completed</th>
                  <th>Last Active</th>
                </tr>
              </thead>
              <tbody id="learners-body"></tbody>
            </table>
          </div>
          <div class="mt-3">
            <a href="/roadmap/" class="btn btn-outline-light btn-sm">Back to Roadmaps</a>
          </div>
        </div>
      </section>

      <footer class="footer copyright">
        <p class="x-small text-secondary mb-0">&copy; 2026 Sage-Code Laboratory</p>
      </footer>
    </div>

    <script src="/assets/js/scl-api.js"></script>
    <script src="/assets/js/sage.js"></script>
    <script src="/assets/js/roadmap-learners.js"></script>
  </body>
</html>
