<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="ui-monospace, Consolas, monospace">
  <!-- Solid canvas: anatomy of one compound selector chain, annotated part by part. -->
  <rect x="0" y="0" width="640" height="340" fill="#0f172a"/>
  <text x="320" y="34" fill="#e2e8f0" font-size="17" text-anchor="middle" font-weight="bold">Anatomy of a selector chain</text>

  <defs>
    <marker id="lead" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- the selector, rendered large -->
  <text x="320" y="96" fill="#e2e8f0" font-size="24" text-anchor="middle">ul.menu  li.item:hover  &gt;  a::after</text>

  <!-- segment highlight boxes: ul / .menu / (space) / li.item / :hover / > / a / ::after -->
  <!-- ul -->
  <rect x="146" y="72" width="30" height="34" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <!-- .menu -->
  <rect x="176" y="72" width="56" height="34" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- descendant space -->
  <rect x="232" y="72" width="18" height="34" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
  <!-- li.item -->
  <rect x="250" y="72" width="78" height="34" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <!-- :hover -->
  <rect x="328" y="72" width="62" height="34" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- child combinator -->
  <rect x="398" y="72" width="20" height="34" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
  <!-- a -->
  <rect x="426" y="72" width="22" height="34" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <!-- ::after -->
  <rect x="448" y="72" width="68" height="34" fill="none" stroke="#ef4444" stroke-width="1.5"/>

  <!-- leader lines to labels -->
  <line x1="161" y1="106" x2="120" y2="170" stroke="#64748b" stroke-width="1" marker-end="url(#lead)"/>
  <text x="120" y="188" fill="#34d399" font-size="12" text-anchor="middle">type selector</text>

  <line x1="204" y1="106" x2="204" y2="170" stroke="#64748b" stroke-width="1" marker-end="url(#lead)"/>
  <text x="204" y="188" fill="#3b82f6" font-size="12" text-anchor="middle">class</text>

  <line x1="241" y1="106" x2="288" y2="170" stroke="#64748b" stroke-width="1" marker-end="url(#lead)"/>
  <text x="288" y="188" fill="#94a3b8" font-size="12" text-anchor="middle">descendant</text>
  <text x="288" y="203" fill="#94a3b8" font-size="12" text-anchor="middle">combinator</text>

  <line x1="359" y1="106" x2="400" y2="256" stroke="#64748b" stroke-width="1" marker-end="url(#lead)"/>
  <text x="400" y="274" fill="#f59e0b" font-size="12" text-anchor="middle">pseudo-class: a STATE</text>

  <line x1="408" y1="106" x2="470" y2="170" stroke="#64748b" stroke-width="1" marker-end="url(#lead)"/>
  <text x="470" y="188" fill="#94a3b8" font-size="12" text-anchor="middle">child</text>
  <text x="470" y="203" fill="#94a3b8" font-size="12" text-anchor="middle">combinator</text>

  <line x1="437" y1="106" x2="530" y2="256" stroke="#64748b" stroke-width="1" marker-end="url(#lead)"/>
  <text x="530" y="274" fill="#ef4444" font-size="12" text-anchor="middle">pseudo-element:</text>
  <text x="530" y="289" fill="#ef4444" font-size="12" text-anchor="middle">a generated BOX</text>

  <text x="320" y="322" fill="#64748b" font-size="11" text-anchor="middle">compound parts add specificity; combinators only describe relationships</text>
</svg>
