<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="ui-monospace, Consolas, monospace">
  <!-- Solid canvas: flexbox axes — main axis follows flex-direction, cross axis is perpendicular. -->
  <rect x="0" y="0" width="560" height="300" fill="#0f172a"/>
  <text x="280" y="32" fill="#e2e8f0" font-size="17" text-anchor="middle" font-weight="bold">Flexbox: two axes, one direction</text>
  <text x="280" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">flex-direction: row (the default) — justify-content works on the main axis</text>

  <defs>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- the flex container -->
  <rect x="80" y="90" width="400" height="150" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="280" y="116" fill="#64748b" font-size="12" text-anchor="middle">flex container  (display: flex)</text>

  <!-- flex items laid out on the main axis, with a visible gap -->
  <rect x="112" y="140" width="88" height="70" rx="6" fill="#3b82f6"/>
  <text x="156" y="180" fill="#0f172a" font-size="12" text-anchor="middle" font-weight="bold">item 1</text>
  <rect x="236" y="140" width="88" height="70" rx="6" fill="#3b82f6"/>
  <text x="280" y="180" fill="#0f172a" font-size="12" text-anchor="middle" font-weight="bold">item 2</text>
  <rect x="360" y="140" width="88" height="70" rx="6" fill="#3b82f6"/>
  <text x="404" y="180" fill="#0f172a" font-size="12" text-anchor="middle" font-weight="bold">item 3</text>

  <!-- main axis arrow above the items -->
  <line x1="96" y1="128" x2="472" y2="128" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrF)"/>
  <text x="484" y="132" fill="#f59e0b" font-size="12">main axis</text>

  <!-- cross axis arrow on the left -->
  <line x1="66" y1="106" x2="66" y2="222" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC)"/>
  <text x="60" y="240" fill="#38bdf8" font-size="12" text-anchor="middle">cross</text>

  <!-- property mapping table -->
  <text x="140" y="266" fill="#e2e8f0" font-size="12">justify-content → main axis</text>
  <text x="360" y="266" fill="#e2e8f0" font-size="12">align-items → cross axis</text>
  <text x="280" y="288" fill="#64748b" font-size="11" text-anchor="middle">flex-direction: column swaps the two axes</text>
</svg>
