<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="ui-monospace, Consolas, monospace">
  <!-- Solid canvas: grid-template-areas — layout described as a named map of the page. -->
  <rect x="0" y="0" width="560" height="310" fill="#0f172a"/>
  <text x="280" y="32" fill="#e2e8f0" font-size="17" text-anchor="middle" font-weight="bold">Grid template areas</text>
  <text x="280" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">one line of CSS describes the whole page map</text>

  <!-- the grid: 3 columns x 3 rows -->
  <!-- header spans all columns -->
  <rect x="110" y="80" width="340" height="46" rx="6" fill="#f59e0b"/>
  <text x="280" y="108" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="bold">header  header  header</text>
  <!-- row 2: sidebar / main / aside -->
  <rect x="110" y="138" width="100" height="90" rx="6" fill="#3b82f6"/>
  <text x="160" y="188" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="bold">side</text>
  <rect x="222" y="138" width="140" height="90" rx="6" fill="#3b82f6"/>
  <text x="292" y="188" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="bold">main  main</text>
  <rect x="374" y="138" width="76" height="90" rx="6" fill="#3b82f6"/>
  <text x="412" y="188" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="bold">aside</text>
  <!-- footer spans all columns -->
  <rect x="110" y="240" width="340" height="40" rx="6" fill="#34d399"/>
  <text x="280" y="265" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="bold">footer  footer  footer</text>

  <!-- the code that produced it -->
  <text x="30" y="120" fill="#e2e8f0" font-size="11">&quot;header</text>
  <text x="30" y="136" fill="#e2e8f0" font-size="11">header</text>
  <text x="30" y="152" fill="#e2e8f0" font-size="11">header&quot;</text>
  <text x="18" y="180" fill="#e2e8f0" font-size="11">&quot;side</text>
  <text x="18" y="196" fill="#e2e8f0" font-size="11">main</text>
  <text x="18" y="212" fill="#e2e8f0" font-size="11">aside&quot;</text>
  <text x="30" y="252" fill="#e2e8f0" font-size="11">&quot;footer</text>
  <text x="30" y="268" fill="#e2e8f0" font-size="11">footer&quot;</text>

  <text x="280" y="300" fill="#64748b" font-size="11" text-anchor="middle">each grid item is placed with grid-area: name; reflow = rearranging the strings</text>
</svg>
