<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="ui-monospace, Consolas, monospace">
  <!-- Solid canvas: the five position values, one mini-viewport per value. -->
  <rect x="0" y="0" width="620" height="300" fill="#0f172a"/>
  <text x="310" y="32" fill="#e2e8f0" font-size="17" text-anchor="middle" font-weight="bold">position: five behaviors, one property</text>
  <text x="310" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">the gray page box scrolls; the blue box is the positioned element</text>

  <!-- panel: static -->
  <g>
    <rect x="30" y="76" width="104" height="150" fill="#1e293b" stroke="#475569"/>
    <rect x="46" y="96" width="72" height="26" fill="#334155"/>
    <rect x="46" y="132" width="72" height="26" fill="#334155"/>
    <rect x="52" y="168" width="60" height="30" fill="#3b82f6"/>
    <text x="82" y="188" fill="#0f172a" font-size="11" text-anchor="middle" font-weight="bold">in flow</text>
    <text x="82" y="250" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">static</text>
    <text x="82" y="266" fill="#94a3b8" font-size="10" text-anchor="middle">the default</text>
  </g>

  <!-- panel: relative -->
  <g>
    <rect x="150" y="76" width="104" height="150" fill="#1e293b" stroke="#475569"/>
    <rect x="166" y="96" width="72" height="26" fill="#334155"/>
    <rect x="166" y="132" width="72" height="26" fill="#334155"/>
    <!-- offset from its normal spot; the gap stays reserved -->
    <rect x="172" y="162" width="60" height="30" fill="#3b82f6"/>
    <rect x="166" y="132" width="72" height="26" fill="none" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="202" y="250" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">relative</text>
    <text x="202" y="266" fill="#94a3b8" font-size="10" text-anchor="middle">offset, gap kept</text>
  </g>

  <!-- panel: absolute -->
  <g>
    <rect x="270" y="76" width="104" height="150" fill="#1e293b" stroke="#475569"/>
    <rect x="286" y="96" width="72" height="26" fill="#334155"/>
    <rect x="286" y="132" width="72" height="26" fill="#334155"/>
    <rect x="316" y="182" width="52" height="26" fill="#3b82f6"/>
    <text x="322" y="250" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">absolute</text>
    <text x="322" y="266" fill="#94a3b8" font-size="10" text-anchor="middle">pinned, no gap</text>
  </g>

  <!-- panel: fixed -->
  <g>
    <rect x="390" y="76" width="104" height="150" fill="#1e293b" stroke="#475569"/>
    <rect x="406" y="96" width="72" height="26" fill="#334155"/>
    <rect x="406" y="132" width="72" height="26" fill="#334155"/>
    <!-- pinned to the panel corner regardless of scroll -->
    <rect x="396" y="82" width="48" height="22" fill="#f59e0b"/>
    <text x="420" y="97" fill="#0f172a" font-size="10" text-anchor="middle" font-weight="bold">pinned</text>
    <text x="442" y="250" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">fixed</text>
    <text x="442" y="266" fill="#94a3b8" font-size="10" text-anchor="middle">vs viewport</text>
  </g>

  <!-- panel: sticky -->
  <g>
    <rect x="510" y="76" width="104" height="150" fill="#1e293b" stroke="#475569"/>
    <rect x="526" y="96" width="72" height="20" fill="#334155"/>
    <rect x="526" y="124" width="72" height="20" fill="#334155"/>
    <!-- sticks at the top edge while scrolling through its parent -->
    <rect x="516" y="82" width="92" height="22" fill="#34d399"/>
    <text x="562" y="97" fill="#0f172a" font-size="10" text-anchor="middle" font-weight="bold">sticky top</text>
    <text x="562" y="250" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">sticky</text>
    <text x="562" y="266" fill="#94a3b8" font-size="10" text-anchor="middle">in-flow + trap</text>
  </g>

  <text x="310" y="292" fill="#64748b" font-size="11" text-anchor="middle">relative/absolute/fixed/sticky establish a containing block for absolute descendants</text>
</svg>
