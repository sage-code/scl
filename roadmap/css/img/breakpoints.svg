<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="ui-monospace, Consolas, monospace">
  <!-- Solid canvas: mobile-first breakpoints — narrow layout is the base, wider layouts enhance it. -->
  <rect x="0" y="0" width="600" height="330" fill="#0f172a"/>
  <text x="300" y="32" fill="#e2e8f0" font-size="17" text-anchor="middle" font-weight="bold">Mobile-first breakpoints</text>
  <text x="300" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">base styles serve the narrow case; min-width queries only add</text>

  <!-- axis -->
  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="40" y1="296" x2="560" y2="296" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="60" y="316" fill="#64748b" font-size="11">360px</text>
  <text x="252" y="316" fill="#64748b" font-size="11">768px</text>
  <text x="462" y="316" fill="#64748b" font-size="11">1024px</text>

  <!-- range bands: base / >=768 / >=1024 -->
  <rect x="40" y="70" width="196" height="14" fill="#3b82f6"/>
  <rect x="244" y="70" width="196" height="14" fill="#f59e0b"/>
  <rect x="448" y="70" width="104" height="14" fill="#34d399"/>
  <text x="138" y="100" fill="#3b82f6" font-size="11" text-anchor="middle">base (no query)</text>
  <text x="342" y="100" fill="#f59e0b" font-size="11" text-anchor="middle">@media (min-width: 768px)</text>
  <text x="500" y="100" fill="#34d399" font-size="11" text-anchor="middle">(min-width: 1024px)</text>

  <!-- base: one column -->
  <g>
    <rect x="50" y="118" width="60" height="34" rx="4" fill="#334155"/>
    <rect x="118" y="118" width="60" height="34" rx="4" fill="#334155"/>
    <rect x="186" y="118" width="60" height="34" rx="4" fill="#334155"/>
    <text x="138" y="172" fill="#94a3b8" font-size="11" text-anchor="middle">1 column</text>
  </g>

  <!-- >=768: two columns -->
  <g>
    <rect x="254" y="118" width="60" height="34" rx="4" fill="#334155"/>
    <rect x="254" y="160" width="60" height="34" rx="4" fill="#334155"/>
    <rect x="322" y="118" width="60" height="34" rx="4" fill="#334155"/>
    <rect x="322" y="160" width="60" height="34" rx="4" fill="#334155"/>
    <text x="342" y="214" fill="#94a3b8" font-size="11" text-anchor="middle">2 columns</text>
  </g>

  <!-- >=1024: three columns + sidebar -->
  <g>
    <rect x="458" y="118" width="40" height="34" rx="4" fill="#1e293b" stroke="#64748b"/>
    <rect x="458" y="160" width="40" height="34" rx="4" fill="#334155"/>
    <rect x="506" y="118" width="40" height="34" rx="4" fill="#334155"/>
    <rect x="506" y="160" width="40" height="34" rx="4" fill="#334155"/>
    <text x="500" y="214" fill="#94a3b8" font-size="11" text-anchor="middle">3 columns</text>
  </g>

  <!-- arrows showing additions only -->
  <line x1="120" y1="240" x2="120" y2="120" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="330" y1="240" x2="330" y2="112" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="500" y1="240" x2="500" y2="112" stroke="#34d399" stroke-width="1.5"/>

  <text x="300" y="262" fill="#64748b" font-size="11" text-anchor="middle">queries never undo a narrow layout — they only layer more constraints on top</text>
</svg>
