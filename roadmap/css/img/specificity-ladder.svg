<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="ui-monospace, Consolas, monospace">
  <!-- Solid canvas: specificity as an ascending ladder; each rung beats everything below it. -->
  <rect x="0" y="0" width="560" height="330" fill="#0f172a"/>
  <text x="280" y="32" fill="#e2e8f0" font-size="17" text-anchor="middle" font-weight="bold">The specificity ladder</text>
  <text x="280" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">weights are read as id-class-type, higher rung wins regardless of order</text>

  <!-- rung 1: universal / :where -->
  <rect x="40" y="252" width="96" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="88" y="273" fill="#e2e8f0" font-size="12" text-anchor="middle">0-0-0</text>
  <text x="88" y="290" fill="#94a3b8" font-size="10" text-anchor="middle">*, :where()</text>

  <!-- rung 2: type / pseudo-element -->
  <rect x="152" y="204" width="96" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="200" y="225" fill="#e2e8f0" font-size="12" text-anchor="middle">0-0-1</text>
  <text x="200" y="242" fill="#94a3b8" font-size="10" text-anchor="middle">p, ::before</text>

  <!-- rung 3: class / pseudo-class / attribute -->
  <rect x="264" y="156" width="96" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="312" y="177" fill="#e2e8f0" font-size="12" text-anchor="middle">0-1-0</text>
  <text x="312" y="194" fill="#94a3b8" font-size="10" text-anchor="middle">.card, :hover</text>

  <!-- rung 4: id -->
  <rect x="376" y="108" width="96" height="48" rx="8" fill="#f59e0b"/>
  <text x="424" y="129" fill="#0f172a" font-size="12" text-anchor="middle" font-weight="bold">1-0-0</text>
  <text x="424" y="146" fill="#0f172a" font-size="10" text-anchor="middle">#hero</text>

  <!-- rung 5: inline style -->
  <rect x="462" y="60" width="84" height="48" rx="8" fill="#ef4444"/>
  <text x="504" y="81" fill="#0f172a" font-size="12" text-anchor="middle" font-weight="bold">inline</text>
  <text x="504" y="98" fill="#0f172a" font-size="10" text-anchor="middle">style="..."</text>

  <!-- ascending arrow -->
  <line x1="60" y1="240" x2="440" y2="78" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <text x="150" y="120" fill="#38bdf8" font-size="12" transform="rotate(-15 150 120)">wins upward</text>

  <text x="280" y="322" fill="#64748b" font-size="11" text-anchor="middle">a lower rung never beats a higher one, no matter how many selectors it stacks</text>
</svg>
