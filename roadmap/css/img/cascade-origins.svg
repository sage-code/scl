<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" font-family="ui-monospace, Consolas, monospace">
  <!-- Solid canvas: the cascade resolves conflicts top to bottom; the first test that decides wins. -->
  <rect x="0" y="0" width="440" height="540" fill="#0f172a"/>
  <text x="220" y="34" fill="#e2e8f0" font-size="17" text-anchor="middle" font-weight="bold">How the cascade decides</text>
  <text x="220" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">first test that separates the candidates wins</text>

  <!-- marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Step 1: origin and importance -->
  <rect x="60" y="76" width="320" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="96" fill="#e2e8f0" font-size="13" text-anchor="middle">1. Origin &amp; importance</text>
  <text x="220" y="113" fill="#94a3b8" font-size="11" text-anchor="middle">author beats user beats browser</text>
  <line x1="220" y1="122" x2="220" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: context -->
  <rect x="60" y="144" width="320" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="169" fill="#e2e8f0" font-size="13" text-anchor="middle">2. Shadow / iframe context</text>
  <line x1="220" y1="184" x2="220" y2="202" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: style attribute -->
  <rect x="60" y="206" width="320" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="231" fill="#e2e8f0" font-size="13" text-anchor="middle">3. style="..." attribute</text>
  <line x1="220" y1="246" x2="220" y2="264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: layers -->
  <rect x="60" y="268" width="320" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="293" fill="#e2e8f0" font-size="13" text-anchor="middle">4. Cascade layers (@layer)</text>
  <line x1="220" y1="308" x2="220" y2="326" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5: specificity -->
  <rect x="60" y="330" width="320" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="355" fill="#e2e8f0" font-size="13" text-anchor="middle">5. Specificity</text>
  <line x1="220" y1="370" x2="220" y2="388" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 6: order of appearance -->
  <rect x="60" y="392" width="320" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="417" fill="#e2e8f0" font-size="13" text-anchor="middle">6. Order of appearance</text>
  <line x1="220" y1="432" x2="220" y2="450" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- winner -->
  <rect x="120" y="454" width="200" height="52" rx="8" fill="#34d399"/>
  <text x="220" y="476" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="bold">WINNING declaration</text>
  <text x="220" y="494" fill="#0f172a" font-size="11" text-anchor="middle">the rest are discarded</text>

  <text x="220" y="526" fill="#64748b" font-size="11" text-anchor="middle">!important flips origin order; unlayered styles beat layered styles</text>
</svg>
