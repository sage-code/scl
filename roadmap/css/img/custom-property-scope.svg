<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="ui-monospace, Consolas, monospace">
  <!-- Solid canvas: custom property scope — each subtree resolves --accent to its nearest definition. -->
  <rect x="0" y="0" width="600" height="330" fill="#0f172a"/>
  <text x="300" y="32" fill="#e2e8f0" font-size="17" text-anchor="middle" font-weight="bold">Custom properties resolve per subtree</text>
  <text x="300" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">a variable is inherited; the nearest definition on the ancestor chain wins</text>

  <!-- root -->
  <rect x="240" y="80" width="120" height="42" rx="8" fill="#f59e0b"/>
  <text x="300" y="99" fill="#0f172a" font-size="12" text-anchor="middle" font-weight="bold">:root</text>
  <text x="300" y="115" fill="#0f172a" font-size="11" text-anchor="middle">--accent: orange</text>

  <!-- branch lines -->
  <line x1="240" y1="122" x2="140" y2="158" stroke="#64748b" stroke-width="1.5"/>
  <line x1="300" y1="122" x2="300" y2="158" stroke="#64748b" stroke-width="1.5"/>
  <line x1="360" y1="122" x2="460" y2="158" stroke="#64748b" stroke-width="1.5"/>

  <!-- left subtree: uses root value -->
  <rect x="60" y="162" width="160" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="140" y="181" fill="#e2e8f0" font-size="12" text-anchor="middle">header</text>
  <text x="140" y="197" fill="#94a3b8" font-size="11" text-anchor="middle">color: var(--accent)</text>
  <rect x="100" y="224" width="80" height="30" rx="6" fill="#f59e0b"/>
  <text x="140" y="244" fill="#0f172a" font-size="11" text-anchor="middle" font-weight="bold">orange</text>
  <line x1="140" y1="204" x2="140" y2="222" stroke="#64748b" stroke-width="1.5"/>

  <!-- middle subtree: inherits -->
  <rect x="230" y="162" width="140" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="300" y="181" fill="#e2e8f0" font-size="12" text-anchor="middle">main</text>
  <text x="300" y="197" fill="#94a3b8" font-size="11" text-anchor="middle">no definition</text>
  <rect x="260" y="224" width="80" height="30" rx="6" fill="#f59e0b"/>
  <text x="300" y="244" fill="#0f172a" font-size="11" text-anchor="middle" font-weight="bold">orange</text>
  <line x1="300" y1="204" x2="300" y2="222" stroke="#64748b" stroke-width="1.5"/>

  <!-- right subtree: local override -->
  <rect x="390" y="162" width="150" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="465" y="181" fill="#e2e8f0" font-size="12" text-anchor="middle">aside</text>
  <text x="465" y="197" fill="#94a3b8" font-size="11" text-anchor="middle">--accent: skyblue</text>
  <rect x="425" y="224" width="80" height="30" rx="6" fill="#3b82f6"/>
  <text x="465" y="244" fill="#0f172a" font-size="11" text-anchor="middle" font-weight="bold">skyblue</text>
  <line x1="465" y1="204" x2="465" y2="222" stroke="#64748b" stroke-width="1.5"/>

  <text x="300" y="292" fill="#64748b" font-size="11" text-anchor="middle">this is how themes and dark mode work: redefine tokens on a subtree, not on every rule</text>
</svg>
