<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo 16 - Grid patterns</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; line-height: 1.6; }
    h1, h2 { line-height: 1.2; }

    /* PATTERN 1: the auto-fit card wall - NO media queries.
       "As many 16rem columns as fit; share the remaining space evenly." */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; }

    /* PATTERN 2: the page shell as a picture */
    .page {
      display: grid;
      grid-template-areas:
        "header header"
        "side   main"
        "footer footer";
      grid-template-columns: 12rem 1fr;
      grid-template-rows: auto 1fr auto;
      min-height: 60vh;
      gap: 1px;
      background: #334155;   /* shows through the 1px gaps as grid lines */
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    .page > * { background: #1e293b; padding: 0.75rem; }
    .page > header { grid-area: header; }
    .page > nav    { grid-area: side; }
    .page > main   { grid-area: main; }
    .page > footer { grid-area: footer; }

    /* Mobile: SAME markup, rearranged by editing only the strings */
    @media (max-width: 48rem) {
      .page {
        grid-template-areas: "header" "main" "side" "footer";
        grid-template-columns: 1fr;
      }
      .page > nav { display: none; }
    }
  </style>
</head>
<body>

  <h1>Grid patterns</h1>

  <h2>The card wall</h2>
  <div class="cards">
    <div class="card">Card one</div>
    <div class="card">Card two</div>
    <div class="card">Card three</div>
    <div class="card">Card four — resize the window and count the columns re-flow.</div>
  </div>

  <h2>The page shell</h2>
  <div class="page">
    <header>header</header>
    <nav>side</nav>
    <main>main — on narrow screens the areas below reorder by editing strings only.</main>
    <footer>footer</footer>
  </div>

  <!-- Exercise: give one card grid-column: 1 / -1 and watch it span the row. -->
</body>
</html>
