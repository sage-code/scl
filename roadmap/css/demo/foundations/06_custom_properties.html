<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo 06 - Custom properties</title>
  <style>
    :root {
      /* Primitive tokens: raw values, defined once */
      --brand: #38bdf8;
      --warn: #f59e0b;
      --space-2: 0.5rem;
      --space-3: 1rem;
    }

    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; line-height: 1.6; }

    .card {
      border: 1px solid var(--brand);
      padding: var(--space-3);
      border-radius: 8px;
      margin-bottom: var(--space-3);
    }
    .card h2 { color: var(--brand); margin-top: 0; }

    /* LOCAL OVERRIDE: re-declare the token on one subtree.
       Every var(--brand) BELOW this element re-resolves; the page keeps the blue. */
    .card.highlight { --brand: var(--warn); }

    /* var() takes a fallback for undefined tokens - always provide one
       when the variable may come from an unset context */
    .card footer { color: var(--not-defined, #64748b); font-size: 0.875rem; }

    /* Themes are just re-declared tokens at the top of a subtree */
    [data-theme="inverted"] { --brand: #a78bfa; --space-3: 1.5rem; }
  </style>
</head>
<body>

  <h1>Custom properties</h1>

  <div class="card">
    <h2>Blue card</h2>
    <p>Tokens resolve from the nearest definition on the ancestor chain: here, :root.</p>
  </div>

  <div class="card highlight">
    <h2>Amber card</h2>
    <p>This card re-declares --brand locally: border and heading re-theme, and ONLY here.</p>
  </div>

  <div class="card" data-theme="inverted">
    <h2>Violet card</h2>
    <p>A data-attribute theme: same tokens, different values, larger spacing.</p>
  </div>

  <!-- Exercise: add a .card compact variant that sets --space-3 to 0.5rem locally. -->
</body>
</html>
