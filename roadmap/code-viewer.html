<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Viewer | Sage-Code</title>
    <!-- Bootstrap and Prism CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/code-viewer.css">
</head>
<body class="bg-dark text-light">
    <div id="viewer-container" class="container-fluid p-3">
        <header class="d-flex justify-content-between align-items-center mb-3">
            <div class="logo"><strong>Sage-Code</strong> <span class="text-secondary">| Viewer</span></div>
            <div class="actions">
                <a href="#" id="download-btn" class="btn btn-sm btn-outline-light me-2">Download</a>
                <button onclick="window.history.back()" class="btn btn-sm btn-outline-danger">Close</button>
            </div>
        </header>
        <div class="editor-wrapper">
            <pre class="line-numbers"><code id="code-display">Loading code...</code></pre>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-dart.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="/assets/js/code-viewer.js"></script>
</body>
</html>
