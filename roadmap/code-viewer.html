<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Viewer | Sage-Code</title>
    <!-- Bootstrap and Prism CSS (single shared bundle) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/prism.css">
    <link rel="stylesheet" href="/assets/css/sage-common.css">
    <link rel="stylesheet" href="/assets/css/code-viewer.css">
</head>
<body class="bg-dark text-light">
    <div id="viewer-container" class="container-fluid p-3">
        <header class="d-flex justify-content-between align-items-center mb-3">
            <div class="logo"><strong>Sage-Code</strong> <span class="text-secondary">| Viewer</span></div>
            <div class="actions">
                <button id="zoom-in-btn" class="btn btn-sm btn-outline-light me-1" title="Zoom in (Ctrl +)" aria-label="Zoom in">+</button>
                <button id="zoom-out-btn" class="btn btn-sm btn-outline-light me-1" title="Zoom out (Ctrl -)" aria-label="Zoom out">&minus;</button>
                <button id="wrap-btn" class="btn btn-sm btn-outline-light me-2" title="Toggle line wrapping (currently OFF)" aria-label="Toggle line wrapping">W</button>
                <a href="#" id="download-btn" class="btn btn-sm btn-outline-light me-2">Download</a>
                <button onclick="window.history.back()" class="btn btn-sm btn-outline-danger">Close</button>
            </div>
        </header>
        <div class="editor-wrapper">
            <pre class="line-numbers"><code id="code-display">Loading code...</code></pre>
        </div>
    </div>

    <!-- Scripts: single shared Prism bundle (covers every track language) -->
    <script src="/assets/prism.js"></script>
    <script src="/assets/js/code-viewer.js"></script>
</body>
</html>
