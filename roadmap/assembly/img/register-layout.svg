<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">x86-64 sub-register layout</title>
  <desc id="desc">A single 64-bit register is addressable as rax, eax, ax, al and ah. Writing a 32-bit name clears the upper 32 bits; writing a 16-bit or 8-bit name does not.</desc>
  <defs>
    <style>
      .head   { font-family: system-ui, sans-serif; font-size: 16px; fill: #e7ecf3; }
      .reg    { font-family: ui-monospace, Consolas, monospace; font-size: 16px; fill: #e7ecf3; }
      .note   { font-family: system-ui, sans-serif; font-size: 13px; fill: #cfd6e0; }
      .bits   { font-family: ui-monospace, Consolas, monospace; font-size: 13px; fill: #9aa6b6; }
      .hltext { font-family: system-ui, sans-serif; font-size: 13px; fill: #1f2430; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="820" height="360" fill="#1f2430"/>

  <!-- Title bar -->
  <rect x="40" y="14" width="740" height="38" rx="8" fill="#273142" stroke="#3f4854"/>
  <text x="410" y="38" class="head" text-anchor="middle">One 64-bit register, five names — the x86-64 sub-register model</text>

  <!-- 64 bits: 640 px wide, 10 px per bit, boxes from x=60 to x=700 -->
  <text x="60" y="72" class="bits">bit 63</text>
  <text x="700" y="72" class="bits" text-anchor="end">bit 0</text>

  <!-- rax : all 64 bits -->
  <rect x="60" y="80" width="640" height="44" rx="6" fill="#273142" stroke="#7c5cff" stroke-width="2"/>
  <text x="380" y="108" class="reg" text-anchor="middle">rax</text>
  <text x="712" y="108" class="bits">63 .. 0</text>

  <!-- eax : low 32 bits -->
  <rect x="60" y="132" width="320" height="44" rx="6" fill="#273142" stroke="#7c5cff" stroke-width="2"/>
  <text x="220" y="160" class="reg" text-anchor="middle">eax</text>
  <text x="712" y="160" class="bits">31 .. 0</text>

  <!-- ax : low 16 bits -->
  <rect x="60" y="184" width="160" height="44" rx="6" fill="#273142" stroke="#7c5cff" stroke-width="2"/>
  <text x="140" y="212" class="reg" text-anchor="middle">ax</text>
  <text x="712" y="212" class="bits">15 .. 0</text>

  <!-- al and ah : the low two bytes -->
  <rect x="60" y="236" width="80" height="44" rx="6" fill="#273142" stroke="#7c5cff" stroke-width="2"/>
  <text x="100" y="264" class="reg" text-anchor="middle">al</text>
  <rect x="148" y="236" width="80" height="44" rx="6" fill="#273142" stroke="#7c5cff" stroke-width="2"/>
  <text x="188" y="264" class="reg" text-anchor="middle">ah</text>
  <text x="712" y="264" class="bits">7 .. 0 · 15 .. 8</text>

  <!-- Highlight box: the essential rule, dark writing on a light box -->
  <rect x="380" y="184" width="332" height="96" rx="8" fill="#e7ecf3" stroke="#9aa6b6"/>
  <text x="400" y="212" class="hltext">Writing a 32-bit name ZEROES the top half:</text>
  <text x="400" y="234" class="hltext">mov rax, 0x1122334455667788</text>
  <text x="400" y="254" class="hltext">mov eax, 0xAB  →  rax = 0x00000000000000AB</text>
  <text x="400" y="272" class="hltext">The 16-bit and 8-bit names do NOT.</text>

  <!-- Footer note -->
  <text x="60" y="316" class="note">ARM64 names its 31 general-purpose registers x0 .. x30 and uses w0 .. w30 for the low 32 bits of each one.</text>
  <text x="60" y="338" class="note">The same windowing idea applies, but ARM always zeroes the upper bits when a 32-bit name is written.</text>
</svg>
