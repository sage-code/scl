<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430">
  <title>Lexical vs dynamic scoping</title>
  <desc>A global x is read from the block that declared around it (lexical) versus the block that called it (dynamic).</desc>
  <rect x="0" y="0" width="780" height="430" fill="#15181d"/>
  <text x="390" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8ecf1">Scoping: where does x resolve?</text>

  <rect x="50" y="80" width="330" height="56" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="215" y="106" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8ecf1">global scope (module)</text>
  <text x="215" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">x = 1</text>

  <rect x="120" y="180" width="210" height="116" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="225" y="206" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">block A</text>
  <text x="225" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">y = x + 1</text>
  <rect x="180" y="248" width="90" height="34" rx="6" fill="#eaf3ff"/>
  <text x="225" y="271" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10233c">reads x -> 1</text>

  <rect x="400" y="180" width="330" height="116" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="565" y="206" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">block B (nested in A)</text>
  <text x="565" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">x = 99</text>
  <rect x="585" y="248" width="110" height="34" rx="6" fill="#ffe9d1"/>
  <text x="640" y="271" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3c2706">shadows global x</text>

  <text x="215" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">lexical (static) scope</text>
  <text x="215" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">text nesting decides; predictable</text>
  <text x="565" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">dynamic scope (AutoLISP)</text>
  <text x="565" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">call stack decides; surprises</text>

  <text x="390" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">a specification must state which rule its names follow</text>
</svg>
