<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370">
  <title>IR ladder</title>
  <desc>Source and AST sit at the top; each IR lowers toward the machine, adding detail and losing meaning.</desc>
  <rect x="0" y="0" width="760" height="370" fill="#15181d"/>
  <text x="380" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8ecf1">IR ladder: losing detail, gaining precision</text>

  <rect x="60" y="70" width="260" height="40" rx="8" fill="#eaf3ff"/>
  <text x="190" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10233c">source / AST (Phase 1)</text>

  <line x1="350" y1="90" x2="420" y2="90" stroke="#8fa3bd" stroke-width="1.5"/>
  <polygon points="426,90 416,84 416,96" fill="#8fa3bd"/>

  <rect x="428" y="70" width="272" height="40" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="564" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">three-address code</text>

  <rect x="428" y="130" width="272" height="40" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="564" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">SSA (static single assignment)</text>

  <rect x="428" y="190" width="272" height="40" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="564" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">stack bytecode (next topic)</text>

  <line x1="564" y1="110" x2="564" y2="130" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="564" y1="170" x2="564" y2="190" stroke="#8fa3bd" stroke-width="1.5"/>

  <rect x="60" y="130" width="300" height="100" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="210" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e8ecf1">LLVM IR (Phase 3)</text>
  <text x="210" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">the production-ready end of the</text>
  <text x="210" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">ladder for compilers and JITs</text>

  <text x="380" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">pick the lowest IR you can still read; keep readable ones for diagnostics</text>
  <text x="380" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">every DSL compiler needs at least one IR — even if it is just a tree</text>
</svg>
