<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <title>Typing modes</title>
  <desc>Where type checks run: dynamic at runtime, static at compile time, gradual in between.</desc>
  <rect x="0" y="0" width="820" height="300" fill="#15181d"/>
  <text x="410" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8ecf1">Typing modes — where checks happen</text>

  <line x1="60" y1="150" x2="760" y2="150" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="760,150 750,144 750,156" fill="#8fa3bd"/>
  <text x="60" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">runtime (flexible)</text>
  <text x="760" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">compile time (safe)</text>

  <rect x="70" y="80" width="150" height="50" rx="8" fill="#eaf3ff"/>
  <text x="145" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#10233c">dynamic</text>
  <text x="145" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#10233c">Python, JS</text>

  <rect x="335" y="80" width="150" height="50" rx="8" fill="#ffe9d1"/>
  <text x="410" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3c2706">gradual</text>
  <text x="410" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3c2706">TypeScript, mypy</text>

  <rect x="600" y="80" width="150" height="50" rx="8" fill="#e8f7e8"/>
  <text x="675" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#103810">static</text>
  <text x="675" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#103810">Java, C, Rust</text>

  <text x="410" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b9c6d6">static catches more errors earlier (and needs more ceremony);</text>
  <text x="410" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b9c6d6">dynamic stays flexible — Julia and TypeScript sit far to the safe side</text>
</svg>
