<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <title>Symbol table</title>
  <desc>A nested scope stack: an inner block shadows a global binding and resolves against the enclosing environment.</desc>
  <rect x="0" y="0" width="700" height="360" fill="#15181d"/>
  <text x="350" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8ecf1">Symbol table as a scope stack</text>

  <rect x="190" y="70" width="320" height="52" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="350" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">global scope</text>
  <text x="350" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">room: token(NAME), capacity: int, time: clock</text>

  <rect x="250" y="150" width="200" height="52" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="350" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">block (function body)</text>
  <text x="350" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">request: function, tmp: table</text>

  <rect x="300" y="230" width="100" height="52" rx="8" fill="#ffe9d1"/>
  <text x="350" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3c2706">inner block</text>
  <text x="350" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3c2706">tmp: shadows outer</text>

  <line x1="350" y1="122" x2="350" y2="150" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="350" y1="202" x2="350" y2="230" stroke="#8fa3bd" stroke-width="1.5"/>

  <text x="350" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">resolution walks outward: inner block, then body, then global, then built-ins</text>
</svg>
