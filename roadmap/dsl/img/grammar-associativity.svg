<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430">
  <title>Associativity</title>
  <desc>8 - 3 - 2 parsed with left and right associativity yields different trees and different results.</desc>
  <rect x="0" y="0" width="780" height="430" fill="#15181d"/>
  <text x="390" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8ecf1">One expression, two trees (8 - 3 - 2)</text>

  <text x="195" y="72" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8ecf1">left associative (Pascal-style)</text>
  <rect x="160" y="96" width="70" height="40" rx="6" fill="#eaf3ff"/>
  <text x="195" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10233c">-</text>
  <rect x="70" y="170" width="70" height="40" rx="6" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="105" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">-</text>
  <rect x="30" y="250" width="54" height="36" rx="6" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="57" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e8ecf1">8</text>
  <rect x="96" y="250" width="54" height="36" rx="6" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="123" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e8ecf1">3</text>
  <rect x="162" y="250" width="54" height="36" rx="6" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="189" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e8ecf1">2</text>
  <line x1="105" y1="186" x2="57" y2="250" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="105" y1="186" x2="123" y2="250" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="195" y1="136" x2="123" y2="170" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="195" y1="136" x2="189" y2="250" stroke="#8fa3bd" stroke-width="1.5"/>
  <text x="195" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">(8 - 3) - 2 = 3</text>

  <text x="585" y="72" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8ecf1">right associative</text>
  <rect x="550" y="96" width="70" height="40" rx="6" fill="#ffe9d1"/>
  <text x="585" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3c2706">-</text>
  <rect x="507" y="170" width="70" height="40" rx="6" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="542" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">-</text>
  <rect x="467" y="250" width="54" height="36" rx="6" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="494" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e8ecf1">3</text>
  <rect x="533" y="250" width="54" height="36" rx="6" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="560" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e8ecf1">2</text>
  <rect x="599" y="250" width="54" height="36" rx="6" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="626" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e8ecf1">8</text>
  <line x1="542" y1="186" x2="494" y2="250" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="542" y1="186" x2="560" y2="250" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="585" y1="136" x2="626" y2="170" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="585" y1="136" x2="494" y2="250" stroke="#8fa3bd" stroke-width="1.5"/>
  <text x="585" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">8 - (3 - 2) = 7</text>

  <text x="390" y="396" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">the grammar must fix one reading — ambiguity is a spec bug</text>
</svg>
