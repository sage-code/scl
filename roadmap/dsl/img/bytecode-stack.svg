<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <title>Stack machine</title>
  <desc>Bytecode pushes operands onto a stack; operations pop and push results, so instructions stay uniform.</desc>
  <rect x="0" y="0" width="720" height="340" fill="#15181d"/>
  <text x="360" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8ecf1">Stack machine: 1 2 +</text>

  <rect x="60" y="100" width="340" height="56" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="230" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8ecf1">bytecode</text>
  <text x="230" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">PUSH 1   PUSH 2   ADD   HALT</text>

  <rect x="470" y="80" width="60" height="24" rx="6" fill="#eaf3ff"/>
  <text x="500" y="97" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10233c">2</text>
  <rect x="470" y="112" width="60" height="24" rx="6" fill="#eaf3ff"/>
  <text x="500" y="129" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10233c">1</text>
  <text x="500" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e8ecf1">stack</text>

  <line x1="400" y1="128" x2="468" y2="128" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="468,128 458,122 458,134" fill="#8fa3bd"/>

  <rect x="60" y="210" width="340" height="56" rx="8" fill="#e8f7e8"/>
  <text x="230" y="234" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#103810">after ADD</text>
  <text x="230" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#103810">one result: 3 (both operands popped)</text>

  <text x="360" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">uniform instructions = tiny implementations, easy verification</text>
</svg>
