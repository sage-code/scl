<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480">
  <title>DSL taxonomy</title>
  <desc>External versus embedded DSLs, and declarative versus imperative shape.</desc>
  <rect x="0" y="0" width="820" height="480" fill="#15181d"/>
  <text x="410" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e8ecf1">DSL taxonomy</text>
  <line x1="40" y1="60" x2="780" y2="60" stroke="#8fa3bd" stroke-width="1"/>

  <rect x="40" y="80" width="360" height="150" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="220" y="108" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8ecf1">External — own syntax &amp; parser</text>
  <text x="220" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">SQL, Verilog, EBNF, LATEX, Make</text>
  <text x="220" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">full control; no host-language drag</text>

  <rect x="420" y="80" width="360" height="150" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="600" y="108" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8ecf1">Embedded — host language</text>
  <text x="600" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">builders, fluent APIs, macros</text>
  <text x="600" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">reuse host tooling (AutoLISP in CAD)</text>

  <rect x="40" y="260" width="360" height="150" rx="8" fill="#eaf3ff"/>
  <text x="220" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#10233c">Declarative — state the WHAT</text>
  <text x="220" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#10233c">rules and queries; engine searches</text>
  <text x="220" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#10233c">SQL, Datalog, MiniZinc, CSS</text>

  <rect x="420" y="260" width="360" height="150" rx="8" fill="#ffe9d1"/>
  <text x="600" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3c2706">Imperative — state the HOW</text>
  <text x="600" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3c2706">step-by-step instructions</text>
  <text x="600" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3c2706">AutoLISP, awk, Make recipes</text>

  <text x="410" y="446" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">Most DSLs are a hybrid: a vocabulary plus a few rules of each kind</text>
</svg>
