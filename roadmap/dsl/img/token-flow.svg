<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240">
  <title>Lexical pipeline</title>
  <desc>Source text becomes a stream of tokens via the lexer; tokens feed the parser.</desc>
  <rect x="0" y="0" width="760" height="240" fill="#15181d"/>
  <text x="380" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8ecf1">Lexical pipeline</text>

  <rect x="30" y="80" width="160" height="70" rx="8" fill="#eaf3ff"/>
  <text x="110" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#10233c">source text</text>
  <text x="110" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#10233c">room 3A # comment</text>

  <line x1="190" y1="115" x2="250" y2="115" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="256,115 246,109 246,121" fill="#8fa3bd"/>

  <rect x="258" y="80" width="150" height="70" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="333" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8ecf1">lexer</text>
  <text x="333" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">scans characters</text>

  <line x1="408" y1="115" x2="468" y2="115" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="474,115 464,109 464,121" fill="#8fa3bd"/>

  <rect x="476" y="60" width="250" height="110" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="601" y="88" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8ecf1">tokens</text>
  <text x="601" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">KEYWORD(room)</text>
  <text x="601" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">NAME(3A)  # comment skipped</text>
  <text x="601" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">EOF</text>

  <text x="601" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">tokens feed the parser (Parsing &amp; Trees)</text>
</svg>
