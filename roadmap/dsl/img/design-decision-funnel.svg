<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="960" viewBox="0 0 860 960">
  <!-- Design decision funnel for the DSL roadmap — dark-theme SVG.
       Solid non-transparent canvas/boxes; light text on dark; dark text only
       inside light highlight boxes; UML-flow shapes aligned with gaps. -->
  <title>Should you design a new language?</title>
  <desc>Flow from problem through reuse/invent decision, paradigm selection, syntax/grammar, implementation, and ecosystem/AI tooling.</desc>
  <rect x="0" y="0" width="860" height="960" fill="#15181d"/>

  <text x="430" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e8ecf1">Design Considerations — decision funnel</text>

  <!-- Start -->
  <rect x="230" y="76" width="400" height="58" rx="8" fill="#eaf3ff"/>
  <text x="430" y="102" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#10233c">Problem to express or automate</text>
  <text x="430" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#10233c">a real, measured need — not a style preference</text>

  <line x1="430" y1="134" x2="430" y2="162" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="430,168 424,158 436,158" fill="#8fa3bd"/>

  <!-- Decision diamond -->
  <polygon points="430,168 560,222 430,276 300,222" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="430" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8ecf1">Does an existing tool fit?</text>
  <text x="430" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">language, DSL, config format, macro</text>

  <!-- NO branch -->
  <line x1="430" y1="276" x2="430" y2="304" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="430,310 424,300 436,300" fill="#8fa3bd"/>
  <text x="446" y="298" font-family="sans-serif" font-size="13" fill="#b9c6d6">no</text>

  <rect x="220" y="312" width="420" height="58" rx="8" fill="#ffe9d1"/>
  <text x="430" y="338" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3c2706">Invent: justify the new language</text>
  <text x="430" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3c2706">costs: tooling, semantics, docs, maintenance forever</text>

  <line x1="430" y1="370" x2="430" y2="398" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="430,404 424,394 436,394" fill="#8fa3bd"/>

  <rect x="180" y="406" width="500" height="58" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="430" y="432" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8ecf1">Reuse paradigms, conventions, rules</text>
  <text x="430" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">imperative / functional / OOP / logic / declarative</text>

  <line x1="430" y1="464" x2="430" y2="492" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="430,498 424,488 436,488" fill="#8fa3bd"/>

  <rect x="200" y="500" width="460" height="58" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="430" y="526" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8ecf1">Fix semantics early</text>
  <text x="430" y="546" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">scoping · typing · evaluation order · memory model · errors</text>

  <line x1="430" y1="558" x2="430" y2="586" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="430,592 424,582 436,582" fill="#8fa3bd"/>

  <rect x="200" y="594" width="460" height="58" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="430" y="620" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8ecf1">Syntax and grammar (Phase 1)</text>
  <text x="430" y="640" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">unambiguous · conventional · machine-friendly = AI-friendly</text>

  <line x1="430" y1="652" x2="430" y2="680" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="430,686 424,676 436,676" fill="#8fa3bd"/>
  <rect x="180" y="688" width="500" height="58" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="430" y="714" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8ecf1">Implement: interpreter or compiler (Phase 2)</text>
  <text x="430" y="734" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">lexer → parser → analysis → bytecode / IR / native</text>

  <line x1="430" y1="746" x2="430" y2="774" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="430,780 424,770 436,770" fill="#8fa3bd"/>

  <rect x="160" y="782" width="540" height="58" rx="8" fill="#e8f7e8"/>
  <text x="430" y="808" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#103810">Ship tooling, docs, and AI assistance</text>
  <text x="430" y="828" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#103810">diagnostics · REPL · LSP · grammar specs feed generators</text>

  <!-- Feedback loop: measure -->
  <line x1="430" y1="840" x2="430" y2="868" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="430,874 424,864 436,864" fill="#8fa3bd"/>
  <rect x="200" y="876" width="460" height="48" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="430" y="906" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8ecf1">Measure, then maintain or cut losses</text>

  <!-- YES branch (left) -->
  <line x1="300" y1="222" x2="112" y2="222" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="106,222 116,216 116,228" fill="#8fa3bd"/>
  <text x="142" y="210" font-family="sans-serif" font-size="13" fill="#b9c6d6">yes</text>
  <rect x="16" y="188" width="88" height="68" rx="8" fill="#eaf3ff"/>
  <text x="60" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10233c">Reuse</text>
  <text x="60" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#10233c">extend / embed</text>

  <!-- Side note: disruption vs compliance -->
  <rect x="650" y="120" width="190" height="120" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="745" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">Disruption vs compliance</text>
  <text x="745" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">disrupt only where it fixes</text>
  <text x="745" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">a real bug class (Rust</text>
  <text x="745" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">ownership, Kotlin null</text>
  <text x="745" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">safety) — comply elsewhere</text>

  <!-- Side note: critical thinking -->
  <rect x="650" y="262" width="190" height="96" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="745" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">Critical thinking</text>
  <text x="745" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">smallest language that solves</text>
  <text x="745" y="332" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">the problem; write examples</text>
  <text x="745" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">before implementation</text>

</svg>
