<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430">
  <title>Compiler pipeline</title>
  <desc>Source flows through front-end, middle-end and back-end; every stage can report its own class of errors.</desc>
  <rect x="0" y="0" width="840" height="430" fill="#15181d"/>
  <text x="420" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e8ecf1">Compiler pipeline</text>

  <rect x="30" y="90" width="150" height="90" rx="8" fill="#eaf3ff"/>
  <text x="105" y="122" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#10233c">front-end</text>
  <text x="105" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#10233c">lex, parse, analyze</text>
  <text x="105" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#10233c">(Phase 1 skills)</text>

  <rect x="235" y="90" width="150" height="90" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="2"/>
  <text x="310" y="122" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8ecf1">middle-end</text>
  <text x="310" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">IR + optimization</text>
  <text x="310" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">language-independent</text>

  <rect x="440" y="90" width="150" height="90" rx="8" fill="#ffe9d1"/>
  <text x="515" y="122" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3c2706">back-end</text>
  <text x="515" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3c2706">codegen, target code</text>
  <text x="515" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3c2706">or bytecode / LLVM</text>

  <rect x="645" y="90" width="160" height="90" rx="8" fill="#e8f7e8"/>
  <text x="725" y="122" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#103810">target</text>
  <text x="725" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#103810">native, bytecode,</text>
  <text x="725" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#103810">or an interpreter</text>

  <line x1="180" y1="135" x2="235" y2="135" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="235,135 225,129 225,141" fill="#8fa3bd"/>
  <line x1="385" y1="135" x2="440" y2="135" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="440,135 430,129 430,141" fill="#8fa3bd"/>
  <line x1="590" y1="135" x2="645" y2="135" stroke="#8fa3bd" stroke-width="2"/>
  <polygon points="645,135 635,129 635,141" fill="#8fa3bd"/>

  <rect x="230" y="240" width="380" height="66" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="420" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8ecf1">errors at every stage</text>
  <text x="420" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">lexical/syntax from Phase 1, semantic from analysis,</text>
  <text x="420" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9c6d6">assumptions from codegen — each with its own diagnostics</text>

  <text x="420" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">an interpreter is a pipeline whose target is the host machine + runtime</text>
  <text x="420" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">a DSL compiler usually stops at bytecode or an IR: reuse the back-end</text>
</svg>
