<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420">
  <title>Abstract syntax tree</title>
  <desc>AST of the expression 1 + 2 * 3: precedence shapes the tree, not the parentheses.</desc>
  <rect x="0" y="0" width="560" height="420" fill="#15181d"/>
  <text x="280" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8ecf1">AST of  1 + 2 * 3</text>

  <rect x="225" y="70" width="110" height="48" rx="8" fill="#eaf3ff"/>
  <text x="280" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#10233c">+</text>

  <rect x="90" y="170" width="90" height="44" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="135" y="198" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#e8ecf1">1</text>

  <rect x="330" y="170" width="110" height="48" rx="8" fill="#ffe9d1"/>
  <text x="385" y="200" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3c2706">*</text>

  <rect x="290" y="280" width="90" height="44" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="335" y="308" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#e8ecf1">2</text>

  <rect x="410" y="280" width="90" height="44" rx="8" fill="#15181d" stroke="#e8ecf1" stroke-width="1.5"/>
  <text x="455" y="308" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#e8ecf1">3</text>

  <line x1="270" y1="118" x2="142" y2="170" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="290" y1="118" x2="372" y2="170" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="380" y1="218" x2="335" y2="280" stroke="#8fa3bd" stroke-width="1.5"/>
  <line x1="392" y1="218" x2="455" y2="280" stroke="#8fa3bd" stroke-width="1.5"/>

  <text x="280" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b9c6d6">multiplication binds tighter: the tree encodes meaning, not text</text>
</svg>
