<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <rect width="520" height="300" fill="#1e1e1e" rx="10"/>
  <text x="20" y="30" fill="#f7a41d" font-size="16" font-family="sans-serif" font-weight="bold">ArenaAllocator lifetime</text>
  <rect x="40" y="60" width="200" height="180" rx="8" fill="#2d2d2d" stroke="#f7a41d" stroke-width="2"/>
  <text x="60" y="88" fill="#eee" font-size="14" font-family="monospace">var arena = init(...)</text>
  <rect x="60" y="110" width="160" height="30" rx="6" fill="#3a3a3a" stroke="#8a8a8a"/>
  <text x="72" y="130" fill="#ccc" font-size="13" font-family="monospace">alloc(64) -> a1</text>
  <rect x="60" y="148" width="160" height="30" rx="6" fill="#3a3a3a" stroke="#8a8a8a"/>
  <text x="72" y="168" fill="#ccc" font-size="13" font-family="monospace">alloc(64) -> a2</text>
  <rect x="60" y="186" width="160" height="30" rx="6" fill="#3a3a3a" stroke="#8a8a8a"/>
  <text x="72" y="206" fill="#ccc" font-size="13" font-family="monospace">alloc(64) -> a3</text>
  <line x1="240" y1="150" x2="320" y2="150" stroke="#f7a41d" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="320" y="100" width="170" height="100" rx="8" fill="#3a3a3a" stroke="#c0392b" stroke-width="2"/>
  <text x="338" y="128" fill="#ffb4a2" font-size="14" font-family="monospace">defer arena.deinit()</text>
  <text x="338" y="158" fill="#ffb4a2" font-size="13" font-family="monospace">frees a1+a2+a3</text>
  <text x="338" y="186" fill="#aaa" font-size="12" font-family="sans-serif">all at once</text>
  <text x="60" y="266" fill="#ccc" font-size="13" font-family="sans-serif">no individual frees needed — the arena owns every byte until it dies</text>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f7a41d"/></marker></defs>
</svg>
