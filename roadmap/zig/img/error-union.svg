<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <rect width="520" height="300" fill="#1e1e1e" rx="10"/>
  <text x="20" y="30" fill="#f7a41d" font-size="16" font-family="sans-serif" font-weight="bold">Set!T — error union</text>
  <rect x="40" y="60" width="440" height="80" rx="8" fill="#2d2d2d" stroke="#f7a41d" stroke-width="2"/>
  <text x="60" y="86" fill="#eee" font-size="13" font-family="monospace">fn openFile() ![]u8 { ... }</text>
  <rect x="60" y="102" width="180" height="34" rx="6" fill="#3a3a3a" stroke="#27ae60"/>
  <text x="72" y="124" fill="#9bffb4" font-size="13" font-family="monospace">value: []u8</text>
  <rect x="260" y="102" width="180" height="34" rx="6" fill="#3a3a3a" stroke="#c0392b"/>
  <text x="272" y="124" fill="#ffb4a2" font-size="13" font-family="monospace">error: NotFound</text>
  <line x1="150" y1="140" x2="150" y2="190" stroke="#27ae60" stroke-width="2" marker-end="url(#a1)"/>
  <text x="168" y="182" fill="#9bffb4" font-size="13" font-family="monospace">try unwraps</text>
  <line x1="350" y1="140" x2="350" y2="190" stroke="#c0392b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="330" y="226" fill="#ffb4a2" font-size="13" font-family="monospace">catch recovers</text>
  <text x="60" y="260" fill="#ccc" font-size="13" font-family="sans-serif">one of the two is produced; the caller decides with try or catch</text>
  <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#27ae60"/></marker><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/></marker></defs>
