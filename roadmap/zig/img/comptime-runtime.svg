<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <rect width="520" height="300" fill="#1e1e1e" rx="10"/>
  <text x="20" y="30" fill="#f7a41d" font-size="16" font-family="sans-serif" font-weight="bold">comptime — two phases, one compiler</text>
  <rect x="30" y="70" width="150" height="120" rx="8" fill="#2d2d2d" stroke="#8a8a8a" stroke-width="2"/>
  <text x="48" y="96" fill="#eee" font-size="14" font-family="monospace">source.zig</text>
  <text x="48" y="120" fill="#aaa" font-size="12" font-family="sans-serif">generic fn max(T)</text>
  <text x="48" y="140" fill="#aaa" font-size="12" font-family="sans-serif">comptime blocks</text>
  <rect x="210" y="70" width="150" height="120" rx="8" fill="#3a3a3a" stroke="#f7a41d" stroke-width="2"/>
  <text x="228" y="96" fill="#eee" font-size="14" font-family="monospace">specialized</text>
  <text x="228" y="116" fill="#ffd54a" font-size="13" font-family="monospace">max(u32, ...)</text>
  <text x="228" y="136" fill="#ffd54a" font-size="13" font-family="monospace">max(f64, ...)</text>
  <text x="228" y="170" fill="#aaa" font-size="12" font-family="sans-serif">errors checked here</text>
  <rect x="390" y="70" width="120" height="120" rx="8" fill="#2d2d2d" stroke="#27ae60" stroke-width="2"/>
  <text x="408" y="100" fill="#9bffb4" font-size="14" font-family="monospace">machine code</text>
  <text x="408" y="150" fill="#aaa" font-size="12" font-family="sans-serif">zero comptime</text>
  <text x="408" y="168" fill="#aaa" font-size="12" font-family="sans-serif">cost at runtime</text>
  <line x1="180" y1="130" x2="210" y2="130" stroke="#ffd54a" stroke-width="2" marker-end="url(#c1)"/>
  <text x="176" y="56" fill="#ccc" font-size="12" font-family="sans-serif">compile the source once</text>
  <line x1="360" y1="130" x2="390" y2="130" stroke="#27ae60" stroke-width="2" marker-end="url(#c2)"/>
  <text x="352" y="56" fill="#ccc" font-size="12" font-family="sans-serif">instantiate per type</text>
  <defs><marker id="c1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffd54a"/></marker><marker id="c2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#27ae60"/></marker></defs>
</svg>
