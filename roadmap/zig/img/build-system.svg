<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <rect width="520" height="300" fill="#1e1e1e" rx="10"/>
  <text x="20" y="30" fill="#f7a41d" font-size="16" font-family="sans-serif" font-weight="bold">build.zig — the step graph</text>
  <rect x="30" y="70" width="160" height="50" rx="8" fill="#2d2d2d" stroke="#f7a41d" stroke-width="2"/>
  <text x="48" y="98" fill="#eee" font-size="14" font-family="monospace">zig build</text>
  <line x1="190" y1="95" x2="240" y2="95" stroke="#f7a41d" stroke-width="2" marker-end="url(#b1)"/>
  <rect x="240" y="70" width="150" height="50" rx="8" fill="#3a3a3a" stroke="#27ae60"/>
  <text x="258" y="98" fill="#9bffb4" font-size="13" font-family="monospace">install artifact</text>
  <line x1="390" y1="95" x2="440" y2="95" stroke="#f7a41d" stroke-width="2" marker-end="url(#b2)"/>
  <rect x="440" y="70" width="60" height="50" rx="8" fill="#2d2d2d" stroke="#8a8a8a"/>
  <text x="450" y="98" fill="#eee" font-size="12" font-family="monospace">zig-out</text>
  <line x1="315" y1="120" x2="315" y2="160" stroke="#27ae60" stroke-width="2" marker-end="url(#b3)"/>
  <rect x="240" y="160" width="150" height="50" rx="8" fill="#3a3a3a" stroke="#8a8a8a"/>
  <text x="258" y="188" fill="#ccc" font-size="13" font-family="monospace">run step</text>
  <line x1="240" y1="185" x2="150" y2="185" stroke="#8a8a8a" stroke-width="2" marker-end="url(#b4)"/>
  <rect x="30" y="160" width="120" height="50" rx="8" fill="#3a3a3a" stroke="#8a8a8a"/>
  <text x="48" y="188" fill="#ccc" font-size="13" font-family="monospace">test step</text>
  <text x="30" y="250" fill="#ccc" font-size="13" font-family="sans-serif">steps declare dependOn — the compiler runs them in order, caching what is clean</text>
  <defs><marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f7a41d"/></marker><marker id="b2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f7a41d"/></marker><marker id="b3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#27ae60"/></marker><marker id="b4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a8a8a"/></marker></defs>
</svg>
