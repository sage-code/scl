<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ab4f8"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f28b82"/>
    </marker>
  </defs>
  <!-- canvas -->
  <rect x="0" y="0" width="860" height="520" fill="#161b22"/>

  <!-- title -->
  <text x="30" y="42" fill="#e8eaed" font-size="20" font-weight="bold">Type flow through the layers</text>

  <!-- outer: entrypoints layer -->
  <rect x="40" y="80" width="780" height="90" rx="8" fill="#1e2a38" stroke="#8ab4f8" stroke-width="2"/>
  <text x="60" y="110" fill="#8ab4f8" font-size="15" font-weight="bold">entrypoints/</text>
  <text x="60" y="132" fill="#e8eaed" font-size="13">main.ts · routes.ts · App.tsx</text>
  <text x="440" y="132" fill="#9aa0a6" font-size="12">knows every layer; the only place frameworks may construct requests</text>

  <!-- adapters layer -->
  <rect x="90" y="200" width="680" height="90" rx="8" fill="#1e2a38" stroke="#8ab4f8" stroke-width="2"/>
  <text x="110" y="230" fill="#8ab4f8" font-size="15" font-weight="bold">adapters/</text>
  <text x="110" y="252" fill="#e8eaed" font-size="13">http handlers · repositories · queue consumers</text>
  <text x="470" y="252" fill="#9aa0a6" font-size="12">parses unknown input at the boundary (zod)</text>

  <!-- application layer -->
  <rect x="140" y="320" width="580" height="90" rx="8" fill="#1e2a38" stroke="#8ab4f8" stroke-width="2"/>
  <text x="160" y="350" fill="#8ab4f8" font-size="15" font-weight="bold">application/</text>
  <text x="160" y="372" fill="#e8eaed" font-size="13">services · use cases · business rules</text>
  <text x="500" y="372" fill="#9aa0a6" font-size="12">speaks only domain vocabulary</text>

  <!-- domain layer -->
  <rect x="190" y="440" width="480" height="60" rx="8" fill="#2d4a35" stroke="#81c995" stroke-width="2"/>
  <text x="210" y="466" fill="#81c995" font-size="15" font-weight="bold">domain/</text>
  <text x="310" y="466" fill="#e8eaed" font-size="13">User · UserId (branded) · Order</text>
  <text x="210" y="488" fill="#9aa0a6" font-size="12">imports nothing project-internal — zero dependency arrows leave this box</text>

  <!-- green arrows: inward type flow -->
  <line x1="430" y1="170" x2="430" y2="196" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arrT)"/>
  <line x1="430" y1="290" x2="430" y2="316" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arrT)"/>
  <line x1="430" y1="410" x2="430" y2="436" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arrT)"/>

  <!-- labels for green arrows -->
  <text x="445" y="190" fill="#81c995" font-size="12">passes parsed types ↓</text>
  <text x="445" y="310" fill="#81c995" font-size="12">User, Order flow ↓</text>
  <text x="445" y="430" fill="#81c995" font-size="12">brands &amp; invariants ↓</text>

  <!-- red arrow: illegal leak (framework type into domain) -->
  <path d="M 760 125 C 830 190 830 400 676 462" fill="none" stroke="#f28b82" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrR)"/>
  <text x="700" y="300" fill="#f28b82" font-size="12" transform="rotate(83 700 300)">Request / AxiosResponse / Row</text>
  <text x="640" y="270" fill="#f28b82" font-size="12" font-weight="bold">✗ forbidden leak</text>

  <!-- legend -->
  <rect x="620" y="30" width="200" height="34" rx="6" fill="#2d4a35" stroke="#81c995" stroke-width="1.5"/>
  <text x="634" y="52" fill="#81c995" font-size="12">✓ allowed dependency</text>
  <rect x="620" y="30" width="0" height="0"/>
</svg>
