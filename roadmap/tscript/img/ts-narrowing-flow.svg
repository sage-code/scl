<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img">
  <title>Narrowing flow: each check refines the union</title>
  <desc>A value of type string or number flows through a typeof guard. Inside the true branch the type is string, inside the else branch it is number, after the if it is the union again.</desc>

  <rect x="0" y="0" width="920" height="430" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Narrowing: the checker follows your control flow</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">value: string | number — each guard removes union members from the branches.</text>

  <!-- start node -->
  <rect x="330" y="100" width="260" height="48" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="24"/>
  <text x="460" y="129" font-family="Consolas, monospace" font-size="14" fill="#e6edf3" text-anchor="middle">value: string | number</text>

  <!-- decision diamond -->
  <path d="M460 165 L560 215 L460 265 L360 215 Z" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="460" y="210" font-family="Consolas, monospace" font-size="13" fill="#ffa657" text-anchor="middle">typeof value</text>
  <text x="460" y="228" font-family="Consolas, monospace" font-size="13" fill="#ffa657" text-anchor="middle">=== "string" ?</text>

  <!-- true branch -->
  <path d="M560 215 L660 215" stroke="#7ee787" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="580" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7ee787">true</text>
  <rect x="670" y="188" width="210" height="54" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="686" y="210" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">value: string</text>
  <text x="686" y="230" font-family="Consolas, monospace" font-size="12" fill="#7ee787">.toUpperCase() OK</text>

  <!-- false branch -->
  <path d="M360 215 L262 215" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="330" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff7b72">false</text>
  <rect x="40" y="188" width="212" height="54" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="56" y="210" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">value: number</text>
  <text x="56" y="230" font-family="Consolas, monospace" font-size="12" fill="#ff7b72">.toFixed(2) OK</text>

  <!-- join node -->
  <path d="M460 265 L460 315" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="300" y="325" width="320" height="52" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="460" y="347" font-family="Consolas, monospace" font-size="13" fill="#e6edf3" text-anchor="middle">after the if:</text>
  <text x="460" y="367" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8" text-anchor="middle">string | number again (re-widened)</text>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7ee787"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff7b72"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/></marker>
  </defs>
</svg>
