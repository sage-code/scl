<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img">
  <title>strictNullChecks: two worlds for one type</title>
  <desc>Without strictNullChecks, null flows into every type and crashes at runtime. With it, string and string or null are distinct, and a guard makes the nullable value usable.</desc>

  <rect x="0" y="0" width="920" height="430" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">strictNullChecks: null stops infecting every type</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The same code, before and after the single most impactful strict flag.</text>

  <!-- left: off -->
  <rect x="40" y="105" width="400" height="270" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="56" y="132" font-family="Consolas, monospace" font-size="14" fill="#ff7b72">strict: false (JS behavior)</text>
  <text x="56" y="164" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">function greet(name: string) {</text>
  <text x="56" y="188" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">  return name.toUpperCase();</text>
  <text x="56" y="212" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">}</text>
  <text x="56" y="240" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">const n: string = null;  // accepted!</text>
  <text x="56" y="264" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">greet(n);</text>
  <text x="56" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff7b72">null and undefined sneak into every type.</text>
  <text x="56" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff7b72">Crash at runtime: TypeError: Cannot read</text>
  <text x="56" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff7b72">properties of null (reading 'toUpperCase')</text>

  <!-- right: on -->
  <rect x="480" y="105" width="400" height="270" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="496" y="132" font-family="Consolas, monospace" font-size="14" fill="#7ee787">strict: true</text>
  <text x="496" y="164" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">const n: string | null = getUser();</text>
  <text x="496" y="196" font-family="Consolas, monospace" font-size="13" fill="#ff7b72">// greet(n);  ✗ compile error:</text>
  <text x="496" y="220" font-family="Consolas, monospace" font-size="13" fill="#ff7b72">// 'string | null' not assignable to 'string'</text>
  <text x="496" y="252" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">if (n !== null) {</text>
  <text x="496" y="276" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">  greet(n);  // OK: narrowed to string</text>
  <text x="496" y="300" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">}</text>
  <text x="496" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7ee787">'may be null' is now part of the type —</text>
  <text x="496" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7ee787">the guard proves the branch is safe.</text>

  <!-- middle arrow -->
  <path d="M448 240 L472 240" stroke="#ffa657" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <defs>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffa657"/></marker>
  </defs>
</svg>
