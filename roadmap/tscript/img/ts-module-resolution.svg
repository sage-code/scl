<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="460" fill="#12181f"/>
  <text x="440" y="34" text-anchor="middle" fill="#e8edf2" font-size="19" font-weight="600">Module resolution: how an import specifier becomes a file</text>

  <!-- Import statement -->
  <rect x="40" y="90" width="250" height="90" rx="8" fill="#223140" stroke="#4dd0a5" stroke-width="1.5"/>
  <text x="165" y="120" text-anchor="middle" fill="#4dd0a5" font-size="13" font-weight="600">import { log } from …</text>
  <text x="165" y="145" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">"./logger"</text>
  <text x="165" y="166" text-anchor="middle" fill="#8fa3b3" font-size="11">the specifier is all you write</text>

  <!-- Strategy branches -->
  <line x1="295" y1="135" x2="360" y2="95" stroke="#4dd0a5" stroke-width="2"/>
  <polygon points="360,95 348,93 353,104" fill="#4dd0a5"/>
  <line x1="295" y1="135" x2="360" y2="240" stroke="#f2b544" stroke-width="2"/>
  <polygon points="360,240 350,231 347,243" fill="#f2b544"/>

  <!-- Relative branch -->
  <rect x="365" y="65" width="240" height="95" rx="8" fill="#1a2530" stroke="#4dd0a5" stroke-width="1.5"/>
  <text x="485" y="92" text-anchor="middle" fill="#4dd0a5" font-size="13" font-weight="600">Relative — "./logger"</text>
  <text x="485" y="116" text-anchor="middle" fill="#d8dee9" font-size="12">path resolved from THIS file</text>
  <text x="485" y="138" text-anchor="middle" fill="#d8dee9" font-size="12">→ src/logger.ts</text>

  <!-- Package branch -->
  <rect x="365" y="195" width="240" height="120" rx="8" fill="#1a2530" stroke="#f2b544" stroke-width="1.5"/>
  <text x="485" y="222" text-anchor="middle" fill="#f2b544" font-size="13" font-weight="600">Bare — "zod"</text>
  <text x="485" y="246" text-anchor="middle" fill="#d8dee9" font-size="12">walk up folders → node_modules</text>
  <text x="485" y="268" text-anchor="middle" fill="#d8dee9" font-size="12">read package.json "exports"</text>
  <text x="485" y="290" text-anchor="middle" fill="#d8dee9" font-size="12">→ types from "types"/".d.ts"</text>

  <!-- moduleResolution setting -->
  <rect x="660" y="195" width="180" height="120" rx="8" fill="#223140" stroke="#e06c75" stroke-width="1.5"/>
  <text x="750" y="225" text-anchor="middle" fill="#e06c75" font-size="13" font-weight="600">moduleResolution</text>
  <text x="750" y="252" text-anchor="middle" fill="#d8dee9" font-size="12">"Bundler" → exports maps,</text>
  <text x="750" y="272" text-anchor="middle" fill="#d8dee9" font-size="12">no extension required</text>
  <text x="750" y="296" text-anchor="middle" fill="#d8dee9" font-size="12">"NodeNext" → strict,</text>
  <text x="750" y="316" text-anchor="middle" fill="#d8dee9" font-size="12">extensions in ESM</text>

  <line x1="610" y1="255" x2="655" y2="255" stroke="#f2b544" stroke-width="2"/>
  <polygon points="655,255 643,249 643,261" fill="#f2b544"/>

  <!-- Verdict row -->
  <rect x="40" y="370" width="800" height="56" rx="8" fill="#1a2530" stroke="#3a4d5f"/>
  <text x="440" y="393" text-anchor="middle" fill="#d8dee9" font-size="12.5">Relative imports = your code's structure. Bare imports = the dependency graph.</text>
  <text x="440" y="413" text-anchor="middle" fill="#8fa3b3" font-size="12">Same rules run twice: once in the checker, once in the bundler/runtime — when they disagree, you get "runs but shows red" or "checks but won't run"</text>
</svg>
