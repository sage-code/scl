<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Where tsc fits next to bundlers and runners</title>
  <desc>Source feeds two independent consumers: tsc which only checks, and fast transpilers (tsx, esbuild, Vite) which only strip types. Runtime platforms execute the JavaScript output without knowing TypeScript existed.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">One tool checks, another one runs</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Bundlers are fast because they skip checking — that is tsc's job.</text>

  <!-- source -->
  <rect x="40" y="150" width="170" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="182" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">src/*.ts</text>
  <text x="56" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">+ node_modules *.d.ts</text>
  <text x="56" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">+ tsconfig.json</text>

  <!-- branch to tsc -->
  <path d="M210 175 L300 120" stroke="#7ee787" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="305" y="85" width="230" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="321" y="113" font-family="Consolas, monospace" font-size="15" fill="#7ee787">tsc / tsc --noEmit</text>
  <text x="321" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">checks types · your CI gate</text>

  <!-- branch to transpiler -->
  <path d="M210 215 L300 270" stroke="#ffa657" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="305" y="240" width="230" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="321" y="268" font-family="Consolas, monospace" font-size="15" fill="#ffa657">tsx · esbuild · Vite</text>
  <text x="321" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">strips types · never checks</text>

  <!-- to runtimes -->
  <path d="M540 120 L640 120" stroke="#7ee787" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="645" y="85" width="230" height="70" fill="#161b22" stroke="#e6edf3" stroke-width="2" rx="6"/>
  <text x="661" y="113" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">node · browser · deno</text>
  <text x="661" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">runs plain JavaScript</text>

  <path d="M540 275 L640 275" stroke="#ffa657" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="645" y="240" width="230" height="70" fill="#161b22" stroke="#e6edf3" stroke-width="2" rx="6"/>
  <text x="661" y="268" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">dist/ bundle · dev server</text>
  <text x="661" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">same plain JavaScript</text>

  <!-- note -->
  <text x="321" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">slow, thorough</text>
  <text x="321" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">fast, no checking — why editors + tsc still matter</text>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7ee787"/></marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffa657"/></marker>
  </defs>
</svg>
