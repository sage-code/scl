<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" style="width:100%;height:auto;" role="img" aria-label="Left column: JavaScript statement syntax. Right column: TypeScript additions — annotations, generics, type aliases, assertion operators">
  <rect width="760" height="280" rx="12" fill="#0f172a"/>
  <text x="380" y="34" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">JavaScript Core vs. TypeScript Type-Layer Additions</text>

  <rect x="28" y="56" width="330" height="196" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="193" y="84" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="14" font-weight="700">JavaScript Runtime Syntax</text>
  <text x="48" y="118" fill="#e2e8f0" font-family="monospace" font-size="13">let count = 0;</text>
  <text x="48" y="146" fill="#e2e8f0" font-family="monospace" font-size="13">function id(x) { return x; }</text>
  <text x="48" y="174" fill="#e2e8f0" font-family="monospace" font-size="13">const user = { name: "Ada" };</text>
  <text x="48" y="216" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Emitted intact into output .js</text>

  <rect x="402" y="56" width="330" height="196" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="567" y="84" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="700">TypeScript Erase-Only Additions</text>
  <text x="422" y="118" fill="#e2e8f0" font-family="monospace" font-size="13">let count: number = 0;</text>
  <text x="422" y="146" fill="#e2e8f0" font-family="monospace" font-size="13">function id&lt;T&gt;(x: T): T</text>
  <text x="422" y="174" fill="#e2e8f0" font-family="monospace" font-size="13">type User = { name: string };</text>
  <text x="422" y="216" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Checked by tsc, erased before runtime</text>

  <line x1="358" y1="154" x2="402" y2="154" stroke="#34d399" stroke-width="2.5"/>
</svg>
