<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img">
  <title>Generic inference: the type parameter as a slot</title>
  <desc>A generic signature with T in three positions. The call first([1, 2, 3]) fills the T slot with number by inference, and the return type becomes number or undefined.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Inference fills the T slot at each call site</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">One signature, written once; the argument decides what T is on every call.</text>

  <!-- signature panel -->
  <rect x="40" y="105" width="840" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="140" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">function first&lt;</text>
  <text x="222" y="140" font-family="Consolas, monospace" font-size="15" fill="#ff7b72" font-weight="bold">T</text>
  <text x="240" y="140" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">&gt;(items:</text>
  <text x="352" y="140" font-family="Consolas, monospace" font-size="15" fill="#ff7b72" font-weight="bold">T</text>
  <text x="370" y="140" font-family="Consolas, monospace" font-size="15" fill="#e6edf3">[]):</text>
  <text x="424" y="140" font-family="Consolas, monospace" font-size="15" fill="#ff7b72" font-weight="bold">T</text>
  <text x="446" y="140" font-family="Consolas, monospace" font-size="15" fill="#e6edf3"> | undefined</text>
  <text x="56" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">Three positions share one placeholder: the parameter array element and the return type are linked through T.</text>

  <!-- call site -->
  <rect x="40" y="225" width="400" height="120" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="56" y="255" font-family="Consolas, monospace" font-size="14" fill="#ffa657">call site</text>
  <text x="56" y="287" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">const n = first([1, 2, 3]);</text>
  <text x="56" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">argument element type: number</text>

  <!-- result -->
  <rect x="480" y="225" width="400" height="120" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="496" y="255" font-family="Consolas, monospace" font-size="14" fill="#7ee787">T is filled with number</text>
  <text x="496" y="287" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">n: number | undefined</text>
  <text x="496" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">hover n in the editor to see it — no angle brackets written</text>

  <!-- arrow -->
  <path d="M448 285 L472 285" stroke="#ffa657" stroke-width="2.5" marker-end="url(#arrowO)"/>
  <defs>
    <marker id="arrowO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffa657"/></marker>
  </defs>
</svg>
