<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="460" fill="#12181f"/>
  <text x="440" y="34" text-anchor="middle" fill="#e8edf2" font-size="19" font-weight="600">Type-level computation: types as functions from types to types</text>

  <!-- Input type -->
  <rect x="40" y="120" width="150" height="120" rx="8" fill="#223140" stroke="#4dd0a5" stroke-width="1.5"/>
  <text x="115" y="150" text-anchor="middle" fill="#4dd0a5" font-size="14" font-weight="600">Input union</text>
  <text x="115" y="178" text-anchor="middle" fill="#d8dee9" font-size="13">"small" | "medium"</text>
  <text x="115" y="200" text-anchor="middle" fill="#d8dee9" font-size="13">| "large"</text>
  <text x="115" y="226" text-anchor="middle" fill="#8fa3b3" font-size="11">a type value</text>

  <!-- Arrow 1 into mapped/conditional machinery -->
  <line x1="195" y1="180" x2="300" y2="180" stroke="#4dd0a5" stroke-width="2"/>
  <polygon points="300,180 288,174 288,186" fill="#4dd0a5"/>

  <!-- Machine box -->
  <rect x="305" y="80" width="270" height="290" rx="10" fill="#1a2530" stroke="#f2b544" stroke-width="1.5"/>
  <text x="440" y="112" text-anchor="middle" fill="#f2b544" font-size="14" font-weight="600">Mapped type</text>
  <rect x="325" y="128" width="230" height="52" rx="6" fill="#223140" stroke="#3a4d5f"/>
  <text x="440" y="150" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">type Sizes = {</text>
  <text x="440" y="168" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">[K in T]: Area }</text>
  <text x="440" y="205" text-anchor="middle" fill="#f2b544" font-size="14" font-weight="600">Conditional type</text>
  <rect x="325" y="220" width="230" height="52" rx="6" fill="#223140" stroke="#3a4d5f"/>
  <text x="440" y="242" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">T extends "large"</text>
  <text x="440" y="260" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">? XL : Standard</text>
  <text x="440" y="300" text-anchor="middle" fill="#8fa3b3" font-size="11.5">iterates / branches over the input</text>
  <text x="440" y="320" text-anchor="middle" fill="#8fa3b3" font-size="11.5">at compile time — zero runtime cost</text>
  <text x="440" y="350" text-anchor="middle" fill="#e06c75" font-size="11.5">this box does NOT exist in emitted JS</text>

  <!-- Arrow 2 out -->
  <line x1="580" y1="180" x2="685" y2="180" stroke="#4dd0a5" stroke-width="2"/>
  <polygon points="685,180 673,174 673,186" fill="#4dd0a5"/>

  <!-- Output type -->
  <rect x="690" y="120" width="150" height="120" rx="8" fill="#223140" stroke="#4dd0a5" stroke-width="1.5"/>
  <text x="765" y="150" text-anchor="middle" fill="#4dd0a5" font-size="14" font-weight="600">Derived type</text>
  <text x="765" y="178" text-anchor="middle" fill="#d8dee9" font-size="13">{ small: Area;</text>
  <text x="765" y="198" text-anchor="middle" fill="#d8dee9" font-size="13">medium: Area;</text>
  <text x="765" y="218" text-anchor="middle" fill="#d8dee9" font-size="13">large: Area }</text>
  <text x="765" y="226" text-anchor="middle" fill="#8fa3b3" font-size="11"> </text>

  <!-- Bottom annotation: comparison with runtime functions -->
  <rect x="120" y="386" width="640" height="50" rx="8" fill="#223140" stroke="#3a4d5f"/>
  <text x="440" y="407" text-anchor="middle" fill="#d8dee9" font-size="12.5">Same mental model as a runtime function — f(x) → y — but evaluated by the</text>
  <text x="440" y="426" text-anchor="middle" fill="#d8dee9" font-size="12.5">checker on types, and fully erased before the program runs</text>
</svg>
