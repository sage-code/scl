<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="400" fill="#12181f"/>
  <text x="440" y="34" text-anchor="middle" fill="#e8edf2" font-size="19" font-weight="600">Declaration augmenting: teaching the checker about foreign code</text>

  <!-- Library zone -->
  <rect x="40" y="70" width="260" height="260" rx="10" fill="#1a2530" stroke="#3a4d5f" stroke-width="1.5"/>
  <text x="170" y="100" text-anchor="middle" fill="#4dd0a5" font-size="14" font-weight="600">Third-party library</text>
  <rect x="60" y="120" width="220" height="60" rx="6" fill="#223140" stroke="#3a4d5f"/>
  <text x="170" y="145" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">export interface Cart {</text>
  <text x="170" y="163" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">items: Item[] }</text>
  <text x="170" y="215" text-anchor="middle" fill="#8fa3b3" font-size="11.5">ships a .d.ts file the checker reads</text>
  <text x="170" y="235" text-anchor="middle" fill="#8fa3b3" font-size="11.5">you cannot (and should not) edit it</text>
  <text x="170" y="275" text-anchor="middle" fill="#e06c75" font-size="12" font-weight="600">cart.couponCode ✗ unknown</text>

  <!-- Your augmentation zone -->
  <rect x="380" y="70" width="260" height="260" rx="10" fill="#1a2530" stroke="#f2b544" stroke-width="1.5"/>
  <text x="510" y="100" text-anchor="middle" fill="#f2b544" font-size="14" font-weight="600">Your augmentation file</text>
  <rect x="400" y="120" width="220" height="110" rx="6" fill="#223140" stroke="#3a4d5f"/>
  <text x="510" y="145" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">import "cart-lib";</text>
  <text x="510" y="168" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">declare module "cart-lib" {</text>
  <text x="510" y="188" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">interface Cart {</text>
  <text x="510" y="208" text-anchor="middle" fill="#d8dee9" font-size="12.5" font-family="Consolas, monospace">couponCode?: string } }</text>
  <text x="510" y="265" text-anchor="middle" fill="#8fa3b3" font-size="11.5">same module name → declarations merge</text>
  <text x="510" y="285" text-anchor="middle" fill="#8fa3b3" font-size="11.5">your fields join the library's interface</text>

  <!-- Checker zone -->
  <rect x="720" y="130" width="120" height="140" rx="10" fill="#223140" stroke="#4dd0a5" stroke-width="1.5"/>
  <text x="780" y="165" text-anchor="middle" fill="#4dd0a5" font-size="14" font-weight="600">Checker</text>
  <text x="780" y="195" text-anchor="middle" fill="#d8dee9" font-size="12.5">sees ONE</text>
  <text x="780" y="215" text-anchor="middle" fill="#d8dee9" font-size="12.5">merged Cart</text>
  <text x="780" y="248" text-anchor="middle" fill="#4dd0a5" font-size="12" font-weight="600">couponCode ✓</text>

  <!-- Arrows -->
  <line x1="305" y1="200" x2="375" y2="200" stroke="#4dd0a5" stroke-width="2"/>
  <polygon points="375,200 363,194 363,206" fill="#4dd0a5"/>
  <line x1="645" y1="200" x2="715" y2="200" stroke="#f2b544" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="715,200 703,194 703,206" fill="#f2b544"/>

  <!-- Bottom annotation -->
  <rect x="140" y="348" width="600" height="36" rx="8" fill="#223140" stroke="#3a4d5f"/>
  <text x="440" y="372" text-anchor="middle" fill="#d8dee9" font-size="12.5">Merging is additive and checked — misuse shows up as impossible types, not silent lies</text>
</svg>
