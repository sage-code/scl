<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img">
  <title>JavaScript bugs at runtime versus TypeScript bugs at compile time</title>
  <desc>Two lanes: a JavaScript file flows straight to production where the user triggers the error; a TypeScript file passes a type check that stops the same bug before deploy.</desc>

  <rect x="0" y="0" width="920" height="420" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="396" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">The same bug, two timelines</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">JavaScript reports the error at runtime; TypeScript reports it before the code ever runs.</text>

  <!-- lane labels -->
  <text x="40" y="130" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">JavaScript</text>
  <text x="40" y="270" font-family="Consolas, monospace" font-size="15" fill="#7ee787">TypeScript</text>

  <!-- JavaScript lane -->
  <rect x="150" y="105" width="160" height="56" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="166" y="129" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">order.js</text>
  <text x="166" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">bug ships silently</text>

  <path d="M310 133 L390 133" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="395" y="105" width="160" height="56" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="411" y="129" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">deploy</text>
  <text x="411" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">no check runs</text>

  <path d="M555 133 L635 133" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="640" y="105" width="220" height="56" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="656" y="129" font-family="Consolas, monospace" font-size="14" fill="#ff7b72">user hits TypeError</text>
  <text x="656" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">days later · console.log debugging</text>

  <!-- TypeScript lane -->
  <rect x="150" y="245" width="160" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="166" y="269" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">order.ts</text>
  <text x="166" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">bug is visible to tsc</text>

  <path d="M310 273 L390 273" stroke="#7ee787" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="395" y="245" width="160" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="411" y="269" font-family="Consolas, monospace" font-size="14" fill="#7ee787">type check</text>
  <text x="411" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">tsc / your editor</text>

  <path d="M555 273 L635 273" stroke="#7ee787" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="640" y="245" width="220" height="56" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="656" y="269" font-family="Consolas, monospace" font-size="14" fill="#ffa657">error at build time</text>
  <text x="656" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the bug never reaches a user</text>

  <!-- alignment line connecting the two lanes' cost -->
  <path d="M760 165 L760 241" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="772" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">same bug, earlier feedback</text>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ff7b72"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7ee787"/>
    </marker>
  </defs>
</svg>
