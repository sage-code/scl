<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img">
  <title>The TypeScript compiler pipeline</title>
  <desc>A TypeScript file is parsed into an AST, the checker compares every expression against declared and inferred types, and the emitter strips the types producing plain JavaScript. Checking and emitting are separate, separable steps.</desc>

  <rect x="0" y="0" width="920" height="360" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="336" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Inside tsc: check first, emit second</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The two jobs are separable — you can run one without the other.</text>

  <!-- stage boxes -->
  <rect x="40" y="120" width="180" height="110" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">.ts source</text>
  <text x="56" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">code + annotations</text>
  <text x="56" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">+ interfaces</text>
  <text x="56" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">+ generics</text>

  <path d="M220 175 L280 175" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="228" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">parse</text>

  <rect x="285" y="120" width="150" height="110" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="301" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">AST</text>
  <text x="301" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">syntax tree of</text>
  <text x="301" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the whole program</text>

  <path d="M435 175 L495 175" stroke="#7ee787" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="443" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">check</text>

  <rect x="500" y="120" width="180" height="110" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="516" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">checker</text>
  <text x="516" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">every value gets a</text>
  <text x="516" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">type: declared or</text>
  <text x="516" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">inferred</text>

  <path d="M680 175 L740 175" stroke="#ffa657" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="688" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">emit</text>

  <rect x="745" y="120" width="130" height="110" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="761" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">.js output</text>
  <text x="761" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">types erased,</text>
  <text x="761" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">nothing left but</text>
  <text x="761" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">JavaScript</text>

  <!-- error branch from checker -->
  <path d="M590 230 L590 280 L420 280" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="250" y="258" width="170" height="44" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="266" y="286" font-family="Consolas, monospace" font-size="14" fill="#ff7b72">diagnostics</text>
  <text x="430" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">with --noEmit the checker reports errors and nothing is written</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7ee787"/></marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffa657"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff7b72"/></marker>
  </defs>
</svg>
