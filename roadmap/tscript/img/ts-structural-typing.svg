<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img">
  <title>Structural typing: shape, not name</title>
  <desc>A value with more properties than required is accepted by a type that needs fewer. Two identically shaped but independently declared types are mutually assignable.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Structural typing: the shape decides, not the name</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">A type is satisfied by having the required members — never by declaring a relationship.</text>

  <!-- left panel: extra properties OK -->
  <rect x="40" y="105" width="400" height="230" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="132" font-family="Consolas, monospace" font-size="14" fill="#58a6ff">extra members are fine</text>
  <text x="56" y="164" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">type Point = { x: number; y: number };</text>
  <text x="56" y="196" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">const p = { x: 1, y: 2, label: "a" };</text>
  <text x="56" y="228" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">const q: Point = p;   // OK</text>
  <text x="56" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7ee787">p has x and y — label is a bonus.</text>
  <text x="56" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7ee787">The checker only asks: are the required</text>
  <text x="56" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7ee787">members present with right types?</text>

  <!-- right panel: names irrelevant -->
  <rect x="480" y="105" width="400" height="230" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="496" y="132" font-family="Consolas, monospace" font-size="14" fill="#ffa657">declared name is irrelevant</text>
  <text x="496" y="164" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">type Meter = { value: number };</text>
  <text x="496" y="188" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">type Token = { value: number };</text>
  <text x="496" y="220" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">const m: Meter = { value: 5 };</text>
  <text x="496" y="244" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">const t: Token = m;   // OK — same shape</text>
  <text x="496" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff7b72">No 'implements Meter' needed. Two types</text>
  <text x="496" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff7b72">with identical shapes are mutually</text>
  <text x="496" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff7b72">assignable in both directions.</text>
</svg>
