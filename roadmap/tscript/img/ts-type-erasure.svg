<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img">
  <title>Type erasure: what the runtime actually executes</title>
  <desc>Left: the TypeScript source with annotations, an interface, and a generic. Right: the emitted JavaScript where every type-only construct is gone. The runtime never sees a single type.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Erasure: the types never reach the runtime</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Everything on the left that exists only for the checker is gone on the right.</text>

  <!-- left panel: TypeScript -->
  <rect x="40" y="105" width="400" height="230" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="132" font-family="Consolas, monospace" font-size="14" fill="#58a6ff">order.ts</text>
  <text x="56" y="162" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">interface Order { id: number }</text>
  <text x="56" y="186" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">function tag(o: Order): string {</text>
  <text x="56" y="210" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">  return `#${o.id}`;</text>
  <text x="56" y="234" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">}</text>
  <text x="56" y="258" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">const first = tag&lt;Order&gt;({ id: 7 });</text>
  <text x="56" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff7b72">annotation · interface · generic parameter</text>
  <text x="56" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff7b72">= design-time only</text>

  <!-- middle arrow -->
  <path d="M455 220 L520 220" stroke="#ffa657" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="462" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">emit</text>

  <!-- right panel: JavaScript -->
  <rect x="530" y="105" width="350" height="230" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="546" y="132" font-family="Consolas, monospace" font-size="14" fill="#ffa657">order.js</text>
  <text x="546" y="162" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">function tag(o) {</text>
  <text x="546" y="186" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">  return `#${o.id}`;</text>
  <text x="546" y="210" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">}</text>
  <text x="546" y="234" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">const first = tag({ id: 7 });</text>
  <text x="546" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7ee787">no interfaces, no annotations,</text>
  <text x="546" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7ee787">no generic syntax — identical runtime</text>

  <defs>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffa657"/></marker>
  </defs>
</svg>
