<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>What happens on submit</title>
  <desc>Submit fires validation first; a valid form is encoded and sent by GET or POST; the server answers with a new page or data.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">The browser does more than you think</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Understanding this flow tells you when you need JavaScript: almost never for validation, often for feedback.</text>
  <rect x="60" y="130" width="190" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="160" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">1. submit event</text>
  <text x="76" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">button or Enter key</text>
  <rect x="300" y="130" width="210" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="316" y="160" font-family="Consolas, monospace" font-size="15" fill="#ffa657">2. constraint check</text>
  <text x="316" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">pattern, required, type…</text>
  <rect x="560" y="130" width="210" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="576" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">3. encode</text>
  <text x="576" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">urlencoded / multipart</text>
  <rect x="60" y="250" width="210" height="80" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="280" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">4. HTTP request</text>
  <text x="76" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">GET or POST to action</text>
  <rect x="310" y="250" width="210" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="326" y="280" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">5. server responds</text>
  <text x="326" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">redirect or result page</text>
  <line x1="256" y1="170" x2="288" y2="170" stroke="#7ee787" stroke-width="2"/>
  <polygon points="296,170 287,166 287,174" fill="#7ee787"/>
  <line x1="516" y1="170" x2="548" y2="170" stroke="#7ee787" stroke-width="2"/>
  <polygon points="556,170 547,166 547,174" fill="#7ee787"/>
  <line x1="410" y1="214" x2="242" y2="246" stroke="#7ee787" stroke-width="2"/>
  <polygon points="250,246 241,242 241,250" fill="#7ee787"/>
  <line x1="276" y1="290" x2="298" y2="290" stroke="#7ee787" stroke-width="2"/>
  <polygon points="306,290 297,286 297,294" fill="#7ee787"/>
  <line x1="516" y1="290" x2="552" y2="200" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="560,200 551,196 551,204" fill="#ff7b72"/>
  <text x="538.0" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">invalid? block + show errors</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">GET puts values in the URL (shareable, for searches); POST puts them in the body (required for anything that changes data).</text>
</svg>
