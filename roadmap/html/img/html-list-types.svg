<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Three list elements</title>
  <desc>ul for unordered sets, ol for ordered sequences, dl for name–value groups. Lists are the honest way to mark up 'a group of things'.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Pick by meaning, not by bullet style</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The bullet/number rendering is CSS's business; the element's job is to tell the browser 'this is a list'.</text>
  <rect x="60" y="120" width="250" height="120" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">ul</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">unordered: order does not matter</text>
  <text x="80" y="165" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">&lt;li&gt;…&lt;/li&gt;</text>
  <rect x="350" y="120" width="250" height="120" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="366" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">ol</text>
  <text x="366" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">ordered: sequence is part of the meaning</text>
  <text x="370" y="165" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">1. 2. 3.</text>
  <rect x="640" y="120" width="240" height="120" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="656" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">dl</text>
  <text x="656" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">description: term + definition pairs</text>
  <text x="660" y="165" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">&lt;dt&gt; / &lt;dd&gt;</text>
  <text x="60" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">recipes, rankings, steps</text>
  <text x="60" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">-&gt; ol, almost always</text>
  <text x="350" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">menus, tags, feature lists</text>
  <text x="350" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">-&gt; ul, almost always</text>
  <text x="640" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">glossaries, metadata pairs,</text>
  <text x="640" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">FAQ question/answer groups</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Lists can nest (a ul inside an li) — screen readers announce nesting depth, so keep structures shallow and real.</text>
</svg>
