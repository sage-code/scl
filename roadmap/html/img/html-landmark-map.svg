<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img">
  <title>Landmark regions</title>
  <desc>Semantic elements become named landmarks that screen-reader users jump between — a table of contents for every page.</desc>

  <rect x="0" y="0" width="920" height="430" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">The same page, navigable in seconds</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">header, nav, main, aside, and footer map to landmark roles — without writing a single ARIA attribute.</text>
  <rect x="160" y="110" width="600" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="176" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;header&gt;</text>
  <text x="176" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">site identity + h1 — banner landmark</text>
  <rect x="160" y="178" width="600" height="50" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="176" y="208" font-family="Consolas, monospace" font-size="15" fill="#7ee787">&lt;nav&gt;</text>
  <text x="176" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the site's main menu — navigation landmark</text>
  <rect x="160" y="240" width="400" height="90" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="176" y="270" font-family="Consolas, monospace" font-size="15" fill="#ffa657">&lt;main&gt;</text>
  <text x="176" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the unique content of THIS page — main landmark</text>
  <rect x="575" y="240" width="185" height="90" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="591" y="270" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">&lt;aside&gt;</text>
  <text x="591" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">related but optional</text>
  <rect x="160" y="336" width="600" height="44" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="176" y="366" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;footer&gt;</text>
  <text x="176" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">copyright, colophon — contentinfo landmark</text>
  <text x="60" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Rule: exactly one visible &lt;main&gt; per page. Skip link first: &lt;a class="skip" href="#main"&gt;Skip to content&lt;/a&gt;.</text>
</svg>
