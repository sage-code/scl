<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Inline SVG vs canvas</title>
  <desc>SVG keeps shapes in the DOM (styleable, accessible, scalable); canvas paints pixels and forgets them.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Vector DOM or pixel buffer</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Icons, charts, and diagrams belong in SVG; games and thousands of points belong in canvas.</text>
  <rect x="60" y="120" width="380" height="150" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">inline &lt;svg&gt;</text>
  <text x="80" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">retained DOM nodes</text>
  <text x="80" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">CSS can style parts; JS can bind events</text>
  <text x="80" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">crisp at any zoom</text>
  <text x="80" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">accessible with &lt;title&gt; + role</text>
  <rect x="480" y="120" width="380" height="150" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="496" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">&lt;canvas&gt;</text>
  <text x="500" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">immediate-mode pixel drawing</text>
  <text x="500" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">fast for thousands of moving items</text>
  <text x="500" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">no DOM per shape; redraw everything</text>
  <text x="500" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">text inside is invisible to a11y tools</text>
  <text x="60" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Standalone SVG images need role="img" and a &lt;title&gt; — or use &lt;img src="diagram.svg" alt="..."&gt; and inherit alt text.</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">SVG in &lt;img&gt; cannot run scripts or load external fonts — a security feature worth knowing.</text>
</svg>
