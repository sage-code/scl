<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Native media elements</title>
  <desc>video, audio, and track give the browser's built-in player — with attributes for behavior and tracks for captions.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Media without plugins</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">controls, poster, muted, and preload shape the experience; captions are both an accessibility and a legal standard.</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;video controls poster="cover.jpg" muted preload="metadata"&gt;</text>
  <text x="90" y="148" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">&lt;source src="clip.webm" type="video/webm"&gt;</text>
  <text x="90" y="176" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">&lt;source src="clip.mp4" type="video/mp4"&gt;</text>
  <text x="90" y="204" font-family="Consolas, monospace" font-size="15" fill="#ffa657">&lt;track src="subs-en.vtt" kind="captions" srclang="en" label="English"&gt;</text>
  <text x="60" y="232" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;/video&gt;</text>
  <rect x="60" y="266" width="270" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="296" font-family="Consolas, monospace" font-size="15" fill="#7ee787">source list</text>
  <text x="76" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">first supported format wins</text>
  <rect x="370" y="266" width="260" height="60" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="386" y="296" font-family="Consolas, monospace" font-size="15" fill="#ffa657">track</text>
  <text x="386" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">captions · subtitles · chapters</text>
  <rect x="670" y="266" width="210" height="60" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="686" y="296" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">fallback content</text>
  <text x="686" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">text between the tags</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Autoplay only works muted in most browsers — and muted autoplay plus a visible play control is the accessible pattern.</text>
</svg>
