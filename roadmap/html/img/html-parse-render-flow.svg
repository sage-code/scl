<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>From bytes to pixels</title>
  <desc>The parser turns bytes into tokens, tokens into the DOM; CSS builds the CSSOM; the render tree is painted to the screen.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Why blocking resources freeze the page</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">HTML parsing stops at a blocking stylesheet or script — every performance trick works on this pipeline.</text>
  <rect x="60" y="130" width="170" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="160" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">bytes</text>
  <text x="76" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">network response</text>
  <rect x="270" y="130" width="170" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="286" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">tokens</text>
  <text x="286" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">parser sees &lt; and &gt;</text>
  <rect x="480" y="130" width="170" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="496" y="160" font-family="Consolas, monospace" font-size="15" fill="#ffa657">DOM</text>
  <text x="496" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the element tree</text>
  <rect x="690" y="130" width="170" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="706" y="160" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">render</text>
  <text x="706" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">paint to screen</text>
  <line x1="236" y1="165" x2="258" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="266,165 257,161 257,169" fill="#7ee787"/>
  <line x1="446" y1="165" x2="468" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="476,165 467,161 467,169" fill="#7ee787"/>
  <line x1="656" y1="165" x2="678" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="686,165 677,161 677,169" fill="#7ee787"/>
  <rect x="480" y="240" width="170" height="60" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="496" y="270" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">CSSOM</text>
  <text x="496" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">from stylesheets</text>
  <line x1="565" y1="200" x2="557" y2="236" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="565,236 556,232 556,240" fill="#ff7b72"/>
  <line x1="650" y1="266" x2="722" y2="210" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="730,210 721,206 721,214" fill="#ff7b72"/>
  <text x="690.0" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">render tree = DOM x CSSOM</text>
  <text x="60" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ff7b72">blocking &lt;script&gt;</text>
  <text x="60" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ff7b72">pauses the token stage</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">One blocking script in &lt;head&gt; delays every pixel after it — defer/async move scripts off this critical path.</text>
</svg>
