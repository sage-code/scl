<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Embedding with iframes, safely</title>
  <desc>An iframe is a full browsing context inside your page. sandbox, allow, and loading decide how much it can do.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Third-party content, first-party risk</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Everything the frame loads runs with its own origin — but without sandbox, it can navigate YOUR page.</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;iframe src="https://maps.example.com/embed"</text>
  <text x="90" y="148" font-family="Consolas, monospace" font-size="15" fill="#ffa657">sandbox="allow-scripts allow-same-origin"</text>
  <text x="90" y="176" font-family="Consolas, monospace" font-size="15" fill="#ffa657">loading="lazy" title="Office location map" allowfullscreen&gt;</text>
  <rect x="60" y="220" width="260" height="90" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="250" font-family="Consolas, monospace" font-size="15" fill="#ffa657">sandbox tokens</text>
  <text x="76" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">allow-scripts, allow-forms, allow-popups, allow-same-origin…</text>
  <rect x="360" y="220" width="250" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="376" y="250" font-family="Consolas, monospace" font-size="15" fill="#7ee787">title attribute</text>
  <text x="376" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">names the frame in the a11y tree</text>
  <rect x="650" y="220" width="210" height="90" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="666" y="250" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">lazy + width/height</text>
  <text x="666" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">perf: no layout shift, no eager load</text>
  <text x="60" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">sandbox without allow-same-origin blocks the frame from touching your DOM and cookies — start strict, add tokens per need.</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Every iframe needs a title — 'iframe' is what screen readers announce otherwise, for every frame on the page.</text>
</svg>
