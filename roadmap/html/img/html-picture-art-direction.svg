<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Art direction with &lt;picture&gt;</title>
  <desc>picture chooses different images by media condition — not just different sizes, different crops or formats.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">When srcset is not enough</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Use picture when the IMAGE CONTENT should change: a wide crop on desktop, a tight crop on mobile, AVIF/WebP where supported.</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">&lt;picture&gt;</text>
  <text x="90" y="148" font-family="Consolas, monospace" font-size="16" fill="#9fb3c8">&lt;source media="(min-width: 800px)" srcset="wide.avif"&gt;</text>
  <text x="90" y="176" font-family="Consolas, monospace" font-size="16" fill="#9fb3c8">&lt;source type="image/webp" srcset="photo.webp"&gt;</text>
  <text x="90" y="204" font-family="Consolas, monospace" font-size="16" fill="#ffa657">&lt;img src="photo.jpg" alt="Sage plant on a desk"&gt;</text>
  <text x="60" y="232" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">&lt;/picture&gt;</text>
  <text x="60" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">first match wins; the &lt;img&gt; is the fallback and the required alt-text home</text>
  <rect x="60" y="296" width="380" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="326" font-family="Consolas, monospace" font-size="15" fill="#7ee787">media=</text>
  <text x="76" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">viewport condition (art direction)</text>
  <rect x="480" y="296" width="380" height="60" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="496" y="326" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">type=</text>
  <text x="496" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">format condition (modern codecs)</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Every picture needs an &lt;img&gt; child — it carries alt, sizing, and the fallback for browsers that match no source.</text>
</svg>
