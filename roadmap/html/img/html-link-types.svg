<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The many jobs of &lt;a&gt;</title>
  <desc>Anchors navigate pages, sections of the current page, email, phone, and file downloads — one element, five jobs.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">One element, five destinations</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">href decides the job. Omit href and the anchor is just a placeholder target with no link behavior.</text>
  <rect x="60" y="110" width="400" height="40" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">https://example.com/page</text>
  <text x="490" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">another page (same or other site)</text>
  <rect x="60" y="158" width="400" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="188" font-family="Consolas, monospace" font-size="15" fill="#7ee787">/roadmap/html/#topics</text>
  <text x="490" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">a fragment: scroll to an id on the page</text>
  <rect x="60" y="206" width="400" height="40" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="236" font-family="Consolas, monospace" font-size="15" fill="#ffa657">mailto:hi@example.com</text>
  <text x="490" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">opens the visitor's email client</text>
  <rect x="60" y="254" width="400" height="40" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="284" font-family="Consolas, monospace" font-size="15" fill="#ffa657">tel:+40712345678</text>
  <text x="490" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">dials on mobile devices</text>
  <rect x="60" y="302" width="400" height="40" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="332" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">href="report.pdf" download</text>
  <text x="490" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">downloads instead of navigating</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Link text should describe the destination ('read the HTML standard'), never 'click here' — screen-reader users skim link lists.</text>
</svg>
