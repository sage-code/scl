<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Structured data with JSON-LD</title>
  <desc>A script block of type application/ld+json describes what the page IS in a vocabulary search engines parse directly.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">HTML describes structure; JSON-LD describes meaning</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Course, Article, FAQPage, BreadcrumbList — schema.org types can earn rich results in search.</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">&lt;script type="application/ld+json"&gt;</text>
  <text x="90" y="148" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">{</text>
  <text x="110" y="176" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">"@context": "https://schema.org",</text>
  <text x="110" y="204" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">"@type": "Course",</text>
  <text x="110" y="232" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">"name": "HTML5 Tutorial", "provider": {...}</text>
  <text x="90" y="260" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">}</text>
  <text x="60" y="288" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">&lt;/script&gt;</text>
  <rect x="480" y="130" width="380" height="120" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="496" y="160" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">invisible to users</text>
  <text x="496" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">never replaces visible content</text>
  <rect x="480" y="270" width="380" height="100" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="496" y="300" font-family="Consolas, monospace" font-size="15" fill="#7ee787">validate</text>
  <text x="496" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Google Rich Results Test + validator.schema.org</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">JSON-LD must be valid JSON — a trailing comma silently kills the whole block for crawlers.</text>
</svg>
