<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>HTML's security surface</title>
  <desc>Links, embeds, and external resources are the three doors an attacker uses. Each has a one-attribute fix.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Four risks every author inherits</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">None of these need a backend to matter — they are decisions in your markup, today.</text>
  <rect x="60" y="110" width="190" height="56" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">tab-nabbing</text>
  <text x="270" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">target="_blank" page can control your tab</text>
  <rect x="560" y="110" width="300" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="576" y="140" font-family="Consolas, monospace" font-size="15" fill="#7ee787">fix</text>
  <text x="575" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">rel="noopener noreferrer"</text>
  <rect x="60" y="172" width="190" height="56" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="202" font-family="Consolas, monospace" font-size="15" fill="#ffa657">mixed content</text>
  <text x="270" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">http:// resource inside an https:// page</text>
  <rect x="560" y="172" width="300" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="576" y="202" font-family="Consolas, monospace" font-size="15" fill="#7ee787">fix</text>
  <text x="575" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">always https: + upgrade-insecure-requests</text>
  <rect x="60" y="234" width="190" height="56" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="264" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">injection via embeds</text>
  <text x="270" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">iframe/script from an unknown origin</text>
  <rect x="560" y="234" width="300" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="576" y="264" font-family="Consolas, monospace" font-size="15" fill="#7ee787">fix</text>
  <text x="575" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">sandbox + CSP allowlist + SRI on scripts</text>
  <rect x="60" y="296" width="190" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="326" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">referrer leak</text>
  <text x="270" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">full URL sent to linked sites</text>
  <rect x="560" y="296" width="300" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="576" y="326" font-family="Consolas, monospace" font-size="15" fill="#7ee787">fix</text>
  <text x="575" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">referrerpolicy="no-referrer" / strict-origin</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">CSP via &lt;meta&gt; covers the page it is on — a real header is stronger; SRI verifies a file was not tampered with.</text>
</svg>
