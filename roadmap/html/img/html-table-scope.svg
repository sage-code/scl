<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>How screen readers read a cell</title>
  <desc>th scope connects each header cell to the data cells it governs — row, column, or both.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">scope is the table's coordinate system</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">With scope, a screen reader can announce 'Price, row March, column Europe' instead of a meaningless cell value.</text>
  <rect x="200" y="120" width="160" height="44" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="216" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">th scope="col"</text>
  <rect x="370" y="120" width="160" height="44" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="386" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">th scope="col"</text>
  <rect x="200" y="175" width="160" height="44" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="216" y="205" font-family="Consolas, monospace" font-size="15" fill="#7ee787">&lt;td&gt;</text>
  <text x="216" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">data cell</text>
  <rect x="370" y="175" width="160" height="44" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="386" y="205" font-family="Consolas, monospace" font-size="15" fill="#7ee787">&lt;td&gt;</text>
  <text x="386" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">data cell</text>
  <rect x="40" y="175" width="140" height="44" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="56" y="205" font-family="Consolas, monospace" font-size="15" fill="#ffa657">th scope="row"</text>
  <line x1="280" y1="168" x2="272" y2="186" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="280,186 271,182 271,190" fill="#58a6ff"/>
  <text x="280.0" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">column header</text>
  <line x1="450" y1="168" x2="442" y2="186" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="450,186 441,182 441,190" fill="#58a6ff"/>
  <text x="450.0" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">column header</text>
  <line x1="196" y1="197" x2="168" y2="197" stroke="#ffa657" stroke-width="2"/>
  <polygon points="176,197 167,193 167,201" fill="#ffa657"/>
  <text x="186.0" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">row header</text>
  <text x="60" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Header cells are th (with scope); data cells are td. &lt;th scope="row"&gt; marks the first cell of a row as its header.</text>
  <text x="60" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">For two-axis tables add headers/id pairs; for layout pretending, use CSS grid instead of tables.</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Rule of thumb: if removing a row or column changes the meaning of other cells, it is data — use a real table.</text>
</svg>
