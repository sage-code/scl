<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>How a social card is built</title>
  <desc>When a URL is shared, the platform fetches its og: tags and renders a card — your markup IS the preview.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">og:title, og:description, og:image</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Crawlers do not run your JavaScript reliably — the tags must be in the served HTML (one reason SSR exists).</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">&lt;meta property="og:title" content="HTML Roadmap"&gt;</text>
  <text x="60" y="148" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">&lt;meta property="og:description" content="Semantic HTML, forms, a11y."&gt;</text>
  <text x="60" y="176" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">&lt;meta property="og:image" content="https://sagecode.org/images/SageCode.jpg"&gt;</text>
  <text x="60" y="204" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">&lt;meta property="og:url" content="https://sagecode.org/roadmap/html/"&gt;</text>
  <rect x="60" y="240" width="380" height="100" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="270" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">the rendered card</text>
  <text x="76" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">image on top, title, description, domain</text>
  <rect x="480" y="240" width="380" height="100" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="496" y="270" font-family="Consolas, monospace" font-size="15" fill="#7ee787">debugging</text>
  <text x="496" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Facebook Sharing Debugger, Twitter Card Validator — validate before shipping</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">og:image wants an absolute URL and a 1200x630 image — relative paths and tiny logos render as broken cards.</text>
</svg>
