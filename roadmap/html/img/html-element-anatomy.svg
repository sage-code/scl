<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>HTML element anatomy</title>
  <desc>An element is an opening tag, optional attributes, content, and a closing tag. Void elements have no closing tag and no content.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Tags name the meaning; attributes configure it</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The browser does not show the tags — it uses them to decide what the content IS.</text>
  <text x="60" y="140" font-family="Consolas, monospace" font-size="22" fill="#58a6ff">&lt;a</text>
  <text x="100" y="140" font-family="Consolas, monospace" font-size="22" fill="#ffa657">href="https://developer.mozilla.org"</text>
  <text x="460" y="140" font-family="Consolas, monospace" font-size="22" fill="#58a6ff">&gt;</text>
  <text x="490" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#e6edf3">MDN Web Docs</text>
  <text x="660" y="140" font-family="Consolas, monospace" font-size="22" fill="#58a6ff">&lt;/a&gt;</text>
  <line x1="95" y1="152" x2="95" y2="200" stroke="#58a6ff" stroke-width="2"/>
  <line x1="470" y1="152" x2="470" y2="200" stroke="#58a6ff" stroke-width="2"/>
  <text x="60" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#58a6ff">opening tag</text>
  <text x="340" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffa657">attribute (name="value")</text>
  <text x="540" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6edf3">text content</text>
  <text x="660" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#58a6ff">closing tag</text>
  <rect x="60" y="260" width="360" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="290" font-family="Consolas, monospace" font-size="15" fill="#7ee787">&lt;p&gt;</text>
  <text x="190" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e6edf3">paragraph</text>
  <text x="302" y="290" font-family="Consolas, monospace" font-size="15" fill="#7ee787">&lt;/p&gt;</text>
  <text x="76" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">container: holds content between the tags</text>
  <rect x="460" y="260" width="380" height="64" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="476" y="290" font-family="Consolas, monospace" font-size="15" fill="#ffa657">&lt;img</text>
  <text x="590" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e6edf3">src="bug.png" alt="A ladybug"</text>
  <text x="722" y="290" font-family="Consolas, monospace" font-size="15" fill="#ffa657"></text>
  <text x="476" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">void: no content, no closing tag — ever</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Nesting rule: elements close in the reverse order they opened — &lt;p&gt;&lt;strong&gt;text&lt;/strong&gt;&lt;/p&gt;, never &lt;p&gt;&lt;strong&gt;text&lt;/p&gt;&lt;/strong&gt;.</text>
</svg>
