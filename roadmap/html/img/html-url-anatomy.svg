<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Anatomy of a URL</title>
  <desc>scheme says how to talk, host says who, path says what, query adds parameters, fragment points inside the page.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Every href is a URL — learn its parts</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Fragments never reach the server: the browser handles them locally by scrolling to the matching id.</text>
  <rect x="60" y="140" width="150" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="170" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">https://</text>
  <text x="135.0" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle">scheme</text>
  <rect x="215" y="140" width="300" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="231" y="170" font-family="Consolas, monospace" font-size="15" fill="#7ee787">developer.mozilla.org</text>
  <text x="365.0" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7ee787" text-anchor="middle">host</text>
  <rect x="520" y="140" width="235" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="536" y="170" font-family="Consolas, monospace" font-size="15" fill="#ffa657">/en-US/docs/Web/HTML</text>
  <text x="637.5" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffa657" text-anchor="middle">path</text>
  <rect x="760" y="140" width="120" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="776" y="170" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">#links</text>
  <text x="820.0" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d2a8ff" text-anchor="middle">fragment</text>
  <line x1="60" y1="270" x2="300" y2="270" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">?q=html&amp;lang=en — query (server-side parameters)</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Relative URLs ('./about.html', '../img/bug.png') resolve against the current page's URL — they keep working when the site moves.</text>
</svg>
