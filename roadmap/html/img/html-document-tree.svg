<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The document tree</title>
  <desc>The browser parses nesting into a tree of nodes: one html root, exactly one head and one body.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Nesting becomes a tree</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">CSS selectors and JavaScript both navigate this same tree — that is why structure choice matters.</text>
  <rect x="380" y="110" width="160" height="56" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="396" y="140" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">html</text>
  <text x="396" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">root node</text>
  <rect x="180" y="200" width="160" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="196" y="230" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">head</text>
  <text x="196" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">metadata</text>
  <rect x="560" y="200" width="180" height="56" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="576" y="230" font-family="Consolas, monospace" font-size="15" fill="#7ee787">body</text>
  <text x="576" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">visible content</text>
  <rect x="60" y="290" width="150" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="320" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">title</text>
  <text x="76" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">tab text</text>
  <rect x="240" y="290" width="170" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="256" y="320" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">meta</text>
  <text x="256" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">charset, viewport</text>
  <rect x="470" y="290" width="170" height="56" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="486" y="320" font-family="Consolas, monospace" font-size="15" fill="#ffa657">h1</text>
  <text x="486" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">page heading</text>
  <rect x="680" y="290" width="170" height="56" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="696" y="320" font-family="Consolas, monospace" font-size="15" fill="#ffa657">p</text>
  <text x="696" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">paragraph</text>
  <line x1="420" y1="166" x2="292" y2="196" stroke="#7ee787" stroke-width="2"/>
  <polygon points="300,196 291,192 291,200" fill="#7ee787"/>
  <line x1="500" y1="166" x2="612" y2="196" stroke="#7ee787" stroke-width="2"/>
  <polygon points="620,196 611,192 611,200" fill="#7ee787"/>
  <line x1="220" y1="256" x2="132" y2="286" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="140,286 131,282 131,290" fill="#58a6ff"/>
  <line x1="300" y1="256" x2="312" y2="286" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="320,286 311,282 311,290" fill="#58a6ff"/>
  <line x1="620" y1="256" x2="552" y2="286" stroke="#ffa657" stroke-width="2"/>
  <polygon points="560,286 551,282 551,290" fill="#ffa657"/>
  <line x1="680" y1="256" x2="752" y2="286" stroke="#ffa657" stroke-width="2"/>
  <polygon points="760,286 751,282 751,290" fill="#ffa657"/>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Misnested tags produce an unexpected tree — which silently changes what CSS and JavaScript can reach.</text>
</svg>
