<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Block vs inline flow</title>
  <desc>Block elements stack vertically and take full width; inline elements flow inside a line of text like words.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Two layout behaviors in plain HTML</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">This is the CSS-free default every page starts from — the mental model behind the page skeleton.</text>
  <rect x="60" y="120" width="780" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">block: &lt;p&gt;</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">full width, new line, height from content</text>
  <rect x="60" y="190" width="780" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="220" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">block: &lt;p&gt;</text>
  <rect x="60" y="270" width="220" height="50" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="300" font-family="Consolas, monospace" font-size="15" fill="#7ee787">text</text>
  <rect x="300" y="270" width="150" height="50" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="316" y="300" font-family="Consolas, monospace" font-size="15" fill="#ffa657">inline &lt;a&gt;</text>
  <text x="316" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">flows in the line</text>
  <rect x="470" y="270" width="120" height="50" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="486" y="300" font-family="Consolas, monospace" font-size="15" fill="#7ee787">more text</text>
  <rect x="610" y="270" width="160" height="50" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="626" y="300" font-family="Consolas, monospace" font-size="15" fill="#ffa657">inline &lt;strong&gt;</text>
  <text x="60" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">inline boxes ignore width/height and wrap like words</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">A paragraph cannot contain a heading; a heading cannot sit inside a &lt;span&gt;. Content-model rules follow this picture.</text>
</svg>
