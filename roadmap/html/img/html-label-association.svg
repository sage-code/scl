<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Labeling a control</title>
  <desc>A label tells every user what a control is for — click the label, focus moves to the control; screen readers read it aloud.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Three ways to label — two are correct</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">An input without an accessible name is announced as 'edit text' — the fastest way to fail an accessibility audit.</text>
  <rect x="60" y="120" width="380" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">explicit: for + id</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">best: works across the document</text>
  <text x="80" y="165" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">&lt;label for="em"&gt;Email&lt;/label&gt;</text>
  <rect x="480" y="120" width="380" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="496" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">implicit: wrap the control</text>
  <text x="496" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">good: one label per control</text>
  <text x="500" y="165" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">&lt;label&gt;Email &lt;input ...&gt;&lt;/label&gt;</text>
  <rect x="60" y="240" width="380" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="76" y="270" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">aria-label</text>
  <text x="76" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">last resort: invisible to sighted users</text>
  <text x="80" y="285" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">&lt;input aria-label="Email"&gt;</text>
  <rect x="480" y="240" width="380" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="496" y="270" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">anti-pattern: placeholder</text>
  <text x="496" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">vanishes on input — not a label</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Group related controls with fieldset + legend (radio sets, addresses) — the legend becomes the group's accessible name.</text>
</svg>
