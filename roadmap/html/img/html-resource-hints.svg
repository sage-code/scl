<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Loading attributes and resource hints</title>
  <desc>defer, async, preload, prefetch, and preconnect each answer a different question about a resource.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">The right tool per resource</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Ask: does the page need this to render, to become interactive, or only later — maybe never?</text>
  <rect x="60" y="110" width="260" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#7ee787">defer</text>
  <text x="350" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">scripts: parse continues, run in order at the end</text>
  <rect x="60" y="154" width="260" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="184" font-family="Consolas, monospace" font-size="15" fill="#7ee787">async</text>
  <text x="350" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">scripts: run when ready — order not guaranteed (analytics)</text>
  <rect x="60" y="198" width="260" height="40" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="228" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">rel="preload"</text>
  <text x="350" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">fetch something THIS page definitely needs soon</text>
  <rect x="60" y="242" width="260" height="40" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="272" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">rel="prefetch"</text>
  <text x="350" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">fetch for the NEXT navigation, idle time</text>
  <rect x="60" y="286" width="260" height="40" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="316" font-family="Consolas, monospace" font-size="15" fill="#ffa657">rel="preconnect"</text>
  <text x="350" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">warm up DNS+TLS to a third-party origin</text>
  <rect x="60" y="330" width="260" height="40" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="360" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">loading="lazy"</text>
  <text x="350" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">images/iframes: fetch when near the viewport</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Preloading something the page barely uses steals bandwidth from the CSS that blocks paint — hints are a budget.</text>
</svg>
