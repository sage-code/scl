<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Table anatomy</title>
  <desc>A data table has a caption, column definitions, and three row groups: thead, tbody, and tfoot.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Tables describe data — they are not layout</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Each part has a job; skipping the parts is what makes tables unreadable to assistive technology.</text>
  <rect x="60" y="110" width="520" height="44" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">&lt;caption&gt;</text>
  <text x="76" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">title of the table, read first</text>
  <rect x="60" y="160" width="520" height="60" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="190" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;thead&gt;</text>
  <text x="76" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">column headers — &lt;th scope="col"&gt;</text>
  <rect x="60" y="226" width="520" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="256" font-family="Consolas, monospace" font-size="15" fill="#7ee787">&lt;tbody&gt;</text>
  <text x="76" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the actual data rows</text>
  <rect x="60" y="292" width="520" height="44" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="322" font-family="Consolas, monospace" font-size="15" fill="#ffa657">&lt;tfoot&gt;</text>
  <text x="76" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">totals / summary rows</text>
  <rect x="620" y="160" width="260" height="176" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="636" y="190" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">&lt;colgroup&gt;</text>
  <text x="636" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">per-column styling hooks (width, borders) — presentational only</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Screen readers reconstruct the table from these groups: a th without scope or a table without caption loses its map.</text>
</svg>
