<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The validation workflow</title>
  <desc>Validate early, validate often: the W3C validator catches unclosed tags, bad nesting, and broken attributes in seconds.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">A loop, not a final step</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Valid HTML is the cheapest bug prevention in web development — most rendering bugs are invalid nesting.</text>
  <rect x="60" y="120" width="240" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">1. author</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">write the page</text>
  <rect x="340" y="120" width="240" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="356" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">2. validate</text>
  <text x="356" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">validator.w3.org or Nu</text>
  <rect x="620" y="120" width="240" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="636" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">3. fix</text>
  <text x="636" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">errors first, then warnings</text>
  <line x1="306" y1="155" x2="328" y2="155" stroke="#7ee787" stroke-width="2"/>
  <polygon points="336,155 327,151 327,159" fill="#7ee787"/>
  <line x1="586" y1="155" x2="608" y2="155" stroke="#7ee787" stroke-width="2"/>
  <polygon points="616,155 607,151 607,159" fill="#7ee787"/>
  <line x1="740" y1="196" x2="172" y2="310" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="180,310 171,306 171,314" fill="#d2a8ff"/>
  <text x="460.0" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">regression: re-run on every change</text>
  <line x1="180" y1="310" x2="172" y2="196" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="180,196 171,192 171,200" fill="#d2a8ff"/>
  <rect x="340" y="260" width="240" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="356" y="290" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">4. audit</text>
  <text x="356" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Lighthouse + aXe for a11y and perf</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">CI tip: the Nu validator ships a local Docker image and an API — validation can be a build step, not a memory.</text>
</svg>
