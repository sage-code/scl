<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The constraint validation pipeline</title>
  <desc>Attributes declare the rules; the browser enforces them before any network request and exposes the state to CSS and JS.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Declare rules where the data lives</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">required, minlength, maxlength, min, max, step, pattern — the browser checks them all before submit.</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">&lt;input type="email" name="em" required</text>
  <text x="90" y="148" font-family="Consolas, monospace" font-size="16" fill="#9fb3c8">minlength="5" maxlength="60"</text>
  <text x="90" y="176" font-family="Consolas, monospace" font-size="16" fill="#9fb3c8">pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"</text>
  <text x="60" y="204" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">title="Use a valid email address"&gt;</text>
  <rect x="60" y="240" width="260" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="270" font-family="Consolas, monospace" font-size="15" fill="#7ee787">:valid / :invalid</text>
  <text x="76" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">CSS reacts to the state</text>
  <rect x="360" y="240" width="250" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="376" y="270" font-family="Consolas, monospace" font-size="15" fill="#ffa657">checkValidity()</text>
  <text x="376" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">JS asks the same question</text>
  <rect x="650" y="240" width="220" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="666" y="270" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">validationMessage</text>
  <text x="666" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">localized error text, free</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">novalidate on the form disables this pipeline for custom UI — then JS must reproduce every rule you dropped.</text>
</svg>
