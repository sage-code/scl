<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Debugging HTML in DevTools</title>
  <desc>Elements pane shows the live DOM (not your source), the Console shows parse warnings, Lighthouse audits quality.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Source vs live DOM — know the difference</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The parser repairs mistakes (moves tags, closes elements). The Elements pane shows the repaired result.</text>
  <rect x="60" y="120" width="250" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">Elements</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">live DOM tree, computed styles, a11y pane</text>
  <rect x="340" y="120" width="250" height="90" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="356" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">Console</text>
  <text x="356" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">parse errors, malformed-nesting warnings</text>
  <rect x="620" y="120" width="240" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="636" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">Lighthouse</text>
  <text x="636" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">a11y, SEO, best-practice audits</text>
  <rect x="60" y="250" width="250" height="80" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="280" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">view-source:</text>
  <text x="76" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">what YOU wrote — static text</text>
  <rect x="340" y="250" width="250" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="356" y="280" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">inspector</text>
  <text x="356" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">what the browser KEPT after repair</text>
  <rect x="620" y="250" width="240" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="636" y="280" font-family="Consolas, monospace" font-size="15" fill="#ffa657">diff = parser repair</text>
  <text x="636" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the bug was in your source</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">A table rendering outside its table, or a style bleeding everywhere — check for a stray tag the parser had to relocate.</text>
</svg>
