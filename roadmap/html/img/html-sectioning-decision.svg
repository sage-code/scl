<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>article, section, or div?</title>
  <desc>A decision tree for containers: ask what the content IS, then whether it could carry its own heading in a feed.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Work down the tree</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Div is not a failure — it is the correct answer when the grouping is purely visual.</text>
  <polygon points="460,95.0 590.0,130 460,165.0 330.0,130" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="460" y="135" font-family="Consolas, monospace" font-size="13" fill="#ffa657" text-anchor="middle">self-contained work?</text>
  <polygon points="230,195.0 350.0,230 230,265.0 110.0,230" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="230" y="235" font-family="Consolas, monospace" font-size="13" fill="#7ee787" text-anchor="middle">makes sense in a feed?</text>
  <polygon points="690,195.0 810.0,230 690,265.0 570.0,230" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="690" y="235" font-family="Consolas, monospace" font-size="13" fill="#7ee787" text-anchor="middle">needed for CSS/JS only?</text>
  <rect x="80" y="310" width="280" height="60" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="96" y="340" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;article&gt;</text>
  <text x="96" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">blog post, card, comment, product</text>
  <rect x="400" y="310" width="260" height="60" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="416" y="340" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">&lt;section&gt;</text>
  <text x="416" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">thematic chapter with a heading</text>
  <rect x="700" y="310" width="180" height="60" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="716" y="340" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">&lt;div&gt;</text>
  <text x="716" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">styling or scripting hook</text>
  <line x1="400" y1="168" x2="292" y2="192" stroke="#7ee787" stroke-width="2"/>
  <polygon points="300,192 291,188 291,196" fill="#7ee787"/>
  <text x="350.0" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">yes</text>
  <line x1="520" y1="168" x2="632" y2="192" stroke="#7ee787" stroke-width="2"/>
  <polygon points="640,192 631,188 631,196" fill="#7ee787"/>
  <text x="580.0" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">no</text>
  <line x1="200" y1="268" x2="182" y2="306" stroke="#7ee787" stroke-width="2"/>
  <polygon points="190,306 181,302 181,310" fill="#7ee787"/>
  <text x="195.0" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">yes</text>
  <line x1="300" y1="268" x2="412" y2="306" stroke="#7ee787" stroke-width="2"/>
  <polygon points="420,306 411,302 411,310" fill="#7ee787"/>
  <text x="360.0" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">no</text>
  <line x1="660" y1="268" x2="612" y2="306" stroke="#7ee787" stroke-width="2"/>
  <polygon points="620,306 611,302 611,310" fill="#7ee787"/>
  <text x="640.0" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">no</text>
  <line x1="740" y1="268" x2="752" y2="306" stroke="#7ee787" stroke-width="2"/>
  <polygon points="760,306 751,302 751,310" fill="#7ee787"/>
  <text x="750.0" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">yes</text>
  <text x="60" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">A section without a heading is usually a sign you wanted div — or that the heading is missing.</text>
</svg>
