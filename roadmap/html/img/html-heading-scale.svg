<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The heading scale</title>
  <desc>Six heading levels form an outline, like a book's table of contents. Level by position, not by font size.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">h1 is the page title, h2 its chapters</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Never choose a heading for its size — that is CSS. Assistive technology navigates by this outline.</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="30" fill="#58a6ff">h1</text>
  <text x="150" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#e6edf3">one per page: the subject of the whole document</text>
  <line x1="60" y1="136" x2="860" y2="136" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="170" font-family="Consolas, monospace" font-size="25" fill="#7ee787">h2</text>
  <text x="150" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e6edf3">major sections, in document order</text>
  <line x1="60" y1="186" x2="860" y2="186" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="215" font-family="Consolas, monospace" font-size="22" fill="#ffa657">h3</text>
  <text x="150" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e6edf3">subsections of the h2 above them</text>
  <line x1="60" y1="231" x2="860" y2="231" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="255" font-family="Consolas, monospace" font-size="19" fill="#d2a8ff">h4-h6</text>
  <text x="150" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e6edf3">deeper detail — rarely needed in practice</text>
  <line x1="60" y1="271" x2="860" y2="271" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Skipping levels (h2 straight to h4) breaks the outline screen-reader users navigate by — keep it a ladder.</text>
</svg>
