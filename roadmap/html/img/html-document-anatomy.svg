<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Document anatomy</title>
  <desc>Every page has the same four-part skeleton: doctype, html root, head for metadata, body for content.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">The four parts every page needs</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Omit one and the browser fills in the blanks for you — badly: quirks mode, wrong encoding, no favicon.</text>
  <rect x="60" y="110" width="800" height="46" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">&lt;!DOCTYPE html&gt;</text>
  <text x="76" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">not an element: switches the parser to standards mode</text>
  <rect x="60" y="170" width="800" height="180" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="200" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;html lang="en"&gt;</text>
  <rect x="90" y="205" width="370" height="120" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="106" y="235" font-family="Consolas, monospace" font-size="15" fill="#ffa657">&lt;head&gt;</text>
  <text x="106" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">charset · viewport · title · description · CSS links</text>
  <rect x="490" y="205" width="340" height="120" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="506" y="235" font-family="Consolas, monospace" font-size="15" fill="#7ee787">&lt;body&gt;</text>
  <text x="506" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">everything the user sees and interacts with</text>
  <text x="110" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">machines read here:</text>
  <text x="110" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">browser tabs, search engines,</text>
  <text x="110" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">social cards</text>
  <text x="510" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">people experience here:</text>
  <text x="510" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">text, images, forms,</text>
  <text x="510" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">buttons, media</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">lang on &lt;html&gt; is the highest-value accessibility attribute on the page — screen readers pick a voice from it.</text>
</svg>
