<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Input types are semantics, not skin</title>
  <desc>Each input type brings a tailored keyboard, built-in validation, and a semantic role. Never default to type="text".</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Choosing an input type</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">email shows an @ keyboard on phones; number constrains input; date opens a picker — behavior ships free with the type.</text>
  <rect x="60" y="110" width="300" height="40" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">text</text>
  <text x="390" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">single line, anything goes</text>
  <rect x="60" y="156" width="300" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="186" font-family="Consolas, monospace" font-size="15" fill="#7ee787">email / url / tel</text>
  <text x="390" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">mobile keyboards + format validation</text>
  <rect x="60" y="202" width="300" height="40" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="232" font-family="Consolas, monospace" font-size="15" fill="#ffa657">number / range</text>
  <text x="390" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">spinner / slider with min, max, step</text>
  <rect x="60" y="248" width="300" height="40" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="278" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">date / time / month</text>
  <text x="390" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">native pickers, locale aware</text>
  <rect x="60" y="294" width="300" height="40" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="76" y="324" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">checkbox / radio</text>
  <text x="390" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">on-off and choose-one groups</text>
  <rect x="60" y="340" width="300" height="40" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="370" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">password / hidden</text>
  <text x="390" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">masked input / not displayed, still submitted</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">file, color, and search complete the set — and type="search" gains native clear affordances on some platforms.</text>
</svg>
