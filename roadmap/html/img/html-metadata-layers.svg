<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Metadata layers in &lt;head&gt;</title>
  <desc>Layer 1 makes the page work, layer 2 makes it rank, layer 3 makes it share. Each layer is read by a different machine.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Three audiences, three layers</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Write the layers in this order and audits stop finding duplicates, missing images, and wrong locales.</text>
  <rect x="60" y="110" width="800" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">Layer 1 - function</text>
  <text x="76" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">charset · viewport · title · description · canonical · favicon</text>
  <rect x="60" y="195" width="800" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="225" font-family="Consolas, monospace" font-size="15" fill="#7ee787">Layer 2 - search engines</text>
  <text x="76" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">robots meta · hreflang · structured data (JSON-LD)</text>
  <rect x="60" y="280" width="800" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="310" font-family="Consolas, monospace" font-size="15" fill="#ffa657">Layer 3 - social sharing</text>
  <text x="76" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Open Graph (og:*) · Twitter card tags</text>
  <text x="60" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">layer 1: browsers and crawlers   layer 2: ranking systems   layer 3: link-preview generators</text>
</svg>
