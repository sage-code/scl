<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The ARIA decision flow</title>
  <desc>First rule of ARIA: do not use ARIA. Native HTML already covers 90 percent of widgets and carries none of the maintenance cost.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Ask in order</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">ARIA adds roles and states on top of the accessibility tree — it changes semantics, never behavior.</text>
  <polygon points="250,105.0 400.0,140 250,175.0 100.0,140" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="250" y="145" font-family="Consolas, monospace" font-size="13" fill="#ffa657" text-anchor="middle">does an HTML element exist?</text>
  <polygon points="620,105.0 770.0,140 620,175.0 470.0,140" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="620" y="145" font-family="Consolas, monospace" font-size="13" fill="#7ee787" text-anchor="middle">can you reuse it with ARIA enhancement?</text>
  <rect x="120" y="230" width="260" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="136" y="260" font-family="Consolas, monospace" font-size="15" fill="#7ee787">use the native element</text>
  <text x="136" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">&lt;button&gt;, &lt;a&gt;, &lt;input&gt; — done</text>
  <rect x="480" y="230" width="300" height="60" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="496" y="260" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">native + ARIA attribute</text>
  <text x="496" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">e.g. aria-expanded on a disclosure</text>
  <rect x="760" y="230" width="120" height="60" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="776" y="260" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">full ARIA pattern</text>
  <text x="776" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">grid, tree, tablist + JS wiring</text>
  <line x1="250" y1="176" x2="242" y2="226" stroke="#7ee787" stroke-width="2"/>
  <polygon points="250,226 241,222 241,230" fill="#7ee787"/>
  <text x="250.0" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">yes</text>
  <line x1="430" y1="165" x2="458" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="466,165 457,161 457,169" fill="#7ee787"/>
  <text x="448.0" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">no</text>
  <line x1="620" y1="176" x2="492" y2="226" stroke="#7ee787" stroke-width="2"/>
  <polygon points="500,226 491,222 491,230" fill="#7ee787"/>
  <text x="560.0" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">yes</text>
  <line x1="770" y1="176" x2="812" y2="226" stroke="#7ee787" stroke-width="2"/>
  <polygon points="820,226 811,222 811,230" fill="#7ee787"/>
  <text x="795.0" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">no</text>
  <text x="60" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Roles without behavior are a trap: role="button" on a div still needs tabindex, keydown handlers, and state announcements.</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Prefer: native element &gt; native + ARIA attribute &gt; full ARIA pattern with complete keyboard support.</text>
</svg>
