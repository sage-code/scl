<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Anatomy of a form</title>
  <desc>A form is a contract between the page and the server: method says how, action says where, controls carry the values.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Every control needs a name</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Only controls with a name attribute are submitted — an unnamed input sends nothing, a classic bug.</text>
  <rect x="60" y="110" width="500" height="220" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;form action="/subscribe" method="post"&gt;</text>
  <rect x="90" y="150" width="200" height="50" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="106" y="180" font-family="Consolas, monospace" font-size="15" fill="#ffa657">label</text>
  <text x="106" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">for="email"</text>
  <rect x="320" y="150" width="210" height="50" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="336" y="180" font-family="Consolas, monospace" font-size="15" fill="#7ee787">input</text>
  <text x="336" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">name="email"</text>
  <rect x="90" y="230" width="200" height="50" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="106" y="260" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">button</text>
  <text x="106" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">type="submit"</text>
  <text x="320" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">labels, hints, error slots</text>
  <line x1="560" y1="220" x2="612" y2="220" stroke="#7ee787" stroke-width="2"/>
  <polygon points="620,220 611,216 611,224" fill="#7ee787"/>
  <text x="590.0" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">on submit</text>
  <rect x="620" y="185" width="260" height="70" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="636" y="215" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">server</text>
  <text x="636" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">receives name=value pairs</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">The submitted payload is just name=value pairs (&amp;email=sage%40code.dev) — names are the API of your form.</text>
</svg>
