<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Inert markup: template and dialog</title>
  <desc>template holds HTML the browser parses but does not render; dialog renders on demand with one method call.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">HTML that waits for JavaScript</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Both solve 'UI that exists before it is shown' — without display:none hacks or string concatenation.</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">&lt;template id="row-tpl"&gt;</text>
  <text x="90" y="148" font-family="Consolas, monospace" font-size="16" fill="#9fb3c8">&lt;tr&gt;&lt;td class="name"&gt;&lt;/td&gt;&lt;td class="qty"&gt;&lt;/td&gt;&lt;/tr&gt;</text>
  <text x="60" y="176" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">&lt;/template&gt;</text>
  <text x="60" y="204" font-family="Consolas, monospace" font-size="15" fill="#7ee787">tpl.content.cloneNode(true)  // then fill and append</text>
  <text x="60" y="240" font-family="Consolas, monospace" font-size="16" fill="#d2a8ff">&lt;dialog id="confirm"&gt;…&lt;/dialog&gt;</text>
  <text x="60" y="268" font-family="Consolas, monospace" font-size="15" fill="#7ee787">dlg.showModal()  // focus trap + Esc + ::backdrop, free</text>
  <rect x="480" y="120" width="380" height="100" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="496" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">&lt;template&gt;</text>
  <text x="496" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">inert: images don't load, scripts don't run</text>
  <rect x="480" y="240" width="380" height="100" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="496" y="270" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">&lt;dialog&gt;</text>
  <text x="496" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">top-layer rendering, accessible by default</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Cloning a template beats building HTML strings: no injection risk, and the parser checks your markup once.</text>
</svg>
