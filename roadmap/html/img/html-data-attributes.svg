<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The data-* contract</title>
  <desc>data-* attributes attach machine-readable values to elements without inventing non-standard attributes.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Custom metadata that stays valid</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">dataset in JavaScript mirrors the DOM: data-product-id becomes element.dataset.productId.</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">&lt;tr data-product-id="42" data-stock="low"&gt;</text>
  <text x="90" y="148" font-family="Consolas, monospace" font-size="16" fill="#9fb3c8">&lt;td&gt;Sage seeds&lt;/td&gt;</text>
  <text x="60" y="176" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">&lt;/tr&gt;</text>
  <rect x="60" y="220" width="380" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="250" font-family="Consolas, monospace" font-size="15" fill="#7ee787">HTML side</text>
  <text x="76" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">data-&lt;name&gt;="&lt;value&gt;" — lowercase, no camelCase</text>
  <rect x="480" y="220" width="380" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="496" y="250" font-family="Consolas, monospace" font-size="15" fill="#ffa657">JS side</text>
  <text x="496" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">el.dataset.productId / getAttribute('data-...')</text>
  <line x1="440" y1="260" x2="468" y2="260" stroke="#7ee787" stroke-width="2"/>
  <polygon points="476,260 467,256 467,264" fill="#7ee787"/>
  <text x="458.0" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">the bridge</text>
  <text x="60" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">CSS reads them too: [data-stock="low"] { color: var(--warn) } — state that styles and scripts agree on.</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Never repurpose aria-* or invented attributes: data-* is the standard's own extension point.</text>
</svg>
