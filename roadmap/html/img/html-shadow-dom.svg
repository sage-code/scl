<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Custom elements and Shadow DOM</title>
  <desc>customElements defines new tags; a shadow root gives each one a private DOM and stylesheet scope.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Reusable widgets in vanilla HTML</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The page's CSS cannot leak in, the widget's CSS cannot leak out — encapsulation as a platform feature.</text>
  <rect x="60" y="120" width="300" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">&lt;sage-rating&gt;</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">custom element (JS class)</text>
  <rect x="420" y="120" width="200" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="436" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">shadow root</text>
  <text x="436" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">attachShadow({mode:'open'})</text>
  <rect x="660" y="120" width="200" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="676" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">shadow tree</text>
  <text x="676" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">its own &lt;style&gt;, markup</text>
  <line x1="366" y1="155" x2="408" y2="155" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="416,155 407,151 407,159" fill="#d2a8ff"/>
  <line x1="626" y1="155" x2="648" y2="155" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="656,155 647,151 647,159" fill="#58a6ff"/>
  <rect x="60" y="240" width="380" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="270" font-family="Consolas, monospace" font-size="15" fill="#ffa657">light DOM</text>
  <text x="76" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">what the page writes: &lt;sage-rating&gt;…&lt;/sage-rating&gt;</text>
  <rect x="480" y="240" width="380" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="496" y="270" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">slot</text>
  <text x="496" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">where the light DOM renders inside the shadow tree</text>
  <line x1="250" y1="240" x2="552" y2="200" stroke="#ffa657" stroke-width="2"/>
  <polygon points="560,200 551,196 551,204" fill="#ffa657"/>
  <text x="405.0" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">projected via &lt;slot&gt;</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Frameworks wrap these ideas; the platform versions need no build step and interoperate with all of them.</text>
</svg>
