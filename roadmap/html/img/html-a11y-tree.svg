<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The accessibility tree</title>
  <desc>The browser derives an accessibility tree from the DOM plus ARIA; assistive technology reads that tree, not your HTML.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Screen readers never see your tags</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Semantics in, semantics out: a div-based button is invisible as a button unless ARIA recreates what HTML gives for free.</text>
  <rect x="60" y="130" width="220" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="160" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">DOM</text>
  <text x="76" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">your HTML elements</text>
  <rect x="350" y="130" width="230" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="366" y="160" font-family="Consolas, monospace" font-size="15" fill="#ffa657">accessibility tree</text>
  <text x="366" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">names, roles, states</text>
  <rect x="650" y="130" width="230" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="666" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">assistive tech</text>
  <text x="666" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">screen reader, switch, braille</text>
  <line x1="286" y1="165" x2="338" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="346,165 337,161 337,169" fill="#7ee787"/>
  <line x1="586" y1="165" x2="638" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="646,165 637,161 637,169" fill="#7ee787"/>
  <rect x="350" y="250" width="230" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="366" y="280" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">name + role + value</text>
  <text x="366" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">what every widget must expose</text>
  <line x1="465" y1="200" x2="457" y2="246" stroke="#ffa657" stroke-width="2"/>
  <polygon points="465,246 456,242 456,250" fill="#ffa657"/>
  <text x="60" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Native elements win: a real &lt;button&gt; carries role, focus, and keyboard behavior with zero extra code.</text>
</svg>
