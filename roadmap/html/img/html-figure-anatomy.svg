<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Figure and caption</title>
  <desc>figure marks self-contained content referenced from the text; figcaption is its visible, machine-readable caption.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Content that could stand alone</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">A figure can move to an appendix without breaking the surrounding paragraphs — that is the test.</text>
  <rect x="120" y="110" width="420" height="200" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="136" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;figure&gt;</text>
  <rect x="150" y="150" width="360" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="166" y="180" font-family="Consolas, monospace" font-size="15" fill="#7ee787">img / code / table / chart</text>
  <text x="166" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">any flow content</text>
  <rect x="150" y="260" width="360" height="40" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="166" y="290" font-family="Consolas, monospace" font-size="15" fill="#ffa657">&lt;figcaption&gt;</text>
  <text x="166" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">caption — first or last child</text>
  <rect x="600" y="110" width="280" height="200" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="616" y="140" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">the surrounding &lt;p&gt;</text>
  <text x="616" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">text refers to 'figure 1'</text>
  <line x1="546" y1="210" x2="588" y2="210" stroke="#7ee787" stroke-width="2"/>
  <polygon points="596,210 587,206 587,214" fill="#7ee787"/>
  <text x="571.0" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">referenced by</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">figcaption is announced with the image by screen readers — it complements alt text, it does not replace it.</text>
</svg>
