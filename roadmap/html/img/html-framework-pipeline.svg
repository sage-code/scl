<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Where HTML lives in a framework stack</title>
  <desc>Components, templates, and JSX all compile down to HTML — the framework is a build step for markup, not a replacement for it.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Everything compiles to markup</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Whoever writes the template decides the landmarks, the alt text, and the labels. That author is you.</text>
  <rect x="60" y="120" width="190" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">component</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">React/Vue/Svelte source</text>
  <rect x="290" y="120" width="200" height="90" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="306" y="150" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">compiler</text>
  <text x="306" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">template -&gt; render code</text>
  <rect x="530" y="120" width="180" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="546" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">HTML output</text>
  <text x="546" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the real DOM the user gets</text>
  <rect x="750" y="120" width="130" height="90" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="766" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">browser</text>
  <text x="766" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">parse + paint</text>
  <line x1="256" y1="165" x2="278" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="286,165 277,161 277,169" fill="#7ee787"/>
  <line x1="496" y1="165" x2="518" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="526,165 517,161 517,169" fill="#7ee787"/>
  <line x1="716" y1="165" x2="738" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="746,165 737,161 737,169" fill="#7ee787"/>
  <rect x="60" y="260" width="380" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="290" font-family="Consolas, monospace" font-size="15" fill="#7ee787">what survives the trip</text>
  <text x="76" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">semantic tags, alt, labels, roles</text>
  <rect x="480" y="260" width="400" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="496" y="290" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">what gets lost</text>
  <text x="496" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">div soup, missing alt, div-buttons</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Audit the OUTPUT, not the source: view-source and the a11y pane judge what actually ships.</text>
</svg>
