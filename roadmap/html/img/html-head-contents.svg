<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>What belongs in &lt;head&gt;</title>
  <desc>The head is a machine-facing briefing: identity first, behavior second, and only the resources you need.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Head inventory, in the order to write it</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Charset must be within the first 1024 bytes — put it first and never think about it again.</text>
  <rect x="60" y="110" width="230" height="40" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">meta charset</text>
  <text x="320" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">UTF-8 character encoding — first, always</text>
  <rect x="60" y="154" width="230" height="40" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="184" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">meta viewport</text>
  <text x="320" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">responsive scaling on phones</text>
  <rect x="60" y="198" width="230" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="228" font-family="Consolas, monospace" font-size="15" fill="#7ee787">title</text>
  <text x="320" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">tab text, bookmark label, top SEO signal</text>
  <rect x="60" y="242" width="230" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="272" font-family="Consolas, monospace" font-size="15" fill="#7ee787">meta description</text>
  <text x="320" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">search-result snippet (not a ranking factor)</text>
  <rect x="60" y="286" width="230" height="40" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="316" font-family="Consolas, monospace" font-size="15" fill="#ffa657">link rel=stylesheet</text>
  <text x="320" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">CSS — render-blocking, so keep it small</text>
  <rect x="60" y="330" width="230" height="40" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="76" y="360" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">script defer</text>
  <text x="320" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">JS — defer keeps HTML parsing uninterrupted</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Favicon, canonical, and social tags also live here — the metadata chapter covers the full SEO and social set.</text>
</svg>
