<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>SSR and hydration</title>
  <desc>Server-side rendering ships complete HTML; hydration attaches event listeners so the same markup becomes a live app.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">The same page, twice</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Phase 1 is instant HTML (paint now); phase 2 is the framework waking it up (interact later).</text>
  <rect x="60" y="120" width="260" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">1. server renders</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">template -&gt; full HTML string</text>
  <rect x="360" y="120" width="240" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="376" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">2. browser paints</text>
  <text x="376" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">content visible before JS</text>
  <rect x="640" y="120" width="220" height="90" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="656" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">3. hydration</text>
  <text x="656" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">JS binds listeners + state</text>
  <line x1="326" y1="165" x2="348" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="356,165 347,161 347,169" fill="#7ee787"/>
  <line x1="606" y1="165" x2="628" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="636,165 627,161 627,169" fill="#7ee787"/>
  <rect x="360" y="260" width="240" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="376" y="290" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">before hydration</text>
  <text x="376" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">static: links work, buttons don't</text>
  <rect x="640" y="260" width="220" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="656" y="290" font-family="Consolas, monospace" font-size="15" fill="#7ee787">after</text>
  <text x="656" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">fully interactive SPA</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Hydration mismatch bugs come from the server and client producing different HTML — semantics again, not styling.</text>
</svg>
