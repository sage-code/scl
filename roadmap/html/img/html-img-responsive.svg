<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Responsive images with srcset</title>
  <desc>srcset offers candidate files; sizes tells the browser how wide the image will render. The browser picks the best file.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">One &lt;img&gt;, several candidate files</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">You describe the options; the browser decides using viewport width, DPI, and user settings like data-saver.</text>
  <text x="60" y="120" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">&lt;img src="photo-800.jpg"</text>
  <text x="90" y="148" font-family="Consolas, monospace" font-size="16" fill="#9fb3c8">srcset="photo-400.jpg 400w, photo-800.jpg 800w, photo-1600.jpg 1600w"</text>
  <text x="90" y="176" font-family="Consolas, monospace" font-size="16" fill="#9fb3c8">sizes="(max-width: 600px) 100vw, 50vw"</text>
  <text x="60" y="204" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">alt="A ladybug on a leaf"&gt;</text>
  <rect x="60" y="240" width="260" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="270" font-family="Consolas, monospace" font-size="15" fill="#7ee787">phone 400px wide</text>
  <text x="76" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">100vw -&gt; picks 400w file</text>
  <rect x="350" y="240" width="260" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="366" y="270" font-family="Consolas, monospace" font-size="15" fill="#ffa657">laptop, 2x screen</text>
  <text x="366" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">50vw of 1440px -&gt; 1600w file</text>
  <rect x="640" y="240" width="240" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="656" y="270" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">retina + data saver</text>
  <text x="656" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">may pick smaller anyway</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">The 'w' values are real pixel widths of the files, and sizes is a layout promise — measure the rendered slot, then write it.</text>
</svg>
