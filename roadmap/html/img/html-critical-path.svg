<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The critical rendering path</title>
  <desc>HTML and CSS must both arrive before first paint; JavaScript is the only one that can wait.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">What the browser cannot paint without</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Every resource in &lt;head&gt; is on this path. Moving things off it is what 'performance' means for HTML authors.</text>
  <rect x="60" y="120" width="220" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">HTML</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the dependency root — always critical</text>
  <rect x="340" y="120" width="220" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="356" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">CSS</text>
  <text x="356" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">critical: no paint before CSSOM</text>
  <rect x="620" y="120" width="220" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="636" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">defer JS</text>
  <text x="636" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">non-critical: download parallel, run later</text>
  <rect x="200" y="260" width="220" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="216" y="290" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">render tree</text>
  <text x="216" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">DOM + CSSOM</text>
  <rect x="470" y="260" width="200" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="486" y="290" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">layout</text>
  <text x="486" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">geometry for every box</text>
  <rect x="710" y="260" width="150" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="726" y="290" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">paint</text>
  <text x="726" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">pixels</text>
  <line x1="286" y1="200" x2="272" y2="256" stroke="#7ee787" stroke-width="2"/>
  <polygon points="280,256 271,252 271,260" fill="#7ee787"/>
  <line x1="450" y1="200" x2="437" y2="256" stroke="#ffa657" stroke-width="2"/>
  <polygon points="445,256 436,252 436,260" fill="#ffa657"/>
  <line x1="430" y1="295" x2="458" y2="295" stroke="#7ee787" stroke-width="2"/>
  <polygon points="466,295 457,291 457,299" fill="#7ee787"/>
  <line x1="676" y1="295" x2="698" y2="295" stroke="#7ee787" stroke-width="2"/>
  <polygon points="706,295 697,291 697,299" fill="#7ee787"/>
  <line x1="730" y1="200" x2="782" y2="256" stroke="#7ee787" stroke-width="2"/>
  <polygon points="790,256 781,252 781,260" fill="#7ee787"/>
  <text x="760.0" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">runs after parse</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">An HTML-only page still needs its CSS to paint — inlining the tiny critical CSS beats a 200KB framework reset.</text>
</svg>
