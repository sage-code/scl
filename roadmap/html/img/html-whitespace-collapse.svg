<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Whitespace collapsing</title>
  <desc>Runs of spaces, tabs, and newlines in source HTML render as one space. Indentation is for readers, not layout.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">The browser forgets your formatting</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Layout is a job for CSS. Source whitespace only carries meaning inside special elements like &lt;pre&gt;.</text>
  <rect x="60" y="120" width="380" height="120" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">what you write</text>
  <text x="80" y="155" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;p&gt;</text>
  <text x="100" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e6edf3">Hello    spaces</text>
  <text x="100" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e6edf3">and newlines</text>
  <text x="80" y="240" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">&lt;/p&gt;</text>
  <line x1="470" y1="180" x2="512" y2="180" stroke="#7ee787" stroke-width="2"/>
  <polygon points="520,180 511,176 511,184" fill="#7ee787"/>
  <text x="495.0" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">renders as</text>
  <rect x="550" y="120" width="320" height="120" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="566" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">what the user sees</text>
  <text x="570" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e6edf3">Hello spaces and newlines</text>
  <text x="570" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">single spaces; breaks ignored</text>
  <text x="60" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Exception: &lt;pre&gt; keeps every space and newline — the right home for code samples and ASCII diagrams.</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Wide indentation can therefore never break the page — but it must not replace real layout either.</text>
</svg>
