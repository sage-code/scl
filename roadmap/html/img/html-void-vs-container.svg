<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Container vs void vs boolean attribute</title>
  <desc>Three shapes cover almost every element: containers with content, void elements with none, and attributes whose presence is the value.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Three element shapes</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Learn to classify an element at a glance; each shape has different writing rules.</text>
  <rect x="60" y="130" width="260" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">Container</text>
  <text x="76" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">&lt;p&gt;…&lt;/p&gt; &lt;div&gt;…&lt;/div&gt;</text>
  <rect x="360" y="130" width="260" height="90" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="376" y="160" font-family="Consolas, monospace" font-size="15" fill="#ffa657">Void</text>
  <text x="376" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">&lt;br&gt; &lt;hr&gt; &lt;img&gt; &lt;input&gt;</text>
  <rect x="660" y="130" width="220" height="90" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="676" y="160" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">Boolean attribute</text>
  <text x="676" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">&lt;video autoplay&gt;</text>
  <text x="60" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">has content and a closing tag;</text>
  <text x="60" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">the closing tag is not optional</text>
  <text x="360" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">cannot hold content — writing</text>
  <text x="360" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">&lt;br&gt;&lt;/br&gt; is invalid HTML</text>
  <text x="660" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">present = true, absent = false;</text>
  <text x="660" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">autoplay="autoplay" is redundant</text>
  <rect x="60" y="300" width="520" height="34" fill="#e6edf3" rx="6"/>
  <text x="74" y="322" font-family="Consolas, monospace" font-size="14" fill="#0d1117" font-weight="bold">&lt;input type="checkbox" checked&gt;</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Self-closing slashes on void elements (&lt;br/&gt;) are allowed but meaningless in HTML5 — plain &lt;br&gt; is idiomatic.</text>
</svg>
