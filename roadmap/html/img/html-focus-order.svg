<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Focus order and tabindex</title>
  <desc>Keyboard users move in DOM order. tabindex 0 joins the natural order; positive values break it; negative removes from tabbing.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Tab follows the source, not the layout</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">CSS can move anything anywhere visually — the tab ring still walks the DOM. Keep the DOM order logical.</text>
  <rect x="60" y="130" width="180" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">1</text>
  <text x="76" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">nav link</text>
  <rect x="270" y="130" width="180" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="286" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">2</text>
  <text x="286" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">search input</text>
  <rect x="480" y="130" width="180" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="496" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">3</text>
  <text x="496" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">search button</text>
  <rect x="690" y="130" width="190" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="706" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">4</text>
  <text x="706" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">main content link</text>
  <rect x="60" y="240" width="260" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="270" font-family="Consolas, monospace" font-size="15" fill="#ffa657">tabindex="0"</text>
  <text x="76" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">join natural order (custom widgets)</text>
  <rect x="360" y="240" width="260" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="376" y="270" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">tabindex="-1"</text>
  <text x="376" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">focusable by JS, not by Tab (modals)</text>
  <rect x="660" y="240" width="220" height="70" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="676" y="270" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">tabindex="1+"</text>
  <text x="676" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">breaks order — never ship this</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Visible focus is not optional: :focus-visible styles keep the ring; outline: none without replacement fails WCAG 2.4.7.</text>
</svg>
