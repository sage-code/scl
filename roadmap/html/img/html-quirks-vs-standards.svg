<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Quirks mode vs standards mode</title>
  <desc>The doctype is a parser switch: without it, the browser emulates 1998 layout bugs that no modern CSS expects.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">One line decides which engine you get</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">document.compatMode tells you where you are — 'CSS1Compat' is the only mode worth shipping.</text>
  <rect x="60" y="120" width="400" height="130" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">missing / old doctype</text>
  <text x="80" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ff7b72">quirks mode</text>
  <text x="80" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">box-sizing inconsistencies</text>
  <text x="80" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">different table and image baseline rules</text>
  <text x="80" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">JS feature detection lies</text>
  <rect x="500" y="120" width="360" height="130" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="516" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">&lt;!DOCTYPE html&gt;</text>
  <text x="520" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7ee787">standards mode</text>
  <text x="520" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">spec-compliant rendering</text>
  <text x="520" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">same behavior across browsers</text>
  <text x="520" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">the only mode DevTools assumes</text>
  <text x="60" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">In DevTools the docmode tooltip shows the mode; if it says quirks, stop debugging CSS and fix the doctype first.</text>
  <text x="60" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">XML mode (application/xhtml+xml) is a third path with stricter parsing — rare, and unforgiving of one bad tag.</text>
</svg>
