<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 03 - Text and Headings</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    kbd { background: #161b22; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Text and Headings</h1>

  <!-- Headings form the outline: h1 -> h2 -> h3, never skip a level -->
  <h2>Inline semantics</h2>
  <p>You <strong>must</strong> validate, and you should <em>always</em> preview.
     Press <kbd>Ctrl</kbd>+<kbd>S</kbd>, run <code>npm run build</code>,
     and expect <samp>Build complete</samp>.</p>

  <h2>Quotations</h2>
  <!-- blockquote quotes a passage; q quotes inline; cite names a work -->
  <blockquote cite="https://html.spec.whatwg.org/">
    <p>HTML is the foundation of the Web.</p>
  </blockquote>
  <p>My favorite reference is <cite>HTML Living Standard</cite>.</p>

  <h2>Abbreviations and time</h2>
  <!-- abbr spells out on hover; time is machine-readable -->
  <p><abbr title="HyperText Markup Language">HTML</abbr> started in
     <time datetime="1993">1993</time>.</p>
</body>
</html>
