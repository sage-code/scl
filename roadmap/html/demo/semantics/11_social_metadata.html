<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The three metadata layers, in the order machines read them -->
  <title>Demo 11 - Social Metadata</title>

  <!-- Layer 1: function -->
  <meta name="description" content="A demo page with complete layer-1, layer-2 and layer-3 head metadata.">
  <link rel="canonical" href="https://example.com/demo/social-metadata">

  <!-- Layer 2: search engines -->
  <meta name="robots" content="index, follow">

  <!-- Layer 3: social sharing (og:image wants an ABSOLUTE url) -->
  <meta property="og:title" content="Social Metadata Demo">
  <meta property="og:description" content="What crawlers read when you share a link.">
  <meta property="og:image" content="https://sagecode.org/images/SageCode.jpg">
  <meta property="og:url" content="https://example.com/demo/social-metadata">
  <meta name="twitter:card" content="summary_large_image">

  <style>body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }</style>
</head>
<body>
  <h1>Social Metadata</h1>
  <p>View this page's source, then paste its URL into the Facebook Sharing
     Debugger to see the card the og: tags build.</p>
</body>
</html>
