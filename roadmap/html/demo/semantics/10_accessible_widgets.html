<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 10 - Accessible Widgets</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    button { padding: 8px 16px; margin: 4px; }
    /* replace the focus ring; never just remove it */
    :focus-visible { outline: 3px solid #58a6ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Accessible Widgets</h1>

  <h2>Native vs fake</h2>
  <!-- The native button: role, name, focus and keyboard behavior for free -->
  <button type="button" onclick="alert('native button')">Real button</button>

  <!-- The anti-pattern: no role, no name, no keyboard support -->
  <div onclick="alert('div button')" style="display:inline-block; padding:8px 16px; background:#161b22; border-radius:6px;">Div button (bad)</div>

  <h2>Disclosure with state</h2>
  <!-- aria-expanded mirrors the state; the script keeps it in sync -->
  <button id="toggle" aria-expanded="false" aria-controls="panel">Details</button>
  <div id="panel" hidden>
    <p>A real button plus ARIA state: behavior native, semantics honest.</p>
  </div>

  <script>
    const btn = document.getElementById('toggle');
    const panel = document.getElementById('panel');
    btn.addEventListener('click', () => {
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      panel.hidden = open;
    });
  </script>
</body>
</html>
