<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 09 - Semantic Page</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #0d1117; color: #e6edf3; }
    header, nav, footer { padding: 1rem; background: #161b22; }
    main, aside { padding: 1rem; }
    .skip-link { position: absolute; left: -999px; background: #58a6ff; color: #0d1117; padding: 8px; }
    /* the skip link appears when it receives keyboard focus */
    .skip-link:focus { left: 8px; top: 8px; }
  </style>
</head>
<body>
  <!-- First focusable element: jumps past the nav -->
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header>
    <p><strong>My Site</strong></p>
  </header>

  <nav aria-label="Main">
    <ul>
      <li><a href="#main-content">Home</a></li>
      <li><a href="#about">About</a></li>
    </ul>
  </nav>

  <main id="main-content">
    <h1>Semantic Page</h1>
    <article>
      <h2>An article</h2>
      <p>Self-contained: it would make sense in a feed on its own.</p>
    </article>
  </main>

  <aside>
    <h2>Related</h2>
    <p>Side content outside the main flow.</p>
  </aside>

  <footer>
    <p>&copy; 2026 Sage-Code Laboratory</p>
  </footer>
</body>
</html>
