<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 07 - Contact Form</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    label { display: block; margin-top: 1rem; }
    input, textarea { display: block; margin-top: 4px; width: 300px; }
    button { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Contact Form</h1>

  <!-- action/method declare the contract; GET for searches, POST for changes -->
  <form action="/contact" method="post">
    <!-- label for=id: the accessible name. autocomplete helps people fill faster -->
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" autocomplete="name" required>

    <label for="user_email">Email</label>
    <input id="user_email" name="user_email" type="email" autocomplete="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <!-- submit is the default button type inside a form -->
    <button type="submit">Send message</button>
  </form>
</body>
</html>
