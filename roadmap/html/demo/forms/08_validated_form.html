<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 08 - Validated Form</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    label { display: block; margin-top: 1rem; }
    input { display: block; margin-top: 4px; width: 300px; }
    /* :user-invalid only reddens after the user has interacted */
    input:user-invalid { border-color: #ff7b72; }
    input:valid { border-color: #7ee787; }
  </style>
</head>
<body>
  <h1>Validated Form</h1>

  <!-- Rules declared in attributes: the browser enforces them on submit -->
  <form action="/signup" method="post">
    <label for="user">Username (3-20 chars)</label>
    <input id="user" name="user" required minlength="3" maxlength="20">

    <label for="em">Email</label>
    <input id="em" name="em" type="email" required aria-describedby="em-error">
    <!-- visible error slot linked to the field: better than the bubble alone -->
    <p id="em-error" style="color:#ff7b72;">Enter your email as name@example.com</p>

    <label for="guests">Guests (1-8)</label>
    <input id="guests" name="guests" type="number" min="1" max="8" step="1">

    <button type="submit">Sign up</button>
  </form>
</body>
</html>
