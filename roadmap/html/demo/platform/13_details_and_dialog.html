<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 13 - Details and Dialog</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    dialog { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; }
    dialog::backdrop { background: rgba(0,0,0,0.6); }
  </style>
</head>
<body>
  <h1>Details and Dialog</h1>

  <!-- details/summary: a disclosure widget with zero JavaScript -->
  <details>
    <summary>Do I need a framework for this?</summary>
    <p>No. details and summary are the platform's disclosure widget.</p>
  </details>

  <!-- dialog: focus trap, Escape and ::backdrop built in -->
  <button id="open-modal">Open modal</button>
  <dialog id="confirm">
    <p>Delete this item?</p>
    <button id="yes">Delete</button>
    <button id="no">Cancel</button>
  </dialog>

  <script>
    const dlg = document.getElementById('confirm');
    document.getElementById('open-modal').addEventListener('click', () => dlg.showModal());
    document.getElementById('no').addEventListener('click', () => dlg.close());
    document.getElementById('yes').addEventListener('click', () => dlg.close('deleted'));
  </script>
</body>
</html>
