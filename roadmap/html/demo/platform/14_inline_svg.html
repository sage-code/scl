<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 14 - Inline SVG</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    /* SVG nodes are DOM: CSS styles their parts */
    svg .hot { fill: #ffa657; transition: fill 0.2s; }
    svg:hover .hot { fill: #ff7b72; }
  </style>
</head>
<body>
  <h1>Inline SVG</h1>

  <!-- role=img + title: shapes are otherwise invisible to assistive tech -->
  <svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Warning triangle">
    <title>Warning triangle</title>
    <path class="hot" d="M60 10 L110 100 H10 Z"/>
  </svg>

  <p>Hover the triangle: it is a DOM node, so CSS can restyle it —
     impossible with an &lt;img&gt; and pointless with canvas.</p>
</body>
</html>
