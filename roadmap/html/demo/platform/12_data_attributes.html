<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 12 - Data Attributes</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    /* CSS reads data-* too: state both worlds agree on */
    li[data-stock="low"] { color: #ffa657; }
    li[data-stock="out"] { color: #ff7b72; text-decoration: line-through; }
  </style>
</head>
<body>
  <h1>Data Attributes</h1>

  <ul id="stock">
    <li data-product-id="1" data-stock="ok">Sage seeds</li>
    <li data-product-id="2" data-stock="low">Rosemary seeds</li>
    <li data-product-id="3" data-stock="out">Basil seeds</li>
  </ul>

  <p id="pick">Click a row.</p>

  <script>
    // dataset mirrors the DOM: data-product-id -> dataset.productId
    document.getElementById('stock').addEventListener('click', (event) => {
      const li = event.target.closest('li');
      if (!li) return;
      document.getElementById('pick').textContent =
        'Product #' + li.dataset.productId + ' — stock: ' + li.dataset.stock;
    });
  </script>
</body>
</html>
