<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 06 - Data Table</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #30363d; padding: 6px 12px; text-align: left; }
  </style>
</head>
<body>
  <h1>Data Table</h1>

  <!-- A correct table: caption first, th with scope, then data rows -->
  <table>
    <caption>Greenhouse temperatures, March 2026</caption>
    <thead>
      <tr>
        <th scope="col">Week</th>
        <th scope="col">Day temp</th>
        <th scope="col">Night temp</th>
      </tr>
    </thead>
    <tbody>
      <tr><th scope="row">Week 1</th><td>22&deg;C</td><td>14&deg;C</td></tr>
      <tr><th scope="row">Week 2</th><td>24&deg;C</td><td>15&deg;C</td></tr>
      <tr><th scope="row">Week 3</th><td>21&deg;C</td><td>13&deg;C</td></tr>
    </tbody>
    <tfoot>
      <tr><th scope="row">Average</th><td>22.3&deg;C</td><td>14.0&deg;C</td></tr>
    </tfoot>
  </table>
</body>
</html>
