<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 04 - Lists and Links</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <h1>Lists and Links</h1>

  <h2>The three list types</h2>
  <!-- ul: order irrelevant | ol: order IS the meaning | dl: name-value pairs -->
  <ul>
    <li>Unordered: a menu</li>
    <li>Unordered: tags</li>
  </ul>
  <ol>
    <li>Ordered: first step</li>
    <li>Ordered: second step</li>
  </ol>
  <dl>
    <dt>Element</dt>
    <dd>A part of the document tree.</dd>
  </dl>

  <h2>Every anchor job</h2>
  <!-- href decides the job. rel on external links is the security habit -->
  <ul>
    <li><a href="#lists">Fragment: jump to Lists</a></li>
    <li><a href="https://developer.mozilla.org/en-US/docs/Web/HTML"
           target="_blank" rel="noopener noreferrer nofollow">External (new tab)</a></li>
    <li><a href="mailto:hello@example.com">Email us</a></li>
    <li><a href="tel:+40712345678">Call us</a></li>
  </ul>
</body>
</html>
