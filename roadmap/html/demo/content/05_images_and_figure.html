<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 05 - Images and Figure</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    figure { border: 1px solid #30363d; border-radius: 8px; padding: 1rem; max-width: 360px; }
    figcaption { font-size: 0.85rem; color: #9fb3c8; }
  </style>
</head>
<body>
  <h1>Images and Figure</h1>

  <!-- Informative image: alt describes its role, not its pixels -->
  <img src="/roadmap/html/img/ledy-bug.png" alt="Ladybug on a sage leaf"
       width="320" height="240" loading="lazy">

  <!-- Decorative image: empty alt removes it from the reading flow -->
  <img src="/roadmap/html/img/ledy-bug.png" alt="" width="64" height="48">

  <!-- figure: self-contained content with a visible caption -->
  <figure>
    <img src="/roadmap/html/img/ledy-bug.png" alt="Close-up of a ladybug" width="320" height="240">
    <figcaption>Figure 1: the garden's best pest control.</figcaption>
  </figure>
</body>
</html>
