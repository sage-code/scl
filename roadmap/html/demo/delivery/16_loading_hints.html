<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 16 - Loading Hints</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    .slot { background: #161b22; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>Loading Hints</h1>

  <div class="slot">
    <h2>Above the fold: eager</h2>
    <!-- width/height reserve the slot (no layout shift); no lazy here -->
    <img src="/roadmap/html/img/ledy-bug.png" alt="Ladybug on a sage leaf" width="320" height="240">
  </div>

  <div class="slot">
    <h2>Below the fold: lazy</h2>
    <!-- loading=lazy defers the fetch until the element nears the viewport -->
    <img src="/roadmap/html/img/ledy-bug.png" alt="Second ladybug, offscreen" width="320" height="240" loading="lazy">
  </div>

  <div class="slot">
    <h2>Deferred script</h2>
    <!-- defer: download in parallel, run after parsing, in order -->
    <script defer src="data:text/javascript,console.log('deferred script ran after parse')"></script>
    <p>Watch the console: deferred scripts run after the document parses.</p>
  </div>
</body>
</html>
