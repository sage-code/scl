<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 15 - Embed Iframe</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    iframe { border: 1px solid #30363d; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Embed Iframe</h1>

  <!-- The four hygiene attributes: title, sandbox, size, lazy -->
  <iframe src="../../foundations/01_hello_world.html"
          title="Embedded hello world demo"
          width="480" height="240"
          sandbox="allow-scripts"
          loading="lazy"></iframe>

  <p>An iframe embeds a complete second document — here, a sibling demo.
     Its sandbox keeps it from scripting this page.</p>
</body>
</html>
