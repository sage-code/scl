<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="saTitle saDesc">
  <title id="saTitle">Shell anatomy</title>
  <desc id="saDesc">A terminal passes keystrokes to the shell, the shell asks the kernel through syscalls, and the kernel drives the hardware.</desc>

  <!-- Solid canvas -->
  <rect x="0" y="0" width="900" height="280" fill="#0d1117"/>

  <!-- Row of stacked boxes with aligned gaps -->
  <rect x="30" y="105" width="180" height="76" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="120" y="138" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Terminal</text>
  <text x="120" y="161" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">emulator / TTY</text>

  <rect x="270" y="105" width="180" height="76" rx="8" fill="#dbeafe" stroke="#58a6ff" stroke-width="2"/>
  <text x="360" y="138" fill="#0b1220" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Shell (bash)</text>
  <text x="360" y="161" fill="#1f2a37" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">parses &amp; expands</text>

  <rect x="510" y="105" width="180" height="76" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="138" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Kernel</text>
  <text x="600" y="161" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">process / file layer</text>

  <rect x="750" y="105" width="120" height="76" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="810" y="138" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Hardware</text>
  <text x="810" y="161" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">CPU / disk</text>

  <!-- Arrows with gaps, never touching the boxes -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <line x1="214" y1="143" x2="266" y2="143" stroke="#58a6ff" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="454" y1="143" x2="506" y2="143" stroke="#58a6ff" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="694" y1="143" x2="746" y2="143" stroke="#58a6ff" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Labels -->
  <text x="240" y="96" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">keys</text>
  <text x="480" y="96" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">syscalls</text>
  <text x="720" y="96" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">I/O</text>

  <text x="450" y="52" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Who talks to whom</text>
  <text x="450" y="228" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">The shell never touches hardware: it translates your line into programs and system calls.</text>
</svg>
