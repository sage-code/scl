<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="eoTitle eoDesc">
  <title id="eoTitle">Expansion order</title>
  <desc id="eoDesc">Bash expands a command line in eight ordered steps, from brace expansion to quote removal.</desc>

  <rect x="0" y="0" width="900" height="340" fill="#0d1117"/>

  <defs>
    <marker id="ae" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <text x="450" y="42" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Eight expansions, one strict order</text>

  <!-- Row 1 -->
  <rect x="30" y="70" width="196" height="86" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="128" y="98" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1 · brace</text>
  <text x="128" y="123" fill="#e6edf3" font-family="Consolas, monospace" font-size="14" text-anchor="middle">{a,b}.txt</text>

  <rect x="246" y="70" width="196" height="86" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="344" y="98" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2 · tilde</text>
  <text x="344" y="123" fill="#e6edf3" font-family="Consolas, monospace" font-size="14" text-anchor="middle">~/bin</text>

  <rect x="462" y="70" width="196" height="86" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="560" y="98" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3 · parameter</text>
  <text x="560" y="123" fill="#e6edf3" font-family="Consolas, monospace" font-size="14" text-anchor="middle">$HOME</text>

  <rect x="678" y="70" width="192" height="86" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="774" y="98" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4 · command</text>
  <text x="774" y="123" fill="#e6edf3" font-family="Consolas, monospace" font-size="14" text-anchor="middle">$(date)</text>

  <!-- Row arrow -->
  <line x1="450" y1="162" x2="450" y2="190" stroke="#58a6ff" stroke-width="2" marker-end="url(#ae)"/>

  <!-- Row 2 -->
  <rect x="30" y="198" width="196" height="86" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="128" y="226" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5 · arithmetic</text>
  <text x="128" y="251" fill="#e6edf3" font-family="Consolas, monospace" font-size="14" text-anchor="middle">$((n+1))</text>

  <rect x="246" y="198" width="196" height="86" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="344" y="226" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">6 · word splitting</text>
  <text x="344" y="251" fill="#e6edf3" font-family="Consolas, monospace" font-size="13" text-anchor="middle">$IFS</text>

  <rect x="462" y="198" width="196" height="86" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="560" y="226" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">7 · globbing</text>
  <text x="560" y="251" fill="#e6edf3" font-family="Consolas, monospace" font-size="14" text-anchor="middle">*.log</text>

  <rect x="678" y="198" width="192" height="86" rx="8" fill="#dbeafe" stroke="#58a6ff" stroke-width="2"/>
  <text x="774" y="226" fill="#0b1220" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">8 · quote removal</text>
  <text x="774" y="251" fill="#1f2a37" font-family="Consolas, monospace" font-size="13" text-anchor="middle">remove \ and quotes</text>

  <text x="450" y="318" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">Quoting decides which steps see your text — that is why quoting changes meaning.</text>
</svg>
