<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="plTitle plDesc">
  <title id="plTitle">Pipeline and streams</title>
  <desc id="plDesc">Three commands connected by pipes; stdout flows left to right while stderr is redirected separately.</desc>

  <rect x="0" y="0" width="900" height="300" fill="#0d1117"/>

  <defs>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#58a6ff"/>
    </marker>
    <marker id="apr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#f0883e"/>
    </marker>
  </defs>

  <text x="450" y="42" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">A pipeline connects stdout to stdin</text>

  <text x="60" y="128" fill="#9db4cc" font-family="Consolas, monospace" font-size="13" text-anchor="middle">stdin</text>
  <line x1="20" y1="150" x2="88" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#ap)"/>

  <rect x="95" y="112" width="190" height="76" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="190" y="145" fill="#e6edf3" font-family="Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">cat access.log</text>
  <text x="190" y="168" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">writes stdout</text>

  <rect x="355" y="112" width="190" height="76" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="450" y="145" fill="#e6edf3" font-family="Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">grep " 500 "</text>
  <text x="450" y="168" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">filters lines</text>

  <rect x="615" y="112" width="190" height="76" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="710" y="145" fill="#e6edf3" font-family="Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">wc -l</text>
  <text x="710" y="168" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">counts lines</text>

  <!-- Pipe symbols with gaps -->
  <text x="322" y="157" fill="#7ee787" font-family="Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle">|</text>
  <text x="582" y="157" fill="#7ee787" font-family="Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle">|</text>

  <line x1="288" y1="150" x2="306" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="548" y1="150" x2="566" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="808" y1="150" x2="878" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#ap)"/>
  <text x="845" y="128" fill="#9db4cc" font-family="Consolas, monospace" font-size="13" text-anchor="middle">stdout</text>

  <!-- stderr branch -->
  <line x1="190" y1="192" x2="190" y2="232" stroke="#f0883e" stroke-width="2" marker-end="url(#apr)"/>
  <rect x="95" y="236" width="190" height="44" rx="8" fill="#3a2a1a" stroke="#f0883e" stroke-width="2"/>
  <text x="190" y="263" fill="#ffd8a8" font-family="Consolas, monospace" font-size="13" text-anchor="middle">2&gt;&amp;1 → stderr</text>

  <text x="610" y="258" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">Each program sees fd 0, 1 and 2 — pipes only rewire fd 1.</text>
</svg>
