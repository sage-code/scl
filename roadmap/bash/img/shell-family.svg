<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="sfTitle sfDesc">
  <title id="sfTitle">Shell family tree</title>
  <desc id="sfDesc">The Bourne family (sh, dash, ash, ksh, zsh, bash) versus independent shells (csh, fish) and Windows shells (PowerShell, cmd).</desc>

  <rect x="0" y="0" width="900" height="380" fill="#0d1117"/>

  <defs>
    <marker id="af" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect x="360" y="40" width="180" height="62" rx="8" fill="#dbeafe" stroke="#58a6ff" stroke-width="2"/>
  <text x="450" y="68" fill="#0b1220" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Bourne sh</text>
  <text x="450" y="89" fill="#1f2a37" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">1979 · POSIX basis</text>

  <!-- Second row: five descendants -->
  <rect x="30" y="170" width="156" height="66" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="108" y="198" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">dash</text>
  <text x="108" y="219" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">fast /bin/sh</text>

  <rect x="206" y="170" width="156" height="66" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="284" y="198" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">ash</text>
  <text x="284" y="219" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">BusyBox / embedded</text>

  <rect x="382" y="170" width="156" height="66" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="460" y="198" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">ksh</text>
  <text x="460" y="219" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">KornShell</text>

  <rect x="558" y="170" width="156" height="66" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="636" y="198" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">zsh</text>
  <text x="636" y="219" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">macOS default</text>

  <rect x="734" y="170" width="136" height="66" rx="8" fill="#dbeafe" stroke="#58a6ff" stroke-width="2"/>
  <text x="802" y="198" fill="#0b1220" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">bash</text>
  <text x="802" y="219" fill="#1f2a37" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">this track</text>

  <!-- Fan-out arrows -->
  <line x1="420" y1="104" x2="108" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#af)"/>
  <line x1="435" y1="104" x2="284" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#af)"/>
  <line x1="450" y1="104" x2="460" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#af)"/>
  <line x1="465" y1="104" x2="636" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#af)"/>
  <line x1="480" y1="104" x2="802" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#af)"/>

  <!-- Independent shells -->
  <text x="450" y="285" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Independent families — same job, different syntax</text>
  <rect x="120" y="305" width="150" height="56" rx="8" fill="#1f2a37" stroke="#8a9bb5" stroke-width="2"/>
  <text x="195" y="339" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">csh / tcsh</text>
  <rect x="300" y="305" width="150" height="56" rx="8" fill="#1f2a37" stroke="#8a9bb5" stroke-width="2"/>
  <text x="375" y="332" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">fish</text>
  <text x="375" y="350" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle">not POSIX</text>
  <rect x="480" y="305" width="170" height="56" rx="8" fill="#1f2a37" stroke="#8a9bb5" stroke-width="2"/>
  <text x="565" y="332" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">PowerShell</text>
  <text x="565" y="350" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle">objects, not text</text>
  <rect x="670" y="305" width="120" height="56" rx="8" fill="#1f2a37" stroke="#8a9bb5" stroke-width="2"/>
  <text x="730" y="339" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">cmd.exe</text>
</svg>
