<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="soTitle soDesc">
  <title id="soTitle">Bash startup order</title>
  <desc id="soDesc">Bash chooses startup files based on whether it is a login shell and whether it is interactive.</desc>

  <rect x="0" y="0" width="900" height="420" fill="#0d1117"/>

  <defs>
    <marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <text x="450" y="40" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Which startup file runs?</text>

  <!-- Decision 1 -->
  <rect x="350" y="62" width="200" height="56" rx="8" fill="#dbeafe" stroke="#58a6ff" stroke-width="2"/>
  <text x="450" y="96" fill="#0b1220" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Login shell? (-l)</text>

  <!-- Yes branch -->
  <line x1="350" y1="90" x2="176" y2="90" stroke="#58a6ff" stroke-width="2" marker-end="url(#as)"/>
  <text x="262" y="82" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">yes</text>

  <rect x="40" y="150" width="272" height="72" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="176" y="180" fill="#e6edf3" font-family="Consolas, monospace" font-size="14" text-anchor="middle">/etc/profile</text>
  <text x="176" y="203" fill="#9db4cc" font-family="Consolas, monospace" font-size="13" text-anchor="middle">~/.bash_profile → ~/.bash_login → ~/.profile</text>

  <line x1="176" y1="118" x2="176" y2="146" stroke="#58a6ff" stroke-width="2" marker-end="url(#as)"/>

  <!-- No branch -->
  <line x1="450" y1="118" x2="450" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#as)"/>
  <text x="470" y="140" fill="#f0883e" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">no</text>

  <rect x="324" y="150" width="200" height="56" rx="8" fill="#dbeafe" stroke="#58a6ff" stroke-width="2"/>
  <text x="424" y="184" fill="#0b1220" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Interactive? (-i)</text>

  <line x1="524" y1="178" x2="640" y2="178" stroke="#58a6ff" stroke-width="2" marker-end="url(#as)"/>
  <text x="582" y="170" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">yes</text>

  <rect x="644" y="150" width="216" height="72" rx="8" fill="#1f2a37" stroke="#58a6ff" stroke-width="2"/>
  <text x="752" y="180" fill="#e6edf3" font-family="Consolas, monospace" font-size="14" text-anchor="middle">/etc/bash.bashrc</text>
  <text x="752" y="203" fill="#9db4cc" font-family="Consolas, monospace" font-size="13" text-anchor="middle">~/.bashrc</text>

  <line x1="424" y1="206" x2="424" y2="248" stroke="#58a6ff" stroke-width="2" marker-end="url(#as)"/>
  <text x="444" y="232" fill="#f0883e" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">no</text>

  <rect x="286" y="252" width="276" height="66" rx="8" fill="#1f2a37" stroke="#8a9bb5" stroke-width="2"/>
  <text x="424" y="280" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">Non-interactive script</text>
  <text x="424" y="303" fill="#9db4cc" font-family="Consolas, monospace" font-size="13" text-anchor="middle">runs $BASH_ENV, else nothing</text>

  <text x="450" y="366" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">Scripts are non-interactive: they never read ~/.bashrc unless you source it themselves.</text>
  <text x="450" y="390" fill="#9db4cc" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">That is why automation must not rely on your aliases or interactive functions.</text>
</svg>
