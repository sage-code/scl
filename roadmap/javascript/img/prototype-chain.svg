<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880">
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#0f172a"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">The prototype chain: a lookup walks up until it finds — or null</text>

  <rect x="120" y="70" width="380" height="70" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="140" y="98" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">const dog = { legs: 4 };</text>
  <text x="140" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">the instance — your own properties live here</text>

  <rect x="120" y="180" width="380" height="70" rx="6" fill="#2b3a55" stroke="#475569"/>
  <text x="140" y="208" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">Dog.prototype = { bark() {…} }</text>
  <text x="140" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">shared by every Dog instance</text>

  <rect x="120" y="290" width="380" height="70" rx="6" fill="#2b3a55" stroke="#475569"/>
  <text x="140" y="318" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">Object.prototype = { toString(), hasOwnProperty()… }</text>
  <text x="140" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">the common ancestor of (almost) all objects</text>

  <path d="M310,140 L310,172" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrP)"/>
  <text x="322" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">__proto__</text>
  <path d="M310,250 L310,282" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrP)"/>
  <text x="322" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">__proto__</text>
  <path d="M310,360 L310,392" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrP)"/>
  <text x="322" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">null — chain ends</text>

  <rect x="580" y="70" width="270" height="180" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="600" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">lookups on dog:</text>
  <text x="600" y="126" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">dog.legs      → level 1 ✓</text>
  <text x="600" y="152" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">dog.bark()    → level 2 ✓</text>
  <text x="600" y="178" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">dog.toString  → level 3 ✓</text>
  <text x="600" y="204" font-family="Consolas, monospace" font-size="13" fill="#ef4444" stroke="none">dog.fly       → undefined</text>
  <text x="600" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">walked the whole chain, found nothing</text>

  <rect x="580" y="290" width="270" height="70" rx="6" fill="#f59e0b"/>
  <text x="595" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a">Object.hasOwn(dog, "legs")</text>
  <text x="595" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a">asks level 1 ONLY — use it to tell</text>
  <text x="595" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a">own properties from inherited ones</text>
</svg>
