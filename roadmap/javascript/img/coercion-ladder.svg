<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760">
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#0f172a"/>
  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">What the + operator decides</text>

  <rect x="60" y="90" width="120" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="120" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#e2e8f0">a + b</text>
  <path d="M180,115 L292,115" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrC)"/>

  <path d="M420,60 L540,115 L420,170 L300,115 Z" fill="#1e293b" stroke="#475569"/>
  <text x="420" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">either operand</text>
  <text x="420" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">is a string?</text>

  <path d="M540,115 L588,84" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrC)"/>
  <text x="556" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">yes</text>
  <rect x="592" y="50" width="150" height="62" rx="6" fill="#f59e0b"/>
  <text x="667" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">join as text</text>
  <text x="667" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">"2" + 3 → "23"</text>

  <path d="M540,115 L588,146" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrC)"/>
  <text x="556" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">no</text>
  <rect x="592" y="140" width="150" height="62" rx="6" fill="#3b82f6"/>
  <text x="667" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">numeric add</text>
  <text x="667" y="188" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">2 + 3 → 5</text>

  <rect x="60" y="240" width="682" height="76" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">== converts first — avoid it</text>
  <text x="80" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">=== compares type AND value: "5" === 5 is false. Use === everywhere.</text>
</svg>
