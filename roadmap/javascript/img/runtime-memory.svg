<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880">
  <rect width="880" height="420" fill="#0f172a"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">The call stack and the heap while descend(3) runs</text>

  <!-- left: call stack -->
  <rect x="60" y="60" width="330" height="330" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3b82f6">CALL STACK — frames, last in / first out</text>

  <rect x="85" y="105" width="280" height="52" rx="4" fill="#334155" stroke="#475569"/>
  <text x="100" y="127" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">descend(3) — waits</text>
  <text x="100" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">added first, finishes last</text>

  <rect x="85" y="167" width="280" height="52" rx="4" fill="#334155" stroke="#475569"/>
  <text x="100" y="189" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">descend(2) — waits</text>
  <text x="100" y="209" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">each frame remembers its depth</text>

  <rect x="85" y="229" width="280" height="52" rx="4" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="100" y="251" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">descend(1) — running</text>
  <text x="100" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dbeafe">top frame: currently executing</text>

  <rect x="85" y="291" width="280" height="52" rx="4" fill="#020617" stroke="#475569" stroke-dasharray="5 4"/>
  <text x="100" y="313" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">descend(0) — next</text>
  <text x="100" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">base case: returns, stack unwinds</text>

  <text x="225" y="374" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">overflow = more frames than the stack allows</text>

  <!-- right: heap -->
  <rect x="490" y="60" width="330" height="330" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="510" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3b82f6">HEAP — objects, unstructured</text>

  <rect x="515" y="110" width="180" height="56" rx="4" fill="#334155" stroke="#475569"/>
  <text x="530" y="132" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">{ value: 100 }</text>
  <text x="530" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">ONE object, two references</text>

  <!-- arrows from variable names to object -->
  <text x="515" y="200" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">heapObject ──┐</text>
  <text x="515" y="222" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">alias ───────┴─→ same box</text>
  <text x="515" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">assignment copies the reference,</text>
  <text x="515" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">never the object</text>

  <rect x="515" y="285" width="180" height="44" rx="4" fill="#020617" stroke="#475569" stroke-dasharray="5 4"/>
  <text x="530" y="305" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">{ leaked: … }</text>
  <text x="530" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">still referenced → not collected</text>

  <text x="655" y="362" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">GC frees objects nothing can reach</text>

  <!-- divider -->
  <line x1="440" y1="70" x2="440" y2="380" stroke="#475569" stroke-dasharray="3 5"/>
</svg>