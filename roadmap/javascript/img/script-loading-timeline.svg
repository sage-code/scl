<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900">
  <rect width="900" height="470" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">How the browser loads a script</text>

  <text x="112" y="104" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">plain script</text>
  <rect x="120" y="80" width="176" height="36" fill="#1e293b" stroke="#475569"/>
  <text x="208" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">parsing</text>
  <rect x="302" y="80" width="156" height="36" fill="#3b82f6"/>
  <text x="380" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">download</text>
  <rect x="464" y="80" width="172" height="36" fill="#f59e0b"/>
  <text x="550" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">run</text>
  <rect x="642" y="80" width="114" height="36" fill="#1e293b" stroke="#475569"/>
  <text x="699" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">parsing</text>
  <line x1="764" y1="70" x2="764" y2="126" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="772" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">page ready</text>
  <text x="380" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">the page waits here — nothing below the script is rendered yet</text>

  <text x="112" y="229" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">defer</text>
  <rect x="200" y="163" width="160" height="22" fill="#3b82f6"/>
  <text x="280" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">download (in parallel)</text>
  <rect x="120" y="205" width="616" height="36" fill="#1e293b" stroke="#475569"/>
  <text x="428" y="227" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">parsing continues — the page is never blocked</text>
  <rect x="744" y="205" width="108" height="36" fill="#f59e0b"/>
  <text x="798" y="227" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">run (in order)</text>
  <line x1="864" y1="195" x2="864" y2="251" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="856" y="188" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">page ready after defer scripts</text>

  <text x="112" y="354" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">async</text>
  <rect x="200" y="288" width="140" height="22" fill="#3b82f6"/>
  <text x="270" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">download</text>
  <rect x="120" y="330" width="216" height="36" fill="#1e293b" stroke="#475569"/>
  <text x="228" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">parsing</text>
  <rect x="344" y="330" width="116" height="36" fill="#f59e0b"/>
  <text x="402" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">run (when ready)</text>
  <rect x="468" y="330" width="268" height="36" fill="#1e293b" stroke="#475569"/>
  <text x="602" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">parsing continues</text>
  <line x1="744" y1="320" x2="744" y2="376" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="736" y="313" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">page ready (does not wait for async)</text>

  <rect x="120" y="424" width="22" height="14" fill="#1e293b" stroke="#475569"/>
  <text x="150" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">HTML parsing</text>
  <rect x="270" y="424" width="22" height="14" fill="#3b82f6"/>
  <text x="300" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">download</text>
  <rect x="400" y="424" width="22" height="14" fill="#f59e0b"/>
  <text x="430" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">run the script</text>
  <line x1="560" y1="431" x2="590" y2="431" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="598" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">DOMContentLoaded — the page is ready</text>
</svg>
