<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880">
  <rect width="880" height="430" fill="#0f172a"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">Scope: where a name can be seen</text>

  <rect x="40" y="60" width="800" height="340" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">global scope</text>
  <text x="60" y="115" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">const app = "demo";</text>

  <rect x="100" y="140" width="680" height="230" rx="6" fill="#2b3a55" stroke="#475569"/>
  <text x="125" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">function greet() scope</text>
  <text x="125" y="195" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">const who = "Ada";</text>

  <rect x="160" y="220" width="300" height="120" rx="6" fill="#3b82f6"/>
  <text x="175" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">block scope</text>
  <text x="175" y="272" font-family="Consolas, monospace" font-size="13" fill="#0f172a">let msg = "hi";</text>
  <text x="175" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a">can read: msg ✓  who ✓  app ✓</text>

  <rect x="520" y="220" width="240" height="120" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="540" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">name lookup walks outward</text>
  <text x="540" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">1. block — finds msg</text>
  <text x="540" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">2. function — finds who</text>
  <text x="540" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">3. global — finds app</text>

  <text x="60" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">the lookup never walks inward: outer code cannot see msg or who — they are invisible outside their block</text>
</svg>
