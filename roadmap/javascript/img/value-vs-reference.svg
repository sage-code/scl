<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880">
  <defs>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="410" fill="#0f172a"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">Assignment copies the value — or the address</text>

  <text x="60" y="84" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">let a = 5;   let b = a;</text>
  <rect x="300" y="100" width="90" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="345" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">a = 5</text>
  <rect x="480" y="100" width="90" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="525" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">b = 5</text>
  <path d="M394,125 L472,125" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrV)"/>
  <text x="432" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">copies the value</text>
  <text x="435" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">two independent boxes: change a, and b keeps 5 — primitives copy by value</text>

  <text x="60" y="235" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">const x = { n: 1 };   const y = x;</text>
  <rect x="300" y="252" width="70" height="44" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="335" y="279" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">x</text>
  <rect x="470" y="252" width="70" height="44" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="505" y="279" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">y</text>
  <rect x="380" y="320" width="160" height="50" rx="6" fill="#f59e0b"/>
  <text x="460" y="350" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#0f172a">{ n: 1 }</text>
  <path d="M335,296 L398,316" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrV)"/>
  <path d="M505,296 L462,316" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrV)"/>
  <text x="435" y="392" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">objects copy the address: both names reach the SAME box — change one, both change</text>
</svg>
