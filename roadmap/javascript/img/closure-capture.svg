<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880">
  <defs>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#0f172a"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">A closure keeps its birthplace alive</text>

  <rect x="60" y="70" width="420" height="250" rx="6" fill="#2b3a55" stroke="#475569"/>
  <text x="80" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">function makeCounter() scope</text>

  <rect x="90" y="130" width="150" height="56" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="165" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">let count = 0</text>

  <rect x="90" y="220" width="360" height="76" rx="6" fill="#f59e0b"/>
  <text x="100" y="250" font-family="Consolas, monospace" font-size="13" fill="#0f172a">function () { count += 1;</text>
  <text x="100" y="272" font-family="Consolas, monospace" font-size="13" fill="#0f172a">             return count; }</text>

  <path d="M170,216 L168,194" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrF)"/>
  <text x="255" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">reads and writes count</text>

  <rect x="560" y="70" width="280" height="250" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="580" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">outside, later:</text>
  <text x="580" y="132" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">const next = makeCounter()</text>
  <text x="580" y="162" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">next()  → 1</text>
  <text x="580" y="192" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">next()  → 2</text>
  <text x="580" y="222" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">next()  → 3</text>
  <text x="580" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">count survived between calls:</text>
  <text x="580" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">the function carries its scope</text>

  <path d="M480,190 L552,190" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrF)"/>
  <text x="516" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">returns it</text>
</svg>
