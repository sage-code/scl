<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880">
  <rect width="880" height="400" fill="#0f172a"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">What is this? The call site decides</text>

  <rect x="60" y="70" width="370" height="140" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3b82f6">1 · method call</text>
  <text x="80" y="124" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">dog.bark();</text>
  <text x="80" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">this = dog — the object before the dot</text>
  <text x="80" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">the everyday case</text>

  <rect x="460" y="70" width="370" height="140" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="480" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3b82f6">2 · plain call (strict mode)</text>
  <text x="480" y="124" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">bark();</text>
  <text x="480" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">this = undefined — no object, no this</text>
  <text x="480" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">extracting a method loses it — see the trap</text>

  <rect x="60" y="240" width="370" height="130" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3b82f6">3 · arrow function</text>
  <text x="80" y="294" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">() =&gt; this.count</text>
  <text x="80" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">this = inherited from the birth scope</text>
  <text x="80" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">ignores the call site entirely — the fix</text>

  <rect x="460" y="240" width="370" height="130" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="480" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3b82f6">4 · new / class</text>
  <text x="480" y="294" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">new Dog();</text>
  <text x="480" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">this = the fresh instance being built</text>
  <text x="480" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">constructors and class methods live here</text>
</svg>
