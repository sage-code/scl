<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#0f172a"/>
  <text x="440" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">Where JavaScript runs</text>

  <rect x="40" y="180" width="200" height="90" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="140" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e2e8f0">your code</text>
  <text x="140" y="243" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">hello.js / app.js</text>

  <rect x="320" y="30" width="76" height="24" rx="12" fill="#3b82f6"/>
  <text x="358" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">this track</text>
  <rect x="320" y="70" width="300" height="110" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="470" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e2e8f0">Browser</text>
  <text x="470" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Chrome, Edge — V8 engine</text>
  <text x="470" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Firefox — SpiderMonkey</text>
  <text x="470" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Safari — JavaScriptCore</text>

  <rect x="680" y="70" width="170" height="110" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="765" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">gives you</text>
  <text x="765" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">the page (DOM)</text>
  <text x="765" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">events, network</text>
  <text x="765" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">storage, canvas</text>

  <rect x="320" y="270" width="300" height="110" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="470" y="298" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e2e8f0">Node.js</text>
  <text x="470" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">servers and command-line tools</text>
  <text x="470" y="342" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">reads and writes files</text>
  <text x="470" y="362" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">same V8 engine as Chrome</text>

  <rect x="680" y="270" width="170" height="110" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="765" y="298" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">gives you</text>
  <text x="765" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">files and processes</text>
  <text x="765" y="342" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">HTTP servers</text>
  <text x="765" y="362" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">no window, no DOM</text>

  <path d="M240,210 L308,132" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M240,240 L308,318" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M620,125 L672,125" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M620,325 L672,325" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="262" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">runs in</text>
  <text x="262" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">runs in</text>
  <text x="630" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">provides</text>
  <text x="630" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">provides</text>
</svg>
