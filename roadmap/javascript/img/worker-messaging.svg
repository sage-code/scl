<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880">
  <rect width="880" height="320" fill="#0f172a"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">Main thread ↔ worker: messages, not shared variables</text>

  <!-- main thread -->
  <rect x="60" y="80" width="240" height="160" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3b82f6">MAIN THREAD</text>
  <text x="80" y="134" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">DOM · events · your UI</text>
  <text x="80" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">stays responsive — the worker</text>
  <text x="80" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">burns CPU somewhere else</text>
  <text x="80" y="212" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">worker.postMessage(job)</text>

  <!-- worker thread -->
  <rect x="580" y="80" width="240" height="160" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="600" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3b82f6">WORKER THREAD</text>
  <text x="600" y="134" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">no DOM, no window</text>
  <text x="600" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">own loop, own stack, own heap</text>
  <text x="600" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">heavy compute lives here</text>
  <text x="600" y="212" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">postMessage(result)</text>

  <!-- message lanes -->
  <path d="M 300 130 C 400 110, 480 110, 580 130" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <text x="440" y="106" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#93c5fd">job (structured clone)</text>

  <path d="M 580 190 C 480 210, 400 210, 300 190" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#b)"/>
  <text x="440" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">result (clone) or transferred buffer (zero-copy)</text>

  <!-- transfer note -->
  <rect x="300" y="256" width="280" height="44" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="440" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0">SharedArrayBuffer: ONE heap both threads</text>
  <text x="440" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">touch — Atomics make it safe</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#3b82f6"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#f59e0b"/></marker>
  </defs>
</svg>