<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880">
  <rect width="880" height="420" fill="#0f172a"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">From HTML to pixels — where your JavaScript plugs in</text>

  <!-- stage 1: parse -->
  <rect x="50" y="80" width="240" height="110" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="70" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3b82f6">1 · parse</text>
  <text x="70" y="132" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">index.html + styles.css</text>
  <text x="70" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">browser reads the bytes</text>
  <text x="70" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">no JavaScript involved yet</text>

  <!-- stage 2: trees -->
  <rect x="330" y="80" width="240" height="110" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="350" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3b82f6">2 · build trees</text>
  <text x="350" y="132" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">DOM + CSSOM</text>
  <text x="350" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">the DOM is live: JS reads</text>
  <text x="350" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">and writes it from here on</text>

  <!-- stage 3: js -->
  <rect x="610" y="80" width="220" height="110" rx="6" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="630" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#dbeafe">3 · your JavaScript</text>
  <text x="630" y="132" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">querySelector / append</text>
  <text x="630" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dbeafe">event listeners wait;</text>
  <text x="630" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dbeafe">handlers change the DOM</text>

  <!-- arrows across the top row -->
  <line x1="290" y1="135" x2="330" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <line x1="570" y1="135" x2="610" y2="135" stroke="#94a3b8" stroke-width="2"/>

  <!-- loop back: JS changes DOM -->
  <path d="M 720 190 C 720 240, 450 240, 450 190" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="585" y="232" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#93c5fd">every change marks the tree dirty</text>

  <!-- stage 4: render pipeline -->
  <rect x="120" y="270" width="640" height="100" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="140" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3b82f6">4 · render pipeline (browser-run, every frame)</text>

  <rect x="150" y="312" width="130" height="40" rx="4" fill="#334155" stroke="#475569"/>
  <text x="215" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">style</text>

  <rect x="310" y="312" width="130" height="40" rx="4" fill="#334155" stroke="#475569"/>
  <text x="375" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">layout</text>

  <rect x="470" y="312" width="130" height="40" rx="4" fill="#334155" stroke="#475569"/>
  <text x="535" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">paint</text>

  <rect x="630" y="312" width="110" height="40" rx="4" fill="#334155" stroke="#475569"/>
  <text x="685" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">composite</text>

  <line x1="280" y1="332" x2="310" y2="332" stroke="#94a3b8" stroke-width="2"/>
  <line x1="440" y1="332" x2="470" y2="332" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="332" x2="630" y2="332" stroke="#94a3b8" stroke-width="2"/>

  <text x="440" y="398" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">layout is the expensive step — batch DOM writes so it runs once, not per change</text>
</svg>