<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880">
  <rect width="880" height="300" fill="#0f172a"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">A promise settles once; the chain routes the outcome</text>

  <!-- pending -->
  <rect x="60" y="120" width="160" height="64" rx="8" fill="#334155" stroke="#94a3b8"/>
  <text x="140" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">pending</text>
  <text x="140" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">value not ready yet</text>

  <!-- fulfilled -->
  <rect x="380" y="60" width="180" height="60" rx="8" fill="#166534" stroke="#86efac"/>
  <text x="470" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#f0fdf4">fulfilled</text>
  <text x="470" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dcfce7">has a value</text>

  <!-- rejected -->
  <rect x="380" y="180" width="180" height="60" rx="8" fill="#7f1d1d" stroke="#fca5a5"/>
  <text x="470" y="206" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#fef2f2">rejected</text>
  <text x="470" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fee2e2">has an error</text>

  <!-- settled is final -->
  <text x="470" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">SETTLED — final, exactly once</text>

  <!-- arrows from pending -->
  <line x1="220" y1="140" x2="372" y2="96" stroke="#86efac" stroke-width="2" marker-end="url(#g)"/>
  <text x="290" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#86efac">resolve(value)</text>
  <line x1="220" y1="164" x2="372" y2="206" stroke="#fca5a5" stroke-width="2" marker-end="url(#r)"/>
  <text x="290" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fca5a5">reject(error) / throw</text>

  <!-- routing to handlers -->
  <line x1="560" y1="90" x2="700" y2="90" stroke="#86efac" stroke-width="2" marker-end="url(#g)"/>
  <text x="708" y="95" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">.then(onFulfilled)</text>
  <line x1="560" y1="210" x2="700" y2="210" stroke="#fca5a5" stroke-width="2" marker-end="url(#r)"/>
  <text x="708" y="200" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">.catch(onRejected)</text>
  <text x="708" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">catches ANY failure above it</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#86efac"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#fca5a5"/></marker>
  </defs>
</svg>