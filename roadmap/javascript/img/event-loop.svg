<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880">
  <rect width="880" height="460" fill="#0f172a"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">One thread, one stack, two queues</text>

  <!-- call stack -->
  <rect x="60" y="70" width="300" height="200" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3b82f6">CALL STACK</text>
  <rect x="85" y="110" width="250" height="44" rx="4" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="100" y="137" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">running task (sync code)</text>
  <rect x="85" y="164" width="250" height="44" rx="4" fill="#334155" stroke="#475569"/>
  <text x="100" y="191" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">previous frame…</text>
  <text x="80" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">one thread: when this is busy,</text>
  <text x="80" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">EVERYTHING waits</text>

  <!-- microtask queue -->
  <rect x="440" y="70" width="380" height="110" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="460" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3b82f6">MICROTASK QUEUE — promise callbacks</text>
  <rect x="465" y="110" width="150" height="40" rx="4" fill="#0e7490" stroke="#67e8f9"/>
  <text x="540" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#ecfeff">.then cb 1</text>
  <rect x="630" y="110" width="150" height="40" rx="4" fill="#0e7490" stroke="#67e8f9"/>
  <text x="705" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#ecfeff">.then cb 2</text>
  <text x="460" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">drains COMPLETELY after every task — jumps all timers</text>

  <!-- macrotask queue -->
  <rect x="440" y="200" width="380" height="110" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="460" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3b82f6">MACROTASK QUEUE — timers, I/O, events</text>
  <rect x="465" y="240" width="150" height="40" rx="4" fill="#334155" stroke="#475569"/>
  <text x="540" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">setTimeout</text>
  <rect x="630" y="240" width="150" height="40" rx="4" fill="#334155" stroke="#475569"/>
  <text x="705" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">click handler</text>
  <text x="460" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">one task per turn — the drain repeats between each</text>

  <!-- event loop arrow -->
  <path d="M 360 170 C 400 170, 400 140, 440 125" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 440 255 C 400 255, 400 200, 360 180" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="392" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">event loop:</text>
  <text x="392" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">when the stack empties,</text>
  <text x="392" y="344" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">microtasks first,</text>
  <text x="392" y="362" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">then ONE macrotask</text>

  <!-- render step -->
  <rect x="60" y="300" width="300" height="110" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3b82f6">RENDER STEP (browser, ~60fps)</text>
  <text x="80" y="352" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">style → layout → paint</text>
  <text x="80" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">runs between tasks — blocking</text>
  <text x="80" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">the thread drops frames (jank)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#3b82f6"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#94a3b8"/></marker>
  </defs>
</svg>