<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="370" fill="#0f172a"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0">HTML loads, JavaScript acts</text>

  <rect x="40" y="64" width="380" height="290" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="230" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e2e8f0">index.html</text>
  <text x="64" y="122" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">&lt;html&gt;</text>
  <text x="64" y="146" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">&lt;head&gt;…&lt;/head&gt;</text>
  <text x="64" y="170" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">&lt;body&gt;</text>
  <rect x="56" y="182" width="348" height="20" rx="3" fill="#34d399"/>
  <text x="64" y="197" font-family="Consolas, monospace" font-size="13" fill="#0f172a">&lt;h1 id="greeting"&gt;Hello&lt;/h1&gt;</text>
  <rect x="56" y="208" width="348" height="20" rx="3" fill="#f59e0b"/>
  <text x="64" y="223" font-family="Consolas, monospace" font-size="13" fill="#0f172a">&lt;script src="app.js"&gt;&lt;/script&gt;</text>
  <text x="64" y="251" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">&lt;/body&gt;</text>
  <text x="64" y="275" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">&lt;/html&gt;</text>
  <text x="230" y="316" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">green: the hook JS grabs — amber: where your code is loaded</text>

  <rect x="520" y="64" width="200" height="70" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="620" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e2e8f0">app.js</text>
  <text x="620" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">your JavaScript file</text>

  <rect x="520" y="180" width="280" height="64" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="660" y="206" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">browser engine runs it</text>
  <text x="660" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">top to bottom, one statement at a time</text>

  <rect x="470" y="290" width="180" height="56" rx="6" fill="#34d399"/>
  <text x="560" y="323" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">updates the page</text>
  <rect x="680" y="290" width="160" height="56" rx="6" fill="#3b82f6"/>
  <text x="760" y="323" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">writes to the console</text>

  <path d="M420,218 L512,106" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <text x="432" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">loads</text>
  <path d="M620,134 L620,172" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M600,244 L562,282" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M700,244 L758,282" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
</svg>
