<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 06 — plain vs defer vs async</title>
</head>
<body>
  <h1>Demo 06 — plain vs defer vs async</h1>
  <p>
    Open the console, then reload a few times (Ctrl+R). The inline script in the head
    logs first — before the text below it even exists. The last two lines can swap:
    an <strong>async</strong> script runs as soon as it is downloaded; a
    <strong>defer</strong> script keeps its place at the end.
  </p>
  <p id="done">…</p>

  <!-- 1. PLAIN script in the head: runs immediately, before the elements
          below are parsed. document.body is still null here — the classic
          beginner trap that lesson 02 explains how to avoid. -->
  <script>
    console.log("1. inline head script ran; document.body is:", document.body);
  </script>

  <!-- 2. async: runs as soon as it is downloaded. Order is NOT guaranteed. -->
  <script src="06_async.js" async></script>

  <!-- 3. defer: runs after the whole page is parsed, before DOMContentLoaded. -->
  <script src="06_defer.js" defer></script>
</body>
</html>
