<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 05 — An external script file</title>
</head>
<body>
  <h1 id="title">Loading…</h1>
  <p id="message">…</p>

  <!-- src points to a separate .js file in the SAME folder (a relative path:
       no leading slash). defer = download in parallel, run after the HTML is
       parsed — so by the time the file runs, both elements above exist. -->
  <script src="05_app.js" defer></script>
</body>
</html>
