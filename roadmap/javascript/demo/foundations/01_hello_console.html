<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 01 — Your first console tour</title>
</head>
<body>
  <h1>Open the console (F12), then read this page.</h1>
  <p>
    This page ran a script. The results are in the console, not on the page — on purpose.
    The console is where JavaScript talks to the developer (you).
  </p>

  <script>
    // console.log prints values to the console — your main debugging tool.
    console.log("Hello! This line was printed by JavaScript.");

    // A value is one piece of data. Different types print differently.
    console.log("text is a string"); // string: text in quotes
    console.log(42);                 // number
    console.log(2 + 3);              // the engine computes first, then logs 5
    console.log(true);               // boolean: true or false
    console.log(typeof 42);          // typeof answers "what type is this?" -> "number"

    // Compare your prediction with the result for every line above,
    // then change one value and reload the page (Ctrl+R).
  </script>
</body>
</html>
