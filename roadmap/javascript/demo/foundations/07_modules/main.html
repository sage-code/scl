<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 07 — Modules</title>
</head>
<body>
  <h1 id="greeting">…</h1>

  <!-- type="module": deferred by default, variables stay private to the file,
       and import/export works.
       Modules refuse file:// for security — serve this folder over HTTP:
         python -m http.server 8000
       then open http://localhost:8000/.../07_modules/main.html
       (or use the VS Code "Live Server" extension). -->
  <script type="module" src="main.js"></script>
</body>
</html>
