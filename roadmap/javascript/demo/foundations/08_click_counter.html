<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 08 — A complete click counter</title>
</head>
<body>
  <h1>Click counter</h1>

  <!-- Structure lives in the HTML; behaviour lives in the script below. -->
  <button id="increment">Clicked 0 times</button>
  <p id="milestone">Click the button.</p>

  <script>
    // State: one variable remembers the count between clicks.
    let count = 0;

    const button = document.querySelector("#increment");
    const milestone = document.querySelector("#milestone");

    // addEventListener: "when this event happens on this element, run this function".
    // The function is the REACTION — it runs again on every click, not now.
    button.addEventListener("click", function () {
      count = count + 1;
      button.textContent = "Clicked " + count + " times";

      // A condition: different behaviour at a milestone (lesson 07, control flow).
      if (count === 10) {
        milestone.textContent = "Ten! You just used state + events + a condition.";
      }

      console.log("count is now", count); // diagnostics, not the product
    });
  </script>
</body>
</html>
