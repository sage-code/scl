<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 14 — Two counters, two closures</title>
</head>
<body>
  <h1>Closures: two independent counters</h1>
  <p>Each factory call created a PRIVATE count. Click each button — neither counter can see the other's number.</p>

  <button id="first">First: 0</button>
  <button id="second">Second: 0</button>

  <script>
    // The factory: count lives inside makeCounter's scope.
    function makeCounter(label) {
      let count = 0; // private — no code outside can touch it directly

      // The arrow function below is a CLOSURE: it keeps access to count
      // (and label) even after makeCounter has finished running.
      return function () {
        count += 1;
        console.log(label + " count:", count);
        return count;
      };
    }

    // Two calls → two separate scopes → two independent counts.
    const bumpFirst = makeCounter("first");
    const bumpSecond = makeCounter("second");

    function wire(buttonId, bump) {
      const button = document.querySelector(buttonId);
      button.addEventListener("click", function () {
        const n = bump(); // the closure updates ITS OWN count
        button.textContent = button.textContent.split(":")[0] + ": " + n;
      });
    }

    wire("#first", bumpFirst);
    wire("#second", bumpSecond);
  </script>
</body>
</html>
