<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 12 — Control flow you can click</title>
</head>
<body>
  <h1>Control flow lab</h1>
  <p>Type a number, then press the buttons. Each button runs a different structure and prints what it did.</p>

  <input id="number-in" type="number" value="7">
  <button id="check">if / else</button>
  <button id="grade">switch</button>
  <button id="loop">for loop</button>

  <pre id="out" style="background:#1e293b;color:#e2e8f0;padding:12px;min-height:60px;"></pre>

  <script>
    const input = document.querySelector("#number-in");
    const out = document.querySelector("#out");

    // A helper keeps the three reactions short — functions are lesson 08.
    function show(text) {
      out.textContent = text;
      console.log(text);
    }

    // if / else if / else: exactly one branch runs.
    document.querySelector("#check").addEventListener("click", function () {
      const n = Number(input.value);
      if (n > 10) {
        show(n + " is greater than 10");
      } else if (n === 10) {
        show(n + " is exactly 10");
      } else {
        show(n + " is less than 10");
      }
    });

    // switch: compares one value against fixed cases; break stops the fall-through.
    document.querySelector("#grade").addEventListener("click", function () {
      const n = Number(input.value);
      switch (n) {
        case 0:
          show("zero — the loop body below would not run either");
          break;
        case 10:
          show("ten — a perfect score");
          break;
        default:
          show(n + " is not a case we planned for");
      }
    });

    // for: start at 1; keep going while i <= n; add 2 each round.
    document.querySelector("#loop").addEventListener("click", function () {
      const n = Number(input.value);
      let line = "odd numbers up to " + n + ": ";
      for (let i = 1; i <= n; i += 2) {
        line += i + " ";
      }
      show(line);
    });
  </script>
</body>
</html>
