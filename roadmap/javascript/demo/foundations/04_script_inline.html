<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 04 — JavaScript inside the page</title>
</head>
<body>
  <h1 id="title">Before</h1>
  <p id="message">Nothing happened yet.</p>

  <!-- The script sits at the END of the body: by the time the browser
       reaches it, the elements above already exist, so querySelector
       can find them. (Lesson 02 explains placement and defer.) -->
  <script>
    // document is the whole page. querySelector finds ONE element
    // using a CSS selector: "#title" means id="title".
    const title = document.querySelector("#title");
    const message = document.querySelector("#message");

    // textContent replaces the text inside an element — safely, as plain text.
    title.textContent = "After";
    message.textContent =
      "JavaScript changed this text at " + new Date().toLocaleTimeString();

    // The console keeps a log; the page shows the result. Different audiences.
    console.log("The page was updated.");
  </script>
</body>
</html>
