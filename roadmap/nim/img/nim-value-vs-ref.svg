<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320">
  <rect width="620" height="320" fill="#1e1e1e" rx="10"/>
  <text x="20" y="32" fill="#ffd54a" font-size="16" font-family="sans-serif" font-weight="bold">Value semantics versus reference semantics</text>

  <rect x="20" y="60" width="280" height="200" rx="8" fill="#242424" stroke="#8a8a8a" stroke-width="2"/>
  <text x="36" y="86" fill="#eee" font-size="14" font-family="monospace">let a = Point(x: 1, y: 2)</text>
  <text x="36" y="110" fill="#aaa" font-size="12" font-family="sans-serif">An object is a value: assignment copies it.</text>

  <rect x="36" y="126" width="110" height="60" rx="6" fill="#3a3a3a" stroke="#ffd54a" stroke-width="2"/>
  <text x="50" y="152" fill="#eee" font-size="12" font-family="monospace">a</text>
  <text x="50" y="172" fill="#ffd54a" font-size="12" font-family="monospace">1, 2</text>

  <rect x="180" y="126" width="110" height="60" rx="6" fill="#3a3a3a" stroke="#ffd54a" stroke-width="2"/>
  <text x="194" y="152" fill="#eee" font-size="12" font-family="monospace">b = a</text>
  <text x="194" y="172" fill="#ffd54a" font-size="12" font-family="monospace">1, 2</text>

  <text x="36" y="212" fill="#ccc" font-size="12" font-family="sans-serif">b.x = 9 leaves a untouched — two independent</text>
  <text x="36" y="232" fill="#ccc" font-size="12" font-family="sans-serif">storage locations, no allocation, no aliasing.</text>

  <rect x="320" y="60" width="280" height="200" rx="8" fill="#242424" stroke="#8a8a8a" stroke-width="2"/>
  <text x="336" y="86" fill="#eee" font-size="14" font-family="monospace">ref object / seq / string</text>
  <text x="336" y="110" fill="#aaa" font-size="12" font-family="sans-serif">The variable holds a handle to shared storage.</text>

  <rect x="336" y="126" width="110" height="60" rx="6" fill="#3a3a3a" stroke="#ffd54a" stroke-width="2"/>
  <text x="350" y="152" fill="#eee" font-size="12" font-family="monospace">a</text>
  <text x="350" y="172" fill="#9bffb4" font-size="12" font-family="monospace">handle</text>

  <rect x="480" y="126" width="110" height="60" rx="6" fill="#3a3a3a" stroke="#ffd54a" stroke-width="2"/>
  <text x="494" y="152" fill="#eee" font-size="12" font-family="monospace">b = a</text>
  <text x="494" y="172" fill="#9bffb4" font-size="12" font-family="monospace">handle</text>

  <rect x="408" y="204" width="110" height="44" rx="6" fill="#2d2d2d" stroke="#27ae60" stroke-width="2"/>
  <text x="420" y="231" fill="#9bffb4" font-size="12" font-family="monospace">heap cell</text>

  <line x1="391" y1="186" x2="441" y2="204" stroke="#9bffb4" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="535" y1="186" x2="485" y2="204" stroke="#9bffb4" stroke-width="2" marker-end="url(#b1)"/>

  <text x="20" y="292" fill="#ffd54a" font-size="12" font-family="sans-serif">ARC/ORC counts the handles: the heap cell is destroyed the moment the last one disappears.</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9bffb4"/></marker>
  </defs>
</svg>
