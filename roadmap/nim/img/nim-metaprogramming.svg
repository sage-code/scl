<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300">
  <rect width="620" height="300" fill="#1e1e1e" rx="10"/>
  <text x="20" y="32" fill="#ffd54a" font-size="16" font-family="sans-serif" font-weight="bold">Compile-time pipeline — where templates, macros and static run</text>

  <rect x="20" y="70" width="130" height="120" rx="8" fill="#2d2d2d" stroke="#8a8a8a" stroke-width="2"/>
  <text x="34" y="96" fill="#eee" font-size="13" font-family="monospace">source.nim</text>
  <text x="34" y="122" fill="#aaa" font-size="12" font-family="sans-serif">template</text>
  <text x="34" y="142" fill="#aaa" font-size="12" font-family="sans-serif">macro</text>
  <text x="34" y="162" fill="#aaa" font-size="12" font-family="sans-serif">static:, const</text>

  <rect x="170" y="70" width="130" height="120" rx="8" fill="#3a3a3a" stroke="#ffd54a" stroke-width="2"/>
  <text x="184" y="96" fill="#ffd54a" font-size="13" font-family="monospace">parse + sem</text>
  <text x="184" y="122" fill="#eee" font-size="12" font-family="sans-serif">build the AST</text>
  <text x="184" y="142" fill="#eee" font-size="12" font-family="sans-serif">resolve overloads</text>
  <text x="184" y="162" fill="#eee" font-size="12" font-family="sans-serif">bind symbols</text>

  <rect x="320" y="70" width="130" height="120" rx="8" fill="#3a3a3a" stroke="#ffd54a" stroke-width="2"/>
  <text x="334" y="96" fill="#ffd54a" font-size="13" font-family="monospace">expansion</text>
  <text x="334" y="122" fill="#eee" font-size="12" font-family="sans-serif">templates inline</text>
  <text x="334" y="142" fill="#eee" font-size="12" font-family="sans-serif">macros rewrite</text>
  <text x="334" y="162" fill="#eee" font-size="12" font-family="sans-serif">static: runs</text>

  <rect x="470" y="70" width="130" height="120" rx="8" fill="#2d2d2d" stroke="#27ae60" stroke-width="2"/>
  <text x="484" y="96" fill="#9bffb4" font-size="13" font-family="monospace">codegen</text>
  <text x="484" y="122" fill="#eee" font-size="12" font-family="sans-serif">typed tree</text>
  <text x="484" y="142" fill="#eee" font-size="12" font-family="sans-serif">minus dead code</text>
  <text x="484" y="162" fill="#eee" font-size="12" font-family="sans-serif">emit C</text>

  <line x1="150" y1="130" x2="170" y2="130" stroke="#ffd54a" stroke-width="2" marker-end="url(#m1)"/>
  <line x1="300" y1="130" x2="320" y2="130" stroke="#ffd54a" stroke-width="2" marker-end="url(#m1)"/>
  <line x1="450" y1="130" x2="470" y2="130" stroke="#27ae60" stroke-width="2" marker-end="url(#m2)"/>

  <text x="20" y="226" fill="#ccc" font-size="12" font-family="sans-serif">A template copies syntax; a macro receives AST nodes and returns new ones.</text>
  <text x="20" y="250" fill="#ccc" font-size="12" font-family="sans-serif">Everything here is paid at compile time: the shipped binary holds only the result.</text>
  <text x="20" y="276" fill="#ffd54a" font-size="12" font-family="sans-serif">Inspect it: --expandMacro:name, or the expandMacros procedure in std/macros.</text>

  <defs>
    <marker id="m1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffd54a"/></marker>
    <marker id="m2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#27ae60"/></marker>
  </defs>
</svg>
