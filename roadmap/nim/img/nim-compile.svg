<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300">
  <rect width="620" height="300" fill="#1e1e1e" rx="10"/>
  <text x="20" y="32" fill="#ffd54a" font-size="16" font-family="sans-serif" font-weight="bold">Nim toolchain — one compiler, many backends</text>

  <rect x="20" y="70" width="130" height="120" rx="8" fill="#2d2d2d" stroke="#8a8a8a" stroke-width="2"/>
  <text x="34" y="96" fill="#eee" font-size="14" font-family="monospace">source.nim</text>
  <text x="34" y="122" fill="#aaa" font-size="12" font-family="sans-serif">procs, types</text>
  <text x="34" y="142" fill="#aaa" font-size="12" font-family="sans-serif">templates, macros</text>
  <text x="34" y="162" fill="#aaa" font-size="12" font-family="sans-serif">significant indentation</text>

  <rect x="170" y="70" width="130" height="120" rx="8" fill="#3a3a3a" stroke="#ffd54a" stroke-width="2"/>
  <text x="184" y="96" fill="#ffd54a" font-size="14" font-family="monospace">nim c</text>
  <text x="184" y="122" fill="#eee" font-size="12" font-family="sans-serif">type checking</text>
  <text x="184" y="142" fill="#eee" font-size="12" font-family="sans-serif">macro expansion</text>
  <text x="184" y="162" fill="#eee" font-size="12" font-family="sans-serif">ARC/ORC injection</text>

  <rect x="320" y="70" width="130" height="120" rx="8" fill="#2d2d2d" stroke="#8a8a8a" stroke-width="2"/>
  <text x="334" y="96" fill="#eee" font-size="13" font-family="monospace">nimcache/*.c</text>
  <text x="334" y="122" fill="#aaa" font-size="12" font-family="sans-serif">generated C</text>
  <text x="334" y="142" fill="#aaa" font-size="12" font-family="sans-serif">or C++ / ObjC</text>
  <text x="334" y="162" fill="#aaa" font-size="12" font-family="sans-serif">or JavaScript</text>

  <rect x="470" y="70" width="130" height="120" rx="8" fill="#2d2d2d" stroke="#27ae60" stroke-width="2"/>
  <text x="484" y="96" fill="#9bffb4" font-size="14" font-family="monospace">binary</text>
  <text x="484" y="122" fill="#eee" font-size="12" font-family="sans-serif">native executable</text>
  <text x="484" y="142" fill="#eee" font-size="12" font-family="sans-serif">links libc</text>
  <text x="484" y="162" fill="#eee" font-size="12" font-family="sans-serif">gcc / clang / tcc</text>

  <line x1="150" y1="130" x2="170" y2="130" stroke="#ffd54a" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="300" y1="130" x2="320" y2="130" stroke="#ffd54a" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="450" y1="130" x2="470" y2="130" stroke="#27ae60" stroke-width="2" marker-end="url(#a2)"/>

  <text x="20" y="228" fill="#ccc" font-size="12" font-family="sans-serif">Type errors and macro errors stop here: nothing reaches the C compiler unless the program is sound.</text>
  <text x="20" y="252" fill="#ccc" font-size="12" font-family="sans-serif">The generated C is ordinary C — profile it, debug it, or read it to learn what your code costs.</text>
  <text x="20" y="276" fill="#ffd54a" font-size="12" font-family="sans-serif">Same source, other backends: --mm:arc, --cpu:arm, --os:standalone or the JavaScript target.</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffd54a"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#27ae60"/></marker>
  </defs>
</svg>
