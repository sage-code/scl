<svg xmlns="http://www.w3.org/2000/svg" width="620" height="310" viewBox="0 0 620 310">
  <rect width="620" height="310" fill="#1e1e1e" rx="10"/>
  <text x="20" y="32" fill="#ffd54a" font-size="16" font-family="sans-serif" font-weight="bold">Threads and channels — isolated heaps, explicit messages</text>

  <rect x="20" y="80" width="140" height="130" rx="8" fill="#2d2d2d" stroke="#8a8a8a" stroke-width="2"/>
  <text x="34" y="106" fill="#eee" font-size="14" font-family="monospace">main thread</text>
  <text x="34" y="132" fill="#aaa" font-size="12" font-family="sans-serif">createThread</text>
  <text x="34" y="152" fill="#aaa" font-size="12" font-family="sans-serif">open a channel</text>
  <text x="34" y="172" fill="#aaa" font-size="12" font-family="sans-serif">joinThread</text>
  <text x="34" y="192" fill="#aaa" font-size="12" font-family="sans-serif">recv results</text>

  <rect x="196" y="100" width="110" height="90" rx="8" fill="#3a3a3a" stroke="#ffd54a" stroke-width="2"/>
  <text x="210" y="128" fill="#ffd54a" font-size="13" font-family="monospace">channel</text>
  <text x="210" y="150" fill="#eee" font-size="13" font-family="monospace">jobs: int</text>
  <text x="210" y="174" fill="#aaa" font-size="12" font-family="sans-serif">typed queue</text>

  <rect x="342" y="60" width="120" height="70" rx="8" fill="#2d2d2d" stroke="#9bffb4" stroke-width="2"/>
  <text x="356" y="88" fill="#9bffb4" font-size="13" font-family="monospace">thread A</text>
  <text x="356" y="110" fill="#aaa" font-size="12" font-family="sans-serif">own heap</text>

  <rect x="342" y="160" width="120" height="70" rx="8" fill="#2d2d2d" stroke="#9bffb4" stroke-width="2"/>
  <text x="356" y="188" fill="#9bffb4" font-size="13" font-family="monospace">thread B</text>
  <text x="356" y="210" fill="#aaa" font-size="12" font-family="sans-serif">own heap</text>

  <rect x="498" y="90" width="102" height="110" rx="8" fill="#242424" stroke="#8a8a8a" stroke-width="2"/>
  <text x="510" y="116" fill="#eee" font-size="12" font-family="monospace">results</text>
  <text x="510" y="136" fill="#eee" font-size="12" font-family="monospace">channel</text>
  <text x="510" y="160" fill="#aaa" font-size="12" font-family="sans-serif">send() copies</text>
  <text x="510" y="180" fill="#aaa" font-size="12" font-family="sans-serif">recv() waits</text>

  <line x1="160" y1="145" x2="196" y2="145" stroke="#ffd54a" stroke-width="2" marker-end="url(#t1)"/>
  <line x1="306" y1="132" x2="342" y2="95" stroke="#ffd54a" stroke-width="2" marker-end="url(#t1)"/>
  <line x1="306" y1="158" x2="342" y2="195" stroke="#ffd54a" stroke-width="2" marker-end="url(#t1)"/>
  <line x1="462" y1="95" x2="498" y2="120" stroke="#9bffb4" stroke-width="2" marker-end="url(#t2)"/>
  <line x1="462" y1="195" x2="498" y2="170" stroke="#9bffb4" stroke-width="2" marker-end="url(#t2)"/>

  <text x="20" y="240" fill="#ccc" font-size="12" font-family="sans-serif">A thread does not share the main heap: what crosses a channel is copied, not aliased.</text>
  <text x="20" y="264" fill="#ccc" font-size="12" font-family="sans-serif">That single rule removes data races by construction; --threads:on is the default in Nim 2.x.</text>
  <text x="20" y="288" fill="#ffd54a" font-size="12" font-family="sans-serif">For I/O-bound work prefer async/await: one thread, many pending futures, no channels needed.</text>

  <defs>
    <marker id="t1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffd54a"/></marker>
    <marker id="t2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9bffb4"/></marker>
  </defs>
</svg>
