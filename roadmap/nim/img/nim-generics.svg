<svg xmlns="http://www.w3.org/2000/svg" width="620" height="290" viewBox="0 0 620 290">
  <rect width="620" height="290" fill="#1e1e1e" rx="10"/>
  <text x="20" y="32" fill="#ffd54a" font-size="16" font-family="sans-serif" font-weight="bold">One generic definition, one specialized copy per type</text>

  <rect x="20" y="80" width="190" height="140" rx="8" fill="#3a3a3a" stroke="#ffd54a" stroke-width="2"/>
  <text x="34" y="106" fill="#ffd54a" font-size="13" font-family="monospace">proc max[T](a, b: T)</text>
  <text x="34" y="134" fill="#eee" font-size="12" font-family="sans-serif">written once</text>
  <text x="34" y="156" fill="#eee" font-size="12" font-family="sans-serif">T is a placeholder</text>
  <text x="34" y="178" fill="#eee" font-size="12" font-family="sans-serif">no boxing, no casts</text>
  <text x="34" y="200" fill="#aaa" font-size="12" font-family="sans-serif">type-checked per use</text>

  <rect x="280" y="60" width="320" height="46" rx="6" fill="#2d2d2d" stroke="#8a8a8a" stroke-width="2"/>
  <text x="294" y="88" fill="#9bffb4" font-size="13" font-family="monospace">max[int]</text>
  <text x="400" y="88" fill="#aaa" font-size="12" font-family="sans-serif">integer compare instructions</text>

  <rect x="280" y="122" width="320" height="46" rx="6" fill="#2d2d2d" stroke="#8a8a8a" stroke-width="2"/>
  <text x="294" y="150" fill="#9bffb4" font-size="13" font-family="monospace">max[float]</text>
  <text x="400" y="150" fill="#aaa" font-size="12" font-family="sans-serif">floating-point compare</text>

  <rect x="280" y="184" width="320" height="46" rx="6" fill="#2d2d2d" stroke="#8a8a8a" stroke-width="2"/>
  <text x="294" y="212" fill="#9bffb4" font-size="13" font-family="monospace">max[string]</text>
  <text x="400" y="212" fill="#aaa" font-size="12" font-family="sans-serif">calls the string comparison proc</text>

  <line x1="210" y1="150" x2="280" y2="83" stroke="#ffd54a" stroke-width="2" marker-end="url(#g1)"/>
  <line x1="210" y1="150" x2="280" y2="145" stroke="#ffd54a" stroke-width="2" marker-end="url(#g1)"/>
  <line x1="210" y1="150" x2="280" y2="207" stroke="#ffd54a" stroke-width="2" marker-end="url(#g1)"/>

  <text x="20" y="254" fill="#ccc" font-size="12" font-family="sans-serif">Each instantiation is compiled separately and shares no runtime type information.</text>
  <text x="20" y="276" fill="#ffd54a" font-size="12" font-family="sans-serif">A generic wrong for a concrete type fails at compile time, in the line that used it.</text>

  <defs>
    <marker id="g1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffd54a"/></marker>
  </defs>
</svg>
