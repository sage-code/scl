<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Two failure paths</title>
  <desc>Expected failures return {:error, reason} values; unexpected ones crash the process and become supervisor work.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Expected vs unexpected</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Choosing the path per situation is what makes BEAM systems robust without try/except soup.</text>
  <rect x="60" y="150" width="220" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="180" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">an operation</text>
  <text x="76" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">parses, writes, calls out</text>
  <rect x="420" y="90" width="240" height="64" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="436" y="120" font-family="Consolas, monospace" font-size="15" fill="#ffa657">{:error, reason}</text>
  <text x="436" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">expected: caller handles it</text>
  <rect x="420" y="230" width="240" height="64" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="436" y="260" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">raise / crash</text>
  <text x="436" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">unexpected: let it die</text>
  <line x1="286" y1="175" x2="408" y2="122" stroke="#ffa657" stroke-width="2"/>
  <polygon points="416,122 407,118 407,126" fill="#ffa657"/>
  <text x="351.0" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">tagged tuple</text>
  <line x1="286" y1="225" x2="408" y2="262" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="416,262 407,258 407,266" fill="#ff7b72"/>
  <text x="351.0" y="217" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">exit signal</text>
  <rect x="720" y="230" width="150" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="736" y="260" font-family="Consolas, monospace" font-size="15" fill="#7ee787">supervisor</text>
  <text x="736" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">restarts clean</text>
  <line x1="666" y1="262" x2="708" y2="262" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="716,262 707,258 707,266" fill="#ff7b72"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Rule of thumb: if the CALLER can act on the failure, return a tuple; if it is a bug, crash — the tree absorbs it.</text>
</svg>
