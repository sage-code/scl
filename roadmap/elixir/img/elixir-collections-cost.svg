<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Collection operation costs</title>
  <desc>Lists are cheap at the head and expensive at the tail; maps and tuples buy different guarantees.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Choose the structure by its cheap operations</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Cost comparison for common operations (n = element count).</text>
  <rect x="60" y="115" width="300" height="30" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="145" font-family="Consolas, monospace" font-size="15" fill="#7ee787">list  [h | t]  prepend</text>
  <text x="390" y="136" font-family="Consolas, monospace" font-size="14" fill="#7ee787" font-weight="bold">O(1)</text>
  <text x="500" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">head/tail walks, enumeration</text>
  <rect x="60" y="151" width="300" height="30" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="76" y="181" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">list  append</text>
  <text x="390" y="172" font-family="Consolas, monospace" font-size="14" fill="#ff7b72" font-weight="bold">O(n)</text>
  <text x="500" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">use prepend + reverse instead</text>
  <rect x="60" y="187" width="300" height="30" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="76" y="217" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">list  length / index</text>
  <text x="390" y="208" font-family="Consolas, monospace" font-size="14" fill="#ff7b72" font-weight="bold">O(n)</text>
  <text x="500" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">track counts yourself</text>
  <rect x="60" y="223" width="300" height="30" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="253" font-family="Consolas, monospace" font-size="15" fill="#7ee787">tuple  elem(t, i)</text>
  <text x="390" y="244" font-family="Consolas, monospace" font-size="14" fill="#7ee787" font-weight="bold">O(1)</text>
  <text x="500" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">fixed shapes: returns, coordinates</text>
  <rect x="60" y="259" width="300" height="30" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="289" font-family="Consolas, monospace" font-size="15" fill="#ffa657">map  lookup / update</text>
  <text x="390" y="280" font-family="Consolas, monospace" font-size="14" fill="#ffa657" font-weight="bold">O(log n)</text>
  <text x="500" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">keyed data, pattern matching</text>
  <rect x="60" y="295" width="300" height="30" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="76" y="325" font-family="Consolas, monospace" font-size="15" fill="#7ee787">mapset  membership</text>
  <text x="390" y="316" font-family="Consolas, monospace" font-size="14" fill="#7ee787" font-weight="bold">O(1)</text>
  <text x="500" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">uniqueness, set algebra</text>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Structural sharing makes map 'copies' cheap; linked lists make tail edits expensive — pick accordingly.</text>
</svg>
