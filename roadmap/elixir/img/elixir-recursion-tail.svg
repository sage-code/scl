<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Body recursion vs tail calls</title>
  <desc>Body recursion keeps every frame until the end; a tail call with an accumulator reuses one frame.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Two ways to sum a list</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">h + sum(t) keeps frames; do_sum(t, acc + h) reuses the frame — constant stack.</text>
  <rect x="60" y="120" width="340" height="210" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="76" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">BODY recursion</text>
  <text x="76" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">h + sum_body(t)</text>
  <text x="80" y="170" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">frame n:   waiting for sum(t)</text>
  <text x="80" y="200" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">frame n-1: waiting ...</text>
  <text x="80" y="230" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">...</text>
  <text x="80" y="260" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">frame 1:   base case -> 0</text>
  <rect x="500" y="120" width="360" height="210" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="516" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">TAIL call + accumulator</text>
  <text x="516" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">do_sum(t, acc + h)</text>
  <text x="520" y="170" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">one frame reused per step:</text>
  <text x="520" y="200" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">do_sum([1,2,3], 0)</text>
  <text x="520" y="230" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">do_sum([2,3], 1)</text>
  <text x="520" y="260" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">do_sum([3], 3)</text>
  <text x="520" y="290" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">do_sum([], 6)  -> 6</text>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">The BEAM turns a last-action recursive call into a jump: loops run in constant stack space, any list length.</text>
</svg>
