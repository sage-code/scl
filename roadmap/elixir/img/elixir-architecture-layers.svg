<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>System layering</title>
  <desc>Dependencies point downward only: web code calls contexts; contexts own data and processes.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Where state lives, where boundaries sit</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">One Elixir system, three layers, one supervision tree.</text>
  <rect x="120" y="110" width="640" height="64" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="136" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">web layer</text>
  <text x="136" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Endpoint · Router · Controllers · LiveViews (transport only)</text>
  <rect x="120" y="190" width="640" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="136" y="220" font-family="Consolas, monospace" font-size="15" fill="#7ee787">contexts</text>
  <text x="136" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Billing · Identity · Catalog — the domain API</text>
  <rect x="120" y="270" width="300" height="64" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="136" y="300" font-family="Consolas, monospace" font-size="15" fill="#ffa657">processes</text>
  <text x="136" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">GenServers · Registry · ETS</text>
  <rect x="460" y="270" width="300" height="64" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="476" y="300" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">persistence</text>
  <text x="476" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Ecto · external services</text>
  <line x1="300" y1="174" x2="292" y2="186" stroke="#7ee787" stroke-width="2"/>
  <polygon points="300,186 291,182 291,190" fill="#7ee787"/>
  <line x1="620" y1="174" x2="612" y2="186" stroke="#7ee787" stroke-width="2"/>
  <polygon points="620,186 611,182 611,190" fill="#7ee787"/>
  <line x1="280" y1="254" x2="280" y2="266" stroke="#ffa657" stroke-width="2"/>
  <line x1="600" y1="254" x2="600" y2="266" stroke="#d2a8ff" stroke-width="2"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Nothing calls upward: a context must not import Plug.Conn — that single rule keeps domain code testable.</text>
</svg>
