<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>From mix release to deployment</title>
  <desc>The release bundles compiled code, configuration, and the runtime: deploy the directory, not a language install.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">The release pipeline</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">MIX_ENV=prod mix release — repeatable, self-contained, ops-friendly.</text>
  <rect x="40" y="130" width="180" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="160" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">mix deps.get</text>
  <text x="56" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">locked versions</text>
  <rect x="270" y="130" width="180" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="286" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">mix compile</text>
  <text x="286" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">to BEAM bytecode</text>
  <rect x="500" y="130" width="180" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="516" y="160" font-family="Consolas, monospace" font-size="15" fill="#ffa657">runtime.exs</text>
  <text x="516" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">evaluated at BOOT</text>
  <rect x="730" y="130" width="140" height="80" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="746" y="160" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">tarball</text>
  <text x="746" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the artifact</text>
  <line x1="226" y1="170" x2="258" y2="170" stroke="#7ee787" stroke-width="2"/>
  <polygon points="266,170 257,166 257,174" fill="#7ee787"/>
  <line x1="456" y1="170" x2="488" y2="170" stroke="#ffa657" stroke-width="2"/>
  <polygon points="496,170 487,166 487,174" fill="#ffa657"/>
  <line x1="686" y1="170" x2="718" y2="170" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="726,170 717,166 717,174" fill="#d2a8ff"/>
  <rect x="120" y="260" width="300" height="70" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="136" y="290" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">bin/my_app</text>
  <text x="136" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">start · daemon · remote · rpc</text>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">bin/my_app remote attaches an iex session to the LIVE node — the same IEx tools, pointed at production.</text>
</svg>
