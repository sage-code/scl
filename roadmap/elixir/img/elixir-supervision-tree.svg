<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>A supervision tree</title>
  <desc>Supervisors watch children; restart cascades stop at supervisor boundaries per strategy.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Restarts are local by design</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">one_for_one: a crashed child restarts alone. one_for_all / rest_for_one widen the blast radius deliberately.</text>
  <rect x="360" y="110" width="200" height="60" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="376" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">App supervisor</text>
  <text x="376" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">strategy: rest_for_one</text>
  <rect x="120" y="220" width="180" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="136" y="250" font-family="Consolas, monospace" font-size="15" fill="#7ee787">Registry</text>
  <text x="136" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">names</text>
  <rect x="360" y="220" width="180" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="376" y="250" font-family="Consolas, monospace" font-size="15" fill="#7ee787">Cache</text>
  <text x="376" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">GenServer</text>
  <rect x="600" y="220" width="220" height="60" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="616" y="250" font-family="Consolas, monospace" font-size="15" fill="#ffa657">Worker sup</text>
  <text x="616" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">strategy: one_for_one</text>
  <line x1="210" y1="176" x2="202" y2="216" stroke="#7ee787" stroke-width="2"/>
  <polygon points="210,216 201,212 201,220" fill="#7ee787"/>
  <line x1="450" y1="176" x2="442" y2="216" stroke="#7ee787" stroke-width="2"/>
  <polygon points="450,216 441,212 441,220" fill="#7ee787"/>
  <line x1="710" y1="176" x2="702" y2="216" stroke="#7ee787" stroke-width="2"/>
  <polygon points="710,216 701,212 701,220" fill="#7ee787"/>
  <rect x="560" y="320" width="140" height="50" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="576" y="350" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">worker 1</text>
  <rect x="720" y="320" width="140" height="50" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="736" y="350" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">worker 2</text>
  <line x1="710" y1="286" x2="632" y2="316" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="640,316 631,312 631,320" fill="#d2a8ff"/>
  <line x1="710" y1="286" x2="782" y2="316" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="790,316 781,312 781,320" fill="#d2a8ff"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Crash the Cache under rest_for_one and everything started AFTER it (the worker tree) restarts too — order encodes dependencies.</text>
</svg>
