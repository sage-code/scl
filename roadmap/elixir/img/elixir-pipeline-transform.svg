<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>A pipeline transformation</title>
  <desc>Each pipe step consumes one value and produces a new immutable one; nothing is mutated in place.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Data flowing through the pipe operator</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The same word-frequency pipeline from the syntax lesson, step by step.</text>
  <rect x="40" y="120" width="180" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">text</text>
  <text x="56" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Fun to learn, fun to ship</text>
  <rect x="240" y="120" width="180" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="256" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">downcase</text>
  <text x="256" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">fun to learn, fun to ship</text>
  <rect x="440" y="120" width="180" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="456" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">replace ","</text>
  <text x="456" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">fun to learn  fun to ship</text>
  <rect x="640" y="120" width="180" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="656" y="150" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">split</text>
  <text x="656" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">[six strings]</text>
  <line x1="226" y1="160" x2="266" y2="160" stroke="#7ee787" stroke-width="2"/>
  <polygon points="274,160 265,156 265,164" fill="#7ee787"/>
  <line x1="426" y1="160" x2="466" y2="160" stroke="#7ee787" stroke-width="2"/>
  <polygon points="474,160 465,156 465,164" fill="#7ee787"/>
  <line x1="626" y1="160" x2="666" y2="160" stroke="#7ee787" stroke-width="2"/>
  <polygon points="674,160 665,156 665,164" fill="#7ee787"/>
  <rect x="120" y="250" width="240" height="80" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="136" y="280" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">frequencies</text>
  <text x="136" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">%{fun: 2, to: 2 ...}</text>
  <rect x="480" y="250" width="280" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="496" y="280" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">IO.inspect</text>
  <text x="496" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">peek at any step, no side effects</text>
  <line x1="730" y1="160" x2="722" y2="218" stroke="#7ee787" stroke-width="2"/>
  <polygon points="730,218 721,214 721,222" fill="#7ee787"/>
  <line x1="730" y1="220" x2="240" y2="220" stroke="#7ee787" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="240" y1="220" x2="232" y2="246" stroke="#7ee787" stroke-width="2"/>
  <polygon points="240,246 231,242 231,250" fill="#7ee787"/>
  <line x1="480" y1="290" x2="366" y2="290" stroke="#7ee787" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Each step returns a NEW value — inserting IO.inspect between steps can never corrupt the result.</text>
</svg>
