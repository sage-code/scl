<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The BEAM runtime stack</title>
  <desc>Elixir compiles to BEAM bytecode alongside Erlang; OTP supplies processes and supervision on a preemptive scheduler.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">One language surface, one runtime</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Elixir and Erlang compile to the same bytecode and call each other freely — OTP is a shared library, not a framework choice.</text>
  <rect x="40" y="110" width="200" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">.ex / .exs source</text>
  <text x="56" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Elixir compiler</text>
  <rect x="300" y="110" width="200" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="316" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">.erl source</text>
  <text x="316" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Erlang compiler</text>
  <line x1="246" y1="150" x2="288" y2="150" stroke="#7ee787" stroke-width="2"/>
  <polygon points="296,150 287,146 287,154" fill="#7ee787"/>
  <text x="271.0" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">same AST family</text>
  <rect x="560" y="110" width="300" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="576" y="140" font-family="Consolas, monospace" font-size="15" fill="#ffa657">BEAM bytecode</text>
  <text x="576" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">modules, functions, attributes</text>
  <line x1="506" y1="150" x2="548" y2="150" stroke="#ffa657" stroke-width="2"/>
  <polygon points="556,150 547,146 547,154" fill="#ffa657"/>
  <rect x="40" y="230" width="400" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="56" y="260" font-family="Consolas, monospace" font-size="15" fill="#7ee787">OTP</text>
  <text x="56" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">GenServer · Supervisor · Registry · Task · app env</text>
  <rect x="500" y="230" width="360" height="90" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="516" y="260" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">BEAM scheduler + GC</text>
  <text x="516" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">preemptive slices, one heap per process</text>
  <line x1="240" y1="196" x2="232" y2="226" stroke="#7ee787" stroke-width="2"/>
  <polygon points="240,226 231,222 231,230" fill="#7ee787"/>
  <line x1="680" y1="196" x2="672" y2="226" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="680,226 671,222 671,230" fill="#ff7b72"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">A crash in one process never pauses another: heaps are isolated and collected individually, in microseconds.</text>
</svg>
