<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The Elixir toolchain</title>
  <desc>A version manager pins the OTP and Elixir pair; mix builds, hex fetches, and release packages the deployment artifact.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">From version manager to release</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Install the pair once; everything else ships with Elixir itself.</text>
  <rect x="40" y="120" width="180" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">mise / asdf</text>
  <text x="56" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">pins OTP 28 + Elixir 1.20</text>
  <rect x="280" y="120" width="160" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="296" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">iex</text>
  <text x="296" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">interactive shell</text>
  <rect x="500" y="120" width="160" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="516" y="150" font-family="Consolas, monospace" font-size="15" fill="#ffa657">mix</text>
  <text x="516" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">build · test · tasks</text>
  <rect x="720" y="120" width="150" height="80" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="736" y="150" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">hex</text>
  <text x="736" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">package registry</text>
  <line x1="226" y1="160" x2="268" y2="160" stroke="#7ee787" stroke-width="2"/>
  <polygon points="276,160 267,156 267,164" fill="#7ee787"/>
  <line x1="446" y1="160" x2="488" y2="160" stroke="#7ee787" stroke-width="2"/>
  <polygon points="496,160 487,156 487,164" fill="#7ee787"/>
  <line x1="666" y1="160" x2="708" y2="160" stroke="#7ee787" stroke-width="2"/>
  <polygon points="716,160 707,156 707,164" fill="#7ee787"/>
  <rect x="120" y="250" width="300" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="136" y="280" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">mix release</text>
  <text x="136" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">code + config + runtime</text>
  <rect x="520" y="250" width="280" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="536" y="280" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">deployment artifact</text>
  <text x="536" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">self-contained: no Erlang install</text>
  <line x1="426" y1="290" x2="506" y2="290" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="514,290 505,286 505,294" fill="#ff7b72"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">One Elixir version supports a specific OTP range — the pair (e.g. 1.20-otp-28) is the contract.</text>
</svg>
