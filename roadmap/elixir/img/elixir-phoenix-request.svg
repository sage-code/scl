<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The Phoenix request lifecycle</title>
  <desc>The conn flows through endpoint plugs, router pipelines, a controller, a context, and Ecto.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Every stage is a plain module</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Nothing is hidden in the framework: read it, reorder it, replace it.</text>
  <rect x="40" y="140" width="190" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="170" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">Endpoint</text>
  <text x="56" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">static, parsers, session</text>
  <rect x="250" y="140" width="190" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="266" y="170" font-family="Consolas, monospace" font-size="15" fill="#7ee787">Router</text>
  <text x="266" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">pipelines: browser / api</text>
  <rect x="460" y="140" width="190" height="90" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="476" y="170" font-family="Consolas, monospace" font-size="15" fill="#ffa657">Controller</text>
  <text x="476" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">params -> context -> render</text>
  <rect x="670" y="140" width="190" height="90" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="686" y="170" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">Context</text>
  <text x="686" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">domain logic, no web code</text>
  <line x1="236" y1="185" x2="278" y2="185" stroke="#7ee787" stroke-width="2"/>
  <polygon points="286,185 277,181 277,189" fill="#7ee787"/>
  <line x1="446" y1="185" x2="488" y2="185" stroke="#7ee787" stroke-width="2"/>
  <polygon points="496,185 487,181 487,189" fill="#7ee787"/>
  <line x1="656" y1="185" x2="698" y2="185" stroke="#7ee787" stroke-width="2"/>
  <polygon points="706,185 697,181 697,189" fill="#7ee787"/>
  <rect x="670" y="270" width="190" height="60" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="686" y="300" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">Ecto</text>
  <text x="686" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">queries + changesets</text>
  <line x1="765" y1="236" x2="757" y2="266" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="765,266 756,262 756,270" fill="#d2a8ff"/>
  <line x1="420" y1="236" x2="412" y2="300" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="420,300 411,296 411,304" fill="#58a6ff"/>
  <text x="420.0" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">render / json</text>
  <rect x="160" y="300" width="220" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="176" y="330" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">view / HEEx</text>
  <text x="176" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">template -> HTML</text>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Controllers call contexts; contexts know nothing about the web layer — the seam that scales with teams.</text>
</svg>
