<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>A BEAM cluster</title>
  <desc>Nodes sharing a cookie form a fully-connected mesh; messages and erpc calls cross nodes transparently.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Distribution is a runtime feature</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Node.connect(:"beta@host") with a shared cookie — then send/2 works across machines.</text>
  <rect x="80" y="130" width="280" height="130" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="96" y="160" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">alpha@host</text>
  <text x="96" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">processes + Registry + PubSub</text>
  <rect x="560" y="130" width="280" height="130" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="576" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">beta@host</text>
  <text x="576" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">processes + Registry + PubSub</text>
  <line x1="366" y1="175" x2="546" y2="175" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="554,175 545,171 545,179" fill="#d2a8ff"/>
  <text x="460.0" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">:erpc.call/4</text>
  <line x1="554" y1="215" x2="358" y2="215" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="366,215 357,211 357,219" fill="#d2a8ff"/>
  <text x="460.0" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">PubSub broadcast</text>
  <text x="300" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">TCP mesh: every node keeps a direct link to every node it has connected to.</text>
  <text x="40" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Net-split reality: both sides keep serving; keep authoritative state in Postgres and use the mesh for coordination.</text>
</svg>
