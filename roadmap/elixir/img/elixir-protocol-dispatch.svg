<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Protocol dispatch table</title>
  <desc>One describe/1 call routes to the implementation for the value's type — extensible by any module.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">One call, many implementations</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">defprotocol Render + defimpl per type; consolidated into one dispatch table at compile time.</text>
  <rect x="60" y="160" width="220" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="190" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">Render.to_text(v)</text>
  <text x="76" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">caller does not know the type</text>
  <rect x="420" y="90" width="260" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="436" y="120" font-family="Consolas, monospace" font-size="15" fill="#7ee787">Invoice impl</text>
  <text x="436" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Invoice A-1: $99</text>
  <rect x="420" y="180" width="260" height="64" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="436" y="210" font-family="Consolas, monospace" font-size="15" fill="#ffa657">Ticket impl</text>
  <text x="436" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Row 4, seat 12</text>
  <rect x="420" y="270" width="260" height="64" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="436" y="300" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">Integer impl</text>
  <text x="436" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">number: 7</text>
  <line x1="286" y1="200" x2="408" y2="122" stroke="#7ee787" stroke-width="2"/>
  <polygon points="416,122 407,118 407,126" fill="#7ee787"/>
  <line x1="286" y1="200" x2="408" y2="212" stroke="#ffa657" stroke-width="2"/>
  <polygon points="416,212 407,208 407,216" fill="#ffa657"/>
  <line x1="286" y1="200" x2="408" y2="302" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="416,302 407,298 407,306" fill="#d2a8ff"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Protocols dispatch on DATA type and extend types you do not own; behaviours are contracts for MODULES.</text>
</svg>
