<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>GenServer lifecycle</title>
  <desc>start_link calls init; handle_call and handle_cast process messages; handle_info receives everything else.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">One behaviour, four callbacks</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Every callback returns {reply, new_state} or {noreply, new_state} — the state is just data.</text>
  <rect x="60" y="110" width="220" height="60" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="140" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">start_link / init</text>
  <text x="76" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">returns initial state</text>
  <rect x="360" y="90" width="240" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="376" y="120" font-family="Consolas, monospace" font-size="15" fill="#7ee787">handle_call</text>
  <text x="376" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">caller BLOCKS for the reply</text>
  <rect x="360" y="180" width="240" height="64" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="376" y="210" font-family="Consolas, monospace" font-size="15" fill="#ffa657">handle_cast</text>
  <text x="376" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">fire-and-forget, no guarantee</text>
  <rect x="360" y="270" width="240" height="64" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="376" y="300" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">handle_info</text>
  <text x="376" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">timers, monitors, raw sends</text>
  <line x1="286" y1="140" x2="348" y2="122" stroke="#7ee787" stroke-width="2"/>
  <polygon points="356,122 347,118 347,126" fill="#7ee787"/>
  <line x1="286" y1="140" x2="348" y2="212" stroke="#ffa657" stroke-width="2"/>
  <polygon points="356,212 347,208 347,216" fill="#ffa657"/>
  <line x1="286" y1="140" x2="348" y2="302" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="356,302 347,298 347,306" fill="#d2a8ff"/>
  <rect x="680" y="180" width="190" height="64" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="696" y="210" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">new state</text>
  <text x="696" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">loops back to receive</text>
  <line x1="606" y1="154" x2="668" y2="212" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="676,212 667,208 667,216" fill="#ff7b72"/>
  <line x1="606" y1="244" x2="668" y2="212" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="676,212 667,208 667,216" fill="#ff7b72"/>
  <line x1="606" y1="334" x2="668" y2="212" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="676,212 667,208 667,216" fill="#ff7b72"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">A callback crash is the SUPERVISOR's problem, not the server's: state is lost, init/1 runs again.</text>
</svg>
