<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The LiveView cycle</title>
  <desc>mount assigns state; events and messages update assigns; only changed assigns diff over the socket.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">One process per browser session</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The server renders HTML; a WebSocket ships minimal diffs. No client framework required.</text>
  <rect x="60" y="130" width="200" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="160" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">mount</text>
  <text x="76" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">assign(socket, count: 0)</text>
  <rect x="320" y="60" width="260" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="336" y="90" font-family="Consolas, monospace" font-size="15" fill="#7ee787">handle_event</text>
  <text x="336" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">phx-click="increment"</text>
  <rect x="320" y="190" width="260" height="70" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="336" y="220" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">handle_info</text>
  <text x="336" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">PubSub broadcasts</text>
  <rect x="640" y="130" width="220" height="70" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="656" y="160" font-family="Consolas, monospace" font-size="15" fill="#ffa657">render + diff</text>
  <text x="656" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">only changed assigns</text>
  <line x1="266" y1="165" x2="308" y2="100" stroke="#7ee787" stroke-width="2"/>
  <polygon points="316,100 307,96 307,104" fill="#7ee787"/>
  <line x1="266" y1="165" x2="308" y2="220" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="316,220 307,216 307,224" fill="#d2a8ff"/>
  <line x1="586" y1="95" x2="628" y2="160" stroke="#ffa657" stroke-width="2"/>
  <polygon points="636,160 627,156 627,164" fill="#ffa657"/>
  <line x1="586" y1="225" x2="628" y2="175" stroke="#ffa657" stroke-width="2"/>
  <polygon points="636,175 627,171 627,179" fill="#ffa657"/>
  <line x1="750" y1="206" x2="742" y2="330" stroke="#ffa657" stroke-width="2"/>
  <polygon points="750,330 741,326 741,334" fill="#ffa657"/>
  <line x1="750" y1="330" x2="157" y2="330" stroke="#ffa657" stroke-width="2"/>
  <polygon points="165,330 156,326 156,334" fill="#ffa657"/>
  <text x="457.5" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">browser (WebSocket)</text>
  <line x1="165" y1="330" x2="157" y2="204" stroke="#ffa657" stroke-width="2"/>
  <polygon points="165,204 156,200 156,208" fill="#ffa657"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Streams patch single rows in large lists; Presence tracks connected users across the cluster.</text>
</svg>
