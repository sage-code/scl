<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Rebinding, not mutation</title>
  <desc>Map.put returns a new map; the old binding still sees the original value, so sharing stays safe.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Two bindings, two values, one shared structure</text>
  <text x="40" y="78" font-family="Consolas, monospace" font-size="15" fill="#9fb3c8">map = %{a: 1}   then   bigger = Map.put(map, :b, 2)</text>
  <rect x="120" y="120" width="280" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="136" y="150" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">map</text>
  <text x="136" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">%{a: 1}  (original, untouched)</text>
  <rect x="520" y="120" width="300" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="536" y="150" font-family="Consolas, monospace" font-size="15" fill="#7ee787">bigger</text>
  <text x="536" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">%{a: 1, b: 2}  (new value)</text>
  <line x1="406" y1="165" x2="506" y2="165" stroke="#7ee787" stroke-width="2"/>
  <polygon points="514,165 505,161 505,169" fill="#7ee787"/>
  <text x="460.0" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">Map.put/3</text>
  <text x="120" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e6edf3" font-weight="bold">Who sees what:</text>
  <text x="120" y="276" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">code holding map     -> %{a: 1}          (always)</text>
  <text x="120" y="298" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">code holding bigger  -> %{a: 1, b: 2}   (always)</text>
  <rect x="120" y="312" width="640" height="44" fill="#1f2a37" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="136" y="342" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">persistent data structure</text>
  <text x="136" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">only the changed path is new — a 'copy' of a 200k map takes microseconds</text>
  <text x="40" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Consequence: data can cross process boundaries with no locks — nobody can change a shared value behind your back.</text>
</svg>
