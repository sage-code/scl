<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Pattern matching flow</title>
  <desc>Clauses are tried in order; the first pattern that matches decides the branch and binds its variables.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">case File.read(path)</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">One value, three patterns, one selected branch — matching on SHAPE, not just value.</text>
  <rect x="60" y="150" width="160" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="180" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">value</text>
  <text x="76" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">{:error, :enoent}</text>
  <rect x="320" y="110" width="220" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="336" y="140" font-family="Consolas, monospace" font-size="15" fill="#7ee787">{:ok, body}</text>
  <text x="560" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">bind body -> parse(body)</text>
  <line x1="226" y1="185" x2="308" y2="142" stroke="#7ee787" stroke-width="2"/>
  <polygon points="316,142 307,138 307,146" fill="#7ee787"/>
  <rect x="320" y="200" width="220" height="64" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="336" y="230" font-family="Consolas, monospace" font-size="15" fill="#ffa657">{:error, :enoent}</text>
  <text x="560" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">specific error -> friendly message</text>
  <line x1="226" y1="185" x2="308" y2="232" stroke="#ffa657" stroke-width="2"/>
  <polygon points="316,232 307,228 307,236" fill="#ffa657"/>
  <rect x="320" y="290" width="220" height="64" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="336" y="320" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">{:error, reason}</text>
  <text x="560" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">any other reason -> bind reason</text>
  <line x1="226" y1="185" x2="308" y2="322" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="316,322 307,318 307,326" fill="#ff7b72"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Clause ORDER matters: specific patterns first, catch-alls last. A guard can refine any pattern.</text>
</svg>
