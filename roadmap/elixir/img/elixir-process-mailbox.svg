<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>A process and its mailbox</title>
  <desc>Messages queue in the mailbox; the process consumes them one at a time, updating private state.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">The actor model on the BEAM</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">senders cannot touch state — they can only leave messages. The mailbox serializes everything.</text>
  <rect x="40" y="130" width="180" height="64" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="160" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">sender A</text>
  <text x="56" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">send(pid, msg)</text>
  <rect x="40" y="220" width="180" height="64" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="56" y="250" font-family="Consolas, monospace" font-size="15" fill="#ffa657">sender B</text>
  <text x="56" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">send(pid, msg)</text>
  <rect x="300" y="130" width="220" height="154" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="316" y="160" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">mailbox</text>
  <text x="316" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">FIFO queue of messages</text>
  <text x="316" y="210" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">{:ping, pid}</text>
  <text x="316" y="234" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">{:get, pid}</text>
  <text x="316" y="258" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">{:increment, pid}</text>
  <line x1="226" y1="162" x2="288" y2="170" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="296,170 287,166 287,174" fill="#58a6ff"/>
  <line x1="226" y1="252" x2="288" y2="244" stroke="#ffa657" stroke-width="2"/>
  <polygon points="296,244 287,240 287,248" fill="#ffa657"/>
  <rect x="600" y="130" width="260" height="154" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="616" y="160" font-family="Consolas, monospace" font-size="15" fill="#7ee787">process</text>
  <text x="616" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">receive one message at a
time; state is private</text>
  <line x1="526" y1="200" x2="588" y2="200" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="596,200 587,196 587,204" fill="#d2a8ff"/>
  <text x="561.0" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">receive</text>
  <rect x="600" y="300" width="260" height="56" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="616" y="330" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">reply</text>
  <text x="616" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">send(caller, result)</text>
  <line x1="730" y1="290" x2="722" y2="296" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="730,296 721,292 721,300" fill="#ff7b72"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">State never needs locking: the mailbox IS the serialization point. One overloaded sender cannot corrupt another.</text>
</svg>
