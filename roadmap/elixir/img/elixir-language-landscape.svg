<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img">
  <title>Language positioning map</title>
  <desc>Plotting C, Rust, Go, Python, Ruby and Elixir by concurrency model and fault-tolerance guarantees.</desc>

  <rect x="0" y="0" width="920" height="430" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">What each runtime optimizes</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Axes: horizontal = concurrency model (shared state to isolated actors); vertical = fault tolerance (manual to built-in).</text>
  <line x1="90" y1="370" x2="850" y2="370" stroke="#7ee787" stroke-width="2"/>
  <line x1="90" y1="370" x2="90" y2="120" stroke="#7ee787" stroke-width="2"/>
  <text x="700" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">shared state  —>  isolated actors</text>
  <text x="98" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">fault tolerance</text>
  <rect x="150" y="320" width="130" height="64" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="166" y="350" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">C</text>
  <text x="166" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">manual memory</text>
  <text x="166" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">none</text>
  <rect x="300" y="300" width="130" height="64" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="316" y="330" font-family="Consolas, monospace" font-size="15" fill="#ffa657">Rust</text>
  <text x="316" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">threads, no races</text>
  <text x="316" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">Result types</text>
  <rect x="450" y="320" width="130" height="64" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="466" y="350" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">Go</text>
  <text x="466" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">goroutines</text>
  <text x="466" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">panic/recover</text>
  <rect x="600" y="300" width="130" height="64" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="616" y="330" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">Python</text>
  <text x="616" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">GIL / asyncio</text>
  <text x="616" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">none</text>
  <rect x="730" y="330" width="130" height="64" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="746" y="360" font-family="Consolas, monospace" font-size="15" fill="#ffa657">Ruby</text>
  <text x="746" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">GIL threads</text>
  <text x="746" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">none</text>
  <rect x="700" y="150" width="130" height="64" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="716" y="180" font-family="Consolas, monospace" font-size="15" fill="#7ee787">Elixir</text>
  <text x="716" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">actors on the BEAM</text>
  <text x="716" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">supervision trees</text>
  <text x="40" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Elixir sits in the corner where concurrency and fault tolerance are runtime guarantees, not library choices.</text>
</svg>
