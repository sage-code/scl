<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>Nx execution model</title>
  <desc>defn code is compiled to a native backend by EXLA; ordinary Elixir processes orchestrate it.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">Elixir orchestrates, native code computes</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The same defn function runs on CPU, GPU, or TPU depending on the backend.</text>
  <rect x="60" y="140" width="200" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="76" y="170" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">Elixir process</text>
  <text x="76" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">fetch, schedule, respond</text>
  <rect x="320" y="140" width="200" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="336" y="170" font-family="Consolas, monospace" font-size="15" fill="#7ee787">defn softmax(t)</text>
  <text x="336" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">pure tensor operations</text>
  <rect x="580" y="140" width="140" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="596" y="170" font-family="Consolas, monospace" font-size="15" fill="#ffa657">EXLA / Torchx</text>
  <text x="596" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">JIT compile</text>
  <rect x="760" y="140" width="110" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="776" y="170" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">CPU/GPU/TPU</text>
  <text x="776" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">native execution</text>
  <line x1="266" y1="180" x2="308" y2="180" stroke="#7ee787" stroke-width="2"/>
  <polygon points="316,180 307,176 307,184" fill="#7ee787"/>
  <line x1="526" y1="180" x2="568" y2="180" stroke="#ffa657" stroke-width="2"/>
  <polygon points="576,180 567,176 567,184" fill="#ffa657"/>
  <line x1="726" y1="180" x2="748" y2="180" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="756,180 747,176 747,184" fill="#ff7b72"/>
  <rect x="320" y="270" width="400" height="60" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="336" y="300" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">Nx.Serving</text>
  <text x="336" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">batched, supervised inference for many callers</text>
  <line x1="460" y1="226" x2="452" y2="266" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="460,266 451,262 451,270" fill="#d2a8ff"/>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Bumblebee rides this pipeline: pretrained models served behind a supervised, batching GenServer.</text>
</svg>
