<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img">
  <title>The Ecto flow</title>
  <desc>User params flow through a schema, a changeset pipeline of validations, and the Repo into the database.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e6edf3" font-weight="bold">schema -> changeset -> repo</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Invalid input never reaches the database; errors accumulate in a struct you can render.</text>
  <rect x="40" y="140" width="180" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="56" y="170" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">params</text>
  <text x="56" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">%{"email" => "nope"}</text>
  <rect x="270" y="140" width="200" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="286" y="170" font-family="Consolas, monospace" font-size="15" fill="#7ee787">schema</text>
  <text x="286" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">types, defaults, associations</text>
  <rect x="520" y="140" width="200" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="536" y="170" font-family="Consolas, monospace" font-size="15" fill="#ffa657">changeset</text>
  <text x="536" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">cast -> validate -> constrain</text>
  <rect x="760" y="140" width="110" height="80" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="6"/>
  <text x="776" y="170" font-family="Consolas, monospace" font-size="15" fill="#d2a8ff">Repo</text>
  <text x="776" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">insert / update</text>
  <line x1="226" y1="180" x2="258" y2="180" stroke="#7ee787" stroke-width="2"/>
  <polygon points="266,180 257,176 257,184" fill="#7ee787"/>
  <line x1="476" y1="180" x2="508" y2="180" stroke="#ffa657" stroke-width="2"/>
  <polygon points="516,180 507,176 507,184" fill="#ffa657"/>
  <line x1="726" y1="180" x2="748" y2="180" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="756,180 747,176 747,184" fill="#d2a8ff"/>
  <rect x="520" y="260" width="200" height="60" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="536" y="290" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">errors map</text>
  <text x="536" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">render to the API client</text>
  <line x1="620" y1="226" x2="612" y2="256" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="620,256 611,252 611,260" fill="#ff7b72"/>
  <text x="620.0" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="middle">invalid?</text>
  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Queries are macros compiled against the schema — a typo'd field is a compile error, not an injection.</text>
</svg>
