<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 262" role="img" aria-labelledby="title desc">
  <title id="title">Choose an online C# tool</title>
  <desc id="desc">Decision diagram: try a snippet, build a project, or understand the compiler.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8794"/>
    </marker>
    <style>
      .head { font-family: system-ui, sans-serif; font-size: 16px; fill: #e7ecf3; }
      .dec  { font-family: system-ui, sans-serif; font-size: 15px; fill: #e7ecf3; }
      .tool { font-family: system-ui, sans-serif; font-size: 13px; fill: #cfd6e0; }
    </style>
  </defs>

  <rect x="40" y="12" width="700" height="38" rx="8" fill="#1f2430" stroke="#3f4854"/>
  <text x="390" y="36" class="head" text-anchor="middle">C# without installing — what do you want to do?</text>

  <rect x="60" y="82" width="220" height="48" rx="8" fill="#273142" stroke="#7c5cff"/>
  <text x="170" y="111" class="dec" text-anchor="middle">Try a quick snippet</text>
  <line x1="170" y1="130" x2="170" y2="160" stroke="#7c8794" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="166" width="220" height="76" rx="8" fill="#1f2430" stroke="#3f4854"/>
  <text x="170" y="194" class="tool" text-anchor="middle">.NET Fiddle</text>
  <text x="170" y="216" class="tool" text-anchor="middle">Programiz · OneCompiler</text>

  <rect x="280" y="82" width="220" height="48" rx="8" fill="#273142" stroke="#7c5cff"/>
  <text x="390" y="111" class="dec" text-anchor="middle">Build a real project</text>
  <line x1="390" y1="130" x2="390" y2="160" stroke="#7c8794" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="166" width="220" height="76" rx="8" fill="#1f2430" stroke="#3f4854"/>
  <text x="390" y="194" class="tool" text-anchor="middle">Replit</text>
  <text x="390" y="216" class="tool" text-anchor="middle">Gitpod · Codespaces</text>

  <rect x="500" y="82" width="220" height="48" rx="8" fill="#273142" stroke="#7c5cff"/>
  <text x="610" y="111" class="dec" text-anchor="middle">Understand the compiler</text>
  <line x1="610" y1="130" x2="610" y2="160" stroke="#7c8794" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="166" width="220" height="76" rx="8" fill="#1f2430" stroke="#3f4854"/>
  <text x="610" y="194" class="tool" text-anchor="middle">SharpLab</text>
  <text x="610" y="216" class="tool" text-anchor="middle">see IL + JIT output</text>
</svg>
