<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" role="img" aria-labelledby="t d">
<title id="t">Backtracking search tree for combination sum</title>
<desc id="d">Numbers 2, 3 and 5 must add up to 5, each usable repeatedly. The search tree shows partial sums, the two solutions [2,3] and [5], one dead end [2,2], and branches that are pruned because the next number is larger than what is still needed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Combination sum: candidates {2, 3, 5}, target 5</text>
<line x1="380" y1="102" x2="190" y2="158" stroke="#475569" stroke-width="1.6"/>
<text x="273.0" y="132.0" font-family="sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold">+2</text>
<line x1="380" y1="102" x2="470" y2="158" stroke="#475569" stroke-width="1.6"/>
<text x="437.0" y="132.0" font-family="sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold">+3</text>
<line x1="380" y1="102" x2="650" y2="158" stroke="#475569" stroke-width="1.6"/>
<text x="527.0" y="132.0" font-family="sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold">+5</text>
<line x1="190" y1="202" x2="100" y2="258" stroke="#475569" stroke-width="1.6"/>
<text x="133.0" y="232.0" font-family="sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold">+2</text>
<line x1="190" y1="202" x2="230" y2="258" stroke="#475569" stroke-width="1.6"/>
<text x="222.0" y="232.0" font-family="sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold">+3</text>
<line x1="190" y1="202" x2="350" y2="258" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="282.0" y="232.0" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="bold">+5</text>
<line x1="470" y1="202" x2="450" y2="258" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="448.0" y="232.0" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="bold">+3</text>
<line x1="470" y1="202" x2="570" y2="258" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="532.0" y="232.0" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="bold">+5</text>
<line x1="100" y1="302" x2="100" y2="358" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="112.0" y="332.0" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="bold">+2, +3, +5</text>
<rect x="332" y="58" width="96" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="380" y="77" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">[ ]</text>
<text x="380" y="94" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">need 5</text>
<rect x="142" y="158" width="96" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="190" y="177" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">[2]</text>
<text x="190" y="194" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">need 3</text>
<rect x="422" y="158" width="96" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="470" y="177" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">[3]</text>
<text x="470" y="194" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">need 2</text>
<rect x="602" y="158" width="96" height="44" rx="8" fill="#34d399" stroke="#34d399" stroke-width="2"/>
<text x="650" y="177" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">[5]</text>
<text x="650" y="194" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">need 0  ✓</text>
<rect x="52" y="258" width="96" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<text x="100" y="277" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">[2,2]</text>
<text x="100" y="294" font-family="sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">need 1: dead end</text>
<rect x="182" y="258" width="96" height="44" rx="8" fill="#34d399" stroke="#34d399" stroke-width="2"/>
<text x="230" y="277" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">[2,3]</text>
<text x="230" y="294" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">need 0  ✓</text>
<rect x="302" y="258" width="96" height="44" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
<text x="350" y="277" font-family="monospace" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">[2,5]</text>
<text x="350" y="294" font-family="sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">5 &gt; 3: pruned</text>
<rect x="402" y="258" width="96" height="44" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
<text x="450" y="277" font-family="monospace" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">[3,3]</text>
<text x="450" y="294" font-family="sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">3 &gt; 2: pruned</text>
<rect x="522" y="258" width="96" height="44" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
<text x="570" y="277" font-family="monospace" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">[3,5]</text>
<text x="570" y="294" font-family="sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">5 &gt; 2: pruned</text>
<rect x="52" y="358" width="96" height="44" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
<text x="100" y="377" font-family="monospace" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">[2,2,…]</text>
<text x="100" y="394" font-family="sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">all &gt; 1: pruned</text>
<text x="740" y="340" font-family="sans-serif" font-size="12" fill="#34d399" text-anchor="end">green: solution</text>
<text x="740" y="360" font-family="sans-serif" font-size="12" fill="#f59e0b" text-anchor="end">orange: dead end</text>
<text x="740" y="380" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="end">red dashed: never visited</text>
<text x="740" y="400" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">(the sorted loop stops at the first number too big)</text>
</svg>
