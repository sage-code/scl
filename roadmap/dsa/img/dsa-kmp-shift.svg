<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-labelledby="t d">
<title id="t">KMP shift after a mismatch</title>
<desc id="d">The pattern abcabd is compared with the text abcabcabd. Five characters match and the sixth differs. The longest border of the matched part abcab is ab, so the pattern slides by three and the two characters ab need not be compared again; the rest matches.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">A mismatch never moves the text pointer back</text>
<text x="104.0" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0</text>
<text x="172.0" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">1</text>
<text x="240.0" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">2</text>
<text x="308.0" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">3</text>
<text x="376.0" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">4</text>
<text x="444.0" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">5</text>
<text x="512.0" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">6</text>
<text x="580.0" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">7</text>
<text x="648.0" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">8</text>
<text x="20" y="89" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">text</text>
<rect x="73" y="64" width="62" height="38" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="104.0" y="89" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">a</text>
<rect x="141" y="64" width="62" height="38" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="172.0" y="89" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">b</text>
<rect x="209" y="64" width="62" height="38" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="240.0" y="89" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">c</text>
<rect x="277" y="64" width="62" height="38" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="308.0" y="89" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">a</text>
<rect x="345" y="64" width="62" height="38" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="376.0" y="89" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">b</text>
<rect x="413" y="64" width="62" height="38" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="444.0" y="89" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">c</text>
<rect x="481" y="64" width="62" height="38" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="512.0" y="89" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">a</text>
<rect x="549" y="64" width="62" height="38" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="580.0" y="89" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">b</text>
<rect x="617" y="64" width="62" height="38" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="648.0" y="89" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">d</text>
<text x="20" y="165" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">try 1</text>
<rect x="73" y="140" width="62" height="38" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="104.0" y="165" font-family="monospace" font-size="17" fill="#34d399" text-anchor="middle" font-weight="bold">a</text>
<rect x="141" y="140" width="62" height="38" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="172.0" y="165" font-family="monospace" font-size="17" fill="#34d399" text-anchor="middle" font-weight="bold">b</text>
<rect x="209" y="140" width="62" height="38" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="240.0" y="165" font-family="monospace" font-size="17" fill="#34d399" text-anchor="middle" font-weight="bold">c</text>
<rect x="277" y="140" width="62" height="38" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="308.0" y="165" font-family="monospace" font-size="17" fill="#34d399" text-anchor="middle" font-weight="bold">a</text>
<rect x="345" y="140" width="62" height="38" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="376.0" y="165" font-family="monospace" font-size="17" fill="#34d399" text-anchor="middle" font-weight="bold">b</text>
<rect x="413" y="140" width="62" height="38" rx="5" fill="#ef4444" stroke="#ef4444" stroke-width="1.5"/>
<text x="444.0" y="165" font-family="monospace" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">d</text>
<text x="444.0" y="198" font-family="monospace" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="bold">d ≠ c</text>
<polyline points="308.0,214 308.0,240" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320.0" y="233" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">slide by 5 - pi[4] = 3</text>
<text x="20" y="275" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">try 2</text>
<rect x="277" y="250" width="62" height="38" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="308.0" y="275" font-family="monospace" font-size="17" fill="#3b82f6" text-anchor="middle" font-weight="bold">a</text>
<rect x="345" y="250" width="62" height="38" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="376.0" y="275" font-family="monospace" font-size="17" fill="#3b82f6" text-anchor="middle" font-weight="bold">b</text>
<rect x="413" y="250" width="62" height="38" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="444.0" y="275" font-family="monospace" font-size="17" fill="#34d399" text-anchor="middle" font-weight="bold">c</text>
<rect x="481" y="250" width="62" height="38" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="512.0" y="275" font-family="monospace" font-size="17" fill="#34d399" text-anchor="middle" font-weight="bold">a</text>
<rect x="549" y="250" width="62" height="38" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="580.0" y="275" font-family="monospace" font-size="17" fill="#34d399" text-anchor="middle" font-weight="bold">b</text>
<rect x="617" y="250" width="62" height="38" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="648.0" y="275" font-family="monospace" font-size="17" fill="#34d399" text-anchor="middle" font-weight="bold">d</text>
<text x="342" y="308" font-family="sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle">ab: already known to match</text>
<text x="546" y="308" font-family="sans-serif" font-size="12" fill="#34d399" text-anchor="middle">compared: c a b d</text>
<text x="20" y="350" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="start">pattern  a  b  c  a  b  d</text>
<text x="20" y="372" font-family="monospace" font-size="13" fill="#f59e0b" text-anchor="start">pi       0  0  0  1  2  0</text>
<text x="330" y="350" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">pi[i] = longest proper prefix of pattern[:i+1]</text>
<text x="330" y="370" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">that is also a suffix of it (the border)</text>
</svg>
