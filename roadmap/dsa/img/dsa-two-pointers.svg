<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img" aria-labelledby="t d">
<title id="t">Two pointers and sliding window</title>
<desc id="d">Top: lo and hi pointers move toward each other over a sorted array. Bottom: a window of three cells slides right; one element enters and one leaves.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="680" height="380" fill="#0f172a"/>
