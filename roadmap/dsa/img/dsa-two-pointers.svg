<text x="525.0" y="176" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">hi ← moves left</text>
<text x="81.0" y="140" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">discarded</text>
