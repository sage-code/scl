<text x="451.0" y="328" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">enters (right)</text>
<text x="340.0" y="362" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">window [5 1 3] sum 9  →  next window [1 3 2] sum 9 - 5 + 2 = 6</text>
