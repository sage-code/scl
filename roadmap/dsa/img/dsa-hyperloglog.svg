<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-labelledby="t d">
<title id="t">HyperLogLog</title>
<desc id="d">A 64-bit hash is split. The first four bits, 0101, select register 5. The rest starts with three zeros then a one, so the rank is 4. Register 5 keeps the maximum rank seen. The estimate combines all sixteen registers with a harmonic mean.</desc>
