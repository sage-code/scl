<text x="60" y="290" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="start">register 5 := max(its old value, 4)</text>
<text x="60" y="320" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="start">estimate = alpha * m^2 / sum(2^-register)      (harmonic mean of the registers)</text>
<text x="60" y="348" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="bold">m = 2^14 = 16384 registers: 16 KB, standard error 1.04 / sqrt(m) = 0.81%</text>
<text x="60" y="376" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">the same item always hits the same register with the same rank: duplicates change nothing</text>
