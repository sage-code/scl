<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" aria-labelledby="t d">
<title id="t">Hash table with separate chaining</title>
<desc id="d">Eight buckets. apple and cherry both hash to bucket 3 and share a chain; banana and fig share bucket 1; date is alone in bucket 6.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="680" height="400" fill="#0f172a"/>
<text x="340.0" y="28" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Separate chaining: bucket = hash(key) % 8</text>
<rect x="20" y="60" width="170" height="190" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="105" y="84" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">hash(key) % 8</text>
<text x="40" y="116" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">apple  → 3</text>
<text x="40" y="144" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">banana → 1</text>
<text x="40" y="172" font-family="monospace" font-size="13" fill="#f59e0b" text-anchor="start">cherry → 3</text>
<text x="40" y="200" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">date   → 6</text>
<text x="40" y="228" font-family="monospace" font-size="13" fill="#f59e0b" text-anchor="start">fig    → 1</text>
<text x="105" y="276" font-family="sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">orange = collision</text>
<rect x="230" y="56" width="70" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="265.0" y="77" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">[0]</text>
<rect x="230" y="96" width="70" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="265.0" y="117" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">[1]</text>
<polyline points="300,112.0 338,112.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="96" width="120" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="400" y="117" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">banana</text>
<polyline points="460,112.0 488,112.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="490" y="96" width="120" height="32" rx="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="550" y="117" font-family="monospace" font-size="13" fill="#0f172a" text-anchor="middle">fig</text>
<rect x="230" y="136" width="70" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="265.0" y="157" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">[2]</text>
<rect x="230" y="176" width="70" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="265.0" y="197" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">[3]</text>
<polyline points="300,192.0 338,192.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="176" width="120" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="400" y="197" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">apple</text>
<polyline points="460,192.0 488,192.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="490" y="176" width="120" height="32" rx="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="550" y="197" font-family="monospace" font-size="13" fill="#0f172a" text-anchor="middle">cherry</text>
<rect x="230" y="216" width="70" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="265.0" y="237" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">[4]</text>
<rect x="230" y="256" width="70" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="265.0" y="277" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">[5]</text>
<rect x="230" y="296" width="70" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="265.0" y="317" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">[6]</text>
<polyline points="300,312.0 338,312.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="296" width="120" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="400" y="317" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">date</text>
<rect x="230" y="336" width="70" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="265.0" y="357" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">[7]</text>
<text x="340.0" y="390" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">load factor = 5 entries / 8 buckets = 0.625 — resize (double) when it exceeds 0.75</text>
</svg>
