<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img" aria-labelledby="t d">
<title id="t">Binary search tree search path</title>
<desc id="d">BST with root 8. Searching for 7 visits 8, 3, 6, 7: smaller goes left, larger goes right.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="680" height="380" fill="#0f172a"/>
<text x="340.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Search for 7: one comparison per level, O(h)</text>
<line x1="340" y1="90" x2="190" y2="136" stroke="#3b82f6" stroke-width="3"/>
<line x1="340" y1="90" x2="490" y2="136" stroke="#475569" stroke-width="1.5"/>
