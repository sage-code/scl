<line x1="570" y1="250" x2="520" y2="296" stroke="#475569" stroke-width="1.5"/>
<rect x="312.0" y="56" width="56" height="34" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
