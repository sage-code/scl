<rect x="162.0" y="136" width="56" height="34" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="190" y="158.0" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle">3</text>
<rect x="462.0" y="136" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="490" y="158.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">10</text>
