<text x="236" y="104" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="end">7 &lt; 8 → left</text>
<text x="250" y="184" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="start">7 &gt; 3 → right</text>
