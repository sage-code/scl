<text x="320" y="318.0" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle">7</text>
<rect x="492.0" y="296" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
