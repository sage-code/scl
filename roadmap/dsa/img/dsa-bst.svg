<text x="110" y="238.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">1</text>
<rect x="242.0" y="216" width="56" height="34" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="270" y="238.0" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle">6</text>
<rect x="542.0" y="216" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="570" y="238.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">14</text>
<rect x="192.0" y="296" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="220" y="318.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">4</text>
