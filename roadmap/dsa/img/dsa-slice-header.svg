<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img" aria-labelledby="t d">
<title id="t">Go slice header and backing array</title>
<desc id="d">Slice s points at index 0 with len 5 cap 5; slice t = s[1:3] points at index 1 with len 2 cap 4; both share one array.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="680" height="380" fill="#0f172a"/>
<text x="340.0" y="28" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">t := s[1:3] shares s's backing array</text>
<text x="180.0" y="58" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">slice header s</text>
<rect x="80" y="68" width="200" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="180.0" y="88" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">ptr</text>
<rect x="80" y="102" width="200" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="180.0" y="122" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">len = 5</text>
<rect x="80" y="136" width="200" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="180.0" y="156" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">cap = 5</text>
<polyline points="80,83.0 58,83.0 58,214 118.0,214 118.0,248" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="58" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">slice header t</text>
<rect x="400" y="68" width="200" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="500.0" y="88" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">ptr</text>
<rect x="400" y="102" width="200" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="500.0" y="122" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">len = 2</text>
<rect x="400" y="136" width="200" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="500.0" y="156" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">cap = 4</text>
<polyline points="400,83.0 378,83.0 378,214 226.0,214 226.0,248" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="334.0" y="240" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">backing array</text>
<rect x="70" y="250" width="96" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="118.0" y="278" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">1</text>
<text x="118.0" y="312" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[0]</text>
<rect x="178" y="250" width="96" height="44" rx="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="226.0" y="278" font-family="monospace" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">99</text>
<text x="226.0" y="312" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[1]</text>
<rect x="286" y="250" width="96" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="334.0" y="278" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">3</text>
<text x="334.0" y="312" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[2]</text>
<rect x="394" y="250" width="96" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="442.0" y="278" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">4</text>
<text x="442.0" y="312" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[3]</text>
<rect x="502" y="250" width="96" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="550.0" y="278" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">5</text>
<text x="550.0" y="312" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[4]</text>
<polyline points="178,320 178,326 382,326 382,320" fill="none" stroke="#3b82f6" stroke-width="2"/>
<text x="280.0" y="342" font-family="monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">len(t) = 2</text>
<polyline points="178,350 178,356 598,356 598,350" fill="none" stroke="#3b82f6" stroke-width="2"/>
<text x="388.0" y="372" font-family="monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">cap(t) = 4</text>
<text x="598" y="240" font-family="sans-serif" font-size="12" fill="#f59e0b" text-anchor="end">t[0] = 99 changed s[1]</text>
</svg>
