<text x="452" y="80" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="start" font-weight="bold">Three sets stop attacks</text>
<text x="452" y="110" font-family="sans-serif" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="bold">column (c)</text>
<text x="452" y="130" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">0 4 7 5 2 6 1 3</text>
<text x="452" y="166" font-family="sans-serif" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="bold">diagonal (r − c)</text>
<text x="452" y="186" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">0 −3 −5 −2 2 −1 5 4</text>
<text x="452" y="222" font-family="sans-serif" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="bold">anti-diagonal (r + c)</text>
<text x="452" y="242" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">0 5 9 8 6 11 7 10</text>
<text x="452" y="282" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">All values in a row are different,</text>
<text x="452" y="300" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">so no two queens share a line.</text>
<text x="452" y="332" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">The search places one queen per row</text>
<text x="452" y="350" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">and only tries columns where all three</text>
<text x="452" y="368" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">values are still unused.</text>
