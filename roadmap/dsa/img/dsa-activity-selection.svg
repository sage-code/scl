<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" role="img" aria-labelledby="t d">
<title id="t">Activity selection by earliest end time</title>
<desc id="d">Eleven meetings sorted by end time. Scanning top to bottom, a meeting is taken when it starts at or after the end of the last taken one: [1,4), [5,7), [8,11) and [12,16).</desc>
