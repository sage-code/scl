<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" role="img" aria-labelledby="t d">
<title id="t">Consistent hashing ring</title>
<desc id="d">Servers A, B and C are hashed to several points each on a circle. A key belongs to the first server point met walking clockwise from the key. When server D is added, it takes over only the arc just before each of its points.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Consistent hashing: walk clockwise to the first server</text>
<circle cx="250" cy="225" r="140" fill="none" stroke="#475569" stroke-width="4"/>
<polyline points="169.7,339.7 163.2,334.8 156.9,329.6 151.0,324.0 145.4,318.1 140.2,311.8 135.3,305.3 130.8,298.5 126.8,291.4 123.1,284.2 119.9,276.7 117.1,269.0 114.8,261.2" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
<circle cx="297.9" cy="93.4" r="14" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
<text x="297.9" y="98.4" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text>
<circle cx="385.2" cy="188.8" r="14" fill="#34d399" stroke="#0f172a" stroke-width="2"/>
<text x="385.2" y="193.8" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">B</text>
<circle cx="357.2" cy="315.0" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
<text x="357.2" y="320.0" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">C</text>
<circle cx="274.3" cy="362.9" r="14" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
<text x="274.3" y="367.9" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text>
<circle cx="169.7" cy="339.7" r="14" fill="#34d399" stroke="#0f172a" stroke-width="2"/>
<text x="169.7" y="344.7" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">B</text>
<circle cx="114.8" cy="261.2" r="14" fill="#ef4444" stroke="#0f172a" stroke-width="2"/>
<text x="114.8" y="266.2" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">D</text>
<circle cx="128.8" cy="155.0" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
<text x="128.8" y="160.0" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">C</text>
<circle cx="190.8" cy="98.1" r="14" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
<text x="190.8" y="103.1" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text>
<circle cx="322.1" cy="152.9" r="5" fill="#e2e8f0"/>
<text x="322.1" y="142.9" font-family="monospace" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="bold">k1</text>
<circle cx="301.0" cy="313.3" r="5" fill="#e2e8f0"/>
<text x="301.0" y="303.3" font-family="monospace" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="bold">k2</text>
<circle cx="161.7" cy="276.0" r="5" fill="#e2e8f0"/>
<text x="161.7" y="266.0" font-family="monospace" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="bold">k3</text>
<text x="250" y="219" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">hash space</text>
<text x="250" y="237" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">0 ... 2^64</text>
<text x="260" y="73" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">clockwise &#8635;</text>
<text x="470" y="80" font-family="sans-serif" font-size="15" fill="#e2e8f0" text-anchor="start" font-weight="bold">Lookup</text>
<text x="470" y="104" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">k1 (45&#176;)  &#8594; next point 75&#176;: B</text>
<text x="470" y="126" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">k2 (150&#176;) &#8594; next point 170&#176;: A</text>
<text x="470" y="148" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">k3 (240&#176;) &#8594; before D: C at 300&#176;</text>
<text x="470" y="200" font-family="sans-serif" font-size="15" fill="#ef4444" text-anchor="start" font-weight="bold">Add server D (red arc)</text>
<text x="470" y="224" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">k3 now lands on D.</text>
<text x="470" y="246" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">Every key outside the red arc</text>
<text x="470" y="268" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">keeps its server.</text>
<text x="470" y="320" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="start">hash(key) % N: about N/(N+1)</text>
<text x="470" y="342" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="start">of the keys move.</text>
<text x="470" y="372" font-family="monospace" font-size="13" fill="#34d399" text-anchor="start" font-weight="bold">ring: about 1/(N+1) move.</text>
<text x="470" y="398" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">Many points per server (virtual</text>
<text x="470" y="416" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">nodes) balance the load.</text>
</svg>
