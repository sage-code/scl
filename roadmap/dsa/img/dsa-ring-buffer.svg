<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" role="img" aria-labelledby="t d">
<title id="t">Ring buffer queue</title>
<desc id="d">Eight slots; elements a and b in slots 6 and 7, c and d wrapped into slots 0 and 1. head is 6 and tail is 2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="680" height="300" fill="#0f172a"/>
<text x="340.0" y="28" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Ring buffer: head = 6, size = 4, capacity 8</text>
<rect x="49.0" y="110" width="64" height="48" rx="4" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="81.0" y="140.0" font-family="monospace" font-size="16" fill="#0f172a" text-anchor="middle">c</text>
<rect x="123.0" y="110" width="64" height="48" rx="4" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="155.0" y="140.0" font-family="monospace" font-size="16" fill="#0f172a" text-anchor="middle">d</text>
<rect x="197.0" y="110" width="64" height="48" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="229.0" y="140.0" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle"></text>
<rect x="271.0" y="110" width="64" height="48" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="303.0" y="140.0" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle"></text>
<rect x="345.0" y="110" width="64" height="48" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="377.0" y="140.0" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle"></text>
<rect x="419.0" y="110" width="64" height="48" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="451.0" y="140.0" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle"></text>
<rect x="493.0" y="110" width="64" height="48" rx="4" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="525.0" y="140.0" font-family="monospace" font-size="16" fill="#0f172a" text-anchor="middle">a</text>
<rect x="567.0" y="110" width="64" height="48" rx="4" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="599.0" y="140.0" font-family="monospace" font-size="16" fill="#0f172a" text-anchor="middle">b</text>
<text x="81.0" y="178" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[0]</text>
<text x="155.0" y="178" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[1]</text>
<text x="229.0" y="178" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[2]</text>
<text x="303.0" y="178" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[3]</text>
<text x="377.0" y="178" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[4]</text>
<text x="451.0" y="178" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[5]</text>
<text x="525.0" y="178" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[6]</text>
<text x="599.0" y="178" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">[7]</text>
<polyline points="599.0,110 599.0,80 81.0,80 81.0,108" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340.0" y="72" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">index wraps: (i + 1) % 8</text>
<polyline points="525.0,232 525.0,186" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="525.0" y="250" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">head = 6 (oldest)</text>
<polyline points="229.0,232 229.0,186" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="229.0" y="250" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">tail = (head + size) % 8 = 2</text>
<text x="340.0" y="284" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">queue order, oldest first: a, b, c, d — PopFront reads head, PushBack writes tail</text>
</svg>
