<text x="602" y="248" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">only the lowest set bit</text>
<text x="20" y="290" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="start">Uses: count set bits (clear until 0), test for a power of two (x &amp; (x-1) == 0),</text>
<text x="20" y="312" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="start">walk the set bits of a mask, step through the subsets of a mask.</text>
<text x="20" y="340" font-family="sans-serif" font-size="12" fill="#f59e0b" text-anchor="start">orange: the bits that change</text>
