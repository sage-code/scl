<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" role="img" aria-labelledby="t d">
<title id="t">Lowest set bit tricks</title>
<desc id="d">For x equal to 10110100, x minus 1 is 10110011: the lowest set bit becomes 0 and the zeros below it become 1. x AND x minus 1 is 10110000, the lowest set bit cleared. x AND minus x is 00000100, only the lowest set bit.</desc>
