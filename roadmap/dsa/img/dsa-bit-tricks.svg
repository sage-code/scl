<text x="565.0" y="81" font-family="monospace" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="bold">0</text>
<text x="602" y="80" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">lowest set bit: position 2</text>
