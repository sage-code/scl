<text x="602" y="192" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">lowest set bit cleared</text>
<text x="20" y="250" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="start" font-weight="bold">x &amp; -x</text>
