<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-labelledby="t d">
<title id="t">Bloom filter</title>
<desc id="d">A 16-bit array. The keys cat and dog each set three bits. Looking up cow finds one of its three bits clear, so cow is certainly absent. Looking up emu finds all three bits set by other keys, a false positive.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Bloom filter: 16 bits, 3 positions per key</text>
<rect x="62" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="80.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="80.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0</text>
<rect x="102" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="120.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="120.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">1</text>
<rect x="142" y="190" width="36" height="40" rx="5" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="160.0" y="217" font-family="monospace" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text>
<text x="160.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">2</text>
<rect x="182" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="200.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="200.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">3</text>
<rect x="222" y="190" width="36" height="40" rx="5" fill="#34d399" stroke="#34d399" stroke-width="1.5"/>
<text x="240.0" y="217" font-family="monospace" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text>
<text x="240.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">4</text>
<rect x="262" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="280.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="280.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">5</text>
<rect x="302" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="320.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="320.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">6</text>
<rect x="342" y="190" width="36" height="40" rx="5" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="360.0" y="217" font-family="monospace" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text>
<text x="360.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">7</text>
<rect x="382" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="400.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="400.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">8</text>
<rect x="422" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="440.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="440.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">9</text>
<rect x="462" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="480.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="480.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">10</text>
<rect x="502" y="190" width="36" height="40" rx="5" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="520.0" y="217" font-family="monospace" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text>
<text x="520.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">11</text>
<rect x="542" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="560.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="560.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">12</text>
<rect x="582" y="190" width="36" height="40" rx="5" fill="#34d399" stroke="#34d399" stroke-width="1.5"/>
<text x="600.0" y="217" font-family="monospace" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text>
<text x="600.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">13</text>
<rect x="622" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="640.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="640.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">14</text>
<rect x="662" y="190" width="36" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="680.0" y="217" font-family="monospace" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text>
<text x="680.0" y="250" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">15</text>
<text x="190" y="60" font-family="monospace" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="bold">add cat</text>
<line x1="190" y1="68" x2="160.0" y2="188" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="68" x2="520.0" y2="188" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="68" x2="360.0" y2="188" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="460" y="60" font-family="monospace" font-size="15" fill="#34d399" text-anchor="middle" font-weight="bold">add dog</text>
<line x1="460" y1="68" x2="240.0" y2="188" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="460" y1="68" x2="600.0" y2="188" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="460" y1="68" x2="360.0" y2="188" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="12" y="297" font-family="monospace" font-size="13" fill="#ef4444" text-anchor="start" font-weight="bold">cow?</text>
<circle cx="160.0" cy="292" r="7" fill="#ef4444"/>
<circle cx="440.0" cy="292" r="7" fill="#ef4444"/>
<circle cx="600.0" cy="292" r="7" fill="#ef4444"/>
<text x="12" y="321" font-family="monospace" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="bold">emu?</text>
<circle cx="240.0" cy="316" r="7" fill="#f59e0b"/>
<circle cx="360.0" cy="316" r="7" fill="#f59e0b"/>
<circle cx="520.0" cy="316" r="7" fill="#f59e0b"/>
<text x="440.0" y="296" font-family="sans-serif" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="bold">✗</text>
<text x="60" y="352" font-family="sans-serif" font-size="13" fill="#ef4444" text-anchor="start" font-weight="bold">cow? looks at bits 2, 9, 13: bit 9 is 0, so cow is certainly absent</text>
<text x="60" y="376" font-family="sans-serif" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="bold">emu? looks at bits 4, 7, 11: all set by other keys, so "maybe": a false positive</text>
<text x="740" y="150" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">bit 7 is shared by cat and dog</text>
</svg>
