<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="100%" role="img" aria-labelledby="t d">
<title id="t">Doubly linked list with a sentinel</title>
<desc id="d">A sentinel node and nodes A, B, C linked in both directions, closing into a ring through the sentinel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="680" height="290" fill="#0f172a"/>
<text x="340.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Doubly linked ring with one sentinel node</text>
<rect x="40" y="112" width="110" height="52" rx="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="95.0" y="144" font-family="monospace" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">sentinel</text>
<rect x="200" y="112" width="110" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="255.0" y="144" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">A</text>
<rect x="360" y="112" width="110" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="415.0" y="144" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">B</text>
<rect x="520" y="112" width="110" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="575.0" y="144" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">C</text>
<polyline points="150,128 198,128" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="200,148 152,148" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="310,128 358,128" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="360,148 312,148" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="470,128 518,128" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="520,148 472,148" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="175.0" y="122" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">next</text>
<text x="175.0" y="164" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">prev</text>
<polyline points="575.0,164 575.0,206 95.0,206 95.0,166" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340.0" y="224" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">C.next = sentinel</text>
<polyline points="95.0,112 95.0,72 575.0,72 575.0,110" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340.0" y="64" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">sentinel.prev = C (the last node)</text>
<text x="340.0" y="268" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Empty list: sentinel.next = sentinel.prev = sentinel — no nil checks anywhere</text>
</svg>
