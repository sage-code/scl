<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-labelledby="t d">
<title id="t">Token bucket</title>
<desc id="d">Tokens drip into a bucket at a steady rate up to its capacity. Each request removes one token and is allowed; when the bucket is empty the request is rejected.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Token bucket: rate limits the average, capacity limits the burst</text>
<text x="350" y="62" font-family="sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold">refill: 10 tokens per second</text>
<line x1="350" y1="68" x2="350" y2="88" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M250,90 L250,240 L450,240 L450,90" fill="#1e293b" stroke="#475569" stroke-width="3"/>
<line x1="238" y1="110" x2="462" y2="110" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="232" y="114" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="end">capacity 10 (burst)</text>
<circle cx="276" cy="216" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
<circle cx="312" cy="216" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
<circle cx="348" cy="216" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
<circle cx="384" cy="216" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
<circle cx="420" cy="216" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
<circle cx="276" cy="182" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
<circle cx="312" cy="182" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
<text x="350" y="266" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">7 tokens now</text>
<line x1="460" y1="220" x2="510" y2="220" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="518" y="216" font-family="sans-serif" font-size="13" fill="#34d399" text-anchor="start" font-weight="bold">take 1 token: allowed</text>
<text x="518" y="234" font-family="sans-serif" font-size="13" fill="#ef4444" text-anchor="start" font-weight="bold">no token: rejected (429)</text>
<text x="60" y="300" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">state: tokens (a number) and the time of the last refill. Refill lazily:</text>
<text x="60" y="322" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">tokens = min(capacity, tokens + elapsed * rate) when a request arrives.</text>
</svg>
