<polyline points="256,168.0 638.0,168.0 638.0,148" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="100" width="96" height="36" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="68.0" y="123" font-family="monospace" font-size="13" fill="#0f172a" text-anchor="middle">fetch</text>
<rect x="160" y="60" width="96" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
