<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-labelledby="t d">
<title id="t">Topological order of build steps</title>
<desc id="d">A directed acyclic graph of build steps and one valid topological order produced by Kahn's algorithm.</desc>
