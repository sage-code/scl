<text x="428.0" y="194.0" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">0</text>
<line x1="480" y1="156" x2="560" y2="236" stroke="#475569" stroke-width="2"/>
<text x="532.0" y="194.0" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">1</text>
<line x1="560" y1="236" x2="480" y2="316" stroke="#475569" stroke-width="2"/>
<text x="508.0" y="274.0" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">0</text>
<line x1="560" y1="236" x2="640" y2="316" stroke="#475569" stroke-width="2"/>
<text x="612.0" y="274.0" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">1</text>
<line x1="640" y1="316" x2="580" y2="396" stroke="#475569" stroke-width="2"/>
<text x="598.0" y="354.0" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">0</text>
<line x1="640" y1="316" x2="700" y2="396" stroke="#475569" stroke-width="2"/>
<text x="682.0" y="354.0" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">1</text>
<circle cx="360" cy="76" r="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="360" y="81" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">11</text>
<circle cx="480" cy="156" r="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="480" y="161" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">6</text>
<circle cx="560" cy="236" r="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="560" y="241" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">4</text>
<circle cx="640" cy="316" r="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="640" y="321" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">2</text>
<rect x="190" y="138" width="60" height="36" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="220" y="161" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">a:5</text>
<text x="220" y="192" font-family="monospace" font-size="13" fill="#34d399" text-anchor="middle">0</text>
<rect x="370" y="218" width="60" height="36" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="400" y="241" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">r:2</text>
<text x="400" y="272" font-family="monospace" font-size="13" fill="#34d399" text-anchor="middle">10</text>
<rect x="450" y="298" width="60" height="36" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
