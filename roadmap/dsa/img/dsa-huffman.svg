<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" width="100%" role="img" aria-labelledby="t d">
<title id="t">Huffman tree for abracadabra</title>
<desc id="d">Frequencies a 5, b 2, r 2, c 1, d 1. Merges: c+d=2, b+cd=4, r+4=6, a+6=11. Codes: a 0, r 10, b 110, c 1110, d 1111; 23 bits instead of 33 with a 3-bit fixed code.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="740" height="500" fill="#0f172a"/>
<text x="370.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Huffman tree for "abracadabra": merge the two lightest trees</text>
<line x1="360" y1="76" x2="220" y2="156" stroke="#475569" stroke-width="2"/>
<text x="278.0" y="114.0" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">0</text>
