<text x="480" y="352" font-family="monospace" font-size="13" fill="#34d399" text-anchor="middle">110</text>
<rect x="550" y="378" width="60" height="36" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="580" y="401" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">c:1</text>
<text x="580" y="432" font-family="monospace" font-size="13" fill="#34d399" text-anchor="middle">1110</text>
<rect x="670" y="378" width="60" height="36" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="700" y="401" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">d:1</text>
<text x="700" y="432" font-family="monospace" font-size="13" fill="#34d399" text-anchor="middle">1111</text>
<text x="40" y="250" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="start" font-weight="bold">merge order</text>
<text x="40" y="276" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="start">1. c + d = 2</text>
<text x="40" y="298" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="start">2. b + (cd) = 4</text>
<text x="40" y="320" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="start">3. r + 4 = 6</text>
<text x="40" y="342" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="start">4. a + 6 = 11</text>
<text x="370.0" y="464" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">circles: merged trees with their total weight · blue: symbols with frequency · green: code</text>
<text x="370.0" y="486" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">5·1 + 2·2 + 2·3 + 1·4 + 1·4 = 23 bits (fixed 3-bit code: 33)</text>
</svg>
