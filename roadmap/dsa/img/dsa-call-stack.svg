<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" aria-labelledby="t d">
<title id="t">Call stack of factorial(3)</title>
<desc id="d">Frames for main, factorial(3), factorial(2) and factorial(1) stacked; each returns its value to the frame below.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="680" height="400" fill="#0f172a"/>
<text x="190" y="30" font-family="sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Stack at the deepest call</text>
<text x="520" y="30" font-family="sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Unwinding (pop)</text>
<rect x="60" y="56" width="260" height="56" rx="8" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="190.0" y="79" font-family="monospace" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">factorial(1)</text>
<text x="190.0" y="99" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">n=1 &#8594; base case</text>
<rect x="420" y="64" width="200" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="520.0" y="89.0" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">returns 1</text>
<polyline points="520.0,104 520.0,132" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="126" width="260" height="56" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="190.0" y="149" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">factorial(2)</text>
<text x="190.0" y="169" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">n=2 waits on 2 * factorial(1)</text>
<rect x="420" y="134" width="200" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="520.0" y="159.0" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">returns 2 * 1 = 2</text>
<polyline points="520.0,174 520.0,202" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="196" width="260" height="56" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="190.0" y="219" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">factorial(3)</text>
<text x="190.0" y="239" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">n=3 waits on 3 * factorial(2)</text>
<rect x="420" y="204" width="200" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="520.0" y="229.0" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">returns 3 * 2 = 6</text>
<polyline points="520.0,244 520.0,272" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="266" width="260" height="56" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="190.0" y="289" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">main()</text>
<text x="190.0" y="309" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">waits on factorial(3)</text>
<rect x="420" y="274" width="200" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="520.0" y="299.0" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">prints 6</text>
<polyline points="36,322 36,56" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="189.0" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 24 189.0)">calls push frames</text>
<text x="370" y="78.0" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">pop</text>
<polyline points="320,84.0 418,84.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340.0" y="380" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Each frame keeps its own n; a frame resumes only after the call above it returns.</text>
</svg>
