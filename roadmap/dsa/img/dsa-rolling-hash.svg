<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" role="img" aria-labelledby="t d">
<title id="t">Rolling hash window</title>
<desc id="d">Text abcde with base 10 and letters a=1, b=2, and so on. The window abc has hash 123. To slide to bcd remove a times 100, giving 23, multiply by 10, giving 230, and add d which is 4, giving 234 in constant time.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Slide the window in O(1): subtract, shift, add</text>
<rect x="203" y="60" width="58" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="232.0" y="87" font-family="monospace" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="bold">a</text>
<text x="232.0" y="118" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">1</text>
<rect x="267" y="60" width="58" height="40" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="296.0" y="87" font-family="monospace" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="bold">b</text>
<text x="296.0" y="118" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">2</text>
<rect x="331" y="60" width="58" height="40" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="360.0" y="87" font-family="monospace" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="bold">c</text>
<text x="360.0" y="118" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">3</text>
<rect x="395" y="60" width="58" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="424.0" y="87" font-family="monospace" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="bold">d</text>
<text x="424.0" y="118" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">4</text>
<rect x="459" y="60" width="58" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="488.0" y="87" font-family="monospace" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="bold">e</text>
<text x="488.0" y="118" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">5</text>
<rect x="201" y="52" width="190" height="56" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
<rect x="265" y="132" width="190" height="56" rx="8" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="232.0" y="166" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="middle">a</text>
<text x="296.0" y="166" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="middle">b</text>
<text x="360.0" y="166" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="middle">c</text>
<text x="424.0" y="166" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="middle">d</text>
<text x="488.0" y="166" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="middle">e</text>
<text x="180" y="88" font-family="sans-serif" font-size="13" fill="#f59e0b" text-anchor="end" font-weight="bold">window 1</text>
<text x="180" y="168" font-family="sans-serif" font-size="13" fill="#3b82f6" text-anchor="end" font-weight="bold">window 2</text>
<text x="60" y="230" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="start">hash(abc) = 1·100 + 2·10 + 3</text>
<text x="500" y="230" font-family="monospace" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="bold">= 123</text>
<text x="60" y="264" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="start">remove the leading a:   123 - 1·100</text>
<text x="500" y="264" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="start">=  23</text>
<text x="60" y="298" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="start">shift left by one place:  23 · 10</text>
<text x="500" y="298" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="start">= 230</text>
<text x="60" y="332" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="start">add the new letter d:    230 + 4</text>
<text x="500" y="332" font-family="monospace" font-size="15" fill="#3b82f6" text-anchor="start" font-weight="bold">= 234 = hash(bcd)</text>
<text x="380.0" y="362" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Real hashes use a base and a modulus so the numbers stay small; equal hashes must still be verified.</text>
</svg>
