<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" role="img" aria-labelledby="t d">
<title id="t">LRU cache: a map plus a doubly linked list</title>
<desc id="d">A hash map finds a node by key. The nodes sit in a doubly linked list between a head and a tail sentinel, ordered from most recently used to least recently used. A hit moves the node to the front; inserting into a full cache removes the node before the tail and deletes its key from the map.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">LRU cache: the map finds, the list orders</text>
<text x="90" y="66" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="bold">map[key]*node</text>
<rect x="50" y="80" width="80" height="30" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="100" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">a</text>
<rect x="50" y="120" width="80" height="30" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="140" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">b</text>
<rect x="50" y="160" width="80" height="30" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="180" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">c</text>
<rect x="50" y="200" width="80" height="30" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="220" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">d</text>
<text x="430" y="66" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="bold">recency order (doubly linked)</text>
<rect x="190" y="150" width="64" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
<text x="222" y="178" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">HEAD</text>
<rect x="270" y="150" width="64" height="44" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="302" y="178" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">d</text>
<rect x="350" y="150" width="64" height="44" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="382" y="178" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">a</text>
<rect x="430" y="150" width="64" height="44" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
<text x="462" y="178" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">c</text>
<rect x="510" y="150" width="64" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
<text x="542" y="178" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">TAIL</text>
<line x1="254" y1="165" x2="268" y2="165" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="270" y1="181" x2="256" y2="181" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="334" y1="165" x2="348" y2="165" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350" y1="181" x2="336" y2="181" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="414" y1="165" x2="428" y2="165" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="430" y1="181" x2="416" y2="181" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="494" y1="165" x2="508" y2="165" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510" y1="181" x2="496" y2="181" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="302" y="136" font-family="sans-serif" font-size="12" fill="#34d399" text-anchor="middle" font-weight="bold">most recently used</text>
<text x="462" y="136" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="bold">next victim</text>
<path d="M130,95 C170,95 170,95 180,95" fill="none" stroke="none"/>
<path d="M130,95 Q240.0,243.5 382,196" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M130,175 C170,175 170,175 180,175" fill="none" stroke="none"/>
<path d="M130,175 Q280.0,251.5 462,196" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M130,215 C170,215 170,215 180,215" fill="none" stroke="none"/>
<path d="M130,215 Q200.0,255.5 302,196" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="90" y="262" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(b was evicted:</text>
<text x="90" y="278" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">its key left the map)</text>
<text x="60" y="322" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">Get(k): map lookup, unlink the node, relink at the front. O(1).</text>
<text x="60" y="344" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">Put in a full cache: unlink the node before TAIL, delete its key, insert at the front. O(1).</text>
</svg>
