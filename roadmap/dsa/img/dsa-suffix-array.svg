<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" role="img" aria-labelledby="t d">
<title id="t">Suffix array of banana</title>
<desc id="d">The six suffixes of banana in sorted order with their start positions and the longest common prefix with the suffix above. The suffixes ana and anana, which start with ana, form one block found by binary search. The largest lcp value 3 gives the longest repeated substring ana.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Suffix array and LCP of "banana"</text>
<text x="90" y="60" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="bold">sa</text>
<text x="170" y="60" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="bold">lcp</text>
<text x="250" y="60" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="start" font-weight="bold">suffix</text>
<rect x="60" y="70" width="380" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="96" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">5</text>
<text x="170" y="96" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">0</text>
<text x="250" y="97" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="start" font-weight="bold">a</text>
<rect x="60" y="116" width="380" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="90" y="142" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">3</text>
<text x="170" y="142" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">1</text>
<rect x="250" y="124" width="18" height="24" rx="4" fill="#3b82f6" opacity="0.35"/>
<text x="250" y="143" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="start" font-weight="bold">ana</text>
<rect x="60" y="162" width="380" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="90" y="188" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">1</text>
<text x="170" y="188" font-family="monospace" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold">3</text>
<rect x="250" y="170" width="54" height="24" rx="4" fill="#f59e0b" opacity="0.35"/>
<text x="250" y="189" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="start" font-weight="bold">anana</text>
<rect x="60" y="208" width="380" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="234" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">0</text>
<text x="170" y="234" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">0</text>
<text x="250" y="235" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="start" font-weight="bold">banana</text>
<rect x="60" y="254" width="380" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="280" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">4</text>
<text x="170" y="280" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">0</text>
<text x="250" y="281" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="start" font-weight="bold">na</text>
<rect x="60" y="300" width="380" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="326" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">2</text>
<text x="170" y="326" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">2</text>
<rect x="250" y="308" width="36" height="24" rx="4" fill="#3b82f6" opacity="0.35"/>
<text x="250" y="327" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="start" font-weight="bold">nana</text>
<text x="460" y="134" font-family="sans-serif" font-size="13" fill="#f59e0b" font-weight="bold">← the block that starts with "ana"</text>
<text x="460" y="154" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">two binary searches find its ends</text>
<text x="460" y="218" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">sum of lcp = 6</text>
<text x="460" y="238" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">distinct substrings = 21 - 6 = 15</text>
<text x="460" y="284" font-family="monospace" font-size="13" fill="#f59e0b" text-anchor="start">largest lcp = 3: longest repeat "ana"</text>
<text x="380.0" y="396" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Shared prefixes are neighbours in sorted order, so one array answers many questions.</text>
</svg>
