<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-labelledby="t d">
<title id="t">Union-find path compression</title>
<desc id="d">Before: x points to b, b to a, a to the root r. After Find(x), x, b and a all point directly to r.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="720" height="340" fill="#0f172a"/>
<text x="360.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Find(x) with path compression (arrows point to the parent)</text>
<text x="180" y="60" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">before: x is 3 steps from the root</text>
<line x1="180" y1="150" x2="180" y2="122" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="180" y1="220" x2="180" y2="192" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="180" y1="290" x2="180" y2="262" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="94" y1="156" x2="164" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="266" y1="226" x2="196" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="180" cy="100" r="20" fill="#34d399" stroke="#34d399" stroke-width="1.5"/>
<text x="180" y="105" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">r</text>
<circle cx="180" cy="170" r="20" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180" y="175" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">a</text>
<circle cx="180" cy="240" r="20" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180" y="245" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">b</text>
<circle cx="180" cy="310" r="20" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180" y="315" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">x</text>
<circle cx="90" cy="170" r="20" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="175" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">c</text>
<circle cx="270" cy="240" r="20" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="270" y="245" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">d</text>
<text x="360" y="200" font-family="sans-serif" font-size="36" fill="#94a3b8" text-anchor="middle">→</text>
<text x="550" y="60" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">after Find(x): the path points at r</text>
<circle cx="550" cy="110" r="20" fill="#34d399" stroke="#34d399" stroke-width="1.5"/>
<text x="550" y="115" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">r</text>
<line x1="430" y1="210" x2="523.6" y2="133" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="430" cy="230" r="20" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="430" y="235" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">c</text>
<line x1="510" y1="210" x2="541.2" y2="133" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="510" cy="230" r="20" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="510" y="235" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">a</text>
<line x1="590" y1="210" x2="558.8" y2="133" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="590" cy="230" r="20" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="590" y="235" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">b</text>
<line x1="670" y1="210" x2="576.4" y2="133" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="670" cy="230" r="20" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
<text x="670" y="235" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">x</text>
<circle cx="510" cy="310" r="20" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="510" y="315" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">d</text>
<line x1="510" y1="290" x2="510" y2="253" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
