<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-labelledby="t d">
<title id="t">Fenwick tree ranges</title>
<desc id="d">Slot i of a Fenwick tree stores the sum of the lowbit(i) elements ending at position i. The query for the prefix of length 7 uses slots 7, 6 and 4 (highlighted): 2 + 14 + 9 = 25.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Slot i covers the last lowbit(i) elements ending at i</text>
<rect x="94" y="288" width="66" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="127.0" y="304" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">tree[1]</text>
<text x="127.0" y="319" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">covers 1</text>
<rect x="94" y="240" width="140" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="164.0" y="256" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">tree[2]</text>
<text x="164.0" y="271" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">covers 1-2</text>
<rect x="242" y="288" width="66" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="275.0" y="304" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">tree[3]</text>
<text x="275.0" y="319" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">covers 3</text>
<rect x="94" y="192" width="288" height="38" rx="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="238.0" y="208" font-family="monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">tree[4]</text>
<text x="238.0" y="223" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">covers 1-4</text>
<rect x="390" y="288" width="66" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="423.0" y="304" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">tree[5]</text>
<text x="423.0" y="319" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">covers 5</text>
<rect x="390" y="240" width="140" height="38" rx="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="460.0" y="256" font-family="monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">tree[6]</text>
<text x="460.0" y="271" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">covers 5-6</text>
<rect x="538" y="288" width="66" height="38" rx="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="571.0" y="304" font-family="monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">tree[7]</text>
<text x="571.0" y="319" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">covers 7</text>
<rect x="94" y="144" width="584" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="386.0" y="160" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">tree[8]</text>
<text x="386.0" y="175" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">covers 1-8</text>
<rect x="94" y="338" width="66" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="127.0" y="359" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">3</text>
<text x="127.0" y="386" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">1</text>
<rect x="168" y="338" width="66" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="201.0" y="359" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">1</text>
<text x="201.0" y="386" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">2</text>
<rect x="242" y="338" width="66" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="275.0" y="359" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">4</text>
<text x="275.0" y="386" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">3</text>
<rect x="316" y="338" width="66" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="349.0" y="359" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">1</text>
<text x="349.0" y="386" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">4</text>
<rect x="390" y="338" width="66" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="423.0" y="359" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">5</text>
<text x="423.0" y="386" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">5</text>
<rect x="464" y="338" width="66" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="497.0" y="359" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">9</text>
<text x="497.0" y="386" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">6</text>
<rect x="538" y="338" width="66" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="571.0" y="359" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">2</text>
<text x="571.0" y="386" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">7</text>
<rect x="612" y="338" width="66" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="645.0" y="359" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">6</text>
<text x="645.0" y="386" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">8</text>
<text x="16" y="359" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="start">a</text>
<text x="16" y="386" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="start">i</text>
<text x="90" y="62" font-family="sans-serif" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="bold">Prefix(7): 7 → 6 → 4 → 0  (clear the lowest set bit)</text>
<text x="90" y="82" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="start">tree[7] + tree[6] + tree[4] = 2 + 14 + 9 = 25</text>
<text x="420" y="62" font-family="sans-serif" font-size="13" fill="#3b82f6" text-anchor="start" font-weight="bold">Add(5, d): 5 → 6 → 8  (add the lowest set bit)</text>
<text x="420" y="82" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="start">exactly the slots whose range contains 5</text>
</svg>
