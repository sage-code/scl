<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" role="img" aria-labelledby="t d">
<title id="t">BFS order versus DFS order</title>
<desc id="d">The same graph explored from A. BFS visits by distance level: A, B, C, D, E, F, G. DFS goes deep first: A, B, D, G, E, C, F.</desc>
