<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%" role="img" aria-labelledby="t d">
<title id="t">Problem-solving workflow</title>
<desc id="d">Understand, examples, brute force, analyze; if not fast enough optimize and re-analyze; then implement and test.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="680" height="520" fill="#0f172a"/>
<text x="340.0" y="30" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">From problem to verified solution</text>
<rect x="90" y="52" width="300" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="240.0" y="74" font-family="sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">1. Understand</text>
<text x="240.0" y="93" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">inputs, outputs, constraints</text>
<rect x="90" y="124" width="300" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="240.0" y="146" font-family="sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">2. Examples</text>
<text x="240.0" y="165" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">typical + edge cases, expected results</text>
<rect x="90" y="196" width="300" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="240.0" y="218" font-family="sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">3. Brute force</text>
<text x="240.0" y="237" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">simplest correct solution = oracle</text>
<rect x="90" y="268" width="300" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="240.0" y="290" font-family="sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">4. Analyze</text>
<text x="240.0" y="309" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">time and space in Big O</text>
<polyline points="240.0,104 240.0,122" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="240.0,176 240.0,194" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="240.0,248 240.0,266" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="240.0,348.0 360.0,384 240.0,420.0 120.0,384" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<text x="240.0" y="382" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Fast enough for</text>
<text x="240.0" y="399" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">the constraints?</text>
<polyline points="240.0,320 240.0,346.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="452" y="358.0" width="196" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="550.0" y="380" font-family="sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">5. Optimize</text>
<text x="550.0" y="399" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">remove repeated work</text>
<polyline points="360.0,384 450,384" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="372.0" y="376" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">no</text>
<polyline points="550.0,358.0 550.0,294 392,294" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="558.0" y="330" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">re-analyze</text>
<rect x="90" y="450" width="300" height="52" rx="8" fill="#34d399" stroke="#34d399" stroke-width="1.5"/>
<text x="240.0" y="472" font-family="sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">6. Implement &amp; test</text>
<text x="240.0" y="491" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">table tests, compare with the oracle</text>
<polyline points="240.0,420.0 240.0,448" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250.0" y="440.0" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="start">yes</text>
</svg>
