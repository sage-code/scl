<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" role="img" aria-labelledby="t d">
<title id="t">Singly linked list and node removal</title>
<desc id="d">Top: head points to a, a to b, b to c, c to nil; tail points to c. Bottom: removing c by pointing b.next at d.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="680" height="360" fill="#0f172a"/>
<text x="340.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Singly linked list with head and tail</text>
<rect x="60" y="96" width="90" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<line x1="120" y1="96" x2="120" y2="140" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="124" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">a</text>
<circle cx="135" cy="118" r="4" fill="#94a3b8"/>
<rect x="210" y="96" width="90" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<line x1="270" y1="96" x2="270" y2="140" stroke="#475569" stroke-width="1.5"/>
<text x="240" y="124" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">b</text>
<circle cx="285" cy="118" r="4" fill="#94a3b8"/>
<rect x="360" y="96" width="90" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<line x1="420" y1="96" x2="420" y2="140" stroke="#475569" stroke-width="1.5"/>
<text x="390" y="124" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">c</text>
<circle cx="435" cy="118" r="4" fill="#94a3b8"/>
<polyline points="135,118 208,118" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="285,118 358,118" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="435,118 508,118" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530" y="124" font-family="monospace" font-size="15" fill="#94a3b8" text-anchor="start">nil</text>
<text x="105" y="64" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">head</text>
<polyline points="105,70 105,94" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="405" y="64" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">tail</text>
<polyline points="405,70 405,94" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340.0" y="188" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Remove c: prev.next = victim.next — O(1) once prev is known</text>
<rect x="60" y="226" width="90" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<line x1="120" y1="226" x2="120" y2="270" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="254" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">a</text>
<circle cx="135" cy="248" r="4" fill="#94a3b8"/>
<rect x="210" y="226" width="90" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<line x1="270" y1="226" x2="270" y2="270" stroke="#475569" stroke-width="1.5"/>
<text x="240" y="254" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">b</text>
<circle cx="285" cy="248" r="4" fill="#94a3b8"/>
<rect x="360" y="226" width="90" height="44" rx="4" fill="#ef4444" stroke="#ef4444" stroke-width="1.5"/>
<line x1="420" y1="226" x2="420" y2="270" stroke="#ef4444" stroke-width="1.5"/>
<text x="390" y="254" font-family="monospace" font-size="16" fill="#0f172a" text-anchor="middle">c</text>
<circle cx="435" cy="248" r="4" fill="#0f172a"/>
<rect x="510" y="226" width="90" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<line x1="570" y1="226" x2="570" y2="270" stroke="#475569" stroke-width="1.5"/>
<text x="540" y="254" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">d</text>
<circle cx="585" cy="248" r="4" fill="#94a3b8"/>
<polyline points="135,248 208,248" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="435,248 508,248" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="285,270 285,306 540,306 540,272" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="405" y="324" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">b.next now skips c</text>
<text x="255" y="214" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">prev</text>
<text x="405" y="214" font-family="monospace" font-size="13" fill="#ef4444" text-anchor="middle">victim</text>
</svg>
