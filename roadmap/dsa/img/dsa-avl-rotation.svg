<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" role="img" aria-labelledby="t d">
<title id="t">AVL rotations</title>
<desc id="d">Left-left imbalance 30, 20, 10 is fixed by one right rotation giving root 20 with children 10 and 30. Left-right imbalance 30, 10, 20 is fixed by a left rotation at 10 followed by a right rotation at 30.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="760" height="480" fill="#0f172a"/>
<text x="380.0" y="28" font-family="sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Rotations keep the sorted order and lower the tall side</text>
<text x="30" y="62" font-family="sans-serif" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="bold">left-left: one rotation</text>
<line x1="140" y1="114" x2="100" y2="144" stroke="#475569" stroke-width="1.8"/>
<line x1="100" y1="174" x2="60" y2="204" stroke="#475569" stroke-width="1.8"/>
<rect x="117.0" y="84" width="46" height="30" rx="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="140" y="104.0" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle">30</text>
<rect x="77.0" y="144" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="100" y="164.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">20</text>
<rect x="37.0" y="204" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="60" y="224.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">10</text>
<text x="178" y="104" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="start">balance +2</text>
<polyline points="250,144 390,144" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="130" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">rotate right at 30</text>
<line x1="520" y1="114" x2="480" y2="144" stroke="#475569" stroke-width="1.8"/>
<line x1="520" y1="114" x2="560" y2="144" stroke="#475569" stroke-width="1.8"/>
<rect x="497.0" y="84" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="520" y="104.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">20</text>
<rect x="457.0" y="144" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="480" y="164.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">10</text>
<rect x="537.0" y="144" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="560" y="164.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">30</text>
<text x="640" y="148" font-family="sans-serif" font-size="12" fill="#34d399" text-anchor="start">all balances 0</text>
<text x="30" y="262" font-family="sans-serif" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="bold">left-right: two rotations</text>
<line x1="110" y1="314" x2="70" y2="344" stroke="#475569" stroke-width="1.8"/>
<line x1="70" y1="374" x2="110" y2="404" stroke="#475569" stroke-width="1.8"/>
<rect x="87.0" y="284" width="46" height="30" rx="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="110" y="304.0" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle">30</text>
<rect x="47.0" y="344" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="70" y="364.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">10</text>
<rect x="87.0" y="404" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="110" y="424.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">20</text>
<text x="148" y="304" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="start">+2, but child leans right</text>
<polyline points="190,344 270,344" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="230" y="330" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">left at 10</text>
<line x1="350" y1="314" x2="310" y2="344" stroke="#475569" stroke-width="1.8"/>
<line x1="310" y1="374" x2="270" y2="404" stroke="#475569" stroke-width="1.8"/>
<rect x="327.0" y="284" width="46" height="30" rx="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="350" y="304.0" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle">30</text>
<rect x="287.0" y="344" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="310" y="364.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">20</text>
<rect x="247.0" y="404" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="270" y="424.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">10</text>
<polyline points="400,344 500,344" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="330" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">right at 30</text>
<line x1="600" y1="314" x2="560" y2="344" stroke="#475569" stroke-width="1.8"/>
<line x1="600" y1="314" x2="640" y2="344" stroke="#475569" stroke-width="1.8"/>
<rect x="577.0" y="284" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="600" y="304.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">20</text>
<rect x="537.0" y="344" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="560" y="364.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">10</text>
<rect x="617.0" y="344" width="46" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="640" y="364.0" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">30</text>
<text x="380.0" y="450" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">The first rotation straightens the zig-zag; the second is the simple case above.</text>
</svg>
