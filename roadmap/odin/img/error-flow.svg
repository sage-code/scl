<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">How a failure travels back through or_return</title>
  <desc id="desc">A procedure calls step one, which on success continues to step two. If step one fails, or_return sends the error straight back to the calling procedure and step two never runs.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .box  { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .det  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .ok   { font-family: system-ui, sans-serif; font-size: 11px; fill: #34d399; }
      .err  { font-family: system-ui, sans-serif; font-size: 11px; fill: #f59e0b; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
    <marker id="ea" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#34d399"/>
    </marker>
    <marker id="eb" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="360" fill="#0f172a"/>
  <text x="24" y="34" class="t">Success moves on; failure comes back</text>
  <text x="24" y="54" class="sub">or_return is the shorthand for "if this failed, hand it straight back to my caller".</text>

  <rect x="40" y="110" width="158" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="119" y="140" class="box" text-anchor="middle">your proc</text>
  <text x="119" y="160" class="det" text-anchor="middle">named results</text>

  <rect x="250" y="110" width="158" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="329" y="140" class="box" text-anchor="middle">step 1: parse</text>
  <text x="329" y="160" class="det" text-anchor="middle">value, err</text>

  <rect x="460" y="110" width="158" height="70" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="539" y="140" class="box" text-anchor="middle">step 2: use</text>
  <text x="539" y="160" class="det" text-anchor="middle">never reached</text>

  <line x1="198" y1="145" x2="250" y2="145" stroke="#34d399" stroke-width="2" marker-end="url(#ea)"/>
  <text x="224" y="136" class="ok" text-anchor="middle">call</text>

  <line x1="408" y1="145" x2="460" y2="145" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ea)"/>
  <text x="434" y="136" class="ok" text-anchor="middle">on success</text>

  <polyline points="329,180 329,250 119,250 119,186" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#eb)"/>
  <text x="336" y="216" class="err">on failure: back to the caller at once, carrying the error</text>

  <text x="40" y="292" class="note">Success flows to the right, one step at a time, with each call checked</text>
  <text x="40" y="308" class="note">by its own or_return. Failure short-circuits: the error travels back</text>
  <text x="40" y="324" class="note">immediately, and nothing after the failing step runs at all.</text>
</svg>
