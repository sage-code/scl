<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">How a map lookup produces two results</title>
  <desc id="desc">A lookup passes the key through a hash to find a bucket. If the key is found, the stored value is returned together with true. If the key is absent, the zero value is returned together with false, which is how the two cases are told apart.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .dark { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #0f172a; }
      .lbl  { font-family: system-ui, sans-serif; font-size: 11px; fill: #f59e0b; }
    </style>
    <marker id="ma" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="340" fill="#0f172a"/>
  <text x="24" y="34" class="t">One lookup, two possible answers</text>
  <text x="24" y="54" class="sub">The second result is what distinguishes "the value is zero" from "there is no value".</text>

  <rect x="24" y="130" width="140" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="94" y="156" class="code" text-anchor="middle">ages["ada"]</text>
  <text x="94" y="176" class="note" text-anchor="middle">the key you ask for</text>

  <line x1="164" y1="160" x2="196" y2="160" stroke="#3b82f6" stroke-width="2" marker-end="url(#ma)"/>

  <rect x="200" y="130" width="130" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="265" y="156" class="code" text-anchor="middle">hash it</text>
  <text x="265" y="176" class="note" text-anchor="middle">a number from the key</text>

  <line x1="330" y1="160" x2="362" y2="160" stroke="#3b82f6" stroke-width="2" marker-end="url(#ma)"/>

  <rect x="366" y="130" width="150" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="441" y="156" class="code" text-anchor="middle">find the bucket</text>
  <text x="441" y="176" class="note" text-anchor="middle">and compare the key</text>

  <line x1="516" y1="146" x2="556" y2="110" stroke="#34d399" stroke-width="2" marker-end="url(#ma)"/>
  <line x1="516" y1="176" x2="556" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#mb)"/>

  <rect x="560" y="80" width="176" height="60" rx="8" fill="#34d399" stroke="#065f46" stroke-width="2"/>
  <text x="648" y="106" class="dark" text-anchor="middle">value + true</text>
  <text x="648" y="126" class="dark" text-anchor="middle">the key was there</text>

  <rect x="560" y="182" width="176" height="60" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="648" y="208" class="code" text-anchor="middle">zero + false</text>
  <text x="648" y="228" class="note" text-anchor="middle">no such key — and now you know</text>

  <text x="24" y="248" class="lbl">Use the two-value form when the difference matters.</text>
  <text x="24" y="268" class="note">Ignoring the second result means a missing key and a stored</text>
  <text x="24" y="284" class="note">zero look identical — which is exactly the bug that a fallback</text>
  <text x="24" y="300" class="note">like or_else hides.</text>
</svg>
