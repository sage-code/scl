<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">Each thread has its own context</title>
  <desc id="desc">The main thread owns a context holding its allocators. When a new thread is created, its procedure receives its own context with its own temporary allocator, which is destroyed when the thread ends. A shared box in the middle holds data both threads can reach, and that is why the data needs atomics or a mutex.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .box  { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .det  { font-family: system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
      .ok   { font-family: system-ui, sans-serif; font-size: 10px; fill: #34d399; }
      .warn { font-family: system-ui, sans-serif; font-size: 10px; fill: #f59e0b; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
    <marker id="ta" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#60a5fa"/>
    </marker>
    <marker id="tb" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#0f172a"/>
  <text x="24" y="34" class="t">One context per thread</text>
  <text x="24" y="54" class="sub">The context is copied into each thread, and the temporary allocator is created fresh for it.</text>

  <rect x="24" y="104" width="290" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="126" class="box">main thread</text>
  <rect x="40" y="138" width="258" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="156" class="box">context</text>
  <text x="54" y="172" class="det">allocator, temp_allocator, logger, ...</text>
  <rect x="40" y="192" width="258" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="210" class="box">thread.create_and_start(proc)</text>
  <text x="54" y="226" class="det">suspended until it is started</text>

  <rect x="446" y="104" width="290" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="462" y="126" class="box">worker thread</text>
  <rect x="462" y="138" width="258" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="476" y="156" class="box">its own context</text>
  <text x="476" y="172" class="det">a new temp allocator, freed on exit</text>
  <rect x="462" y="192" width="258" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="476" y="210" class="box">thread.join(t)</text>
  <text x="476" y="226" class="det">wait here until the worker is done</text>

  <line x1="314" y1="179" x2="446" y2="179" stroke="#60a5fa" stroke-width="2" marker-end="url(#ta)"/>
  <text x="380" y="172" class="ok" text-anchor="middle">start</text>
  <line x1="446" y1="247" x2="314" y2="247" stroke="#f59e0b" stroke-width="2" marker-end="url(#tb)"/>
  <text x="380" y="262" class="warn" text-anchor="middle">join</text>

  <rect x="240" y="288" width="280" height="56" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="310" class="box" text-anchor="middle">shared data</text>
  <text x="380" y="328" class="det" text-anchor="middle">both threads can reach it: atomics or a mutex</text>

  <line x1="169" y1="254" x2="300" y2="288" stroke="#334155" stroke-width="2"/>
  <line x1="591" y1="254" x2="460" y2="288" stroke="#334155" stroke-width="2"/>

  <text x="24" y="374" class="note">By default a thread gets the same context as main, and the runtime gives it a fresh temporary allocator that is</text>
  <text x="24" y="390" class="note">destroyed when the thread dies. If you hand it a context of your own, that bookkeeping becomes your job.</text>
</svg>
