<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">Runtime decisions versus compile-time decisions in Odin</title>
  <desc id="desc">On the left, an if or switch evaluates its condition while the program runs, then executes one branch. On the right, a when statement is evaluated by the compiler, so the false branch is erased and never appears in the binary.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e2e8f0; }
      .sub   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .h     { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #3b82f6; }
      .box   { font-family: system-ui, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .dia   { font-family: system-ui, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .dark  { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .gone  { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .lbl   { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#0f172a"/>
  <text x="24" y="34" class="title">Two kinds of decision</text>
  <text x="24" y="54" class="sub">Both choose a branch — but only one of them still has a choice left when the program runs.</text>

  <!-- Runtime column -->
  <text x="40" y="88" class="h">while the program runs  ·  if / switch</text>
  <rect x="40" y="104" width="150" height="44" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="131" class="box" text-anchor="middle">condition</text>

  <line x1="115" y1="148" x2="115" y2="176" stroke="#3b82f6" stroke-width="2" marker-end="url(#a1)"/>

  <polygon points="115,180 185,214 115,248 45,214" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="115" y="218" class="dia" text-anchor="middle">true?</text>

  <line x1="185" y1="214" x2="240" y2="214" stroke="#3b82f6" stroke-width="2" marker-end="url(#a1)"/>
  <text x="196" y="206" class="lbl">yes</text>
  <rect x="244" y="192" width="96" height="44" rx="8" fill="#f59e0b"/>
  <text x="292" y="219" class="dark" text-anchor="middle">run block</text>

  <line x1="115" y1="248" x2="115" y2="274" stroke="#3b82f6" stroke-width="2" marker-end="url(#a1)"/>
  <text x="124" y="266" class="lbl">no</text>
  <rect x="40" y="278" width="150" height="44" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="305" class="box" text-anchor="middle">next statement</text>
  <text x="40" y="348" class="lbl">Both branches exist in the binary, and the</text>
  <text x="40" y="364" class="lbl">choice is made every single time it runs.</text>

  <!-- Compile-time column -->
  <text x="404" y="88" class="h">while the compiler runs  ·  when</text>
  <rect x="404" y="104" width="150" height="44" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="479" y="131" class="box" text-anchor="middle">compile-time test</text>

  <line x1="479" y1="148" x2="432" y2="176" stroke="#3b82f6" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="479" y1="148" x2="590" y2="176" stroke="#3b82f6" stroke-width="2" marker-end="url(#a1)"/>
  <text x="424" y="170" class="lbl">true</text>
  <text x="578" y="170" class="lbl">false</text>

  <rect x="404" y="182" width="118" height="72" rx="8" fill="#34d399" stroke="#065f46" stroke-width="2"/>
  <text x="463" y="212" class="dark" text-anchor="middle">kept</text>
  <text x="463" y="232" class="dark" text-anchor="middle">this code is</text>
  <text x="463" y="248" class="dark" text-anchor="middle">compiled</text>

  <rect x="556" y="182" width="118" height="72" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="615" y="212" class="gone" text-anchor="middle">erased</text>
  <text x="615" y="232" class="gone" text-anchor="middle">never reaches</text>
  <text x="615" y="248" class="gone" text-anchor="middle">the binary</text>

  <text x="404" y="298" class="lbl">The choice is made once, at build time, and</text>
  <text x="404" y="314" class="lbl">costs nothing at runtime — which is also how</text>
  <text x="404" y="330" class="lbl">Odin writes code that only compiles on some</text>
  <text x="404" y="346" class="lbl">platforms.</text>
</svg>
