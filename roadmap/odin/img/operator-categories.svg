<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Odin operators grouped into six families</title>
  <desc id="desc">Panels group the operators: arithmetic (plus, minus, times, divide, remainder), comparison (equality and ordering), logical (and, or, not), bitwise (and, or, and-not, shifts), assignment (compound forms), and membership with ranges (in, not_in, and the range operators).</desc>
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e2e8f0; }
      .sub   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .grp   { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #3b82f6; }
      .ops   { font-family: ui-monospace, Consolas, monospace; font-size: 14px; fill: #e2e8f0; }
      .hot   { font-family: ui-monospace, Consolas, monospace; font-size: 14px; fill: #f59e0b; }
      .note  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#0f172a"/>
  <text x="24" y="36" class="title">Six families of operators</text>
  <text x="24" y="56" class="sub">The symbols you already know, with a few deliberate differences from C families of languages.</text>

  <!-- 1 Arithmetic -->
  <rect x="24" y="90" width="232" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="120" class="grp">Arithmetic</text>
  <text x="40" y="152" class="ops">+   -   *   /   %</text>
  <text x="40" y="186" class="note">On integers, / gives the quotient</text>
  <text x="40" y="204" class="note">and % gives the remainder.</text>

  <!-- 2 Comparison -->
  <rect x="268" y="90" width="232" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="284" y="120" class="grp">Comparison</text>
  <text x="284" y="152" class="ops">==  !=  &lt;  &lt;=  &gt;  &gt;=</text>
  <text x="284" y="186" class="note">Every one produces a bool.</text>
  <text x="284" y="204" class="note">== tests equality; = stores a value.</text>

  <!-- 3 Logical -->
  <rect x="512" y="90" width="232" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="528" y="120" class="grp">Logical</text>
  <text x="528" y="152" class="ops">and &amp;&amp;   or ||   not !</text>
  <text x="528" y="186" class="note">Booleans only — no truthy values.</text>
  <text x="528" y="204" class="note">They short-circuit: the right side may skip.</text>

  <!-- 4 Bitwise -->
  <rect x="24" y="246" width="232" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="276" class="grp">Bitwise</text>
  <text x="40" y="308" class="ops">&amp;   |   &lt;&lt;   &gt;&gt;</text>
  <text x="40" y="336" class="hot">&amp;~  clears bits</text>
  <text x="40" y="362" class="note">Work on individual bits of integers.</text>

  <!-- 5 Assignment -->
  <rect x="268" y="246" width="232" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="284" y="276" class="grp">Assignment</text>
  <text x="284" y="308" class="ops">=  +=  -=  *=  /=  %=</text>
  <text x="284" y="336" class="ops">&amp;=  |=  &lt;&lt;=  &gt;&gt;=</text>
  <text x="284" y="362" class="note">Store a result into an existing name.</text>

  <!-- 6 Membership and ranges -->
  <rect x="512" y="246" width="232" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="528" y="276" class="grp">Membership &amp; ranges</text>
  <text x="528" y="308" class="ops">in   not_in</text>
  <text x="528" y="336" class="ops">..   ..&lt;   ..=</text>
  <text x="528" y="362" class="note">Membership tests; ranges for loops.</text>
</svg>
