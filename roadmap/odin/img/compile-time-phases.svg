<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">What compile-time programming removes</title>
  <desc id="desc">Source code enters the compiler, which resolves branches, type widths and layout assertions. The executable that comes out contains one branch, real numbers in place of size queries, and no runtime checks at all.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .hd   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #3b82f6; }
      .code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .item { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .dark { font-family: system-ui, sans-serif; font-size: 11px; fill: #0f172a; }
      .dh   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl  { font-family: system-ui, sans-serif; font-size: 11px; fill: #f59e0b; }
    </style>
    <marker id="ca" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="350" fill="#0f172a"/>
  <text x="24" y="34" class="t">What compile-time programming removes</text>
  <text x="24" y="54" class="sub">Everything the compiler settles while building is work the program never does.</text>

  <rect x="24" y="112" width="170" height="92" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="109" y="140" class="hd" text-anchor="middle">your source</text>
  <text x="40" y="164" class="code">when ODIN_OS …</text>
  <text x="40" y="182" class="code">size_of(T)</text>
  <text x="40" y="198" class="code">#assert …</text>

  <line x1="194" y1="158" x2="230" y2="158" stroke="#3b82f6" stroke-width="2" marker-end="url(#ca)"/>

  <rect x="234" y="100" width="212" height="116" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="128" class="hd" text-anchor="middle">the compiler settles</text>
  <text x="250" y="152" class="item">which branch survives</text>
  <text x="250" y="172" class="item">how wide a type really is</text>
  <text x="250" y="192" class="item">whether the layout holds</text>

  <line x1="446" y1="158" x2="482" y2="158" stroke="#3b82f6" stroke-width="2" marker-end="url(#ca)"/>

  <rect x="486" y="112" width="170" height="92" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="571" y="140" class="dh" text-anchor="middle">the executable</text>
  <text x="502" y="164" class="dark">one branch, only</text>
  <text x="502" y="182" class="dark">plain numbers</text>
  <text x="502" y="198" class="dark">nothing left to test</text>

  <text x="486" y="228" class="lbl">no runtime cost at all —</text>
  <text x="486" y="246" class="lbl">the question was already answered</text>

  <text x="24" y="280" class="note">The losing branch never exists. Neither do the specialised versions of a generic procedure for</text>
  <text x="24" y="298" class="note">types you never call it with, nor the assertions themselves — they have already been checked.</text>
  <text x="24" y="316" class="note">What remains is one straight line of code, with real numbers written into it.</text>
</svg>
