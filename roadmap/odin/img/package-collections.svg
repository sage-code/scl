<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">Collections, packages and how an import path resolves</title>
  <desc id="desc">Three collections ship with the compiler: core holds the standard library, base holds the language foundation, and vendor holds third-party bindings. Inside each collection are package folders. An import path is read from the outside in, and the last segment is the name used in code.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .hd   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #3b82f6; }
      .code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #e2e8f0; }
      .dim  { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl  { font-family: system-ui, sans-serif; font-size: 11px; fill: #f59e0b; }
      .dark { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #0f172a; }
    </style>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="380" fill="#0f172a"/>
  <text x="24" y="34" class="t">Collections hold packages, packages are folders</text>
  <text x="24" y="54" class="sub">Three collections ship with the compiler — everything else is a folder in your own project.</text>

  <rect x="24" y="86" width="224" height="116" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="112" class="hd">core:</text>
  <text x="40" y="136" class="code">core:fmt</text>
  <text x="40" y="156" class="code">core:os</text>
  <text x="40" y="176" class="code">core:slice</text>
  <text x="40" y="194" class="dim">…and more</text>

  <rect x="266" y="86" width="224" height="116" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="282" y="112" class="hd">base:</text>
  <text x="282" y="136" class="code">base:runtime</text>
  <text x="282" y="156" class="code">base:intrinsics</text>
  <text x="282" y="176" class="code">base:builtin</text>
  <text x="282" y="194" class="dim">the foundation</text>

  <rect x="508" y="86" width="224" height="116" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="524" y="112" class="hd">vendor:</text>
  <text x="524" y="136" class="code">vendor:raylib</text>
  <text x="524" y="156" class="code">vendor:glfw</text>
  <text x="524" y="176" class="dim">third-party bindings,</text>
  <text x="524" y="194" class="dim">maintained by the team</text>

  <rect x="24" y="226" width="708" height="96" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="40" y="250" class="hd">one import, read from the outside in</text>

  <rect x="40" y="264" width="86" height="34" rx="6" fill="#f59e0b"/>
  <text x="60" y="286" class="dark">core:</text>
  <line x1="126" y1="281" x2="158" y2="281" stroke="#3b82f6" stroke-width="2" marker-end="url(#pa)"/>
  <rect x="162" y="264" width="86" height="34" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="286" class="code">math</text>
  <line x1="248" y1="281" x2="280" y2="281" stroke="#3b82f6" stroke-width="2" marker-end="url(#pa)"/>
  <rect x="284" y="264" width="86" height="34" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="306" y="286" class="code">bits</text>
  <line x1="370" y1="281" x2="402" y2="281" stroke="#3b82f6" stroke-width="2" marker-end="url(#pa)"/>
  <rect x="406" y="264" width="180" height="34" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="422" y="286" class="code">package math_bits</text>

  <text x="606" y="278" class="note">the folder name and the</text>
  <text x="606" y="294" class="note">package name can differ</text>

  <text x="24" y="348" class="lbl">In code you write `bits.log2(...)` — the LAST segment of the path is the name you type.</text>
  <text x="24" y="366" class="note">Everything the compiler needs in order to find your code is in that one import line.</text>
</svg>
