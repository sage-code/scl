<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc">
  <title id="title">The regions of an Odin source file</title>
  <desc id="desc">A file holds the package clause first, then imports, then declarations and procedures. The first two regions have a required position; declarations and procedures may appear in any order.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e2e8f0; }
      .sub   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .code  { font-family: ui-monospace, Consolas, monospace; font-size: 14px; fill: #e2e8f0; }
      .note  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .side  { font-family: system-ui, sans-serif; font-size: 12px; fill: #e2e8f0; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="700" height="400" fill="#0f172a"/>

  <text x="32" y="36" class="title">What lives where in an Odin file</text>
  <text x="32" y="56" class="sub">Only the first two regions have a required position.</text>

  <!-- Region 1 -->
  <rect x="32" y="76" width="320" height="54" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="48" y="100" class="code">package main</text>
  <text x="48" y="119" class="note">1 · the package clause — mandatory, always first</text>

  <!-- Region 2 -->
  <rect x="32" y="142" width="320" height="54" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="48" y="166" class="code">import "core:fmt"</text>
  <text x="48" y="185" class="note">2 · imports — after the package, before use</text>

  <!-- Region 3 -->
  <rect x="32" y="208" width="320" height="54" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="48" y="232" class="code">Point :: struct { x, y: int }</text>
  <text x="48" y="251" class="note">3 · declarations: constants, types</text>

  <!-- Region 4 -->
  <rect x="32" y="274" width="320" height="54" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="48" y="298" class="code">main :: proc() { ... }</text>
  <text x="48" y="317" class="note">4 · procedures, including the entry point</text>

  <!-- Fixed-order bracket -->
  <line x1="384" y1="76"  x2="384" y2="196" stroke="#3b82f6" stroke-width="2"/>
  <line x1="376" y1="76"  x2="392" y2="76"  stroke="#3b82f6" stroke-width="2"/>
  <line x1="376" y1="196" x2="392" y2="196" stroke="#3b82f6" stroke-width="2"/>
  <text x="402" y="130" class="side">fixed position</text>
  <text x="402" y="148" class="note">the compiler insists on this order</text>

  <!-- Free-order bracket -->
  <line x1="384" y1="208" x2="384" y2="328" stroke="#94a3b8" stroke-width="2"/>
  <line x1="376" y1="208" x2="392" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <line x1="376" y1="328" x2="392" y2="328" stroke="#94a3b8" stroke-width="2"/>
  <text x="402" y="262" class="side">any order you like</text>
  <text x="402" y="280" class="note">no prototypes, no forward</text>
  <text x="402" y="295" class="note">declarations needed</text>
</svg>
