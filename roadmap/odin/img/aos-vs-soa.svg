<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">AOS and SOA layouts with cache lines drawn over them</title>
  <desc id="desc">In the array-of-structs layout, records are stored whole, so a cache line holds parts of several records and a loop reading one field uses only a few of its bytes. In the struct-of-arrays layout each field has its own array, so a cache line is filled entirely with the field being read.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .h    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #3b82f6; }
      .cell { font-family: ui-monospace, Consolas, monospace; font-size: 10px; fill: #94a3b8; }
      .hot  { font-family: ui-monospace, Consolas, monospace; font-size: 10px; fill: #0f172a; }
      .row  { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .line { font-family: system-ui, sans-serif; font-size: 11px; fill: #3b82f6; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="430" fill="#0f172a"/>
  <text x="24" y="34" class="t">The same four particles, two layouts</text>
  <text x="24" y="54" class="sub">A loop that reads only `health` is drawn with what it actually touches.</text>

  <!-- AOS -->
  <text x="24" y="92" class="h">AOS — array of structs</text>
  <rect x="120" y="100" width="132" height="48" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="127" y="129" class="cell">pos</text>
  <text x="160" y="129" class="cell">vel</text>
  <text x="193" y="129" class="cell">mass</text>
  <rect x="220" y="104" width="28" height="40" rx="4" fill="#f59e0b"/>
  <text x="226" y="129" class="hot">hp</text>
  <rect x="260" y="100" width="132" height="48" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="267" y="129" class="cell">pos</text>
  <text x="300" y="129" class="cell">vel</text>
  <text x="333" y="129" class="cell">mass</text>
  <rect x="360" y="104" width="28" height="40" rx="4" fill="#f59e0b"/>
  <text x="366" y="129" class="hot">hp</text>
  <rect x="400" y="100" width="132" height="48" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="407" y="129" class="cell">pos</text>
  <text x="440" y="129" class="cell">vel</text>
  <text x="473" y="129" class="cell">mass</text>
  <rect x="500" y="104" width="28" height="40" rx="4" fill="#f59e0b"/>
  <text x="506" y="129" class="hot">hp</text>
  <rect x="540" y="100" width="132" height="48" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="547" y="129" class="cell">pos</text>
  <text x="580" y="129" class="cell">vel</text>
  <text x="613" y="129" class="cell">mass</text>
  <rect x="640" y="104" width="28" height="40" rx="4" fill="#f59e0b"/>
  <text x="646" y="129" class="hot">hp</text>

  <rect x="116" y="96" width="316" height="56" rx="6" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="116" y="88" class="line">one 64-byte cache line</text>
  <text x="120" y="174" class="note">The line is filled with fields the loop never asked for. Of its 64 bytes,</text>
  <text x="120" y="190" class="note">about 12 belong to `hp` — three values — and the rest is wasted.</text>

  <!-- SOA -->
  <text x="24" y="228" class="h">SOA — struct of arrays</text>
  <text x="40" y="252" class="row">pos</text>
  <rect x="108" y="238" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="190" y="238" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="272" y="238" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="354" y="238" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>

  <text x="40" y="288" class="row">vel</text>
  <rect x="108" y="274" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="190" y="274" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="272" y="274" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="354" y="274" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>

  <text x="40" y="324" class="row">mass</text>
  <rect x="108" y="310" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="190" y="310" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="272" y="310" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="354" y="310" width="76" height="20" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>

  <text x="40" y="360" class="row">hp</text>
  <rect x="108" y="346" width="76" height="20" rx="4" fill="#f59e0b"/>
  <rect x="190" y="346" width="76" height="20" rx="4" fill="#f59e0b"/>
  <rect x="272" y="346" width="76" height="20" rx="4" fill="#f59e0b"/>
  <rect x="354" y="346" width="76" height="20" rx="4" fill="#f59e0b"/>
  <rect x="104" y="342" width="400" height="28" rx="6" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="516" y="360" class="line">one cache line here holds sixteen hp values</text>
  <text x="108" y="392" class="note">Every byte loaded belongs to the field the loop reads — no waste at all.</text>
  <text x="108" y="408" class="note">Same four particles, same algorithm, different arrangement of bytes.</text>
</svg>
