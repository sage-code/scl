<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Four data shapes in Odin: struct, enum, bit_set and union</title>
  <desc id="desc">A struct holds several named fields in one value that is copied as a whole. An enum names a closed set of numbered options. A bit_set packs yes/no flags into one small integer. A union holds one of several possible types at a time, together with a tag recording which one is live.</desc>
  <defs>
    <style>
      .t     { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .h     { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #3b82f6; }
      .code  { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .note  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .dark  { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#0f172a"/>
  <text x="24" y="34" class="t">Four shapes, four questions</text>
  <text x="24" y="54" class="sub">Grouping fields · naming options · tracking flags · holding one of several types</text>

  <!-- struct -->
  <rect x="24" y="90" width="340" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="118" class="h">struct — fields together</text>
  <rect x="40" y="128" width="150" height="26" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="146" class="code">name: string</text>
  <rect x="40" y="160" width="150" height="26" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="178" class="code">health: int</text>
  <rect x="40" y="192" width="150" height="26" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="210" class="code">score: f64</text>
  <text x="208" y="160" class="note">one value,</text>
  <text x="208" y="176" class="note">copied as a</text>
  <text x="208" y="192" class="note">whole</text>

  <!-- enum -->
  <rect x="396" y="90" width="340" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="412" y="118" class="h">enum — named options</text>
  <rect x="412" y="128" width="128" height="26" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="424" y="146" class="code">.North   0</text>
  <rect x="412" y="160" width="128" height="26" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="424" y="178" class="code">.East    1</text>
  <rect x="412" y="192" width="128" height="26" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="424" y="210" class="code">.South   2</text>
  <text x="556" y="160" class="note">a closed set</text>
  <text x="556" y="176" class="note">of options;</text>
  <text x="556" y="192" class="note">switch checks</text>

  <!-- bit_set -->
  <rect x="24" y="252" width="340" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="280" class="h">bit_set — flags in one integer</text>
  <rect x="40" y="294" width="22" height="28" rx="4" fill="#3b82f6"/>
  <rect x="66" y="294" width="22" height="28" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="92" y="294" width="22" height="28" rx="4" fill="#3b82f6"/>
  <rect x="118" y="294" width="22" height="28" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="144" y="294" width="22" height="28" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="170" y="294" width="22" height="28" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="196" y="294" width="22" height="28" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="222" y="294" width="22" height="28" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="340" class="note">one byte holds eight yes/no flags</text>
  <text x="40" y="360" class="note">test with in, add with +</text>

  <!-- union -->
  <rect x="396" y="252" width="340" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="412" y="280" class="h">union — one of several types</text>
  <rect x="412" y="294" width="150" height="64" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="424" y="316" class="code">int</text>
  <text x="424" y="334" class="code">or f64</text>
  <text x="424" y="352" class="code">or ^Handle</text>
  <rect x="582" y="294" width="80" height="64" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="622" y="320" class="dark" text-anchor="middle">tag</text>
  <text x="622" y="338" class="dark" text-anchor="middle">which one</text>
  <text x="412" y="384" class="note">always ask before reading — the tag says it is safe</text>
</svg>
