<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">The Odin toolchain from source to executable</title>
  <desc id="desc">Package sources, the core and vendor libraries, are read by the odin driver, which checks them and hands code to LLVM, whose output is linked by the system linker into a native executable. Beside this path, odin check, odin test, and odinfmt operate without producing an executable.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e2e8f0; }
      .sub   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .stage { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
      .det   { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .tool  { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .dark  { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .lbl   { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="760" height="340" fill="#0f172a"/>

  <text x="24" y="34" class="title">From source to executable — the Odin toolchain</text>
  <text x="24" y="54" class="sub">One driver, one code generator, one linker. Nothing else is installed.</text>

  <!-- Main pipeline -->
  <rect x="24" y="86" width="128" height="72" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="88" y="114" class="stage" text-anchor="middle">your package</text>
  <text x="88" y="134" class="det" text-anchor="middle">main.odin</text>
  <text x="88" y="149" class="det" text-anchor="middle">core: vendor:</text>

  <rect x="184" y="86" width="128" height="72" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="248" y="114" class="stage" text-anchor="middle">odin driver</text>
  <text x="248" y="134" class="det" text-anchor="middle">parse + type</text>
  <text x="248" y="149" class="det" text-anchor="middle">check</text>

  <rect x="344" y="86" width="118" height="72" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="403" y="114" class="stage" text-anchor="middle">LLVM</text>
  <text x="403" y="134" class="det" text-anchor="middle">code</text>
  <text x="403" y="149" class="det" text-anchor="middle">generation</text>

  <rect x="494" y="86" width="118" height="72" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="553" y="114" class="stage" text-anchor="middle">linker</text>
  <text x="553" y="134" class="det" text-anchor="middle">system</text>
  <text x="553" y="149" class="det" text-anchor="middle">linker</text>

  <rect x="644" y="86" width="92" height="72" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="690" y="116" class="dark" text-anchor="middle">native</text>
  <text x="690" y="134" class="dark" text-anchor="middle">executable</text>

  <line x1="152" y1="122" x2="184" y2="122" stroke="#3b82f6" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="312" y1="122" x2="344" y2="122" stroke="#3b82f6" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="462" y1="122" x2="494" y2="122" stroke="#34d399" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="612" y1="122" x2="644" y2="122" stroke="#34d399" stroke-width="2" marker-end="url(#ar)"/>

  <text x="168" y="78" class="lbl" text-anchor="middle">reads</text>
  <text x="328" y="78" class="lbl" text-anchor="middle">emits IR</text>
  <text x="478" y="78" class="lbl" text-anchor="middle">object code</text>
  <text x="628" y="78" class="lbl" text-anchor="middle">produces</text>

  <!-- Side tools -->
  <text x="24" y="212" class="lbl">Beside the build path — these never produce an executable:</text>

  <rect x="24" y="228" width="200" height="62" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="124" y="254" class="tool" text-anchor="middle">odin check .</text>
  <text x="124" y="274" class="lbl" text-anchor="middle">type-check only, fastest feedback</text>

  <rect x="248" y="228" width="200" height="62" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="348" y="254" class="tool" text-anchor="middle">odin test .</text>
  <text x="348" y="274" class="lbl" text-anchor="middle">runs every @(test) block</text>

  <rect x="472" y="228" width="200" height="62" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="572" y="254" class="tool" text-anchor="middle">odinfmt -w file.odin</text>
  <text x="572" y="274" class="lbl" text-anchor="middle">rewrites in the official style</text>

  <line x1="248" y1="158" x2="248" y2="228" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar2)"/>
  <text x="258" y="196" class="lbl">same front end, different output</text>
</svg>
