<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">A value and a pointer to it</title>
  <desc id="desc">The variable count holds the value 42 at some address. The pointer p holds that same address. The ampersand takes the address, and the caret follows it back to the value.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .name { font-family: ui-monospace, Consolas, monospace; font-size: 13px; fill: #94a3b8; }
      .val  { font-family: ui-monospace, Consolas, monospace; font-size: 18px; fill: #e2e8f0; }
      .op   { font-family: ui-monospace, Consolas, monospace; font-size: 13px; fill: #3b82f6; }
      .op2  { font-family: ui-monospace, Consolas, monospace; font-size: 13px; fill: #34d399; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
    <marker id="pb" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="320" fill="#0f172a"/>
  <text x="24" y="34" class="t">One value, two names for it</text>
  <text x="24" y="54" class="sub">The pointer does not hold 42 — it holds the address where 42 lives.</text>

  <rect x="60" y="120" width="140" height="84" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="148" class="name" text-anchor="middle">count</text>
  <text x="130" y="182" class="val" text-anchor="middle">42</text>

  <rect x="440" y="120" width="200" height="84" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="540" y="148" class="name" text-anchor="middle">p : ^int</text>
  <text x="540" y="182" class="val" text-anchor="middle">0x7f…b40</text>

  <line x1="200" y1="138" x2="440" y2="138" stroke="#3b82f6" stroke-width="2" marker-end="url(#pa)"/>
  <text x="320" y="128" class="op" text-anchor="middle">&amp;count — take the address</text>

  <line x1="440" y1="190" x2="200" y2="190" stroke="#34d399" stroke-width="2" marker-end="url(#pb)"/>
  <text x="320" y="210" class="op2" text-anchor="middle">p^ — follow it back to the value</text>

  <text x="60" y="252" class="note">The value lives at an address; the pointer stores that address.</text>
  <text x="60" y="270" class="note">Nothing was copied — both names refer to the one 42, which is why</text>
  <text x="60" y="288" class="note">writing through the pointer changes what count holds.</text>
</svg>
