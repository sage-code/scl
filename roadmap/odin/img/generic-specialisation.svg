<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">One generic procedure, three specialised versions</title>
  <desc id="desc">A single generic procedure written with a $T parameter is turned by the compiler into separate concrete versions for int, f64 and u8. Only the types the program actually uses are produced, and the choice happens at compile time.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .dark { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #0f172a; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl  { font-family: system-ui, sans-serif; font-size: 11px; fill: #f59e0b; }
      .hd   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #3b82f6; }
    </style>
    <marker id="ga" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="340" fill="#0f172a"/>
  <text x="24" y="34" class="t">One source procedure, one compiled version per type</text>
  <text x="24" y="54" class="sub">The type is chosen while compiling — there is nothing left to decide at run time.</text>

  <text x="40" y="94" class="hd">written once</text>
  <rect x="40" y="104" width="240" height="86" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="54" y="130" class="code">max_value :: proc(</text>
  <text x="54" y="150" class="code">    values: []$T) -&gt; T</text>
  <text x="54" y="176" class="note">one body, one idea</text>

  <line x1="280" y1="147" x2="330" y2="147" stroke="#3b82f6" stroke-width="2" marker-end="url(#ga)"/>
  <text x="305" y="138" class="lbl" text-anchor="middle">compiler</text>

  <text x="348" y="94" class="hd">produced per type used</text>
  <rect x="348" y="104" width="180" height="40" rx="8" fill="#34d399" stroke="#065f46" stroke-width="2"/>
  <text x="438" y="129" class="dark" text-anchor="middle">max_value :: []int</text>
  <rect x="348" y="152" width="180" height="40" rx="8" fill="#34d399" stroke="#065f46" stroke-width="2"/>
  <text x="438" y="177" class="dark" text-anchor="middle">max_value :: []f64</text>
  <rect x="348" y="200" width="180" height="40" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="438" y="225" class="note" text-anchor="middle">[]u8 — never called,</text>
  <text x="438" y="240" class="note" text-anchor="middle">so never produced</text>

  <text x="552" y="120" class="note">Each version is ordinary, specialised code:</text>
  <text x="552" y="138" class="note">direct calls, no dispatch table, and the</text>
  <text x="552" y="156" class="note">optimiser free to do its work.</text>
  <text x="552" y="186" class="lbl">Types you never use cost nothing —</text>
  <text x="552" y="204" class="lbl">they are simply never instantiated.</text>

  <text x="40" y="286" class="note">A constraint (a `where` clause) is checked at each call site, so a mismatch is</text>
  <text x="40" y="304" class="note">reported where you wrote it rather than somewhere inside the generic body.</text>
</svg>
