<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">What crosses the Odin and C boundary</title>
  <desc id="desc">On the left are Odin values: a string is a pointer with a length, a slice is a pointer with a count, int is platform sized, and a struct is an exact layout. On the right are the C equivalents: char star is NUL-terminated with no length, void star is untyped, c.long is 32 bits on one platform and 64 on another, and a struct must have the same fields in the same order. Every value is converted as it crosses the dashed boundary.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .hd   { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #60a5fa; }
      .hd-c { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #f59e0b; }
      .box  { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .det  { font-family: system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
      .lbl  { font-family: system-ui, sans-serif; font-size: 10px; fill: #cbd5e1; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
    <marker id="ca" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#0f172a"/>
  <text x="24" y="34" class="t">Two worlds, one boundary</text>
  <text x="24" y="54" class="sub">Everything that crosses is converted on purpose, because the two sides do not agree on what a string is.</text>

  <text x="386" y="88" class="det" text-anchor="middle">the FFI boundary</text>
  <line x1="386" y1="96" x2="386" y2="356" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>

  <rect x="24" y="104" width="300" height="252" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="126" class="hd">Odin side</text>

  <rect x="40" y="140" width="268" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="157" class="box">string</text>
  <text x="54" y="172" class="det">pointer + length, may hold zero bytes</text>

  <rect x="40" y="190" width="268" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="207" class="box">[]T</text>
  <text x="54" y="222" class="det">pointer + count, a view</text>

  <rect x="40" y="240" width="268" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="257" class="box">int, u32, f64</text>
  <text x="54" y="272" class="det">width fixed by Odin, everywhere</text>

  <rect x="40" y="290" width="268" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="307" class="box">struct</text>
  <text x="54" y="322" class="det">an exact layout the compiler chose</text>

  <rect x="436" y="104" width="300" height="252" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="452" y="126" class="hd-c">C side</text>

  <rect x="452" y="140" width="268" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="466" y="157" class="box">char *</text>
  <text x="466" y="172" class="det">no length: it stops at the first zero</text>

  <rect x="452" y="190" width="268" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="466" y="207" class="box">void *</text>
  <text x="466" y="222" class="det">untyped: add a length by hand</text>

  <rect x="452" y="240" width="268" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="466" y="257" class="box">c.long, c.size_t</text>
  <text x="466" y="272" class="det">width set by the C compiler, not you</text>

  <rect x="452" y="290" width="268" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="466" y="307" class="box">struct</text>
  <text x="466" y="322" class="det">the same fields, in the same order</text>

  <line x1="316" y1="160" x2="446" y2="160" stroke="#f59e0b" stroke-width="2" marker-end="url(#ca)"/>
  <text x="381" y="154" class="lbl" text-anchor="middle">convert</text>

  <line x1="316" y1="210" x2="446" y2="210" stroke="#f59e0b" stroke-width="2" marker-end="url(#ca)"/>
  <text x="381" y="204" class="lbl" text-anchor="middle">keep both</text>

  <line x1="316" y1="260" x2="446" y2="260" stroke="#f59e0b" stroke-width="2" marker-end="url(#ca)"/>
  <text x="381" y="254" class="lbl" text-anchor="middle">pick exact</text>

  <line x1="316" y1="310" x2="446" y2="310" stroke="#f59e0b" stroke-width="2" marker-end="url(#ca)"/>
  <text x="381" y="304" class="lbl" text-anchor="middle">mirror</text>

  <text x="24" y="376" class="note">A foreign import names the library, and a foreign block declares its procedures with a dash instead of a body.</text>
  <text x="24" y="392" class="note">Nothing crosses automatically: you choose the type on each side, and the compiler checks the choice at every call.</text>
</svg>
