<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">The four shapes of the for statement in Odin</title>
  <desc id="desc">A for statement over a range repeats a known number of times, over a collection visits each element, with a condition repeats while the condition holds, and with nothing after the keyword repeats forever until a break.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e2e8f0; }
      .sub   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .head  { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #3b82f6; }
      .code  { font-family: ui-monospace, Consolas, monospace; font-size: 13px; fill: #e2e8f0; }
      .note  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl   { font-family: system-ui, sans-serif; font-size: 11px; fill: #f59e0b; }
    </style>
    <marker id="lp" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#0f172a"/>
  <text x="24" y="34" class="title">One keyword, four shapes</text>
  <text x="24" y="54" class="sub">Read what follows `for` — it decides which kind of iteration you get.</text>

  <!-- 1 range -->
  <rect x="24" y="80" width="340" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="108" class="head">1 · over a range</text>
  <text x="40" y="136" class="code">for i in 0..&lt;5 { }</text>
  <text x="40" y="162" class="note">A known number of laps. The bound is a count</text>
  <text x="40" y="180" class="note">or a length, and the step is always one.</text>

  <!-- 2 collection -->
  <rect x="396" y="80" width="340" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="412" y="108" class="head">2 · over a collection</text>
  <text x="412" y="136" class="code">for item in items { }</text>
  <text x="412" y="162" class="note">Each element in turn — arrays, slices, maps.</text>
  <text x="412" y="180" class="note">Add a second name to receive the index.</text>

  <!-- 3 condition -->
  <rect x="24" y="216" width="340" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="244" class="head">3 · while a condition holds</text>
  <text x="40" y="272" class="code">for i &lt; 5 { }</text>
  <text x="40" y="298" class="note">Repeat until something changes — this is the</text>
  <text x="40" y="316" class="note">role `while` plays in other languages.</text>

  <!-- 4 infinite -->
  <rect x="396" y="216" width="340" height="120" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="412" y="244" class="head">4 · forever</text>
  <text x="412" y="272" class="code">for { }</text>
  <text x="412" y="298" class="lbl">Nothing after the keyword: runs until a</text>
  <text x="412" y="316" class="lbl">break, a return, or the program ends.</text>
</svg>
