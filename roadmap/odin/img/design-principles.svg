<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">The guiding principles of Odin</title>
  <desc id="desc">Four principles — simplicity, orthogonality, explicitness, and joy — feed into the Odin language, which produces readable and predictable systems code.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #e2e8f0; }
      .sub   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .box   { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
      .small { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .dark  { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .darksm{ font-family: system-ui, sans-serif; font-size: 11px; fill: #2b2b2b; }
      .core  { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #e2e8f0; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="640" height="340" fill="#0f172a"/>

  <!-- Header -->
  <text x="24" y="34" class="title">Four principles decide what goes into Odin</text>
  <text x="24" y="54" class="sub">Feature requests are accepted or refused by these; nothing enters by accident.</text>

  <!-- Principle boxes (left column, aligned) -->
  <rect x="24" y="76" width="190" height="46" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="97" class="box">Simplicity</text>
  <text x="40" y="113" class="small">one way to write it</text>

  <rect x="24" y="134" width="190" height="46" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="155" class="box">Orthogonality</text>
  <text x="40" y="171" class="small">small pieces that combine</text>

  <rect x="24" y="192" width="190" height="46" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="213" class="box">Explicitness</text>
  <text x="40" y="229" class="small">nothing hidden</text>

  <rect x="24" y="250" width="190" height="46" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="271" class="box">Joy</text>
  <text x="40" y="287" class="small">fast builds, clear errors</text>

  <!-- Odin -->
  <rect x="286" y="134" width="124" height="104" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="348" y="176" class="core" text-anchor="middle">Odin</text>
  <text x="348" y="198" class="small" text-anchor="middle">compiler + core</text>
  <text x="348" y="214" class="small" text-anchor="middle">library</text>

  <!-- Outcome (light highlight box, dark text) -->
  <rect x="462" y="128" width="156" height="116" rx="10" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="540" y="160" class="dark" text-anchor="middle">Readable,</text>
  <text x="540" y="180" class="dark" text-anchor="middle">predictable code</text>
  <text x="540" y="206" class="darksm" text-anchor="middle">small spec</text>
  <text x="540" y="222" class="darksm" text-anchor="middle">no hidden cost</text>

  <!-- Arrows: principles to Odin -->
  <line x1="214" y1="99"  x2="286" y2="158" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="214" y1="157" x2="286" y2="172" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="214" y1="215" x2="286" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="214" y1="273" x2="286" y2="216" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Odin to outcome -->
  <line x1="410" y1="186" x2="462" y2="186" stroke="#34d399" stroke-width="2" marker-end="url(#arrowg)"/>
</svg>
