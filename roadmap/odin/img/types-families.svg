<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">The families of Odin basic types</title>
  <desc id="desc">Four panels group the basic types: whole numbers (int, uint, fixed-width signed and unsigned integers, endian-tagged integers), floating point (f32 and f64), logic (bool), and text (string, cstring, rune). The everyday defaults int, f64, bool and string are highlighted.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e2e8f0; }
      .sub   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .grp   { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #3b82f6; }
      .chip  { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .ddark { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #0f172a; }
      .note  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="720" height="420" fill="#0f172a"/>

  <text x="24" y="36" class="title">The families of Odin basic types</text>
  <text x="24" y="56" class="sub">Highlighted names are the defaults you will type every day.</text>

  <!-- Panel 1: whole numbers -->
  <rect x="24" y="86" width="330" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="112" class="grp">Whole numbers</text>
  <rect x="40" y="124" width="56" height="26" rx="6" fill="#f59e0b"/>
  <text x="52" y="142" class="ddark">int</text>
  <rect x="104" y="124" width="64" height="26" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="116" y="142" class="chip">uint</text>
  <rect x="40" y="158" width="100" height="26" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="176" class="chip">i8 … i128</text>
  <rect x="148" y="158" width="100" height="26" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="176" class="chip">u8 … u128</text>
  <rect x="40" y="192" width="76" height="26" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="210" class="chip">u32le</text>
  <rect x="124" y="192" width="76" height="26" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="210" class="chip">u64be</text>
  <text x="216" y="210" class="note">…byte order built in</text>

  <!-- Panel 2: floating point -->
  <rect x="370" y="86" width="330" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="386" y="112" class="grp">Floating point</text>
  <rect x="386" y="124" width="56" height="26" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="398" y="142" class="chip">f32</text>
  <rect x="450" y="124" width="56" height="26" rx="6" fill="#f59e0b"/>
  <text x="462" y="142" class="ddark">f64</text>
  <text x="386" y="176" class="note">A decimal literal such as 7.2 is f64 by default.</text>
  <text x="386" y="194" class="note">f32 stores half the bytes with less precision —</text>
  <text x="386" y="212" class="note">the usual choice for graphics and audio.</text>

  <!-- Panel 3: logic -->
  <rect x="24" y="252" width="330" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="278" class="grp">Logic</text>
  <rect x="40" y="290" width="70" height="26" rx="6" fill="#f59e0b"/>
  <text x="52" y="308" class="ddark">bool</text>
  <text x="40" y="342" class="note">Exactly true or false — the result of a comparison.</text>
  <text x="40" y="360" class="note">Odin has no truthy values: 0 is not false, and</text>
  <text x="40" y="378" class="note">1 is not true. Conditions must be real booleans.</text>

  <!-- Panel 4: text -->
  <rect x="370" y="252" width="330" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="386" y="278" class="grp">Text</text>
  <rect x="386" y="290" width="76" height="26" rx="6" fill="#f59e0b"/>
  <text x="396" y="308" class="ddark">string</text>
  <rect x="470" y="290" width="84" height="26" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="308" class="chip">cstring</text>
  <rect x="562" y="290" width="62" height="26" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="574" y="308" class="chip">rune</text>
  <text x="386" y="342" class="note">string = UTF-8 bytes and a length;</text>
  <text x="386" y="360" class="note">cstring = NUL-terminated, for C libraries;</text>
  <text x="386" y="378" class="note">rune = one Unicode code point.</text>
</svg>
