<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">How make and new reach real memory through the context</title>
  <desc id="desc">A call to make or new consults the context structure. The context holds five services including the allocator, which is itself a procedure plus a data pointer. That allocator obtains the actual bytes from the system.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .hd   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #3b82f6; }
      .code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #e2e8f0; }
      .dark { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #0f172a; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl  { font-family: system-ui, sans-serif; font-size: 11px; fill: #f59e0b; }
    </style>
    <marker id="ca" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="380" fill="#0f172a"/>
  <text x="24" y="34" class="t">From a line of Odin to real bytes</text>
  <text x="24" y="54" class="sub">Nothing allocates behind your back: every request passes through the context you can inspect.</text>

  <!-- your code -->
  <rect x="24" y="150" width="124" height="76" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="86" y="180" class="code" text-anchor="middle">make(...)</text>
  <text x="86" y="200" class="code" text-anchor="middle">new(T)</text>

  <line x1="148" y1="188" x2="176" y2="188" stroke="#3b82f6" stroke-width="2" marker-end="url(#ca)"/>

  <!-- context -->
  <rect x="176" y="96" width="236" height="196" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="192" y="122" class="hd">context</text>
  <rect x="188" y="132" width="212" height="24" rx="4" fill="#3b82f6"/>
  <text x="198" y="149" class="dark">allocator</text>
  <rect x="188" y="160" width="212" height="24" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="198" y="177" class="code">temp_allocator</text>
  <rect x="188" y="188" width="212" height="24" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="198" y="205" class="code">logger</text>
  <rect x="188" y="216" width="212" height="24" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="198" y="233" class="code">assertion_failure_proc</text>
  <rect x="188" y="244" width="212" height="24" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="198" y="261" class="code">random_generator</text>

  <line x1="412" y1="144" x2="444" y2="144" stroke="#3b82f6" stroke-width="2" marker-end="url(#ca)"/>

  <!-- allocator -->
  <rect x="448" y="112" width="180" height="96" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="538" y="138" class="hd">allocator</text>
  <text x="462" y="164" class="code">procedure</text>
  <text x="462" y="186" class="code">data</text>

  <line x1="538" y1="208" x2="538" y2="248" stroke="#3b82f6" stroke-width="2" marker-end="url(#ca)"/>
  <text x="548" y="232" class="lbl">obtains the bytes</text>

  <rect x="448" y="252" width="180" height="60" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="538" y="278" class="dark" text-anchor="middle">real memory</text>
  <text x="538" y="296" class="dark" text-anchor="middle">system or arena</text>

  <text x="24" y="322" class="note">An allocator is a procedure plus some data — two fields, nothing more.</text>
  <text x="24" y="340" class="note">Everything make and new allocate comes through the context, unless you</text>
  <text x="24" y="356" class="note">hand the procedure an allocator explicitly.</text>
</svg>
