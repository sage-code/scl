<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">The anatomy of an Odin procedure</title>
  <desc id="desc">A procedure signature has four parts: the name, the proc keyword, the parameter list, and the result type. Arguments travel from the parameters into the body, and the result travels from the body back to the caller.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e2e8f0; }
      .sub   { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .code  { font-family: ui-monospace, Consolas, monospace; font-size: 13px; fill: #e2e8f0; }
      .part  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .sep   { font-family: ui-monospace, Consolas, monospace; font-size: 14px; fill: #94a3b8; }
      .note  { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .body  { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .lbl   { font-family: system-ui, sans-serif; font-size: 11px; fill: #f59e0b; }
    </style>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3b82f6"/>
    </marker>
    <marker id="pb" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#0f172a"/>
  <text x="24" y="34" class="title">The anatomy of a procedure</text>
  <text x="24" y="54" class="sub">The signature is the contract; the body is free to change as long as the contract holds.</text>

  <!-- name -->
  <rect x="40" y="92" width="108" height="62" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="94" y="118" class="code" text-anchor="middle">greet</text>
  <text x="94" y="138" class="part" text-anchor="middle">the name</text>

  <text x="160" y="128" class="sep">::</text>

  <!-- keyword -->
  <rect x="186" y="92" width="72" height="62" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="222" y="118" class="code" text-anchor="middle">proc</text>
  <text x="222" y="138" class="part" text-anchor="middle">keyword</text>

  <!-- parameters -->
  <rect x="270" y="92" width="170" height="62" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="355" y="118" class="code" text-anchor="middle">(name: string)</text>
  <text x="355" y="138" class="part" text-anchor="middle">parameters</text>

  <text x="452" y="128" class="sep">-&gt;</text>

  <!-- result -->
  <rect x="482" y="92" width="120" height="62" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="542" y="118" class="code" text-anchor="middle">string</text>
  <text x="542" y="138" class="part" text-anchor="middle">result type</text>

  <!-- body -->
  <rect x="270" y="220" width="332" height="80" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="436" y="250" class="body" text-anchor="middle">the body</text>
  <text x="436" y="272" class="note" text-anchor="middle">the implementation — callers never read it</text>
  <text x="436" y="288" class="note" text-anchor="middle">and never need to</text>

  <!-- arguments in -->
  <line x1="355" y1="154" x2="355" y2="214" stroke="#3b82f6" stroke-width="2" marker-end="url(#pa)"/>
  <text x="366" y="190" class="lbl">arguments arrive</text>

  <!-- result out -->
  <line x1="590" y1="240" x2="556" y2="160" stroke="#34d399" stroke-width="2" marker-end="url(#pb)"/>
  <text x="598" y="212" class="lbl">result</text>
  <text x="598" y="228" class="lbl">travels back</text>

  <text x="40" y="212" class="note">Call it with arguments that match</text>
  <text x="40" y="228" class="note">the parameter list, and you get back</text>
  <text x="40" y="244" class="note">a value of the result type — or, when</text>
  <text x="40" y="260" class="note">there are several results, a value</text>
  <text x="40" y="276" class="note">for each of them.</text>
</svg>
