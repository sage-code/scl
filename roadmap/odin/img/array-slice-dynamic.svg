<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">Memory layout of a fixed array, a slice and a dynamic array</title>
  <desc id="desc">A fixed array stores its elements inline inside itself. A slice stores only a pointer and a length, so it is a view of data owned elsewhere. A dynamic array stores a pointer, a length and a capacity, and owns a block of memory obtained from an allocator.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .h    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #3b82f6; }
      .code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .cell { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #e2e8f0; }
      .dcell{ font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #64748b; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#0f172a"/>
  <text x="24" y="34" class="t">Three containers, three meanings</text>
  <text x="24" y="54" class="sub">Where the elements actually live decides what copying and modifying mean.</text>

  <!-- Fixed array -->
  <text x="24" y="96" class="h">fixed array</text>
  <text x="24" y="116" class="code">numbers: [4]int</text>
  <text x="24" y="136" class="note">copying copies all four</text>
  <rect x="276" y="80" width="48" height="40" rx="5" fill="#3b82f6"/>
  <text x="300" y="105" class="cell" text-anchor="middle" fill="#0f172a">10</text>
  <rect x="330" y="80" width="48" height="40" rx="5" fill="#3b82f6"/>
  <text x="354" y="105" class="cell" text-anchor="middle" fill="#0f172a">20</text>
  <rect x="384" y="80" width="48" height="40" rx="5" fill="#3b82f6"/>
  <text x="408" y="105" class="cell" text-anchor="middle" fill="#0f172a">30</text>
  <rect x="438" y="80" width="48" height="40" rx="5" fill="#3b82f6"/>
  <text x="462" y="105" class="cell" text-anchor="middle" fill="#0f172a">40</text>
  <text x="500" y="96" class="note">the array IS these cells,</text>
  <text x="500" y="112" class="note">stored inline — nothing</text>
  <text x="500" y="128" class="note">is borrowed or shared</text>

  <!-- Slice -->
  <text x="24" y="196" class="h">slice</text>
  <text x="24" y="216" class="code">s: []int</text>
  <text x="24" y="236" class="note">writing through it</text>
  <text x="24" y="252" class="note">writes the original</text>
  <rect x="276" y="184" width="120" height="56" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="288" y="208" class="cell">pointer</text>
  <text x="288" y="228" class="cell">length  3</text>
  <line x1="396" y1="212" x2="446" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="452" y="184" width="40" height="40" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="472" y="209" class="cell" text-anchor="middle">0</text>
  <rect x="498" y="184" width="40" height="40" rx="5" fill="#3b82f6"/>
  <text x="518" y="209" class="cell" text-anchor="middle" fill="#0f172a">1</text>
  <rect x="544" y="184" width="40" height="40" rx="5" fill="#3b82f6"/>
  <text x="564" y="209" class="cell" text-anchor="middle" fill="#0f172a">1</text>
  <rect x="590" y="184" width="40" height="40" rx="5" fill="#3b82f6"/>
  <text x="610" y="209" class="cell" text-anchor="middle" fill="#0f172a">2</text>
  <rect x="636" y="184" width="40" height="40" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="656" y="209" class="cell" text-anchor="middle">3</text>
  <text x="452" y="244" class="note">three of the six elements — the rest is not yours to touch</text>

  <!-- Dynamic array -->
  <text x="24" y="306" class="h">dynamic array</text>
  <text x="24" y="326" class="code">d: [dynamic]int</text>
  <text x="24" y="346" class="note">owns its block;</text>
  <text x="24" y="362" class="note">free it with delete</text>
  <rect x="276" y="294" width="140" height="56" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="288" y="314" class="cell">pointer</text>
  <text x="288" y="330" class="cell">length  3</text>
  <text x="288" y="346" class="cell">capacity 6</text>
  <line x1="416" y1="322" x2="446" y2="322" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="452" y="294" width="36" height="40" rx="5" fill="#34d399"/>
  <text x="470" y="319" class="cell" text-anchor="middle" fill="#0f172a">1</text>
  <rect x="492" y="294" width="36" height="40" rx="5" fill="#34d399"/>
  <text x="510" y="319" class="cell" text-anchor="middle" fill="#0f172a">2</text>
  <rect x="532" y="294" width="36" height="40" rx="5" fill="#34d399"/>
  <text x="550" y="319" class="cell" text-anchor="middle" fill="#0f172a">3</text>
  <rect x="572" y="294" width="36" height="40" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="590" y="319" class="dcell" text-anchor="middle">—</text>
  <rect x="612" y="294" width="36" height="40" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="630" y="319" class="dcell" text-anchor="middle">—</text>
  <rect x="652" y="294" width="36" height="40" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="670" y="319" class="dcell" text-anchor="middle">—</text>
  <text x="452" y="352" class="note">three in use, three reserved for the next appends</text>
</svg>
