<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">The Odin test runner in one picture</title>
  <desc id="desc">A package contains procedures marked with the test attribute. The command odin test compiles them, and the runner in core:testing executes them on several threads at once, giving each thread its own logger and temporary allocator. When the run finishes it reports a summary of passed and failed tests together with any memory problems, such as leaks or bad frees.</desc>
  <defs>
    <style>
      .t    { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .hd   { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #60a5fa; }
      .hdg  { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #34d399; }
      .box  { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .det  { font-family: system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
      .ok   { font-family: system-ui, sans-serif; font-size: 10px; fill: #34d399; }
      .warn { font-family: system-ui, sans-serif; font-size: 10px; fill: #f59e0b; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
    <marker id="ra" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#60a5fa"/>
    </marker>
    <marker id="rb" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#0f172a"/>
  <text x="24" y="34" class="t">One command, many threads, one report</text>
  <text x="24" y="54" class="sub">Tests are ordinary procedures; the attribute is what the compiler looks for.</text>

  <rect x="24" y="104" width="200" height="252" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="126" class="hd">your package</text>
  <rect x="40" y="140" width="168" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="157" class="box">@(test)</text>
  <text x="52" y="172" class="det">my_test :: proc(t: ^T)</text>
  <rect x="40" y="190" width="168" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="207" class="box">@(test)</text>
  <text x="52" y="222" class="det">hash_test :: proc(t: ^T)</text>
  <rect x="40" y="240" width="168" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="257" class="box">@(test)</text>
  <text x="52" y="272" class="det">parse_test :: proc(t: ^T)</text>
  <text x="40" y="308" class="det">ordinary procedures</text>
  <text x="40" y="324" class="det">in a normal package</text>

  <rect x="272" y="104" width="216" height="252" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="288" y="126" class="hd">the runner</text>
  <rect x="288" y="140" width="184" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="300" y="157" class="box">worker 1</text>
  <text x="300" y="172" class="det">own logger</text>
  <rect x="288" y="190" width="184" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="300" y="207" class="box">worker 2</text>
  <text x="300" y="222" class="det">own temporary allocator</text>
  <rect x="288" y="240" width="184" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="300" y="257" class="box">worker 3</text>
  <text x="300" y="272" class="det">catches segfaults and panics</text>
  <text x="288" y="308" class="det">multi-threaded by default;</text>
  <text x="288" y="324" class="det">written in Odin, in core/testing</text>

  <rect x="536" y="104" width="200" height="252" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="552" y="126" class="hdg">the report</text>
  <rect x="552" y="140" width="168" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="564" y="157" class="box">passed</text>
  <text x="564" y="172" class="det">per package, per test</text>
  <rect x="552" y="190" width="168" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="564" y="207" class="box">failed</text>
  <text x="564" y="222" class="det">with file, line and proc</text>
  <rect x="552" y="240" width="168" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="564" y="257" class="box">memory</text>
  <text x="564" y="272" class="det">leaks and bad frees</text>
  <text x="552" y="308" class="det">the run ends with a</text>
  <text x="552" y="324" class="det">list of failed tests</text>

  <line x1="228" y1="210" x2="268" y2="210" stroke="#60a5fa" stroke-width="2" marker-end="url(#ra)"/>
  <text x="248" y="202" class="ok" text-anchor="middle">odin</text>
  <text x="248" y="230" class="ok" text-anchor="middle">test .</text>
  <line x1="492" y1="210" x2="532" y2="210" stroke="#34d399" stroke-width="2" marker-end="url(#rb)"/>
  <text x="512" y="202" class="ok" text-anchor="middle">run</text>

  <text x="24" y="376" class="note">A test that finishes without failing has passed, so expectations are how a test earns its result.</text>
  <text x="24" y="392" class="note">Memory tracking is on by default: a test that leaks is reported as a problem even when its expectations held.</text>
</svg>
