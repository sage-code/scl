<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#1e1e1e"/>
  <text x="28" y="44" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">Ownership: Move Semantics</text>

  <!-- s1 box (moved from) -->
  <rect x="48" y="92" width="220" height="96" rx="10" fill="#f4cccc" stroke="#999999" stroke-width="2"/>
  <text x="158" y="128" fill="#000000" font-family="Segoe UI, monospace" font-size="20" font-weight="bold" text-anchor="middle">s1: String</text>
  <text x="158" y="160" fill="#000000" font-family="Segoe UI, monospace" font-size="18" text-anchor="middle">"hello"</text>

  <!-- s2 box (moved into) -->
  <rect x="452" y="92" width="220" height="96" rx="10" fill="#ffd966" stroke="#e6b800" stroke-width="2"/>
  <text x="562" y="128" fill="#000000" font-family="Segoe UI, monospace" font-size="20" font-weight="bold" text-anchor="middle">s2: String</text>
  <text x="562" y="160" fill="#000000" font-family="Segoe UI, monospace" font-size="18" text-anchor="middle">"hello"</text>

  <!-- move arrow -->
  <line x1="280" y1="140" x2="440" y2="140" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="360" y="122" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">move</text>

  <!-- invalid note -->
  <rect x="48" y="216" width="220" height="70" rx="10" fill="#333333" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="158" y="246" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="17" text-anchor="middle">s1 is invalid now</text>
  <text x="158" y="270" fill="#999999" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">use-after-move = error</text>
</svg>
