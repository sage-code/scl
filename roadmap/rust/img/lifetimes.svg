<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#1e1e1e"/>
  <text x="28" y="44" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">Lifetimes: the Overlap Rule</text>

  <!-- lifetime 'x bar -->
  <rect x="52" y="96" width="180" height="34" rx="8" fill="#93c47d"/>
  <text x="142" y="119" fill="#000000" font-family="Segoe UI, monospace" font-size="15" font-weight="bold" text-anchor="middle">'x : &amp;"a"</text>

  <!-- lifetime 'y bar -->
  <rect x="240" y="96" width="180" height="34" rx="8" fill="#93c47d"/>
  <text x="330" y="119" fill="#000000" font-family="Segoe UI, monospace" font-size="15" font-weight="bold" text-anchor="middle">'y : &amp;"b"</text>

  <!-- overlap span -->
  <rect x="240" y="160" width="180" height="34" rx="8" fill="#ffd966"/>
  <text x="330" y="183" fill="#000000" font-family="Segoe UI, monospace" font-size="14" font-weight="bold" text-anchor="middle">overlap = 'a</text>

  <!-- output is bounded by overlap -->
  <rect x="430" y="140" width="150" height="60" rx="10" fill="#f4cccc" stroke="#cc0000" stroke-width="2"/>
  <text x="505" y="166" fill="#000000" font-family="Segoe UI, monospace" font-size="16" font-weight="bold" text-anchor="middle">returned &amp;'a</text>
  <text x="505" y="188" fill="#000000" font-family="Segoe UI, monospace" font-size="13" text-anchor="middle">lives in overlap</text>

  <line x1="330" y1="196" x2="470" y2="170" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="142" y1="132" x2="270" y2="176" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="132" x2="330" y2="156" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="250" fill="#d9d9d9" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">a returned reference cannot outlive the shortest input lifetime</text>
</svg>
