<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#1e1e1e"/>
  <text x="28" y="44" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">Box&lt;T&gt;: Heap Allocation</text>

  <!-- stack region -->
  <rect x="46" y="88" width="260" height="180" rx="12" fill="#262626" stroke="#93c47d" stroke-width="2"/>
  <text x="176" y="116" fill="#93c47d" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">stack</text>

  <rect x="66" y="140" width="220" height="66" rx="10" fill="#9fc5e8" stroke="#6fa8dc" stroke-width="2"/>
  <text x="176" y="168" fill="#000000" font-family="Segoe UI, monospace" font-size="18" font-weight="bold" text-anchor="middle">b: Box&lt;i32&gt;</text>
  <text x="176" y="192" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">(pointer)</text>

  <!-- heap region -->
  <rect x="440" y="88" width="240" height="180" rx="12" fill="#262626" stroke="#f4cccc" stroke-width="2"/>
  <text x="560" y="116" fill="#f4cccc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">heap</text>

  <rect x="470" y="140" width="180" height="66" rx="10" fill="#ffd966" stroke="#e6b800" stroke-width="2"/>
  <text x="560" y="168" fill="#000000" font-family="Segoe UI, monospace" font-size="20" font-weight="bold" text-anchor="middle">5</text>
  <text x="560" y="192" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">i32 value</text>

  <line x1="288" y1="168" x2="466" y2="168" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="377" y="150" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">owns</text>

  <text x="360" y="306" fill="#d9d9d9" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">Box owns the heap value; dropping the Box frees that memory</text>
</svg>
