<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#1e1e1e"/>
  <text x="28" y="44" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">Borrowing: Share OR Mutate</text>

  <!-- central owned value -->
  <rect x="270" y="90" width="180" height="80" rx="10" fill="#9fc5e8" stroke="#6fa8dc" stroke-width="2"/>
  <text x="360" y="128" fill="#000000" font-family="Segoe UI, monospace" font-size="19" font-weight="bold" text-anchor="middle">data: String</text>
  <text x="360" y="154" fill="#000000" font-family="Segoe UI, monospace" font-size="15" text-anchor="middle">(owner)</text>

  <!-- shared readers -->
  <rect x="40" y="210" width="200" height="70" rx="10" fill="#93c47d" stroke="#6aa84f" stroke-width="2"/>
  <text x="140" y="240" fill="#000000" font-family="Segoe UI, monospace" font-size="17" font-weight="bold" text-anchor="middle">r1: &amp;String</text>
  <text x="140" y="264" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">read only</text>

  <rect x="40" y="290" width="200" height="56" rx="10" fill="#93c47d" stroke="#6aa84f" stroke-width="2"/>
  <text x="140" y="322" fill="#000000" font-family="Segoe UI, monospace" font-size="17" font-weight="bold" text-anchor="middle">r2: &amp;String</text>

  <!-- exclusive writer -->
  <rect x="480" y="210" width="200" height="70" rx="10" fill="#f4cccc" stroke="#cc0000" stroke-width="2"/>
  <text x="580" y="240" fill="#000000" font-family="Segoe UI, monospace" font-size="17" font-weight="bold" text-anchor="middle">w: &amp;mut String</text>
  <text x="580" y="264" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">read + write</text>

  <!-- arrows: shared reads -->
  <line x1="300" y1="174" x2="120" y2="206" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="172" x2="150" y2="286" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- arrow: exclusive write -->
  <line x1="440" y1="150" x2="560" y2="206" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="356" fill="#d9d9d9" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">many shared reads at once — or one exclusive write — never both</text>
</svg>
