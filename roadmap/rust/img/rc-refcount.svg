<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#1e1e1e"/>
  <text x="28" y="44" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">Rc&lt;T&gt;: Shared Ownership</text>

  <!-- owner a -->
  <rect x="60" y="120" width="180" height="70" rx="10" fill="#93c47d" stroke="#6aa84f" stroke-width="2"/>
  <text x="150" y="150" fill="#000000" font-family="Segoe UI, monospace" font-size="18" font-weight="bold" text-anchor="middle">a</text>
  <text x="150" y="176" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">Rc clone</text>

  <!-- owner b -->
  <rect x="480" y="120" width="180" height="70" rx="10" fill="#93c47d" stroke="#6aa84f" stroke-width="2"/>
  <text x="570" y="150" fill="#000000" font-family="Segoe UI, monospace" font-size="18" font-weight="bold" text-anchor="middle">b</text>
  <text x="570" y="176" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">Rc clone</text>

  <!-- shared heap value with counter -->
  <rect x="250" y="110" width="220" height="100" rx="12" fill="#ffd966" stroke="#e6b800" stroke-width="2"/>
  <text x="360" y="146" fill="#000000" font-family="Segoe UI, monospace" font-size="19" font-weight="bold" text-anchor="middle">"data"</text>
  <text x="360" y="172" fill="#000000" font-family="Segoe UI, monospace" font-size="15" text-anchor="middle">strong_count = 2</text>

  <line x1="240" y1="150" x2="246" y2="150" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="480" y1="150" x2="474" y2="150" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="360" y="252" fill="#d9d9d9" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">value freed only when the last clone drops (count reaches 0)</text>
  <text x="360" y="280" fill="#999999" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">Arc&lt;T&gt; = the same idea, using atomics, thus thread-safe</text>
</svg>
