<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#1e1e1e"/>
  <text x="28" y="44" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">async/await: Tasks on an Executor</text>

  <!-- future box -->
  <rect x="48" y="96" width="180" height="80" rx="10" fill="#9fc5e8" stroke="#6fa8dc" stroke-width="2"/>
  <text x="138" y="130" fill="#000000" font-family="Segoe UI, monospace" font-size="18" font-weight="bold" text-anchor="middle">async fn</text>
  <text x="138" y="156" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">Future (lazy)</text>

  <!-- executor box -->
  <rect x="280" y="96" width="180" height="80" rx="10" fill="#ffd966" stroke="#e6b800" stroke-width="2"/>
  <text x="370" y="130" fill="#000000" font-family="Segoe UI, monospace" font-size="18" font-weight="bold" text-anchor="middle">Executor</text>
  <text x="370" y="156" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">.await / poll</text>

  <!-- runtime box -->
  <rect x="512" y="96" width="160" height="80" rx="10" fill="#93c47d" stroke="#6aa84f" stroke-width="2"/>
  <text x="592" y="130" fill="#000000" font-family="Segoe UI, monospace" font-size="18" font-weight="bold" text-anchor="middle">Runtime</text>
  <text x="592" y="156" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">tokio / std</text>

  <!-- waker box -->
  <rect x="280" y="220" width="180" height="70" rx="10" fill="#f4cccc" stroke="#cc0000" stroke-width="2"/>
  <text x="370" y="250" fill="#000000" font-family="Segoe UI, monospace" font-size="18" font-weight="bold" text-anchor="middle">Waker</text>
  <text x="370" y="274" fill="#000000" font-family="Segoe UI, monospace" font-size="14" text-anchor="middle">wake() on ready</text>

  <line x1="228" y1="136" x2="276" y2="136" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="136" x2="508" y2="136" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="370" y1="178" x2="370" y2="216" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="280" y1="255" x2="170" y2="255" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="255" x2="170" y2="180" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="320" fill="#d9d9d9" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">a Future only runs when polled; when it is not ready it yields and the Waker re-queues it</text>
</svg>
