<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" style="width:100%;height:auto;background:#0f172a;border-radius:8px;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="30" y="25" width="120" height="44" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Input x1</text>

  <rect x="30" y="88" width="120" height="44" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="115" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Input x2</text>

  <rect x="30" y="151" width="120" height="44" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="178" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Input x3</text>

  <line x1="150" y1="47" x2="265" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="150" y1="110" x2="265" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="150" y1="173" x2="265" y2="122" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <text x="208" y="62" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">w1</text>
  <text x="208" y="103" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">w2</text>
  <text x="208" y="160" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">w3</text>

  <rect x="268" y="75" width="175" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="355" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Weighted Sum + Bias</text>
  <text x="355" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">z = w1*x1 + w2*x2 + w3*x3 + b</text>

  <line x1="443" y1="110" x2="478" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="480" y="75" width="155" height="70" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="557" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Activation f(z)</text>
  <text x="557" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">ReLU / Sigmoid / Tanh</text>

  <line x1="635" y1="110" x2="670" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="672" y="75" width="120" height="70" rx="8" fill="#34d399"/>
  <text x="732" y="105" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Output y</text>
  <text x="732" y="125" fill="#0f172a" font-family="sans-serif" font-size="11" text-anchor="middle">Next layer / pred</text>
</svg>
