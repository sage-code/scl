<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" style="width:100%;height:auto;background:#0f172a;border-radius:8px;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="20" y="55" width="115" height="64" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="77" y="83" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. Acquisition</text>
  <text x="77" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">APIs, logs, sensors</text>

  <line x1="135" y1="87" x2="155" y2="87" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="157" y="55" width="115" height="64" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="214" y="83" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Storage</text>
  <text x="214" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">DBs, Parquet, lakes</text>

  <line x1="272" y1="87" x2="292" y2="87" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="294" y="55" width="115" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="351" y="83" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. Cleaning</text>
  <text x="351" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Nulls, types, dedup</text>

  <line x1="409" y1="87" x2="429" y2="87" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="431" y="55" width="115" height="64" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="488" y="83" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Analysis</text>
  <text x="488" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">EDA, stats, models</text>

  <line x1="546" y1="87" x2="566" y2="87" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="568" y="55" width="115" height="64" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="625" y="83" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5. Visuals</text>
  <text x="625" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Charts &amp; decisions</text>

  <line x1="683" y1="87" x2="703" y2="87" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="705" y="55" width="95" height="64" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="752" y="83" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">6. Archive</text>
  <text x="752" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Retain / purge</text>

  <path d="M625,119 L625,165 L77,165 L77,122" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="351" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Feedback loop: new questions &amp; drift drive fresh acquisition</text>
