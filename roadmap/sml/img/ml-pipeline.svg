<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" style="width:100%;height:auto;background:#0f172a;border-radius:8px;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="20" y="70" width="130" height="68" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="85" y="99" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Raw Dataset</text>
  <text x="85" y="119" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Features X, Labels y</text>

  <line x1="150" y1="104" x2="180" y2="104" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="182" y="30" width="150" height="58" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="257" y="56" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Train Split (80%)</text>
  <text x="257" y="74" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Fit scalers &amp; model</text>

  <rect x="182" y="122" width="150" height="58" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="257" y="148" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Test Split (20%)</text>
  <text x="257" y="166" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Held out (no fitting!)</text>

  <line x1="332" y1="59" x2="368" y2="59" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="370" y="30" width="180" height="58" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="460" y="56" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Pipeline + k-Fold CV</text>
  <text x="460" y="74" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Impute, scale, tune params</text>

  <line x1="550" y1="59" x2="588" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="332" y1="151" x2="588" y2="115" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <rect x="590" y="70" width="205" height="68" rx="8" fill="#34d399"/>
  <text x="692" y="99" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Final Holdout Eval</text>
  <text x="692" y="119" fill="#0f172a" font-family="sans-serif" font-size="11" text-anchor="middle">Precision, Recall, PR-AUC / RMSE</text>
</svg>
