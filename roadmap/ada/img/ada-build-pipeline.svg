<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="bpTitle bpDesc">
  <title id="bpTitle">The Ada build pipeline from source to executable</title>
  <desc id="bpDesc">Alire manages dependencies and drives GPRbuild, which feeds specification and body files to the GNAT compiler, then the binder and linker produce the executable.</desc>

  <rect x="0" y="0" width="920" height="380" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="356" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">From crate to executable</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">You rarely invoke the compiler by hand: Alire reads alire.toml, fetches dependencies, and drives GPRbuild.</text>

  <rect x="50" y="130" width="150" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="70" y="160" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">alr build</text>
  <text x="70" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">deps + alire.toml</text>

  <rect x="270" y="130" width="150" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="283" y="160" font-family="Consolas, monospace" font-size="14" fill="#7ee787">GPRbuild</text>
  <text x="283" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">project.gpr file</text>

  <rect x="490" y="130" width="150" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="503" y="160" font-family="Consolas, monospace" font-size="14" fill="#ffa657">GNAT compile</text>
  <text x="503" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">.ads spec + .adb body</text>

  <rect x="710" y="130" width="160" height="80" fill="#1f2a37" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="730" y="160" font-family="Consolas, monospace" font-size="14" fill="#ff7b72">bind + link</text>
  <text x="730" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">executable binary</text>

  <line x1="200" y1="170" x2="264" y2="170" stroke="#7ee787" stroke-width="2"/>
  <polygon points="270,170 262,166 262,174" fill="#7ee787"/>
  <line x1="420" y1="170" x2="484" y2="170" stroke="#ffa657" stroke-width="2"/>
  <polygon points="490,170 482,166 482,174" fill="#ffa657"/>
  <line x1="640" y1="170" x2="704" y2="170" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="710,170 702,166 702,174" fill="#ff7b72"/>

  <rect x="50" y="260" width="380" height="70" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="70" y="288" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">alr get crate_name</text>
  <text x="70" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">downloads the crate and its dependencies into the workspace</text>

  <rect x="490" y="260" width="380" height="70" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="510" y="288" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">alr run</text>
  <text x="510" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">builds if stale, then executes the main unit</text>

  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">The compiler checks the specification of every withed unit first — contracts between units are machine-checked before any code runs.</text>
</svg>
