<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="rvTitle rvDesc">
  <title id="rvTitle">Task rendezvous on an entry</title>
  <desc id="rvDesc">The producer task calls an entry of the consumer and blocks. The consumer reaches the matching accept statement, both tasks exchange data during the rendezvous, and then continue independently.</desc>

  <rect x="0" y="0" width="920" height="430" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Synchronization is a language construct</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">A caller of an entry waits until the accepting task reaches the accept — no mutex, no condition variable, no library.</text>

  <rect x="80" y="120" width="280" height="230" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="100" y="150" font-family="Consolas, monospace" font-size="16" fill="#58a6ff">task Producer;</text>
  <text x="100" y="190" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">Buffer.Put (Item);</text>
  <text x="100" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">1. calls the entry</text>
  <text x="100" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">2. blocks until accepted</text>
  <text x="100" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">4. resumes after exchange</text>

  <rect x="560" y="120" width="280" height="230" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="580" y="150" font-family="Consolas, monospace" font-size="16" fill="#7ee787">task body Buffer is</text>
  <text x="580" y="190" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">accept Put (Item : Item_T) do</text>
  <text x="580" y="212" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  Store := Item;</text>
  <text x="580" y="234" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">end Put;</text>
  <text x="580" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">3. rendezvous: both run the</text>
  <text x="595" y="297" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">critical section atomically</text>

  <line x1="360" y1="200" x2="554" y2="200" stroke="#ffa657" stroke-width="2.5"/>
  <polygon points="560,200 552,196 552,204" fill="#ffa657"/>
  <text x="400" y="188" font-family="Consolas, monospace" font-size="13" fill="#ffa657">entry call</text>

  <text x="40" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">select statements add timeouts and guards; protected objects cover the common producer/consumer case with less ceremony.</text>
  <text x="40" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Both primitives are part of the language, so race conditions are visible in the source, not hidden in a library.</text>
</svg>
