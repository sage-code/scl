<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="rlTitle rlDesc">
  <title id="rlTitle">Variant record layout with a discriminant</title>
  <desc id="rlDesc">A record groups named fields. A variant part selects one of several layouts at run time based on a discriminant. The compiler allows access only to fields present in the chosen variant.</desc>

  <rect x="0" y="0" width="920" height="470" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="446" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">One type, shapes chosen by the discriminant</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">The union of C, but checked: the discriminant records which variant is active and forbids the wrong fields.</text>

  <rect x="60" y="115" width="420" height="290" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="80" y="145" font-family="Consolas, monospace" font-size="15" fill="#7ee787">type Figure (Kind : Shape_Kind := Circle) is</text>
  <text x="80" y="169" font-family="Consolas, monospace" font-size="15" fill="#7ee787">record</text>
  <text x="80" y="193" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  X, Y : Float;              -- common</text>
  <text x="80" y="217" font-family="Consolas, monospace" font-size="14" fill="#ffa657">  case Kind is</text>
  <text x="80" y="241" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">    when Circle =&gt;</text>
  <text x="80" y="265" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">      Radius : Float;</text>
  <text x="80" y="289" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">    when Rectangle =&gt;</text>
  <text x="80" y="313" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">      Width, Height : Float;</text>
  <text x="80" y="337" font-family="Consolas, monospace" font-size="14" fill="#ffa657">  end case;</text>
  <text x="80" y="361" font-family="Consolas, monospace" font-size="15" fill="#7ee787">end record;</text>

  <rect x="540" y="115" width="320" height="130" fill="#0d1117" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="560" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">memory: Kind = Circle</text>
  <text x="560" y="170" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">[ X ][ Y ][ Kind ][ Radius ]</text>
  <text x="560" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">Width is inaccessible here —</text>
  <text x="560" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">reading it is a compile-time error</text>

  <rect x="540" y="265" width="320" height="130" fill="#0d1117" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="560" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffa657">memory: Kind = Rectangle</text>
  <text x="560" y="320" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">[ X ][ Y ][ Kind ][ Width ][ Height ]</text>
  <text x="560" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">same type, different layout —</text>
  <text x="560" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">the discriminant chooses safely</text>

  <text x="40" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">A discriminant with a default (:= Circle) makes the variant changeable at run time; without one, it is fixed at object creation.</text>
</svg>
