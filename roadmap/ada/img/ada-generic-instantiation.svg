<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="giTitle giDesc">
  <title id="giTitle">A generic package is a compile-time template</title>
  <desc id="giDesc">The generic unit declares formal parameters (a type and a function). Each generic instantiation supplies actual arguments and produces a distinct, fully compiled copy specialized to them.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">One template, many checked copies</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Instantiation is at compile time — no templates at run time, no headers to include, and each copy is fully type-checked.</text>

  <rect x="60" y="115" width="380" height="170" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="80" y="143" font-family="Consolas, monospace" font-size="14" fill="#ffa657">generic</text>
  <text x="80" y="167" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  type Item_T is private;</text>
  <text x="80" y="191" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  with function "&lt;" (A, B : Item_T)</text>
  <text x="80" y="215" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">    return Boolean;</text>
  <text x="80" y="239" font-family="Consolas, monospace" font-size="14" fill="#ffa657">package Sorting is ...</text>
  <text x="80" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">formal part: what the caller must supply</text>

  <rect x="60" y="310" width="380" height="52" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="80" y="332" font-family="Consolas, monospace" font-size="13" fill="#58a6ff">package Int_Sort is new Sorting (Integer, "&lt;");</text>
  <text x="80" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">copy 1 — specialized for Integer</text>

  <rect x="480" y="310" width="380" height="52" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="500" y="332" font-family="Consolas, monospace" font-size="13" fill="#7ee787">package Str_Sort is new Sorting (String, "&lt;");</text>
  <text x="500" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">copy 2 — specialized for String</text>

  <line x1="250" y1="290" x2="250" y2="304" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="250,310 246,302 254,302" fill="#58a6ff"/>
  <line x1="670" y1="290" x2="670" y2="304" stroke="#7ee787" stroke-width="2"/>
  <polygon points="670,310 666,302 674,302" fill="#7ee787"/>

  <rect x="480" y="115" width="380" height="170" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="500" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3">Formal parameter kinds</text>
  <text x="500" y="173" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">type T is private;</text>
  <text x="500" y="197" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">type T is range &lt;&gt;;    -- integer only</text>
  <text x="500" y="221" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">type T is (abstract tagged);</text>
  <text x="500" y="245" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">with function F ... ;  -- operations</text>
  <text x="500" y="269" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">N : Integer;           -- values</text>
</svg>
