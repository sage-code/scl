<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="thTitle thDesc">
  <title id="thTitle">The Ada type family tree</title>
  <desc id="thDesc">Every Ada type is either a scalar type (integer, real, enumeration), a composite type (arrays and records), or an access type. Tagged record types extend composites for OOP.</desc>

  <rect x="0" y="0" width="920" height="470" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="446" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Every value has exactly one type</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Types in different branches never mix implicitly — this is the root of Ada's strong typing.</text>

  <rect x="390" y="110" width="150" height="54" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="410" y="143" font-family="Consolas, monospace" font-size="16" fill="#ffa657">type</text>

  <line x1="465" y1="164" x2="165" y2="215" stroke="#58a6ff" stroke-width="2"/>
  <line x1="465" y1="164" x2="465" y2="215" stroke="#7ee787" stroke-width="2"/>
  <line x1="465" y1="164" x2="765" y2="215" stroke="#ff7b72" stroke-width="2"/>

  <rect x="60" y="215" width="210" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="80" y="242" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">scalar</text>
  <text x="80" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">one value at a time</text>

  <rect x="355" y="215" width="220" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="375" y="242" font-family="Consolas, monospace" font-size="15" fill="#7ee787">composite</text>
  <text x="375" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">many values together</text>

  <rect x="660" y="215" width="210" height="70" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="680" y="242" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">access</text>
  <text x="680" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">a reference to a value</text>

  <line x1="165" y1="285" x2="165" y2="320" stroke="#58a6ff" stroke-width="2"/>
  <line x1="465" y1="285" x2="465" y2="320" stroke="#7ee787" stroke-width="2"/>

  <rect x="40" y="320" width="250" height="100" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="6"/>
  <text x="60" y="346" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">integer  — Integer, Natural</text>
  <text x="60" y="370" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">real     — Float, Long_Float</text>
  <text x="60" y="394" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">enum     — (Red, Green, Blue)</text>
  <text x="60" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">range constraints refine all three</text>

  <rect x="340" y="320" width="250" height="100" fill="#161b22" stroke="#7ee787" stroke-width="1.5" rx="6"/>
  <text x="360" y="346" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">array — fixed or unconstrained</text>
  <text x="360" y="370" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">record — fields of any type</text>
  <text x="360" y="394" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">tagged record — OOP base</text>
  <text x="360" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">String is an array of Character</text>

  <rect x="640" y="320" width="250" height="100" fill="#161b22" stroke="#ff7b72" stroke-width="1.5" rx="6"/>
  <text x="660" y="346" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">access-to-object</text>
  <text x="660" y="370" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">access-to-subprogram</text>
  <text x="660" y="394" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">pool-specific vs general</text>
  <text x="660" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">always typed, never void*</text>
</svg>
