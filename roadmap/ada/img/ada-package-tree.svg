<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="ptTitle ptDesc">
  <title id="ptTitle">Package structure: specification, private part, body, and child packages</title>
  <desc id="ptDesc">The visible part of a package specification is the contract clients see; the private part declares types whose internals are hidden; the package body holds the implementation; child packages can see the parent private part.</desc>

  <rect x="0" y="0" width="920" height="480" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="456" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">A package is a contract plus a sealed implementation</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Clients compile against the specification alone; the body can change without recompiling any client.</text>

  <rect x="60" y="110" width="360" height="120" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="80" y="138" font-family="Consolas, monospace" font-size="15" fill="#7ee787">package Geometry is</text>
  <text x="80" y="162" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  type Square is private;</text>
  <text x="80" y="184" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  function Area (S : Square) return Float;</text>
  <text x="80" y="212" font-family="Consolas, monospace" font-size="14" fill="#7ee787">end Geometry;</text>
  <text x="80" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" transform="translate(0,-105)">visible part — the API every client may use</text>

  <rect x="60" y="245" width="360" height="90" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="80" y="273" font-family="Consolas, monospace" font-size="15" fill="#ffa657">private</text>
  <text x="80" y="297" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  type Square is record Side : Float; end record;</text>
  <text x="80" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">private part — fields hidden from clients</text>

  <rect x="500" y="110" width="360" height="120" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="520" y="138" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">package body Geometry is</text>
  <text x="520" y="162" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  function Area (S : Square) return Float is</text>
  <text x="520" y="184" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  begin return S.Side * S.Side; end Area;</text>
  <text x="520" y="212" font-family="Consolas, monospace" font-size="14" fill="#58a6ff">end Geometry;</text>
  <text x="520" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8" transform="translate(0,-105)">body — implementation, invisible to clients</text>

  <rect x="500" y="245" width="360" height="90" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="520" y="273" font-family="Consolas, monospace" font-size="15" fill="#ff7b72">package Geometry.Shapes is</text>
  <text x="520" y="297" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  -- a child package</text>
  <text x="520" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">sees the parent's private part, clients do not</text>

  <line x1="240" y1="245" x2="240" y2="222" stroke="#7ee787" stroke-width="0"/>
  <line x1="420" y1="170" x2="494" y2="170" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="500,170 492,166 492,174" fill="#8b949e"/>
  <text x="430" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">implemented by</text>

  <text x="40" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Adding, removing, or reordering declarations in the private part or the body never breaks a client — only visible-part changes do.</text>
  <text x="40" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">This compile-time separation of interface and implementation is why large Ada systems scale.</text>
</svg>
