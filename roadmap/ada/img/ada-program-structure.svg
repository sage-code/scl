<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="psTitle psDesc">
  <title id="psTitle">Anatomy of an Ada main procedure</title>
  <desc id="psDesc">A main procedure is split into a context clause at the top, a declarative part between procedure and begin, and the statement part between begin and end.</desc>

  <rect x="0" y="0" width="920" height="430" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Three regions of every unit</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Context clauses, then the declarative part (names are born), then the statement part (names are used).</text>

  <rect x="60" y="110" width="480" height="60" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="80" y="136" font-family="Consolas, monospace" font-size="15" fill="#58a6ff">with Ada.Text_IO;</text>
  <text x="80" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">context clause — names the units this unit depends on</text>

  <rect x="60" y="185" width="480" height="90" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="80" y="211" font-family="Consolas, monospace" font-size="15" fill="#7ee787">procedure Main is</text>
  <text x="80" y="233" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">  Count : Integer := 0;</text>
  <text x="80" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">declarative part — every local name declared before use</text>

  <rect x="60" y="290" width="480" height="90" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="80" y="316" font-family="Consolas, monospace" font-size="15" fill="#ffa657">begin</text>
  <text x="80" y="338" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">  Ada.Text_IO.Put_Line ("hello");</text>
  <text x="80" y="361" font-family="Consolas, monospace" font-size="14" fill="#ffa657">end Main;</text>

  <rect x="590" y="110" width="280" height="270" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="610" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3">Rules the compiler enforces</text>
  <text x="610" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">- order is fixed: with → declare → begin</text>
  <text x="610" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">- a name must be declared before use</text>
  <text x="610" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">- the end name must match the unit name</text>
  <text x="610" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">- statements end with a semicolon</text>
  <text x="610" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">- comments start with -- (two dashes)</text>
  <text x="610" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">- identifiers are case-insensitive but</text>
  <text x="625" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9fb3c8">styled Mixed_Case_With_Underscores</text>

  <text x="40" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Every Ada unit — procedure, package body, task, block — follows the same declare/begin/end skeleton.</text>
</svg>
