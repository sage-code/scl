<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="dtTitle dtDesc">
  <title id="dtTitle">Dynamic dispatch through a tagged type hierarchy</title>
  <desc id="dtDesc">Shape is the root tagged type with a primitive operation Area. Circle and Rectangle extend it and override Area. A class-wide variable Area (S) selects the right override at run time through the tag.</desc>

  <rect x="0" y="0" width="920" height="450" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="426" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">The tag travels with the object</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Every tagged object carries a hidden tag; dispatching calls read it to pick the overriding subprogram.</text>

  <rect x="360" y="115" width="200" height="70" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="380" y="143" font-family="Consolas, monospace" font-size="15" fill="#ffa657">type Shape is</text>
  <text x="380" y="165" font-family="Consolas, monospace" font-size="15" fill="#ffa657">  tagged record ...</text>

  <rect x="120" y="245" width="200" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="140" y="273" font-family="Consolas, monospace" font-size="15" fill="#7ee787">type Circle is</text>
  <text x="140" y="295" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">new Shape with ...</text>

  <rect x="600" y="245" width="200" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="620" y="273" font-family="Consolas, monospace" font-size="15" fill="#7ee787">type Rectangle is</text>
  <text x="620" y="295" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">new Shape with ...</text>

  <line x1="460" y1="185" x2="235" y2="240" stroke="#7ee787" stroke-width="2"/>
  <polygon points="230,242 239,240 233,232" fill="#7ee787"/>
  <line x1="460" y1="185" x2="685" y2="240" stroke="#7ee787" stroke-width="2"/>
  <polygon points="690,242 681,240 687,232" fill="#7ee787"/>

  <rect x="120" y="350" width="680" height="56" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="140" y="375" font-family="Consolas, monospace" font-size="14" fill="#58a6ff">S : Shape'Class := Circle'(Radius =&gt; 2.0);  Area (S) -- dispatches to Circle's override</text>
  <text x="140" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">class-wide values accept any type in the family; the tag picks the subprogram at run time</text>

  <text x="40" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Interfaces define contracts without state; abstract operations force each descendant to provide its own body.</text>
</svg>
