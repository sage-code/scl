<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="efTitle efDesc">
  <title id="efTitle">Exception propagation through the call stack</title>
  <desc id="efDesc">Read_Input raises Constraint_Error; Read_Line has no handler so the exception propagates; Main catches it in its handler and the rest of Main is skipped for that call frame only.</desc>

  <rect x="0" y="0" width="920" height="430" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Unhandled means unwind</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">An exception tears down frames one by one until some caller handles it — or the program ends.</text>

  <rect x="620" y="120" width="250" height="70" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="640" y="148" font-family="Consolas, monospace" font-size="14" fill="#58a6ff">procedure Main</text>
  <text x="640" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">has: when Constraint_Error =&gt;</text>

  <rect x="340" y="185" width="250" height="70" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="360" y="213" font-family="Consolas, monospace" font-size="14" fill="#7ee787">procedure Read_Line</text>
  <text x="360" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">no handler — propagates</text>

  <rect x="60" y="250" width="250" height="70" fill="#1f2a37" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="80" y="278" font-family="Consolas, monospace" font-size="14" fill="#ff7b72">procedure Read_Input</text>
  <text x="80" y="302" font-family="Consolas, monospace" font-size="13" fill="#9fb3c8">raise Constraint_Error;</text>

  <line x1="310" y1="285" x2="334" y2="240" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="340,235 331,235 335,243" fill="#ff7b72"/>
  <line x1="590" y1="220" x2="614" y2="175" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="620,170 611,170 615,178" fill="#ff7b72"/>
  <text x="120" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ff7b72">1. raise</text>
  <text x="400" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ff7b72">2. unwind frame</text>
  <text x="640" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7ee787">3. handler runs</text>

  <rect x="60" y="340" width="810" height="50" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="6"/>
  <text x="80" y="364" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">when E : others =&gt;  Put_Line (Exception_Message (E));  -- last-resort handler logs and reports</text>

  <text x="40" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Code after the raise in a frame never executes — exceptions transfer control immediately, out of the frame.</text>
</svg>
