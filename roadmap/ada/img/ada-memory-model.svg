<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="mlTitle mlDesc">
  <title id="mlTitle">Access types: the stack, the heap, and what all_accessibles points to</title>
  <desc id="mlDesc">A local variable lives on the stack and dies at scope exit. An allocator places a value on the heap; an access value points to it. Dangling and memory-leak risks come from mismatches between the two lifetimes.</desc>

  <rect x="0" y="0" width="920" height="440" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="416" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Two lifetimes, one pointer</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Ada has no garbage collector and no manual free: accessibility rules tie each access value to the scope of its pool.</text>

  <rect x="60" y="120" width="300" height="240" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="80" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7ee787">The stack</text>
  <rect x="90" y="175" width="240" height="50" fill="#0d1117" stroke="#7ee787" stroke-width="1.5" rx="4"/>
  <text x="105" y="205" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">N : Integer := 42;</text>
  <rect x="90" y="240" width="240" height="50" fill="#0d1117" stroke="#ffa657" stroke-width="1.5" rx="4"/>
  <text x="105" y="263" font-family="Consolas, monospace" font-size="14" fill="#ffa657">P : Int_Ptr :=</text>
  <text x="105" y="281" font-family="Consolas, monospace" font-size="14" fill="#ffa657">    new Integer'(7);</text>
  <text x="80" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">freed automatically at scope exit</text>

  <rect x="560" y="120" width="300" height="240" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="580" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffa657">The heap (the access pool)</text>
  <rect x="590" y="175" width="240" height="50" fill="#0d1117" stroke="#ffa657" stroke-width="1.5" rx="4"/>
  <text x="605" y="205" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">Integer'(7)</text>
  <text x="590" y="255" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">P.all — dereference reads 7</text>
  <text x="590" y="285" font-family="Consolas, monospace" font-size="14" fill="#9fb3c8">P.all := 9 — writes through P</text>
  <text x="580" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">reclaimed only when the pool is finalized</text>

  <line x1="330" y1="265" x2="554" y2="200" stroke="#ffa657" stroke-width="2"/>
  <polygon points="560,200 551,198 554,206" fill="#ffa657"/>
  <text x="390" y="222" font-family="Consolas, monospace" font-size="13" fill="#ffa657">points to</text>

  <text x="40" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Returning P from the declaring subprogram is rejected at compile time (accessibility check) — the classic dangling-pointer bug cannot be expressed.</text>
</svg>
