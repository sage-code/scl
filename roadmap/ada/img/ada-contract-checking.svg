<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="ccTitle ccDesc">
  <title id="ccTitle">Contract checking with pre- and postconditions</title>
  <desc id="ccDesc">A caller satisfies the precondition before the call. The subprogram runs and must establish the postcondition before returning. Contract violations are detected at the boundary, which localizes every bug to caller or callee.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">The specification carries the proof burden</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">with SPARK the same annotations become statically provable; in plain Ada they are checked at run time.</text>

  <rect x="60" y="120" width="360" height="110" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="80" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff">Caller's obligation</text>
  <text x="80" y="176" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">Sqrt (X) with X &gt;= 0.0</text>
  <text x="80" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">violated here = caller's bug</text>

  <rect x="500" y="120" width="360" height="110" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="520" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7ee787">Callee's obligation</text>
  <text x="520" y="176" font-family="Consolas, monospace" font-size="13" fill="#e6edf3">Result'Result ** 2 ≈ X</text>
  <text x="520" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">violated here = callee's bug</text>

  <line x1="420" y1="175" x2="494" y2="175" stroke="#ffa657" stroke-width="2.5"/>
  <polygon points="500,175 492,171 492,179" fill="#ffa657"/>
  <text x="428" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ffa657">call</text>

  <rect x="60" y="265" width="800" height="60" fill="#1f2a37" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="80" y="291" font-family="Consolas, monospace" font-size="14" fill="#ffa657">function Sqrt (X : Real) return Real</text>
  <text x="80" y="313" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">  with Pre =&gt; X &gt;= 0.0, Post =&gt; abs (Sqrt'Result ** 2 - X) &lt; Epsilon;</text>

  <text x="40" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Aspect syntax (with Pre =&gt;, Post =&gt;) attaches contracts to the specification — the contract is part of the interface every client compiles against.</text>
  <text x="40" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Subtypes with range checks are the simplest contracts of all: they guard every value, everywhere, all the time.</text>
</svg>
