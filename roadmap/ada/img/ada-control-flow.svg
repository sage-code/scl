<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="cfTitle cfDesc">
  <title id="cfTitle">Ada decision and loop constructs</title>
  <desc id="cfDesc">if/elsif chains test conditions in order; case selects on the value of a selector with every alternative covered; the for loop iterates a declared range; while re-tests its condition; exit leaves a loop early.</desc>

  <rect x="0" y="0" width="920" height="400" fill="#0d1117"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">Selection and repetition</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Ada closes every construct with end — no dangling else, no fall-through, no accidental one-statement bodies.</text>

  <rect x="60" y="115" width="380" height="105" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="80" y="141" font-family="Consolas, monospace" font-size="14" fill="#58a6ff">if C1 then A; elsif C2 then B;</text>
  <text x="80" y="163" font-family="Consolas, monospace" font-size="14" fill="#58a6ff">else C; end if;</text>
  <text x="80" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">conditions tested strictly in order</text>

  <rect x="480" y="115" width="380" height="105" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="500" y="141" font-family="Consolas, monospace" font-size="14" fill="#7ee787">case V is</text>
  <text x="500" y="163" font-family="Consolas, monospace" font-size="14" fill="#7ee787">  when 1 | 2 =&gt; ... when others =&gt; ...</text>
  <text x="500" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">every value covered — compiler verified</text>

  <rect x="60" y="245" width="380" height="105" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="80" y="271" font-family="Consolas, monospace" font-size="14" fill="#ffa657">for I in 1 .. N loop ... end loop;</text>
  <text x="80" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">I is a constant of the range's type;</text>
  <text x="80" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">reverse counts down; I never leaks out</text>

  <rect x="480" y="245" width="380" height="105" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="6"/>
  <text x="500" y="271" font-family="Consolas, monospace" font-size="14" fill="#ff7b72">loop ... exit when Done; end loop;</text>
  <text x="500" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">plain loop + exit is the idiom for</text>
  <text x="500" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb3c8">unbounded iteration; while also exists</text>

  <text x="40" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Loop labels (Outer : loop ...) name nested loops so exit and next can target the right one — no goto needed.</text>
</svg>
