<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="description" content="Top quiz scores across Sage-Code roadmaps.">
    <meta name="author" content="Sage-Code Laboratory">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="index, follow">
    <title>Top Score | Sage-Code Roadmaps</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="/assets/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/sage-common.css">
    <link rel="stylesheet" href="/assets/css/sage-hero.css">
    <link rel="stylesheet" href="/assets/css/sage-cards.css">
  </head>
  <body>
    <div class="container">
      <header id="dynamic-header" class="container-fluid pb-2"></header>

      <section class="hero-blackboard">
        <div class="blackboard-content">
          <h1 class="chalk-text">Top Score</h1>
          <p class="chalk-body mt-1">Leaderboard ranked by passed roadmap quizzes, total best points, and average score. Pass quizzes A, B, and C to earn a roadmap certificate on your community profile.</p>
        </div>
      </section>

      <section class="container my-4" aria-label="Quiz leaderboard">
        <div class="card-slate p-4">
          <p id="leaderboard-status" class="alert alert-info mb-3" role="status" aria-live="polite">Loading leaderboard...</p>
          <div class="table-responsive">
            <table class="table table-bordered table-striped table-dark align-middle mb-0">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Learner</th>
                  <th class="text-end">Passed Quizzes</th>
                  <th class="text-end">Tracks</th>
                  <th class="text-end">Total Points</th>
                  <th class="text-end">Avg %</th>
                </tr>
              </thead>
              <tbody id="leaderboard-body"></tbody>
            </table>
          </div>
          <div class="mt-3">
            <a href="/roadmaps/" class="btn btn-outline-light btn-sm">Back to Roadmaps</a>
          </div>
        </div>
      </section>

      <footer class="footer copyright">
        <p class="x-small text-secondary mb-0">&copy; 2026 Sage-Code Laboratory</p>
      </footer>
    </div>

    <script src="/assets/js/scl-api.js"></script>
    <script src="/assets/js/sage.js"></script>
    <script src="/assets/js/roadmap-leaderboard.js"></script>
  </body>
</html>
