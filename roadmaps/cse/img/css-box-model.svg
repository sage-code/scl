<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" role="img" aria-labelledby="bmTitle bmDesc">
  <title id="bmTitle">CSS Box Model Layout</title>
  <desc id="bmDesc">Concentric diagram of the CSS Box Model showing Margin, Border, Padding, and Content layers, plus box-sizing behavior.</desc>

  <!-- Solid dark canvas -->
  <rect x="0" y="0" width="920" height="400" fill="#0f172a"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#334155" stroke-width="2" rx="10"/>

  <!-- Header -->
  <text x="36" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e2e8f0">CSS Box Model: Content → Padding → Border → Margin</text>
  <text x="36" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">Every HTML element renders as a rectangular box composed of four nested layers.</text>

  <!-- Layer 1: Margin (outermost) -->
  <rect x="36" y="96" width="520" height="276" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" rx="8"/>
  <text x="54" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">MARGIN (outer spacing, transparent)</text>

  <!-- Layer 2: Border -->
  <rect x="76" y="136" width="440" height="212" fill="#0f172a" stroke="#ef4444" stroke-width="4" rx="6"/>
  <text x="94" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ef4444">BORDER (visible edge around padding)</text>

  <!-- Layer 3: Padding -->
  <rect x="116" y="176" width="360" height="148" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="6"/>
  <text x="134" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#34d399">PADDING (inner breathing room)</text>

  <!-- Layer 4: Content -->
  <rect x="156" y="216" width="280" height="84" fill="#3b82f6" stroke="#93c5fd" stroke-width="2" rx="6"/>
  <text x="296" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">CONTENT</text>
  <text x="296" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">width × height (text, img)</text>

  <!-- Right Side: Engineering Reference Cards -->
  <rect x="580" y="96" width="304" height="128" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="598" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">1. Layer Order (Inside → Out)</text>
  <text x="598" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">• Content: actual text or media</text>
  <text x="598" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">• Padding: clears space inside border</text>
  <text x="598" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">• Border: wraps padding + content</text>
  <text x="598" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">• Margin: separates neighboring boxes</text>

  <rect x="580" y="242" width="304" height="130" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="8"/>
  <text x="598" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">2. box-sizing Trade-off</text>
  <text x="598" y="294" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">content-box (default):</text>
  <text x="598" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Total width = width + padding + border</text>
  <text x="598" y="338" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">border-box (recommended):</text>
  <text x="598" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">width includes content + padding + border</text>
</svg>
