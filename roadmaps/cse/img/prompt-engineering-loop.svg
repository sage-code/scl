<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" role="img" aria-labelledby="peTitle peDesc">
  <title id="peTitle">Iterative Prompt Engineering Loop</title>
  <desc id="peDesc">Flowchart showing Context, Task, and Constraints fed into a Foundation Model, evaluated against a rubric or schema, and either shipped or iterated back into prompt refinement.</desc>

  <!-- Solid dark canvas -->
  <rect x="0" y="0" width="920" height="400" fill="#0f172a"/>
  <rect x="12" y="12" width="896" height="376" fill="none" stroke="#334155" stroke-width="2" rx="10"/>

  <!-- Header -->
  <text x="36" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e2e8f0">Iterative Prompt Engineering Loop</text>
  <text x="36" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">Treat prompts like code: specify inputs and constraints, test outputs against a rubric, and refine on failure.</text>

  <!-- Step 1: Context + Task + Constraints -->
  <rect x="36" y="110" width="210" height="120" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <rect x="36" y="110" width="210" height="30" fill="#3b82f6" rx="6"/>
  <text x="141" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">1. Prompt Specification</text>
  <text x="52" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">• Role &amp; Context</text>
  <text x="52" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">• Explicit Task</text>
  <text x="52" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">• Format &amp; Constraints</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="246" y1="170" x2="292" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="300,170 290,165 290,175" fill="#94a3b8"/>

  <!-- Step 2: Foundation Model -->
  <rect x="300" y="120" width="170" height="100" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <rect x="300" y="120" width="170" height="28" fill="#f59e0b" rx="6"/>
  <text x="385" y="139" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">2. Model Inference</text>
  <text x="385" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">LLM / Foundation</text>
  <text x="385" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">System + User + Tools</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="470" y1="170" x2="516" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="524,170 514,165 514,175" fill="#94a3b8"/>

  <!-- Step 3: Verify / Eval -->
  <rect x="524" y="110" width="180" height="120" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="8"/>
  <rect x="524" y="110" width="180" height="30" fill="#34d399" rx="6"/>
  <text x="614" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3. Verify &amp; Evaluate</text>
  <text x="540" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">• Schema / JSON check</text>
  <text x="540" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">• Fact &amp; citation check</text>
  <text x="540" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">• Edge-case test set</text>

  <!-- Arrow 3 -> Decision Diamond -->
  <line x1="704" y1="170" x2="736" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="744,170 734,165 734,175" fill="#94a3b8"/>

  <!-- Decision Diamond: Passes Eval? -->
  <polygon points="814,122 884,170 814,218 744,170" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
  <text x="814" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Passes</text>
  <text x="814" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Eval?</text>

  <!-- Yes Branch -> Ship -->
  <line x1="814" y1="218" x2="814" y2="278" stroke="#34d399" stroke-width="2"/>
  <polygon points="814,286 809,276 819,276" fill="#34d399"/>
  <text x="826" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Yes</text>

  <rect x="744" y="286" width="140" height="58" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="8"/>
  <text x="814" y="311" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Integrate / Ship</text>
  <text x="814" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">Log &amp; monitor drift</text>

  <!-- No Branch -> Iterate -->
  <line x1="744" y1="170" x2="744" y2="170" stroke="none"/>
  <polyline points="814,122 814,90 614,90" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="720" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">No (Refine)</text>

  <!-- Iterate Box at Bottom -->
  <polyline points="614,90 141,90 141,102" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="141,110 136,100 146,100" fill="#ef4444"/>

  <!-- Bottom Iteration Guidance Box -->
  <rect x="36" y="276" width="668" height="72" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="8"/>
  <text x="54" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">4. Iterate on Failure Modes</text>
  <text x="54" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0">• Ambiguous output? Tighten constraints or add delimiters.   • Wrong format? Enforce a JSON schema.</text>
  <text x="54" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">• Edge-case errors? Add 2–3 representative few-shot examples.   • Hallucinations? Ground with retrieved context + cite-or-abstain rule.</text>
</svg>
