<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" role="img" aria-labelledby="bgTitle bgDesc">
  <title id="bgTitle">Boolean Logic Gates and Truth Table</title>
  <desc id="bgDesc">Visual reference for AND, OR, NOT, and XOR Boolean logic operations alongside their complete binary truth table.</desc>

  <!-- Solid dark canvas -->
  <rect x="0" y="0" width="920" height="430" fill="#0f172a"/>
  <rect x="12" y="12" width="896" height="406" fill="none" stroke="#334155" stroke-width="2" rx="10"/>

  <!-- Header -->
  <text x="36" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e2e8f0">Boolean Logic Operations &amp; Truth Relationships</text>
  <text x="36" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">Every digital circuit and conditional expression reduces to binary truth values (0 = False, 1 = True).</text>

  <!-- Gate Card 1: AND -->
  <rect x="36" y="96" width="200" height="120" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="136" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">AND (A &amp;&amp; B)</text>
  <line x1="60" y1="146" x2="96" y2="146" stroke="#94a3b8" stroke-width="2"/>
  <line x1="60" y1="170" x2="96" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <text x="48" y="150" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">A</text>
  <text x="48" y="174" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">B</text>
  <path d="M 96 134 L 128 134 A 24 24 0 0 1 128 182 L 96 182 Z" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="152" y1="158" x2="188" y2="158" stroke="#34d399" stroke-width="2"/>
  <text x="194" y="162" font-family="Consolas, monospace" font-size="12" fill="#34d399">Q</text>
  <text x="136" y="204" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">1 only if both A and B are 1</text>

  <!-- Gate Card 2: OR -->
  <rect x="252" y="96" width="200" height="120" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="8"/>
  <text x="352" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">OR (A || B)</text>
  <line x1="276" y1="146" x2="314" y2="146" stroke="#94a3b8" stroke-width="2"/>
  <line x1="276" y1="170" x2="314" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <text x="264" y="150" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">A</text>
  <text x="264" y="174" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">B</text>
  <path d="M 310 134 Q 324 158 310 182 L 340 182 Q 364 182 374 158 Q 364 134 340 134 Z" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="374" y1="158" x2="404" y2="158" stroke="#34d399" stroke-width="2"/>
  <text x="410" y="162" font-family="Consolas, monospace" font-size="12" fill="#34d399">Q</text>
  <text x="352" y="204" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">1 if either A or B is 1</text>

  <!-- Gate Card 3: NOT -->
  <rect x="468" y="96" width="200" height="120" fill="#1e293b" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="568" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef4444">NOT (!A)</text>
  <line x1="500" y1="158" x2="536" y2="158" stroke="#94a3b8" stroke-width="2"/>
  <text x="488" y="162" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">A</text>
  <polygon points="536,136 536,180 578,158" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="584" cy="158" r="5" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="589" y1="158" x2="622" y2="158" stroke="#34d399" stroke-width="2"/>
  <text x="628" y="162" font-family="Consolas, monospace" font-size="12" fill="#34d399">Q</text>
  <text x="568" y="204" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">Inverts the input bit</text>

  <!-- Gate Card 4: XOR -->
  <rect x="684" y="96" width="200" height="120" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="784" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">XOR (A ^ B)</text>
  <line x1="708" y1="146" x2="742" y2="146" stroke="#94a3b8" stroke-width="2"/>
  <line x1="708" y1="170" x2="742" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <text x="696" y="150" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">A</text>
  <text x="696" y="174" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">B</text>
  <path d="M 736 134 Q 750 158 736 182" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M 744 134 Q 758 158 744 182 L 774 182 Q 798 182 808 158 Q 798 134 774 134 Z" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="808" y1="158" x2="838" y2="158" stroke="#34d399" stroke-width="2"/>
  <text x="844" y="162" font-family="Consolas, monospace" font-size="12" fill="#34d399">Q</text>
  <text x="784" y="204" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">1 only when A and B differ</text>

  <!-- Truth Table Box -->
  <rect x="36" y="236" width="848" height="162" fill="#1e293b" stroke="#475569" stroke-width="2" rx="8"/>
  <text x="56" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Combined Truth Table (0 = False, 1 = True)</text>

  <!-- Table Header -->
  <rect x="56" y="274" width="808" height="28" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="120" y="293" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#e2e8f0">A</text>
  <text x="230" y="293" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#e2e8f0">B</text>
  <text x="370" y="293" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#3b82f6">A AND B</text>
  <text x="515" y="293" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#34d399">A OR B</text>
  <text x="660" y="293" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#f59e0b">A XOR B</text>
  <text x="795" y="293" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#ef4444">NOT A</text>

  <!-- Row 1: 0, 0 -->
  <text x="120" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="230" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="370" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="515" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="660" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="795" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>

  <!-- Row 2: 0, 1 -->
  <text x="120" y="342" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="230" y="342" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="370" y="342" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="515" y="342" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="660" y="342" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="795" y="342" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>

  <!-- Row 3: 1, 0 -->
  <text x="120" y="364" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="230" y="364" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="370" y="364" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="515" y="364" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="660" y="364" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="795" y="364" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>

  <!-- Row 4: 1, 1 -->
  <text x="120" y="386" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="230" y="386" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="370" y="386" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="515" y="386" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">1</text>
  <text x="660" y="386" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
  <text x="795" y="386" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">0</text>
</svg>
