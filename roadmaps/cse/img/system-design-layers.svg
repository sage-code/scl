<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" style="width:100%;height:auto;" role="img" aria-labelledby="sdTitle sdDesc">
  <title id="sdTitle">Layered System Design Architecture</title>
  <desc id="sdDesc">Request flow from Client through CDN and Load Balancer to a Stateless App Tier, branching to Distributed Cache, Message Queue with Worker Pool, and Primary with Read Replicas, supported by Observability and Resilience.</desc>

  <!-- Canvas -->
  <rect x="0" y="0" width="920" height="440" fill="#0f172a"/>
  <rect x="12" y="12" width="896" height="416" fill="none" stroke="#334155" stroke-width="2" rx="10"/>

  <!-- Header -->
  <text x="36" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" fill="#e2e8f0">Layered System Design Architecture</text>
  <text x="36" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Traffic enters at the edge, scales horizontally in stateless compute, and separates fast reads, async jobs, and durable writes.</text>

  <!-- Client -->
  <rect x="36" y="148" width="116" height="72" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="94" y="179" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Client</text>
  <text x="94" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Browser / Mobile</text>

  <!-- Arrow Client -> Edge -->
  <line x1="152" y1="184" x2="188" y2="184" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="194,184 186,179 186,189" fill="#38bdf8"/>

  <!-- CDN & Load Balancer -->
  <rect x="194" y="148" width="172" height="72" fill="#1e293b" stroke="#60a5fa" stroke-width="2" rx="8"/>
  <text x="280" y="179" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">CDN &amp; Load Balancer</text>
  <text x="280" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">TLS, Rate Limit, L7 Route</text>

  <!-- Arrow Edge -> App Tier -->
  <line x1="366" y1="184" x2="402" y2="184" stroke="#60a5fa" stroke-width="2"/>
  <polygon points="408,184 400,179 400,189" fill="#60a5fa"/>

  <!-- Stateless App Tier -->
  <rect x="408" y="148" width="180" height="72" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="8"/>
  <text x="498" y="179" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Stateless App Tier</text>
  <text x="498" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Horizontal Scale (N Nodes)</text>

  <!-- Connector hub from App Tier (x=588) to x=614 -->
  <line x1="588" y1="184" x2="614" y2="184" stroke="#94a3b8" stroke-width="2"/>
  <line x1="614" y1="126" x2="614" y2="302" stroke="#94a3b8" stroke-width="2"/>

  <!-- Branch to Cache -->
  <line x1="614" y1="126" x2="642" y2="126" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="648,126 640,121 640,131" fill="#f59e0b"/>
  <rect x="648" y="92" width="236" height="68" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="766" y="121" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Distributed Cache</text>
  <text x="766" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Cache-Aside, TTL, Sub-ms Reads</text>

  <!-- Branch to Queue -->
  <line x1="614" y1="214" x2="642" y2="214" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="648,214 640,209 640,219" fill="#a78bfa"/>
  <rect x="648" y="180" width="236" height="68" fill="#1e293b" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="766" y="209" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Message Queue</text>
  <text x="766" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Async Buffering, Backpressure, DLQ</text>

  <!-- Branch to Primary & Replicas -->
  <line x1="614" y1="302" x2="642" y2="302" stroke="#f87171" stroke-width="2"/>
  <polygon points="648,302 640,297 640,307" fill="#f87171"/>
  <rect x="648" y="268" width="236" height="68" fill="#1e293b" stroke="#f87171" stroke-width="2" rx="8"/>
  <text x="766" y="297" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Primary &amp; Read Replicas</text>
  <text x="766" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Durable Writes, Sharded Reads</text>

  <!-- Worker Pool -->
  <rect x="408" y="268" width="180" height="68" fill="#1e293b" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="498" y="297" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">Worker Pool</text>
  <text x="498" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">Idempotent Retries</text>

  <!-- Arrow Queue -> Worker Pool (routed cleanly via gap) -->
  <polyline points="648,232 628,232 628,284 594,284" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="588,284 596,279 596,289" fill="#a78bfa"/>

  <!-- Arrow Worker Pool -> DB -->
  <line x1="588" y1="316" x2="642" y2="316" stroke="#f87171" stroke-width="2"/>
  <polygon points="648,316 640,311 640,321" fill="#f87171"/>

  <!-- Cross-cutting footer bar -->
  <rect x="36" y="362" width="848" height="48" fill="#1e293b" stroke="#475569" stroke-width="2" rx="8"/>
  <text x="460" y="391" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">Cross-Cutting: Observability (Logs, Metrics, Traces)  |  Circuit Breakers &amp; Timeouts  |  SLOs &amp; Capacity Planning</text>
</svg>
