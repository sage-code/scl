<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" style="width:100%;height:auto;background:#0f172a;border-radius:8px;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="20" y="55" width="135" height="68" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="87" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. Commit / PR</text>
  <text x="87" y="103" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Lint, unit, secret scan</text>

  <line x1="155" y1="89" x2="180" y2="89" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="182" y="55" width="145" height="68" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="254" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Build &amp; Scan</text>
  <text x="254" y="103" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">SHA-tagged artifact + CVE</text>

  <line x1="327" y1="89" x2="352" y2="89" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="354" y="55" width="140" height="68" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="424" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. Staging Gate</text>
  <text x="424" y="103" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Migrations &amp; smoke tests</text>

  <line x1="494" y1="89" x2="519" y2="89" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="521" y="55" width="135" height="68" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="588" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Canary (5%)</text>
  <text x="588" y="103" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Check SLOs &amp; errors</text>

  <line x1="656" y1="89" x2="681" y2="89" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="683" y="55" width="117" height="68" rx="8" fill="#34d399"/>
  <text x="741" y="84" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5. Prod (100%)</text>
  <text x="741" y="103" fill="#0f172a" font-family="sans-serif" font-size="11" text-anchor="middle">Full rollout</text>

  <path d="M588,123 L588,162 L424,162 L424,126" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="506" y="180" fill="#ef4444" font-family="sans-serif" font-size="11" text-anchor="middle">Auto-rollback on error-rate or latency spike</text>
</svg>
