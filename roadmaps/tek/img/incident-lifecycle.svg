<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" style="width:100%;height:auto;background:#0f172a;border-radius:8px;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="20" y="55" width="135" height="68" rx="8" fill="#ef4444"/>
  <text x="87" y="84" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. Detect &amp; Page</text>
  <text x="87" y="103" fill="#0f172a" font-family="sans-serif" font-size="11" text-anchor="middle">Ack &amp; assess impact</text>

  <line x1="155" y1="89" x2="180" y2="89" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="182" y="55" width="140" height="68" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="252" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Triage &amp; Declare</text>
  <text x="252" y="103" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">SEV1-3, IC, channel</text>

  <line x1="322" y1="89" x2="347" y2="89" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="349" y="55" width="145" height="68" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="421" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. Mitigate First</text>
  <text x="421" y="103" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Rollback, flag, failover</text>

  <line x1="494" y1="89" x2="519" y2="89" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="521" y="55" width="135" height="68" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="588" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Verify Recovery</text>
  <text x="588" y="103" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">SLOs green + update</text>

  <line x1="656" y1="89" x2="681" y2="89" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="683" y="55" width="117" height="68" rx="8" fill="#34d399"/>
  <text x="741" y="84" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5. Postmortem</text>
  <text x="741" y="103" fill="#0f172a" font-family="sans-serif" font-size="11" text-anchor="middle">Blameless guardrails</text>

  <text x="410" y="168" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Restore service before deep root-cause debugging; turn postmortem actions into automated tests/alerts</text>
</svg>
