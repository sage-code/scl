<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" style="width:100%;height:auto;" role="img" aria-label="Comparison of media queries measuring the viewport and container queries measuring a component box">
  <rect width="760" height="300" rx="12" fill="#0f172a"/>
  <text x="380" y="34" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Media Queries vs. Container Queries</text>

  <!-- Left: Media Query -->
  <rect x="28" y="54" width="336" height="220" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="196" y="80" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="700">@media (min-width: 768px)</text>
  <text x="196" y="100" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Measures the entire browser viewport</text>
  <rect x="52" y="118" width="288" height="136" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="196" y="138" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Viewport Width</text>
  <rect x="76" y="152" width="240" height="84" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="196" y="186" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Card Component</text>
  <text x="196" y="208" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Same layout even inside a narrow sidebar</text>

  <!-- Right: Container Query -->
  <rect x="396" y="54" width="336" height="220" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="564" y="80" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">@container (min-width: 400px)</text>
  <text x="564" y="100" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Measures the parent container box</text>
  <rect x="420" y="118" width="136" height="136" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="488" y="142" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Narrow Slot (&lt;400px)</text>
  <rect x="434" y="156" width="108" height="82" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="488" y="194" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Stacked</text>
  <text x="488" y="214" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">1-column card</text>

  <rect x="572" y="118" width="136" height="136" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="640" y="142" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Wide Slot (&gt;=400px)</text>
  <rect x="586" y="156" width="108" height="82" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="640" y="194" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Horizontal</text>
  <text x="640" y="214" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">2-column card</text>
</svg>
