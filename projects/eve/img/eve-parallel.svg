<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-labelledby="t d">
  <title id="t">Eve parallel groups</title>
  <desc id="d">A process runs two parallel groups one after the other. In each group, methods started with start run on worker cores, and done waits for all of them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffffff"/>
    </marker>
    <style>
      .code { font-family: Consolas, "Courier New", monospace; font-size: 15px; fill: #000000; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #333333; }
      .light { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #ffffff; }
      .flow { stroke: #ffffff; stroke-width: 2; fill: none; }
      .wait { stroke: #ffffff; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .proc { fill: #cfe2f3; stroke: #0b5394; stroke-width: 2; }
      .group { fill: #fff2cc; stroke: #bf9000; stroke-width: 2; }
      .task { fill: #d9ead3; stroke: #38761d; stroke-width: 2; }
      .barrier { fill: #f4cccc; stroke: #990000; stroke-width: 2; }
    </style>
  </defs>

  <!-- background, same as the other Eve diagrams -->
  <rect x="1" y="1" width="558" height="558" fill="#666666" stroke="#434343" stroke-width="2"/>

  <!-- time axis -->
  <line class="flow" x1="34" y1="40" x2="34" y2="520" marker-end="url(#arrow)"/>
  <text class="light" transform="translate(24 290) rotate(-90)" text-anchor="middle">time</text>

  <!-- process start -->
  <rect class="proc" x="170" y="16" width="220" height="36" rx="18"/>
  <text class="code" x="280" y="39" text-anchor="middle">process main is</text>
  <line class="flow" x1="280" y1="52" x2="280" y2="74" marker-end="url(#arrow)"/>

  <!-- group 1 -->
  <rect class="group" x="140" y="76" width="280" height="36" rx="4"/>
  <text class="code" x="280" y="99" text-anchor="middle">group1: parallel … do</text>
  <path class="flow" d="M200 112L170 148" marker-end="url(#arrow)"/>
  <path class="flow" d="M360 112L390 148" marker-end="url(#arrow)"/>
  <line class="wait" x1="280" y1="112" x2="280" y2="230"/>
  <rect x="256" y="164" width="48" height="17" fill="#666666"/>
  <text class="light" x="280" y="176" text-anchor="middle">waits</text>

  <rect class="task" x="80" y="150" width="170" height="50" rx="4"/>
  <text class="code" x="165" y="172" text-anchor="middle">start task(1);</text>
  <text class="note" x="165" y="190" text-anchor="middle">worker core 1</text>
  <rect class="task" x="310" y="150" width="170" height="50" rx="4"/>
  <text class="code" x="395" y="172" text-anchor="middle">start task(2);</text>
  <text class="note" x="395" y="190" text-anchor="middle">worker core 2</text>

  <path class="flow" d="M165 200L165 230" marker-end="url(#arrow)"/>
  <path class="flow" d="M395 200L395 230" marker-end="url(#arrow)"/>
  <rect class="barrier" x="64" y="232" width="432" height="34" rx="4"/>
  <text class="code" x="280" y="254" text-anchor="middle">done group1;  ** barrier</text>
  <line class="flow" x1="280" y1="266" x2="280" y2="290" marker-end="url(#arrow)"/>

  <!-- group 2 -->
  <rect class="group" x="140" y="292" width="280" height="36" rx="4"/>
  <text class="code" x="280" y="315" text-anchor="middle">group2: parallel … do</text>
  <path class="flow" d="M200 328L170 364" marker-end="url(#arrow)"/>
  <path class="flow" d="M360 328L390 364" marker-end="url(#arrow)"/>
  <line class="wait" x1="280" y1="328" x2="280" y2="446"/>
  <rect x="256" y="380" width="48" height="17" fill="#666666"/>
  <text class="light" x="280" y="392" text-anchor="middle">waits</text>

  <rect class="task" x="80" y="366" width="170" height="50" rx="4"/>
  <text class="code" x="165" y="388" text-anchor="middle">start task(3);</text>
  <text class="note" x="165" y="406" text-anchor="middle">worker core 1</text>
  <rect class="task" x="310" y="366" width="170" height="50" rx="4"/>
  <text class="code" x="395" y="388" text-anchor="middle">start task(4);</text>
  <text class="note" x="395" y="406" text-anchor="middle">worker core 2</text>

  <path class="flow" d="M165 416L165 446" marker-end="url(#arrow)"/>
  <path class="flow" d="M395 416L395 446" marker-end="url(#arrow)"/>
  <rect class="barrier" x="64" y="448" width="432" height="34" rx="4"/>
  <text class="code" x="280" y="470" text-anchor="middle">done group2;  ** barrier</text>
  <line class="flow" x1="280" y1="482" x2="280" y2="504" marker-end="url(#arrow)"/>

  <!-- process continues -->
  <rect class="proc" x="120" y="506" width="320" height="36" rx="18"/>
  <text class="code" x="280" y="529" text-anchor="middle">outputs @ ready … return;</text>
</svg>
