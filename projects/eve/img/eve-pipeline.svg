<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
  <title id="t">Eve pipeline with channels</title>
  <desc id="d">A parallel group with three stages. The producer sends into the channel jobs, four square workers receive from jobs and send into the channel results, the collector receives from results and computes the total. done waits for all six tasks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffffff"/>
    </marker>
    <style>
      .code { font-family: Consolas, "Courier New", monospace; font-size: 15px; fill: #000000; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #333333; }
      .light { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #ffffff; }
      .lcode { font-family: Consolas, "Courier New", monospace; font-size: 14px; fill: #ffffff; }
      .flow { stroke: #ffffff; stroke-width: 2; fill: none; }
      .frame { stroke: #ffffff; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
      .group { fill: #fff2cc; stroke: #bf9000; stroke-width: 2; }
      .task { fill: #d9ead3; stroke: #38761d; stroke-width: 2; }
      .chan { fill: #d9d2e9; stroke: #674ea7; stroke-width: 2; }
      .cell { stroke: #674ea7; stroke-width: 1; }
      .barrier { fill: #f4cccc; stroke: #990000; stroke-width: 2; }
    </style>
  </defs>

  <!-- background, same as the other Eve diagrams -->
  <rect x="1" y="1" width="638" height="378" fill="#666666" stroke="#434343" stroke-width="2"/>

  <!-- the group -->
  <rect class="group" x="200" y="12" width="240" height="32" rx="4"/>
  <text class="code" x="320" y="33" text-anchor="middle">flow: parallel … do</text>
  <rect class="frame" x="10" y="52" width="620" height="268" rx="6"/>

  <!-- stage 1: producer -->
  <rect class="task" x="20" y="162" width="98" height="50" rx="4"/>
  <text class="code" x="69" y="184" text-anchor="middle">produce</text>
  <text class="note" x="69" y="202" text-anchor="middle">1 task</text>
  <line class="flow" x1="118" y1="187" x2="144" y2="187" marker-end="url(#arrow)"/>

  <!-- channel jobs -->
  <text class="lcode" x="192" y="160" text-anchor="middle">jobs</text>
  <rect class="chan" x="146" y="169" width="92" height="36" rx="3"/>
  <path class="cell" d="M169 169V205M192 169V205M215 169V205"/>
  <text class="light" x="192" y="224" text-anchor="middle">capacity 100</text>

  <!-- stage 2: four workers -->
  <path class="flow" d="M238 187L278 87" marker-end="url(#arrow)"/>
  <path class="flow" d="M238 187L278 155" marker-end="url(#arrow)"/>
  <path class="flow" d="M238 187L278 223" marker-end="url(#arrow)"/>
  <path class="flow" d="M238 187L278 291" marker-end="url(#arrow)"/>

  <rect class="task" x="280" y="66" width="96" height="42" rx="4"/>
  <text class="code" x="328" y="86" text-anchor="middle">square</text>
  <text class="note" x="328" y="101" text-anchor="middle">worker 1</text>
  <rect class="task" x="280" y="134" width="96" height="42" rx="4"/>
  <text class="code" x="328" y="154" text-anchor="middle">square</text>
  <text class="note" x="328" y="169" text-anchor="middle">worker 2</text>
  <rect class="task" x="280" y="202" width="96" height="42" rx="4"/>
  <text class="code" x="328" y="222" text-anchor="middle">square</text>
  <text class="note" x="328" y="237" text-anchor="middle">worker 3</text>
  <rect class="task" x="280" y="270" width="96" height="42" rx="4"/>
  <text class="code" x="328" y="290" text-anchor="middle">square</text>
  <text class="note" x="328" y="305" text-anchor="middle">worker 4</text>

  <path class="flow" d="M376 87L416 185" marker-end="url(#arrow)"/>
  <path class="flow" d="M376 155L416 185" marker-end="url(#arrow)"/>
  <path class="flow" d="M376 223L416 189" marker-end="url(#arrow)"/>
  <path class="flow" d="M376 291L416 189" marker-end="url(#arrow)"/>

  <!-- channel results -->
  <text class="lcode" x="464" y="160" text-anchor="middle">results</text>
  <rect class="chan" x="418" y="169" width="92" height="36" rx="3"/>
  <path class="cell" d="M441 169V205M464 169V205M487 169V205"/>
  <text class="light" x="464" y="224" text-anchor="middle">senders: 4</text>
  <line class="flow" x1="510" y1="187" x2="524" y2="187" marker-end="url(#arrow)"/>

  <!-- stage 3: collector -->
  <rect class="task" x="526" y="162" width="96" height="50" rx="4"/>
  <text class="code" x="574" y="184" text-anchor="middle">collect</text>
  <text class="note" x="574" y="202" text-anchor="middle">writes @total</text>

  <!-- barrier -->
  <line class="flow" x1="320" y1="320" x2="320" y2="332" marker-end="url(#arrow)"/>
  <rect class="barrier" x="120" y="334" width="400" height="34" rx="4"/>
  <text class="code" x="320" y="356" text-anchor="middle">done flow;  ** all 6 tasks ended</text>
</svg>
