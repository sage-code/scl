<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" width="350" height="80">
  <style>
    @keyframes flightPath3D {
      0% { transform: translate(30px, 50px) scale(1) scaleX(1); }
      15% { transform: translate(120px, 30px) scale(0.7) scaleX(1); }    /* Further away (70%) */
      30% { transform: translate(240px, 62px) scale(1.25) scaleX(1); }  /* Closer (125%) */
      40% { transform: translate(315px, 40px) scale(0.85) scaleX(1); }
      /* Flip direction to face left */
      42% { transform: translate(310px, 40px) scale(0.85) scaleX(-1); }
      55% { transform: translate(220px, 62px) scale(1.15) scaleX(-1); }  /* Closer (115%) */
      70% { transform: translate(110px, 25px) scale(0.75) scaleX(-1); }  /* Further away (75%) */
      85% { transform: translate(35px, 55px) scale(1.05) scaleX(-1); }
      /* Flip direction to face right */
      87% { transform: translate(40px, 55px) scale(1.05) scaleX(1); }
      100% { transform: translate(30px, 50px) scale(1) scaleX(1); }
    }

    @keyframes flutterBack {
      0%, 100% { transform: rotate(15deg); }
      50% { transform: rotate(-25deg); }
    }

    @keyframes flutterFront {
      0%, 100% { transform: rotate(30deg); }
      50% { transform: rotate(-35deg); }
    }

    .bee-container {
      animation: flightPath3D 11s infinite ease-in-out;
    }

    .wing-back {
      transform-origin: -1px -6px;
      animation: flutterBack 0.04s infinite linear;
    }

    .wing-front {
      transform-origin: 2px -5px;
      animation: flutterFront 0.04s infinite linear;
    }
  </style>

  <!-- Transparent background container -->
  <rect width="350" height="80" fill="none" />

  <g class="bee-container">
    <!-- Back Wing -->
    <path class="wing-back" d="M -1 -6 C -12 -22, 12 -28, 11 -6 Z" fill="rgba(160, 210, 255, 0.6)" stroke="#80B3FF" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Stinger -->
    <polygon points="-18,0 -25,2 -18,4" fill="#2D1A00" />
    
    <!-- Abdomen & Thorax Body -->
    <clipPath id="bodyClip">
      <ellipse cx="-4" cy="2" rx="14" ry="10" />
    </clipPath>
    <ellipse cx="-4" cy="2" rx="14" ry="10" fill="#FFC107" />
    
    <!-- Stripes -->
    <g clip-path="url(#bodyClip)">
      <rect x="-12" y="-10" width="4.5" height="25" fill="#2D1A00" />
      <rect x="-3" y="-10" width="4.5" height="25" fill="#2D1A00" />
      <rect x="6" y="-10" width="4.5" height="25" fill="#2D1A00" />
    </g>
    
    <!-- 3 Legs -->
    <g stroke="#2D1A00" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M -8 11 Q -9 15 -11 16" />
      <path d="M 0 11 Q 0 16 -2 17" />
      <path d="M 7 9 Q 8 13 6 15" />
    </g>
    
    <!-- Head -->
    <circle cx="11" cy="-1" r="9.5" fill="#FFC107" />
    
    <!-- Solid Black Eye -->
    <circle cx="15" cy="-2" r="3" fill="#1A1A1A" />
    <circle cx="16" cy="-3" r="0.8" fill="#FFFFFF" />
    
    <!-- Antennae -->
    <path d="M 8 -9 Q 5 -15 9 -18" fill="none" stroke="#2D1A00" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="9" cy="-18" r="1.5" fill="#2D1A00" />
    
    <path d="M 13 -8 Q 13 -14 17 -16" fill="none" stroke="#2D1A00" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="17" cy="-16" r="1.5" fill="#2D1A00" />
    
    <!-- Front Wing -->
    <path class="wing-front" d="M 2 -5 C -10 -25, 16 -32, 15 -5 Z" fill="rgba(210, 240, 255, 0.85)" stroke="#80B3FF" stroke-width="1.2" stroke-linejoin="round" />
  </g>
</svg>
