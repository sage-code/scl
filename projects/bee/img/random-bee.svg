<svg width="120" height="60" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes flyRandom {
      0%   { transform: translate(35px, 18px) scale(1) scaleX(1) rotate(0deg); }
      
      20%  { transform: translate(85px, 15px) scale(1.25) scaleX(1) rotate(-10deg); }
      /* Pause & Flip turning right-to-left */
      22%  { transform: translate(85px, 15px) scale(1.25) scaleX(1) rotate(0deg); }
      24%  { transform: translate(85px, 15px) scale(1.25) scaleX(-1) rotate(0deg); }
      
      42%  { transform: translate(25px, 22px) scale(0.7) scaleX(-1) rotate(15deg); }
      /* Pause & Flip turning left-to-right */
      44%  { transform: translate(25px, 22px) scale(0.7) scaleX(-1) rotate(0deg); }
      46%  { transform: translate(25px, 22px) scale(0.7) scaleX(1) rotate(0deg); }
      
      68%  { transform: translate(90px, 20px) scale(1.3) scaleX(1) rotate(8deg); }
      /* Pause & Flip turning right-to-left */
      70%  { transform: translate(90px, 20px) scale(1.3) scaleX(1) rotate(0deg); }
      72%  { transform: translate(90px, 20px) scale(1.3) scaleX(-1) rotate(0deg); }
      
      92%  { transform: translate(40px, 16px) scale(0.85) scaleX(-1) rotate(-8deg); }
      /* Pause & Flip back to start */
      95%  { transform: translate(35px, 18px) scale(1) scaleX(-1) rotate(0deg); }
      97%  { transform: translate(35px, 18px) scale(1) scaleX(1) rotate(0deg); }
      100% { transform: translate(35px, 18px) scale(1) scaleX(1) rotate(0deg); }
    }
    @keyframes flap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.2); }
    }
    .bee-container {
      animation: flyRandom 9s infinite cubic-bezier(0.4, 0, 0.6, 1);
      transform-origin: 15px 16px;
    }
    .wing {
      transform-origin: 12px 11px;
      animation: flap 0.08s ease-in-out infinite;
    }
  </style>

  <!-- Bee Group -->
  <g class="bee-container">
    <!-- Wings -->
    <ellipse class="wing" cx="10" cy="11" rx="4" ry="7" fill="#e0f7fa" opacity="0.85" stroke="#80deea" stroke-width="0.5"/>
    <ellipse class="wing" cx="15" cy="10" rx="3" ry="6" fill="#e0f7fa" opacity="0.85" stroke="#80deea" stroke-width="0.5"/>

    <!-- Body / Stripes -->
    <ellipse cx="15" cy="16" rx="10" ry="7" fill="#ffca28"/>
    <path d="M11 10 Q13 16 11 22 M16 9 Q18 16 16 23" stroke="#212121" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="23" cy="16" r="4.5" fill="#212121"/>
    <circle cx="24.5" cy="15" r="1" fill="#ffffff"/>

    <!-- Stinger -->
    <polygon points="5,16 2,15 5,17" fill="#212121"/>
  </g>
</svg>
