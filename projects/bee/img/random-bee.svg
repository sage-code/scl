<svg width="150" height="60" viewBox="0 0 150 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes flyRandom {
      0%   { transform: translate(25px, 15px) scale(0.9) scaleX(1) rotate(0deg); }
      15%  { transform: translate(110px, 10px) scale(1.3) scaleX(1) rotate(-8deg); }
      17%  { transform: translate(110px, 10px) scale(1.3) scaleX(1) rotate(0deg); }
      19%  { transform: translate(110px, 10px) scale(1.3) scaleX(-1) rotate(0deg); }
      35%  { transform: translate(30px, 25px) scale(0.7) scaleX(-1) rotate(10deg); }
      50%  { transform: translate(75px, 12px) scale(1.6) scaleX(-1) rotate(-5deg); }
      52%  { transform: translate(75px, 12px) scale(1.6) scaleX(-1) rotate(0deg); }
      54%  { transform: translate(75px, 12px) scale(1.6) scaleX(1) rotate(0deg); }
      70%  { transform: translate(115px, 20px) scale(1.2) scaleX(1) rotate(8deg); }
      85%  { transform: translate(40px, 14px) scale(1.4) scaleX(1) rotate(-6deg); }
      87%  { transform: translate(40px, 14px) scale(1.4) scaleX(1) rotate(0deg); }
      89%  { transform: translate(40px, 14px) scale(1.4) scaleX(-1) rotate(0deg); }
      100% { transform: translate(25px, 15px) scale(0.9) scaleX(-1) rotate(0deg); }
    }
    @keyframes flap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.2); }
    }
    .bee-container {
      animation: flyRandom 18s infinite cubic-bezier(0.4, 0, 0.6, 1);
      transform-origin: 15px 16px;
    }
    .wing {
      transform-origin: 12px 11px;
      animation: flap 0.08s ease-in-out infinite;
    }
  </style>

  <g class="bee-container">
    <ellipse class="wing" cx="10" cy="11" rx="4" ry="7" fill="#e0f7fa" opacity="0.85" stroke="#80deea" stroke-width="0.5"/>
    <ellipse class="wing" cx="15" cy="10" rx="3" ry="6" fill="#e0f7fa" opacity="0.85" stroke="#80deea" stroke-width="0.5"/>
    <ellipse cx="15" cy="16" rx="10" ry="7" fill="#ffca28"/>
    <path d="M11 10 Q13 16 11 22 M16 9 Q18 16 16 23" stroke="#212121" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="23" cy="16" r="4.5" fill="#212121"/>
    <circle cx="24.5" cy="15" r="1" fill="#ffffff"/>
    <polygon points="5,16 2,15 5,17" fill="#212121"/>
  </g>
</svg>
